        'processP50Ms', 'processP95Ms', 'processP99Ms',
      ]) webCameraState[key] = 0;
      webCameraState.framesSkipped = 0;
    }

    function webCoord(p) {
      if (Array.isArray(p)) {
        return {
          x: Number(p[0]), y: Number(p[1]), z: Number(p[2]),
          visibility: Number(p[3] ?? 0),
        };
      }
      return {
        x: Number(p?.x), y: Number(p?.y), z: Number(p?.z),
        visibility: Number(p?.visibility ?? 0),
      };
    }

    function webFinito(p) {
      return Number.isFinite(p.x) && Number.isFinite(p.y) &&
        Number.isFinite(p.z);
    }

    function puntoEnCuadroWeb(p) {
      return webFinito(p) && p.x >= 0 && p.x <= 1 &&
        p.y >= 0 && p.y <= 1;
    }

    // Validaciones de mano y pose: rig_motion_frame.mjs (puro; compartido
    // con el banco de paridad y los ports a Kotlin, Dart y Python). Aqui solo
    // se registran sus motivos en diagnostico.
    function webManoUtilizable(hand, side = null) {
      const r = handUsable(hand);
      if (!r.ok && typeof errorDiagnostico === 'function') {
        errorDiagnostico('capture', r.code, side, r.landmark);
      }
      return r.ok;
    }

    function webPoseGeometriaValida(pose, poseMundo) {
      const r = poseGeometry(pose, poseMundo);
      if (!r.ok) {
        if (typeof webCameraState !== 'undefined') webCameraState.validation = r.code;
        if (typeof errorDiagnostico === 'function') {
          errorDiagnostico('capture', r.code, null, r.landmark);
        }
      }
      return r.ok;
    }

    /**
     * MotionFrameV2 (152 valores) o null: rig_motion_frame.normalizeMotionFrame,
     * espejo de normalizeFrame() en sign_norm.dart/sign_norm.py. Registra los
     * motivos de rechazo en diagnostico y en webCameraState.validation.
     */
    function normalizarFrameWeb(pose, poseMundo, left, right,
      renderWrists = null) {
      const r = normalizeMotionFrame(pose, poseMundo, left, right, {renderWrists});
      for (const e of r.errors) {
        errorDiagnostico(e.stage, e.code, e.side, e.landmark);
      }
      webCameraState.validation = r.validation;
      return r.vector;
    }

    window.normalizarFrameWeb = normalizarFrameWeb;

    function pintarOverlayWeb(pose, left, right) {
      const video = document.getElementById('camaraVideo');
      const canvas = document.getElementById('camaraOverlay');
      if (!video || !canvas || !video.videoWidth || !video.videoHeight) return;
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      diagnosticOverlayPoints = [];
      ctx.lineWidth = Math.max(2, canvas.width / 320);
      ctx.strokeStyle = '#44e37a';
      ctx.fillStyle = '#44e37a';
      const pxy = (p) => {
        const q = webCoord(p);
        return puntoEnCuadroWeb(q)
          ? [q.x * canvas.width, q.y * canvas.height] : null;
      };
      const line = (a, b, color) => {
        const pa = pxy(a), pb = pxy(b);
        if (!pa || !pb) return;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(pa[0], pa[1]);
        ctx.lineTo(pb[0], pb[1]);
        ctx.stroke();
      };
      const dot = (p, color, stream = 'pose', side = null, landmark = null) => {
        const q = pxy(p);
        if (!q) return;
        const issue = diagnosticPointIssues.find((item) =>
          item.side === side && item.landmark === landmark);
        const diagnosticColor = issue?.status === 'yellow' ? '#f5b400' :
          issue ? '#e32636' : webCameraState.quality < .55 ? '#f5b400' : '#24b35a';
        ctx.fillStyle = diagnosticoActivo ? diagnosticColor : color;
        ctx.beginPath();
        ctx.arc(q[0], q[1], Math.max(2, canvas.width / 160), 0, Math.PI * 2);
        ctx.fill();
        if (diagnosticoActivo) diagnosticOverlayPoints.push({
          x: q[0], y: q[1], stream, side, landmark,
          code: issue?.code ?? (webCameraState.quality < .55 ? 'confidence_low' : 'valid'),
        });
      };
      const label = (p, text, color) => {
        const q = pxy(p);
        if (!q) return;
        ctx.fillStyle = color;
        ctx.font = `bold ${Math.max(11, canvas.width / 30)}px sans-serif`;
        ctx.fillText(text, q[0] + 5, q[1] - 5);
      };
      const poseEdges = [
        [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
        [11, 23], [12, 24], [23, 24],
      ];
      for (const [a, b] of poseEdges) line(pose?.[a], pose?.[b], '#44e37a');
      // Colores I/D trazan cadena anatómica Pose -> mano. No representan
      // lado visual de pantalla y permiten detectar inversión de orientación.
      for (const [shoulder, elbow, wrist, color, shoulderLabel, wristLabel] of [
        [11, 13, 15, '#ff9f43', 'H-I', 'I'],
        [12, 14, 16, '#62b7ff', 'H-D', 'D'],
      ]) {
        line(pose?.[shoulder], pose?.[elbow], color);
        line(pose?.[elbow], pose?.[wrist], color);
        label(pose?.[shoulder], shoulderLabel, color);
        label(pose?.[wrist], wristLabel, color);
      }
      for (const [hand, etiqueta, color] of [
        [left, 'I', '#ff9f43'], [right, 'D', '#62b7ff'],
      ]) {
        if (!hand) continue;
        const handEdges = [
          [0, 1], [1, 2], [2, 3], [3, 4],
          [0, 5], [5, 6], [6, 7], [7, 8],
          [0, 9], [9, 10], [10, 11], [11, 12],
          [0, 13], [13, 14], [14, 15], [15, 16],
          [0, 17], [17, 18], [18, 19], [19, 20],
          [5, 9], [9, 13], [13, 17],
        ];
        for (const [a, b] of handEdges) line(hand[a], hand[b], color);
        for (let index = 0; index < hand.length; index++) {
          dot(hand[index], color, 'hand', etiqueta === 'I' ? 'left' : 'right', index);
        }
        const muñeca = pxy(hand[0]);
        if (muñeca) {
          ctx.fillStyle = color;
          ctx.font = `bold ${Math.max(12, canvas.width / 24)}px sans-serif`;
          ctx.fillText(etiqueta, muñeca[0] + 6, muñeca[1] - 6);
        }
      }
      if (pose) {
        for (let index = 0; index < pose.length; index++) {
          dot(pose[index], '#44e37a', 'pose', null, index);
        }
      }
    }

    function pintarEstadoCamaraWeb() {
      const estado = document.getElementById('camaraEstado');
      const stats = document.getElementById('camaraStats');
      const iniciar = document.getElementById('bIniciarCamara');
      const detener = document.getElementById('bDetenerCamara');
      const grabar = document.getElementById('bGrabarCamara');
      const repetir = document.getElementById('bRepetirCamara');
      const descargar = document.getElementById('bDescargarCamara');
      if (!estado || !stats || !iniciar || !detener ||
          !grabar || !repetir || !descargar) return;
      const s = webCameraState;
      estado.className = 'camaraEstado' +
        (s.error || s.detectorError ? ' error' : s.running ? ' ok' : '');
      estado.textContent = s.loading ? 'Cargando…' : s.error || s.detectorError ? 'Error' :
        s.running ? 'Activa' : s.detectorsLoading ? 'Detectores…' : 'Apagada';
      iniciar.disabled = s.loading || s.running;
      detener.disabled = !s.running && !s.loading;
      grabar.disabled = !s.running || s.recording;
      repetir.disabled = !webUltimaSecuencia;
      descargar.disabled = !webUltimaSecuencia;
      const medir = document.getElementById('bPerfilCorporal');
      const borrar = document.getElementById('bBorrarPerfil');
      if (medir && borrar) {
        const capturando = capturaPerfil?.status().state === 'capturing';
        medir.disabled = !s.running || capturando;
        medir.textContent = capturando
          ? 'Midiendo ' + Math.round(capturaPerfil.status().progress * 100) + '%'
          : 'Medir mi cuerpo';
        borrar.disabled = !perfilCorporal && !capturando;
      }
      const bSesion = document.getElementById('bDescargarSesion');
      const tSesion = document.getElementById('camaraSesion');
      if (bSesion && tSesion) {
        bSesion.disabled = !sesionActual && !ultimaSesionLineas?.length;
        const st = sesionActual?.stats();
        tSesion.textContent = sesionActual
          ? `Sesión ${sesionActual.sessionId}: ${st.frames} frames · ` +
            `${servidorSesionesOk ? 'guardando en servidor' : 'solo en memoria'}` +
            (st.dropped ? ` · ${st.dropped} perdidos` : '')
          : (consentimientoSesion() ? 'Sesión: se inicia con la cámara'
            : 'Sesión: sin consentimiento');
      }
      const calidad = s.quality > 0 ? Math.round(s.quality * 100) + '%' : '—';
      stats.textContent = 'Pose: ' + (s.pose ? 'sí' : 'no') +
        ' · I: ' + (s.leftHand ? 'sí (' + s.leftHandPoints + ')' : 'no') +
        ' · D: ' + (s.rightHand ? 'sí (' + s.rightHandPoints + ')' : 'no') +
        ' · Vector: ' + (s.lastVectorDim || '—') +
        ' · Q: ' + calidad + ' · entrada ' +
        (s.inputFps ? Number(s.inputFps).toFixed(0) : '—') +
        ' FPS (cfg ' + (s.captureFps ? Number(s.captureFps).toFixed(0) : '—') +
        ') · track ' + (s.trackingFps || 0) + ' · pose ' + (s.poseFps || 0) +
        ' · render ' + s.renderFps + ' FPS · M ' +
        Number(s.motionScore ?? 0).toFixed(2) +
        ' · dedos ' + Number(s.fingerMotionScore ?? 0).toFixed(2) +
        (s.motionQuiet ? ' quieto' : ' movimiento') +
        ' · P/H ' + Number(s.poseP95Ms ?? 0).toFixed(1) + '/' +
        Number(s.handP95Ms ?? 0).toFixed(1) + ' ms' +
        ' · proc ' + Number(s.processP95Ms ?? 0).toFixed(1) + ' ms' +
        ' · L ' + Number(s.latencyP50Ms ?? 0).toFixed(1) + '/' +
        Number(s.latencyP95Ms ?? 0).toFixed(1) + '/' +
        Number(s.latencyP99Ms ?? 0).toFixed(1) + ' ms' +
        ' · drop ' + (s.framesSkipped || 0) +
        ' · válidos ' + s.validFrames +
        ' · lados: ' + (s.handAssignmentMode || 'none') +
        ' · stride ' + (s.poseStride || 2) +
        ' · calib ' + (s.calibrationState || 'WARMUP') +
        (s.recording ? ' · grabando ' + s.recordedFrames + '/32' :
          s.lastSequenceFrames ? ' · secuencia lista' : '') +
        (s.stale ? ' · sin tracking' : '') +
        (s.validation ? ' · ' + s.validation : '');
    }

    function siguienteTimestampWeb(capturadoMs = performance.now()) {
      // MediaPipe Tasks Web espera reloj monotónico en milisegundos. Usar
      // epoch (~1e12) desborda timestamp interno y detiene CalculatorGraph.
      const ahora = Math.round(capturadoMs);
      camaraUltimoTimestampMs = Math.max(ahora, camaraUltimoTimestampMs + 1);
      return camaraUltimoTimestampMs;
    }

    // Captura de manos: rig_hand_capture.mjs (compuerta, nacimiento, lado por
    // cadena de brazo, mano utilizable, seguimiento y desacuerdo de muneca).
    // Aqui quedan el registro de sesion, diagnostico y contadores.
    const webHandCapture = createHandCapture({birthFrames: 3});
    let ultimoTrackingWeb = null;
    let ultimoSourceMeta = null;

    function manosDesdeResultado(resultado, pose, timestampMs = 0) {
      const manos = resultado?.landmarks ?? [];
      const etiquetas = resultado?.handednesses ?? resultado?.handedness ?? [];
      const t = Number(timestampMs);
      const captura = webHandCapture.process({
        candidates: manos.map((mano, index) => ({
          landmarks: mano,
          label: etiquetas?.[index]?.[0]?.categoryName,
          confidence: etiquetas?.[index]?.[0]?.score,
        })),
        pose,
        timestampMs: t,
        poseTimestampMs: webPoseCache?.timestampMs ?? t,
      });
      webCameraState.handRejects = (webCameraState.handRejects ?? 0) +
        captura.gate.rejected.length;
      ultimaEntradaManosWeb = sesionActual ? {
        candidates: manos.map((mano, index) => ({
          lm: compactLandmarks(mano),
          label: String(etiquetas?.[index]?.[0]?.categoryName ?? ''),
          conf: Number(Number(etiquetas?.[index]?.[0]?.score ?? .5).toFixed(3)),
        })),
        accepted: captura.gate.accepted, unanchored: captura.gate.unanchored,
        rejected: captura.gate.rejected, passed: captura.passed,
        assignment: {mode: captura.assignment.mode,
          sides: captura.assignment.sideByIndex},
      } : null;
      webCameraState.handAssignmentMode = captura.assignment.mode === 'pose_arm_chain' ||
        captura.assignment.mode === 'ambiguous' ? captura.assignment.mode : 'pose_pending';
      if (captura.sideAmbiguous) {
        webCameraState.validation = 'hand_side_ambiguous';
        guardarAudit({
          frame: frameVivoFrameId + 1,
          timestampMs: t || performance.now(),
          stage: 'association', joint: null, score: .5,
          severity: 'warn', state: 'AMBIGUOUS', action: 'hold_track',
          code: 'hand_side_ambiguous',
        });
      }
      for (const error of captura.errors) {
        if (error.via === 'diagnostico') {
          errorDiagnostico(error.stage, error.code, error.side, error.landmark,
            error.status);
        } else {
          diagnosticErrors.push(error);
        }
      }
      ultimoTrackingWeb = captura.tracking;
      webCameraState.leftSurface = ultimoTrackingWeb.left.surface ?? 'unknown';
      webCameraState.rightSurface = ultimoTrackingWeb.right.surface ?? 'unknown';
      Object.assign(webCameraState, countHandEvents(webCameraState, ultimoTrackingWeb));
      return {
        left: captura.left,
        right: captura.right,
        renderLeft: captura.renderLeft,
        renderRight: captura.renderRight,
        renderWrists: captura.renderWrists,
        tracking: ultimoTrackingWeb,
      };
    }

    function calcularCalidadFrameWeb(pose, poseMundo, left, right) {
      return frameQuality(pose, poseMundo, left, right);
    }

    // Todo lo que sigue a la deteccion (asignacion de manos, 152D,
    // SignSpace, sesion, overlay). Igual para hilo principal y worker.
    function procesarDeteccionWeb({timestampMs, sourceFrameId, processStartedAt,
        ejecutarPose, poseResult, handResult, workerRtMs = null}) {
      if (poseResult) {
        webPoseCache = {
          pose: poseResult?.landmarks?.[0] ?? null,
          poseMundo: poseResult?.worldLandmarks?.[0] ?? null,
          timestampMs,
        };
      } else if (webPoseCache &&
          timestampMs - webPoseCache.timestampMs > kPoseCacheMaxMs) {
        // docs/14 H9: sin caducar, una pose vieja seguia armando el vector
        // y el skew crecia hasta congelar todo el cuerpo (stage_desync).
        webPoseCache = null;
      }
      webCaptureFrameIndex = sourceFrameId;
      const pose = webPoseCache?.pose ?? null;
      const poseMundo = webPoseCache?.poseMundo ?? null;
      const poseTimestampMs = webPoseCache?.timestampMs ?? timestampMs;
      const manos = manosDesdeResultado(handResult, pose, timestampMs);
      const vector = normalizarFrameWeb(
        pose, poseMundo, manos.left, manos.right);
      const vectorRender = normalizarFrameWeb(
        pose, poseMundo,
        manos.renderLeft ?? manos.left,
        manos.renderRight ?? manos.right,
        manos.renderWrists);
      const trackingAccepted = !!manos.left || !!manos.right;
      if (trackingAccepted) camaraTrackingFpsFrames++;
      if (ejecutarPose && poseResult) camaraPoseFpsFrames++;
      webPerformanceMetrics.recordFrame({
        timestampMs,
        sourceFrameId,
        capturedAtMs: timestampMs,
        valid: Array.isArray(vector),
      });
      actualizarMetricasWeb();
      ultimoSourceMeta = {
        pose_t: poseTimestampMs,
        hands_t: timestampMs,
        source_skew_ms: Math.abs(timestampMs - poseTimestampMs),
        tracks: manos.tracking ? {
          left: manos.tracking.left.state,
          right: manos.tracking.right.state,
        } : null,
        association: manos.tracking?.diagnostics ?? null,
        hand_assignment_mode: webCameraState.handAssignmentMode,
        contact: manos.tracking?.contact ?? null,
        hand_points: {
          left: manos.left?.length === 21 ? 21 : 0,
          right: manos.right?.length === 21 ? 21 : 0,
        },
      };
      webCameraState.frames++;
      webCameraState.pose = !!pose && !!poseMundo;
      webCameraState.leftHand = !!manos.left;
      webCameraState.rightHand = !!manos.right;
      webCameraState.leftHandPoints = manos.left?.length === 21 ? 21 : 0;
      webCameraState.rightHandPoints = manos.right?.length === 21 ? 21 : 0;
      webCameraState.lastTimestampMs = timestampMs;
      webCameraState.lastVectorDim = vector?.length ?? 0;
      if (vector) {
        const ahoraValido = performance.now();
        const calidad = calcularCalidadFrameWeb(
          pose, poseMundo, manos.left, manos.right);
        webCameraState.validFrames++;
        webCameraState.quality = calidad;
        webCameraState.lastValidAt = ahoraValido;
        webCameraState.stale = false;
        webCameraState.staleMs = 0;
        frameVivoQuality = calidad;
        signSpaceVivo = filtrarSignSpace(
          signSpaceFrame(pose, poseMundo, {profile: perfilCorporal}),
          timestampMs);
        alimentarCapturaPerfil(pose, poseMundo);
        // Durante el calentamiento el frame se registra y alimenta perfil y
        // calibracion, pero no mueve el avatar.
        if (!enCalentamientoWeb(ahoraValido - timestampMs, ahoraValido)) {
          frameVivoFrameId++;
          frameVivoSourceFrameId = sourceFrameId;
          frameVivoSourceSkewMs = Math.abs(timestampMs - poseTimestampMs);
          frameVivo = suavizarFrameWeb(vectorRender ?? vector, timestampMs);
          frameVivoTimestampMs = timestampMs;
          frameVivoLlegadaMs = ahoraValido;
        }
        procesarCalibracionPulgares(vector, calidad);
        registrarDiagnostico(
          vector, frameVivo, timestampMs, calidad, ultimoSourceMeta);
        if (webCameraState.recording) {
          webGrabacion.push(vector.slice());
          webGrabacionSignSpace.push(signSpaceVivo);
          webCameraState.recordedFrames = webGrabacion.length;
          if (webGrabacion.length >= kTFrames) {
            webUltimaSecuencia = webGrabacion.slice(0, kTFrames);
            webUltimaSignSpace = parseSignSpaceSequence(
              webGrabacionSignSpace.slice(0, kTFrames), kTFrames);
            webCameraState.recording = false;
            webCameraState.lastSequenceFrames = kTFrames;
            pintarEstadoCamaraWeb();
          }
        }
      } else {
        webCameraState.invalidFrames++;
        webCameraState.staleMs = webCameraState.lastValidAt
          ? Math.max(0, performance.now() - webCameraState.lastValidAt) : 0;
        if (!diagnosticErrors.length) {
          errorDiagnostico('capture', webCameraState.validation || 'frame_invalid');
        }
        registrarDiagnostico(null, null, timestampMs, 0);
      }
      if (sesionActual) {
        const r4 = (v) => (Array.isArray(v) ? v.map((x) =>
          Math.round(Number(x) * 1e4) / 1e4) : null);
        const caraCabeza = caraVivo ? headRotationFromFace(caraVivo.landmarks) : null;
        sesionActual.frame({
          t: timestampMs, id: sourceFrameId, mode: capturaModo,
          retarget: retargetMode, view: vistaAvatar,
          ms: {pose: webCameraState.poseMs, hand: webCameraState.handMs,
            proc: performance.now() - processStartedAt,
            ...(workerRtMs != null ? {rt: workerRtMs} : {})},
          pose_ran: !!ejecutarPose,
          avatar: poseAvatarMedida,
          skew_ms: pose ? Math.round(Math.abs(timestampMs - poseTimestampMs)) : null,
          pose: compactLandmarks(pose),
          world: compactLandmarks(poseMundo),
          hands: ultimaEntradaManosWeb,
          tracked: {left: !!manos.left, right: !!manos.right,
            left_surface: webCameraState.leftSurface,
            right_surface: webCameraState.rightSurface},
          face: caraVivo ? {
            head: caraCabeza,
            expr: expressionsFromFaceLandmarks(caraVivo.landmarks),
            pts: compactLandmarks(caraVivo.landmarks, {indices: kCaraClave}),
          } : null,
          vec: r4(vector),
          sign_space: signSpaceVivo ? {v: r4(signSpaceVivo.values),
            mask: signSpaceVivo.mask, mode: signSpaceVivo.mode} : null,
          quality: webCameraState.quality,
          errors: diagnosticErrors.map((e) => e.code),
          profile: capturaPerfil ? capturaPerfil.status().phase : null,
        });
      }
      pintarOverlayWeb(pose, manos.left, manos.right);

      const ahora = performance.now();
      if (!camaraFpsInicio) camaraFpsInicio = ahora;
      camaraFpsFrames++;
      if (ahora - camaraFpsInicio >= 1000) {
        webCameraState.inferenceFps = camaraFpsFrames;
        webCameraState.trackingFps = camaraTrackingFpsFrames;
        webCameraState.poseFps = camaraPoseFpsFrames;
        camaraFpsFrames = 0;
        camaraTrackingFpsFrames = 0;
        camaraPoseFpsFrames = 0;
        camaraFpsInicio = ahora;
      }
      if (webCameraState.frames % 5 === 0) pintarEstadoCamaraWeb();
      if (diagnosticoActivo && webCameraState.frames % 3 === 0) pintarDiagnostico();
      registrarTiempoWeb('process', performance.now() - processStartedAt);
      webCameraState.poseStride = adaptivePoseScheduler.update(
        performance.now(), {
          processP95Ms: webCameraState.processP95Ms,
          inputFps: webCameraState.inputFps,
        }).stride;
    }

    function manejarErrorFrameWeb(e) {
      if (e !== kSaltarFrameWeb) {
        const error = String(e?.message ?? e);
        eventoSesion('camera_error', {error: error.slice(0, 500)});
        webCameraState.running = false;
        void liberarCamaraWeb().catch(() => {}).finally(() => {
          webCameraState.error = error;
          avisar('Error procesando cámara: ' + error);
          pintarEstadoCamaraWeb();
        });
      }
    }

    // Lazo con worker: un frame en vuelo. Al volver el resultado se manda el
    // siguiente antes de procesar este, asi el worker no espera al hilo
    // principal ni al proximo rAF.
    function enviarFrameWorkerWeb(video) {
      const worker = capturaWorkerWeb;
      if (!worker || capturaWorkerOcupado || !webCameraState.running) return;
      if (!hayFrameNuevoVideo(video)) return;
      marcarFrameVideoUsado(video);
      capturaWorkerOcupado = true;
      const timestampMs = siguienteTimestampWeb();
      const enviadoAt = performance.now();
      // Una respuesta tardia de un worker ya cerrado no libera al nuevo.
      const soltar = () => {
        if (capturaWorkerWeb === worker) capturaWorkerOcupado = false;
      };
      // Sin bitmap (video aun no listo): se salta el frame, el worker sigue.
      createImageBitmap(video).then((frame) => worker.detect(frame, timestampMs)
        .then((salida) => {
          soltar();
          if (capturaWorkerWeb !== worker || !webCameraState.running) return;
          enviarFrameWorkerWeb(video);
          procesarResultadoWorker(worker, salida, timestampMs, enviadoAt);
        }, (error) => {
          soltar();
          if (capturaWorkerWeb === worker && webCameraState.running) {
            caerWorkerAHiloPrincipal(error);
          }
        }), soltar);
    }

    // Resultado del worker (envio o stream) al pipeline comun. `desdeMs` =
    // captura del frame; ms.rt en la sesion = espera + inferencia + entrega.
    function procesarResultadoWorker(worker, {result, ms, stages}, timestampMs, desdeMs) {
      const processStartedAt = performance.now();
      const sourceFrameId = webCaptureFrameIndex + 1;
      diagnosticPointIssues = [];
      diagnosticErrors = [];
      try {
        const unificado = worker.mode === 'separado'
          ? separadoToTaskResults(result) : holisticToTaskResults(result);
        registrarTiempoWeb('pose', stages?.pose ?? ms);
        registrarTiempoWeb('hand', stages?.hand ?? 0);
        caraVivo = unificado.face;
        procesarDeteccionWeb({timestampMs, sourceFrameId, processStartedAt,
          ejecutarPose: true, poseResult: unificado.poseResult,
          handResult: unificado.handResult,
          workerRtMs: processStartedAt - desdeMs});
      } catch (e) {
        manejarErrorFrameWeb(e);
      }
    }

    // Stream: el worker lee la camara (MediaStreamTrackProcessor) y toma el
    // frame mas reciente en cuanto termina el anterior, sin esperar a que el
    // hilo principal termine de renderizar. 2026-10-04: en el modo de envio
    // la ida y vuelta era 38 ms para 31 ms de inferencia (~25 FPS).
    function iniciarStreamWorkerWeb() {
      capturaStreamActivo = false;
      const worker = capturaWorkerWeb;
      const track = camaraStream?.getVideoTracks?.()[0];
      if (!worker || !track || !capturaStreamPedido ||
          typeof MediaStreamTrackProcessor !== 'function') return false;
      try {
        const procesador = new MediaStreamTrackProcessor({track, maxBufferSize: 1});
        worker.stream(procesador.readable, {
          onResult: (salida) => {
            if (capturaWorkerWeb !== worker || !webCameraState.running) return;
            procesarResultadoWorker(worker, salida,
              siguienteTimestampWeb(salida.capturedAtMs), salida.capturedAtMs);
          },
          onError: (error) => {
            if (capturaWorkerWeb === worker && webCameraState.running) {
              capturaStreamActivo = false;
              caerWorkerAHiloPrincipal(error);
            }
          },
          onEnd: () => {
            if (capturaWorkerWeb === worker) capturaStreamActivo = false;
          },
        });
        capturaStreamActivo = true;
      } catch (error) {
        capturaWorkerError = 'stream: ' + String(error?.message ?? error).slice(0, 280);
      }
      return capturaStreamActivo;
    }

    function procesarCamaraWeb() {
      if (!webCameraState.running) return;
      const video = document.getElementById('camaraVideo');
      // Diferenciar FPS configurados de FPS reales entregados por la fuente.
      // Un navegador puede negociar 30 FPS y entregar menos frames al video.
      const ahoraEntrada = performance.now();
      const playback = video?.getVideoPlaybackQuality?.();
      if (playback && Number.isFinite(playback.totalVideoFrames)) {
        if (!camaraInputQualityInicio) {
          camaraInputQualityInicio = ahoraEntrada;
          camaraInputQualityFrames = playback.totalVideoFrames;
          camaraInputQualityDropped = Number(playback.droppedVideoFrames) || 0;
        } else if (ahoraEntrada - camaraInputQualityInicio >= 1000) {
          webCameraState.inputFps = Math.max(0, Math.round(
            (playback.totalVideoFrames - camaraInputQualityFrames) * 1000 /
            (ahoraEntrada - camaraInputQualityInicio)));
          // La camara limita todo lo demas: avisar una vez si entrega poco
          // (webcams UVC bajan a 15 FPS con poca luz para exponer mas).
          if (!avisoFpsCamara && webCameraState.frames > 90 &&
              webCameraState.inputFps > 0 && webCameraState.inputFps < 24) {
            avisoFpsCamara = true;
            avisar(`La cámara entrega ${webCameraState.inputFps} FPS (se pidieron 30). ` +
              'Con más luz suele subir a 30. En Linux se puede fijar con ' +
              'v4l2-ctl: exposure_dynamic_framerate=0 (o exposure_auto_priority=0).');
            eventoSesion('camera_low_fps', {input_fps: webCameraState.inputFps,
              requested_fps: webCameraState.captureFps});
          }
          camaraInputQualityInicio = ahoraEntrada;
          camaraInputQualityFrames = playback.totalVideoFrames;
        }
        webCameraState.framesSkipped = Math.max(0,
          (Number(playback.droppedVideoFrames) || 0) - camaraInputQualityDropped);
      }
      if (capturaWorkerWeb) {
        if (!capturaStreamActivo) enviarFrameWorkerWeb(video);
      } else if (hayFrameNuevoVideo(video) && !webCameraState.processing) {
        marcarFrameVideoUsado(video);
        webCameraState.processing = true;
        const processStartedAt = performance.now();
        const timestampMs = siguienteTimestampWeb();
        const sourceFrameId = webCaptureFrameIndex + 1;
        diagnosticPointIssues = [];
        diagnosticErrors = [];
        try {
          // Hands run every accepted frame; pose runs every second frame after
          // first lock. Fast finger response gets priority without losing
          // shoulder-chain identity.
          let ejecutarPose, poseResult, handResult;
          if (!holisticLandmarkerWeb && !(poseLandmarkerWeb && handLandmarkerWeb)) {
            // Recreando detectores: se salta el frame sin marcar error.
            throw kSaltarFrameWeb;
          }
          if (holisticLandmarkerWeb) {
            // Holistic: cuerpo, manos y cara en una pasada, pose cada frame.
            const holisticStartedAt = performance.now();
            let crudo;
            try {
              crudo = holisticLandmarkerWeb.detectForVideo(video, timestampMs);
            } catch (error) {
              caerHolisticACpu(error);
              throw kSaltarFrameWeb;
            }
            const unificado = holisticToTaskResults(crudo);
            registrarTiempoWeb('pose', performance.now() - holisticStartedAt);
            registrarTiempoWeb('hand', 0);
            ejecutarPose = true;
            poseResult = unificado.poseResult;
            handResult = unificado.handResult;
            caraVivo = unificado.face;
          } else {
            ejecutarPose = adaptivePoseScheduler.shouldRun(
              webCaptureFrameIndex, !!webPoseCache);
            const poseStartedAt = performance.now();
            poseResult = ejecutarPose
              ? poseLandmarkerWeb.detectForVideo(video, timestampMs) : null;
            if (ejecutarPose) {
              registrarTiempoWeb('pose', performance.now() - poseStartedAt);
            }
            const handStartedAt = performance.now();
            handResult = handLandmarkerWeb.detectForVideo(video, timestampMs);
            registrarTiempoWeb('hand', performance.now() - handStartedAt);
          }
          procesarDeteccionWeb({timestampMs, sourceFrameId, processStartedAt,
            ejecutarPose, poseResult, handResult});
        } catch (e) {
          manejarErrorFrameWeb(e);
        } finally {
          webCameraState.processing = false;
        }
      }
      if (webCameraState.running) {
        camaraLoopId = requestAnimationFrame(procesarCamaraWeb);
      }
    }

    async function liberarCamaraWeb() {
      cancelAnimationFrame(camaraLoopId);
      void cerrarSesionAutomatica('camera_stop');
      if (camaraStream) {
        for (const track of camaraStream.getTracks()) track.stop();
        camaraStream = null;
      }
      const video = document.getElementById('camaraVideo');
      if (video) {
        video.pause();
        video.srcObject = null;
      }
      if (poseLandmarkerWeb) {
        poseLandmarkerWeb.close();
        poseLandmarkerWeb = null;
      }
      if (handLandmarkerWeb) {
        handLandmarkerWeb.close();
        handLandmarkerWeb = null;
      }
      if (holisticLandmarkerWeb) {
        holisticLandmarkerWeb.close();
        holisticLandmarkerWeb = null;
      }
      if (capturaWorkerWeb) {
        capturaWorkerWeb.close();
        capturaWorkerWeb = null;
      }
      capturaWorkerOcupado = false;
      capturaStreamActivo = false;
      caraVivo = null;
      webPoseCache = null;
      webCaptureFrameIndex = 0;
      frameVivo = null;
      frameVivoRecibidoAt = 0;
      frameVivoExterno = false;
      frameVivoStale = false;
      reiniciarFiltroWeb();
      reiniciarNeutralPulgar();
      reiniciarEstadoPerdidaMano();
      if (vrm) {
        transicionReposo('camara',
          [...huesosBrazo('left'), ...huesosBrazo('right')], posarReposo);
      }
      webCameraState.running = false;
      webCameraState.processing = false;
      webCameraState.detectorsReady = !!preloadedLandmarkersWeb;
      webCameraState.recording = false;
      webCameraState.recordedFrames = 0;
      webCameraState.stale = false;
      webCameraState.staleMs = 0;
      webGrabacion = [];
      webGrabacionSignSpace = [];
    }

    async function crearLandmarkersWeb(vision, fileset) {
      const { PoseLandmarker, HandLandmarker } = vision;
      const base = (model, gpu) => ({
        modelAssetPath: model,
        ...(gpu ? { delegate: 'GPU' } : {}),
      });
      if (capturaModo === 'holistic') {
        const opciones = {
          minPoseDetectionConfidence: confianzaTracking.deteccion,
          minPosePresenceConfidence: confianzaTracking.presencia,
          minHandLandmarksConfidence: confianzaTracking.presencia,
          minFaceDetectionConfidence: 0.4,
          minFacePresenceConfidence: 0.4,
          // El subgrafo de blendshapes falla en GPU WebGL ("No support of
          // const"); las expresiones salen de la geometria de la malla.
          outputFaceBlendshapes: false,
        };
        holisticCrear = (gpu, modelo = holisticModelo) =>
          vision.HolisticLandmarker.createFromOptions(fileset, {
            ...opciones,
            baseOptions: base(modelo, gpu),
            runningMode: 'VIDEO',
          });
        // Worker primero (solo GPU); si no arranca, cadena del hilo principal.
        capturaWorkerError = null;
        capturaWorkerModelo = null;
        if (capturaWorkerPedido && holisticWorkerSupported()) {
          const cliente = createHolisticWorkerClient({
            bundleUrl: kMediaPipeBundle,
            wasmUrl: kMediaPipeWasm,
            // El worker nace de un Blob: las rutas deben ser absolutas.
            models: [new URL(HOLISTIC_MODEL_LOCAL, location.href).href,
              HOLISTIC_MODEL_URL],
            options: opciones,
          });
          try {
            const {model} = await cliente.init();
            holisticModelo = model;
            capturaWorkerModelo = model;
            holisticEnCpu = false;
            return {capturaWorker: cliente};
          } catch (error) {
            cliente.close();
            capturaWorkerError = String(error?.message ?? error).slice(0, 300);
          }
        } else if (capturaWorkerPedido) {
          capturaWorkerError = 'unsupported';
        }
        // Local primero (offline); luego la URL oficial; GPU y luego CPU.
        for (const modelo of [HOLISTIC_MODEL_LOCAL, HOLISTIC_MODEL_URL]) {
          for (const gpu of [true, false]) {
            try {
              const tarea = await holisticCrear(gpu, modelo);
              holisticModelo = modelo;
              holisticEnCpu = !gpu;
              return {holistic: tarea};
            } catch (error) {
              eventoSesion('holistic_create_failed', {model: modelo, gpu,
                error: String(error?.message ?? error).slice(0, 300)});
            }
          }
        }
        // Sin Holistic: respaldo a Pose + Hand para no dejar sin camara.
        capturaModo = 'separado';
        avisar('Holistic no disponible; usando captura separada');
        eventoSesion('capture_fallback', {to: 'separado'});
      }
      // Separado en worker: Pose lite + Hand + Face (cara opcional). Medido
      // 2026-10-04 con video: ida y vuelta 37 ms contra 27 de Holistic y mas
      // manos perdidas (HandLandmarker busca palmas cada frame mientras no
      // ve dos manos); por eso Holistic sigue de producto.
      if (capturaWorkerPedido && holisticWorkerSupported()) {
        const abs = (modelo) => new URL(modelo, location.href).href;
        const confianza = {minTrackingConfidence: confianzaTracking.seguimiento};
        const cliente = createHolisticWorkerClient({
          mode: 'separado',
          bundleUrl: kMediaPipeBundle,
          wasmUrl: kMediaPipeWasm,
          models: {pose: [abs(kPoseModelWeb)], hand: [abs(kHandModelWeb)],
            face: [kFaceModelUrl]},
          options: {
            pose: {numPoses: 1,
              minPoseDetectionConfidence: confianzaTracking.deteccion,
              minPosePresenceConfidence: confianzaTracking.presencia, ...confianza},
            hand: {numHands: 2,
              minHandDetectionConfidence: confianzaTracking.deteccion,
              minHandPresenceConfidence: confianzaTracking.presencia, ...confianza},
            face: {numFaces: 1, minFaceDetectionConfidence: 0.4,
              minFacePresenceConfidence: 0.4, minTrackingConfidence: 0.3,
              outputFaceBlendshapes: false},
          },
        });
        try {
          const {model} = await cliente.init();
          capturaWorkerModelo = model;
          return {capturaWorker: cliente};
        } catch (error) {
          cliente.close();
          capturaWorkerError = String(error?.message ?? error).slice(0, 300);
        }
      }
      let pose = null;
      let hand = null;
      try {
        pose = await PoseLandmarker.createFromOptions(fileset, {
            baseOptions: base(kPoseModelWeb, true),
            runningMode: 'VIDEO',
            numPoses: 1,
            minPoseDetectionConfidence: confianzaTracking.deteccion,
            minPosePresenceConfidence: confianzaTracking.presencia,
            minTrackingConfidence: confianzaTracking.seguimiento,
          });
        hand = await HandLandmarker.createFromOptions(fileset, {
            baseOptions: base(kHandModelWeb, true),
            runningMode: 'VIDEO',
            numHands: 2,
            minHandDetectionConfidence: confianzaTracking.deteccion,
            minHandPresenceConfidence: confianzaTracking.presencia,
            minTrackingConfidence: confianzaTracking.seguimiento,
          });
        return { pose, hand };
      } catch (gpuError) {
        if (pose) pose.close();
        if (hand) hand.close();
        return {
          pose: await PoseLandmarker.createFromOptions(fileset, {
            baseOptions: base(kPoseModelWeb, false),
            runningMode: 'VIDEO',
            numPoses: 1,
            minPoseDetectionConfidence: confianzaTracking.deteccion,
            minPosePresenceConfidence: confianzaTracking.presencia,
            minTrackingConfidence: confianzaTracking.seguimiento,
          }),
          hand: await HandLandmarker.createFromOptions(fileset, {
            baseOptions: base(kHandModelWeb, false),
            runningMode: 'VIDEO',
            numHands: 2,
            minHandDetectionConfidence: confianzaTracking.deteccion,
            minHandPresenceConfidence: confianzaTracking.presencia,
            minTrackingConfidence: confianzaTracking.seguimiento,
          }),
        };
      }
    }

    async function precargarDetectoresWeb() {
      if (!standaloneWeb) return null;
      if (preloadedLandmarkersWeb) {
        webCameraState.detectorsReady = true;
        return preloadedLandmarkersWeb;
      }
      if (detectorWarmupWeb) return detectorWarmupWeb;
      webCameraState.detectorsLoading = true;
      webCameraState.detectorError = null;
      pintarEstadoCamaraWeb();
      detectorWarmupWeb = (async () => {
        const vision = await import(kMediaPipeBundle);
        const fileset = await vision.FilesetResolver.forVisionTasks(kMediaPipeWasm);
        visionWeb = vision;
        filesetWeb = fileset;
        const tasks = await crearLandmarkersWeb(vision, fileset);
        preloadedLandmarkersWeb = tasks;
        webCameraState.detectorsReady = true;
        return tasks;
      })().catch((error) => {
        webCameraState.detectorsReady = false;
        webCameraState.detectorError = String(error?.message ?? error);
        avisar('Detectores MediaPipe: ' + webCameraState.detectorError);
        throw error;
      }).finally(() => {
        detectorWarmupWeb = null;
        webCameraState.detectorsLoading = false;
        pintarEstadoCamaraWeb();
      });
      return detectorWarmupWeb;
    }

    window.precargarDetectoresWeb = precargarDetectoresWeb;

    function iniciarGrabacionWeb() {
      if (!webCameraState.running) return;

    function descargarGrabacionWeb() {
      if (!webUltimaSecuencia) return;
      const paquete = {
        schema: 'MotionSequenceV2',
        norm_version: '2.0.0',
        frame_dim: kFrameDim,
        t_frames: kTFrames,
        fps: 30,
        frames: webUltimaSecuencia,
        // Opcional: permite reproducir la sena en cualquier avatar con el
        // retarget por anclas. Lectores viejos lo ignoran.
        ...(webUltimaSignSpace ? {
          sign_space_version: SIGN_SPACE_VERSION,
          sign_space: webUltimaSignSpace,
        } : {}),
      };
      const blob = new Blob([JSON.stringify(paquete)], {
        type: 'application/json',
      });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = 'motion_sequence_v2.json';
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    const anchoCamaraWeb = (() => {
      try {
        const pedido = Number(new URLSearchParams(location.search).get('res'));
        return [360, 480, 640, 960].includes(pedido) ? pedido : 360;
      } catch (_) { return 360; }
    })();
    async function solicitarStreamWeb() {
      const solicitud = navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: 'user',
          frameRate: { ideal: 30, max: 60 },
          // 360x270 keeps all 21 points usable; controlled A/B at 320x240
          // increased detector p95 on this host. Real device must still
          // validate 30 FPS target. ?res=480|640|960 para medir si Holistic
          // mejora las manos con mas resolucion (se registra en la sesion).
          width: { ideal: anchoCamaraWeb, max: anchoCamaraWeb },
          height: { ideal: anchoCamaraWeb * 3 / 4, max: anchoCamaraWeb * 3 / 4 },
        },
      });
      let cancelado = false;
      const vigilante = solicitud.then((stream) => {
        if (cancelado) {
          for (const track of stream.getTracks()) track.stop();
        }
        return stream;
      });
      let temporizador;
      try {
        return await Promise.race([
          vigilante,
          new Promise((_, reject) => {
            temporizador = setTimeout(() => reject(
              new Error('Permiso de cámara pendiente o no concedido.')), 20000);
          }),
        ]);
      } finally {
        cancelado = true;
        clearTimeout(temporizador);
      }
    }

      const repetir = document.getElementById('bRepetirCamara');
      const descargar = document.getElementById('bDescargarCamara');
      panel.style.display = 'block';
      controlSuavizar.addEventListener('change', () => {
        webCameraState.smoothing = controlSuavizar.checked;
        reiniciarFiltroWeb();
      });
      controlReposoMano.checked = cal.resetHandOnLoss;
      controlReposoMano.addEventListener('change', () => {
        cal.resetHandOnLoss = controlReposoMano.checked;
        reiniciarEstadoPerdidaMano();
      });
      controlDiagnostico.addEventListener('change', () => {
        window.configurarDiagnostico(controlDiagnostico.checked);
      });
      iniciar.addEventListener('click', () => { window.iniciarCamaraWeb(); });
      detener.addEventListener('click', () => { window.detenerCamaraWeb(); });
      grabar.addEventListener('click', iniciarGrabacionWeb);
      repetir.addEventListener('click', repetirGrabacionWeb);
      descargar.addEventListener('click', descargarGrabacionWeb);
      document.getElementById('bPerfilCorporal').addEventListener('click', () => {
        const ok = window.confirm('Medir tu cuerpo unos segundos para adaptar ' +
          'el avatar. Solo se guardan medidas en este navegador (sin video) ' +
          'y puedes borrarlas cuando quieras. ¿Continuar?');
        if (ok) window.iniciarCapturaPerfil({consent: true});
      });
      document.getElementById('bBorrarPerfil').addEventListener('click',
        () => { window.borrarPerfilCorporal(); });
      document.getElementById('bDescargarSesion').addEventListener('click',
        descargarSesionWeb);
      document.getElementById('bBorrarDatos').addEventListener('click',
        () => { window.borrarMisDatos(); });
      const controlEspejo = document.getElementById('avatarVistaEspejo');
      controlEspejo.checked = vistaAvatar === 'espejo';
      controlEspejo.addEventListener('change', () => {
        window.configurarVista(controlEspejo.checked ? 'espejo' : 'interlocutor');
      });
      const controlRetarget = document.getElementById('camaraRetarget');
      controlRetarget.checked = retargetMode === 'anchors';
      controlRetarget.addEventListener('change', () => {
        window.configurarRetarget(controlRetarget.checked ? 'anchors' : 'legacy');
      });
      // pagehide (no beforeunload) es el evento fiable al cerrar o cambiar de
      // pestana, tambien en movil. sendBeacon entrega aunque la pagina muera.
      // Marcas de protocolo: teclas 1-9 anotan el paso actual en la sesion
      // para que el analisis separe errores por gesto.
      window.addEventListener('keydown', (event) => {
        // Solo se ignoran campos de texto: tras marcar una casilla el foco
        // queda en un <input type=checkbox> y antes se perdian las marcas.
        const t = event.target;
        const escribiendo = t?.isContentEditable || t?.tagName === 'TEXTAREA' ||
          (t?.tagName === 'INPUT' &&
            !['checkbox', 'radio', 'button', 'range'].includes(t.type));
        if (!sesionActual || !/^[1-9]$/.test(event.key) || escribiendo) return;
        const paso = Number(event.key);
        eventoSesion('marker', {step: paso, protocol: protocoloMarcas,
          name: kProtocolos[protocoloMarcas][paso - 1]});
        avisar('Marca ' + paso + ' · ' + kProtocolos[protocoloMarcas][paso - 1]);
      });
      window.addEventListener('pagehide', () => {
        const sesion = sesionActual;
        sesionActual = null;
        sesion?.closeNow({reason: 'page_unload', maxBytes: 30000}, (id, lineas) =>
          servidorSesionesOk && navigator.sendBeacon?.(
            '/api/sesiones/' + encodeURIComponent(id),
            new Blob([lineas.join('\n')], {type: 'text/plain'})));
        liberarCamaraWeb();
      });
      pintarEstadoCamaraWeb();
      void precargarDetectoresWeb().catch(() => {});
      const autoStartDeadline = performance.now() + 15000;
      const autoStart = () => {
        if (webCameraState.running || webCameraState.loading ||
            webCameraState.error || webCameraState.detectorError) return;
        if (vrm) {
          void window.iniciarCamaraWeb();
          return;
        }
        if (performance.now() < autoStartDeadline) setTimeout(autoStart, 100);
      };
      setTimeout(autoStart, 0);
    }

    document.getElementById('bPlegarDiag')?.addEventListener('click', () => {
      const panel = document.getElementById('diagnosticoPanel');
      panel.classList.toggle('plegado');
      document.getElementById('bPlegarDiag').textContent =
        panel.classList.contains('plegado') ? '+' : '–';
    });
    document.getElementById('bCapturarDiag')?.addEventListener(
      'click', alternarCapturaDiagnostico);
    document.getElementById('bLimpiarDiag')?.addEventListener('click', () => {
      rigDiagnostics.clear();
      rigAudit.clear();
      ultimoAuditEmitido.clear();
      pintarDiagnostico();
    });
    document.getElementById('bExportarDiag')?.addEventListener(
      'click', exportarDiagnostico);
    document.getElementById('bCalibrarPulgares')?.addEventListener(
      'click', () => window.iniciarCalibracionPulgares());
    document.getElementById('camaraOverlay')?.addEventListener('click', (event) => {
      if (!diagnosticoActivo || !diagnosticOverlayPoints.length) return;
      const canvas = event.currentTarget;
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * canvas.width / rect.width;
      const y = (event.clientY - rect.top) * canvas.height / rect.height;
      const nearest = diagnosticOverlayPoints.reduce((best, point) => {
        const distance = Math.hypot(point.x - x, point.y - y);
        return !best || distance < best.distance ? {point, distance} : best;
      }, null);
      if (nearest && nearest.distance < Math.max(18, canvas.width / 18)) {
        const point = nearest.point;
        document.getElementById('diagErrores').textContent =
          `${point.stream}:${point.side ?? 'body'}:${point.landmark} — ${point.code}`;
      }
    });

    function frameA3Puntos(v) {
      const pt = (i) => new THREE.Vector3(
        v[kOffBody + i * 3], v[kOffBody + i * 3 + 1], v[kOffBody + i * 3 + 2]);

      const presI = v[kOffPresL] >= 0.5;
      const presD = v[kOffPresR] >= 0.5;
      // Munecas: hay DOS fuentes. kOffLoc* viene del detector de manos y es
      // mas preciso, pero llega en cero cuando esa mano no se detecto -- y el
      // cero es el centro entre los hombros, asi que el brazo se doblaba
      // apuntando al pecho. Las munecas del bloque de cuerpo existen siempre
      // que se vea el cuerpo. Se usa la de la mano si esta, si no la del
      // cuerpo.
      const munI = presI
        ? new THREE.Vector3(v[kOffLocL], v[kOffLocL + 1], v[kOffLocL + 2])
        : pt(kPtMunI);
      const munD = presD
        ? new THREE.Vector3(v[kOffLocR], v[kOffLocR + 1], v[kOffLocR + 2])
        : pt(kPtMunD);

      const manoI = [];
      const manoD = [];
      for (let j = 0; j < 20; j++) {
        manoI.push([v[kOffShapeL + j * 3], v[kOffShapeL + j * 3 + 1], v[kOffShapeL + j * 3 + 2]]);
        manoD.push([v[kOffShapeR + j * 3], v[kOffShapeR + j * 3 + 1], v[kOffShapeR + j * 3 + 2]]);
      }
      return {
        hombroI: pt(kPtHombroI), hombroD: pt(kPtHombroD),
        codoI: pt(kPtCodoI), codoD: pt(kPtCodoD),
        caderaI: pt(kPtCaderaI), caderaD: pt(kPtCaderaD),
        munI, munD, presI, presD, manoI, manoD,
      };
    }

    // Un codo nunca puede estar en el origen: por construccion de
    // sign_norm.dart, el origen es el punto medio entre los hombros. Cuando
    // una sena es de una sola mano, los landmarks del brazo que no participa
    // llegan en cero, y ese cero se colaba como posicion valida. Si el codo
    // cae ahi, el dato no existe y el brazo va a reposo.
    function brazoTieneDatos(codo) {
      return Math.sqrt(codo.x * codo.x + codo.y * codo.y) > 0.05;
    }

    function aplicarFrame(v, meta = {}) {
      if (!vrm || modoManual) return;
      if (!Array.isArray(v) || v.length !== kFrameDim ||
          v.some((value) => !Number.isFinite(Number(value)))) {
        guardarAudit({
          frame: meta.frameId ?? null,
          timestampMs: Number(meta.timestampMs) || performance.now(),
          stage: 'render_ingress', joint: null, score: 0,
          severity: 'error', state: 'REJECTED', action: 'drop_frame',
          code: 'non_finite_transform',
        });
        return;
      }
      const p = frameA3Puntos(v);
      const base = baseCuerpo(p);
      const ahoraMs = typeof performance !== 'undefined' && performance.now
        ? performance.now() : Date.now();
      const brazoIVisible = base && brazoTieneDatos(p.codoI);
      const brazoDVisible = base && brazoTieneDatos(p.codoD);
      const usarManoI = actualizarEstadoPerdidaMano(
        'left', !!brazoIVisible && p.presI, ahoraMs);
      const usarManoD = actualizarEstadoPerdidaMano(
        'right', !!brazoDVisible && p.presD, ahoraMs);
      if (base) aplicarTorso(p, meta);
      if (manosActivas.left) {
        const estado = estadoPerdidaMano.left;
        if (brazoIVisible && p.presI && usarManoI) {
          const frameMeta = estado.recoveryFrames > 0
            ? {...meta, recovery: true} : meta;
          resolverBrazo('left', base, p.hombroI, p.codoI, p.munI, frameMeta);
          moverMano('left', true, p.manoI, frameMeta);
          orientarMuneca('left', true, p.manoI, base, frameMeta);
          estado.recoveryFrames = Math.max(0, estado.recoveryFrames - 1);
        } else if (!brazoIVisible || estado.enReposo) {
          if (!estado.reposoAplicado) {
            transicionReposo('left:brazo', huesosBrazo('left'),
              () => posarReposoBrazo('left', meta));
            estado.reposoAplicado = true;
            guardarAudit({
              frame: meta.frameId ?? null,
              timestampMs: Number(meta.timestampMs) || performance.now(),
              stage: 'tracking', joint: 'left:arm', score: 0,
              severity: 'warn', state: 'FROZEN',
              action: 'return_local_chain_to_rest', code: 'arm_or_hand_lost',
            });
          }
        }
      }
      if (manosActivas.right) {
        const estado = estadoPerdidaMano.right;
        if (brazoDVisible && p.presD && usarManoD) {
          const frameMeta = estado.recoveryFrames > 0
            ? {...meta, recovery: true} : meta;
          resolverBrazo('right', base, p.hombroD, p.codoD, p.munD, frameMeta);
          moverMano('right', true, p.manoD, frameMeta);
          orientarMuneca('right', true, p.manoD, base, frameMeta);
          estado.recoveryFrames = Math.max(0, estado.recoveryFrames - 1);
        } else if (!brazoDVisible || estado.enReposo) {
          if (!estado.reposoAplicado) {
            transicionReposo('right:brazo', huesosBrazo('right'),
              () => posarReposoBrazo('right', meta));
            estado.reposoAplicado = true;
            guardarAudit({
              frame: meta.frameId ?? null,
              timestampMs: Number(meta.timestampMs) || performance.now(),
              stage: 'tracking', joint: 'right:arm', score: 0,
              severity: 'warn', state: 'FROZEN',
              action: 'return_local_chain_to_rest', code: 'arm_or_hand_lost',
            });
          }
        }
      }
    }

    // Modulo interno: un solo punto de entrada para vivo y replay. El estado
    // del rig queda encapsulado en esta pagina; Dart solo conoce contrato V2.
    const RigBodyEngine = Object.freeze({ aplicarFrame });

    let colaSignSpace = null;
    window.reproducirSecuencia = function (seqJson, fps, normVersion,
        signSpaceJson = null) {
      if (normVersion != null && String(normVersion) !== '2.0.0') {
        avisar('norm_version incompatible: ' + normVersion, {tecnico: true});
        return;
      }
      try {
        // Android manda JSON (runJavaScript); Flutter Web manda el arreglo
        // tal cual por postMessage. JSON.parse(arreglo) fallaba siempre.
        colaFrames = typeof seqJson === 'string' ? JSON.parse(seqJson) : seqJson;
      } catch (e) {
        avisar('secuencia invalida: ' + e, {tecnico: true});
        return;
      }
      if (!Array.isArray(colaFrames) || colaFrames.length !== kTFrames ||
          colaFrames.some((frame) => !Array.isArray(frame) ||
            frame.length !== kFrameDim ||
            frame.some((value) => !Number.isFinite(Number(value))))) {
        avisar('secuencia incompatible: se requieren 32 frames de 152 valores',
          {tecnico: true});
        colaFrames = [];
        return;
      }
      colaSignSpace = null;
      if (signSpaceJson) {
        try {
          colaSignSpace = parseSignSpaceSequence(
            typeof signSpaceJson === 'string'
              ? JSON.parse(signSpaceJson) : signSpaceJson,
            colaFrames.length);
        } catch (_) { /* pista invalida: se reproduce solo con 152D */ }
      }
      frameActual = 0;
      kFps = Number.isFinite(Number(fps)) && Number(fps) > 0
        ? Math.min(120, Math.max(1, Number(fps))) : 30;
      frameVivo = null;
      signSpaceVivo = null;
      frameVivoFrameId = 0;
      frameVivoSourceSkewMs = 0;
      frameVivoRecibidoAt = 0;
      frameVivoExterno = false;
      frameVivoStale = false;
      reiniciarFiltroWeb();
      reiniciarNeutralPulgar();
      reiniciarEstadoPerdidaMano();
      // La plantilla reinicia su reloj en 0: con compuertas que vieron
      // frames en vivo (o la plantilla anterior) todo el torso quedaba
      // rechazado como stale_frame.
      resetSafetyGates();
      reproduccionRenderId = 0;
      acumMs = 0;
      crossfadePose('reproduccion', huesosCuerpo());
      reproduciendo = colaFrames.length > 0;
    };

    // Modo espejo: aplica UN frame al instante, sin cola ni interpolacion.
    // Lo alimenta la camara en vivo (pantalla_espejo.dart). Corta cualquier
    // reproduccion en curso para que no peleen por los mismos huesos.
    // Dart (Traducir) lo activa para cortar senas con el filtro del visor.
    let movimientoParaDart = false;
    window.configurarMovimiento = function (activo) {
      movimientoParaDart = activo === true;
    };

    window.aplicarFrameVivo = function (frameJson, timestampMs, quality,
        renderFrameJson = null, sourceMetaJson = null) {
      if (!vrm) return;
      let v, renderV = null, sourceMeta = null;
      try {
        v = JSON.parse(frameJson);
        if (renderFrameJson) renderV = JSON.parse(renderFrameJson);
        if (sourceMetaJson) sourceMeta = JSON.parse(sourceMetaJson);
      } catch (e) {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'bridge', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'drop_frame', code: 'frame_parse_error',
        }));
        return; // un frame suelto que no parsea no merece cartel de error
      }
      if (!Array.isArray(v) || v.length !== kFrameDim ||
          v.some((value) => !Number.isFinite(Number(value)))) {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'bridge', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'drop_frame', code: 'non_finite_transform',
        }));
        return;
      }
      if (!Array.isArray(renderV) || renderV.length !== kFrameDim ||
          renderV.some((value) => !Number.isFinite(Number(value)))) {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'bridge', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'fallback_raw_frame',
          code: 'render_non_finite_transform',
        }));
        renderV = v;
      }
      const skew = classifySourceSkew(sourceMeta?.source_skew_ms ?? 0);
      if (skew.mode === 'reject') {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'fusion', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'drop_frame', code: 'stage_desync',
        }));
        return;
      }
      if (!frameVivoExterno) {
        reiniciarNeutralPulgar();
        reiniciarEstadoPerdidaMano();
      }
      reproduciendo = false;
      colaFrames = [];
      frameVivoTimestampMs = Number(timestampMs) || 0;
      frameVivoFrameId++;
      frameVivoSourceSkewMs = Number(sourceMeta?.source_skew_ms ?? 0);
      signSpaceVivo = filtrarSignSpace(
        parseSignSpaceFrame(sourceMeta?.sign_space), frameVivoTimestampMs);
      // Android (Holistic nativo) manda 17 puntos clave de cara.
      const aspecto = Number(sourceMeta?.image_aspect);
      aspectoImagenVivo = aspecto > 0 && Number.isFinite(aspecto) ? aspecto : null;
      const caraPuntos = faceFromKeypoints(sourceMeta?.face_pts);
      caraVivo = caraPuntos ? {landmarks: caraPuntos, blendshapes: {}} : null;
      frameVivoQuality = Number(quality) || 0;
      frameVivoRecibidoAt = performance.now();
      if (!standaloneWeb) {
        aplicarNivelRender(sourceMeta?.tier);
        perfEmbebido.frameReceived({
          frameId: frameVivoFrameId,
          receivedAtMs: frameVivoRecibidoAt,
          inferMs: sourceMeta?.infer_ms,
          hasHand: sourceMeta?.has_hand === true,
          tier: sourceMeta?.tier,
          thermal: sourceMeta?.thermal,
        });
        // El seguimiento corre en Kotlin (CapturaManos): sus errores y su
        // estado por lado alimentan los mismos contadores que la web.
        const trackingNativo = nativeTracking(sourceMeta?.hand_track,
          sourceMeta?.errors);
        if (trackingNativo) {
          Object.assign(webCameraState,
            countHandEvents(webCameraState, trackingNativo));
          webCameraState.leftSurface = trackingNativo.left.surface ?? 'unknown';
          webCameraState.rightSurface = trackingNativo.right.surface ?? 'unknown';
        }
      }
      frameVivoExterno = !standaloneWeb;
      frameVivoStale = false;
      diagnosticPointIssues = [];
      diagnosticErrors = [];
      ultimoTrackingWeb = null;
      ultimoSourceMeta = sourceMeta ?? {
        pose_t: frameVivoTimestampMs,
        hands_t: frameVivoTimestampMs,
        source_skew_ms: 0,
      };
      if (skew.mode === 'project') {
        errorDiagnostico('fusion', 'source_skew', null, null, 'yellow');
      }
      for (const error of sourceMeta?.errors ?? []) {
        if (error?.stage && error?.code) {
          diagnosticErrors.push(error);
          rigAudit.record(createAuditSnapshot({
            frame: frameVivoFrameId + 1,
            timestampMs: frameVivoTimestampMs,
            stage: error.stage,
            joint: error.side ?? null,
            score: 0,
            severity: 'warn',
            state: 'REPORTED', action: 'observe', code: error.code,
          }));
        }
      }
      frameVivo = suavizarFrameWeb(renderV, frameVivoTimestampMs);
      // Traducir (Android) corta las senas con el mismo quieto/movimiento
      // adaptativo del laboratorio web: movimiento intencional del cuerpo o
      // la muneca, o de los dedos, con alguna mano presente.
      if (movimientoParaDart && window.SenasChannel) {
        const d = ultimoDiagnosticoFiltro ?? {};
        const conMano = v[kOffPresL] >= .5 || v[kOffPresR] >= .5;
        const dedos = Number(d.fingerMotionScore ?? 0);
        const enMovimiento = conMano &&
          (d.intentionalMotion === true || dedos >= .8);
        window.SenasChannel.postMessage('motion:' + JSON.stringify({
          t: frameVivoTimestampMs, m: enMovimiento ? 1 : 0,
          s: Math.round(Number(d.motionScore ?? 0) * 100) / 100,
          f: Math.round(dedos * 100) / 100, h: conMano,
        }));
      }
      procesarCalibracionPulgares(v, frameVivoQuality);
      registrarDiagnostico(v, frameVivo, frameVivoTimestampMs,
        frameVivoQuality, ultimoSourceMeta);
      if (diagnosticoActivo) pintarDiagnostico();
    };

    // El editor de pose de desarrollo (panel "Editor de pose", huesos y
    // calibracion a mano) se quitó de esta pantalla. modoManual queda en
    // false para siempre: aplicarFrame() más abajo lo usa como corte de
    // emergencia y no hace falta tocarlo para nada más.
    let modoManual = false;

    let ultimoT = 0;
    let acumMs = 0;
    // Stream que se quedo sin frames: al volver entra con crossfade.
    let volverConCrossfade = false;

    // Interpola dos frames 152D de una plantilla solo si tienen la misma
    // estructura (misma presencia de manos, brazos con datos): un hueco en
    // cero interpolado llevaria la mano al pecho. Si no, el mas cercano.
    function interpolarFramePlantilla(a, b, f) {
      if (!b || f <= 0) return a;
      if (f >= 1) return b;
      const conCodo = (v, punto) => Math.hypot(v[kOffBody + punto * 3],
        v[kOffBody + punto * 3 + 1]) > 0.05;
      const misma = (a[kOffPresL] >= .5) === (b[kOffPresL] >= .5) &&
        (a[kOffPresR] >= .5) === (b[kOffPresR] >= .5) &&
        conCodo(a, kPtCodoI) === conCodo(b, kPtCodoI) &&
        conCodo(a, kPtCodoD) === conCodo(b, kPtCodoD);
      if (!misma) return f < .5 ? a : b;
      return a.map((x, k) => x + (b[k] - x) * f);
    }

    function interpolarSignSpacePlantilla(a, b, f) {
      if (!a || !b) return f < .5 ? a : b;
      const misma = a.mode === b.mode && Object.keys(a.mask).every((k) =>
        a.mask[k] === b.mask[k]);
      if (!misma) return f < .5 ? a : b;
      return {...a, values: a.values.map((x, k) => x + (b.values[k] - x) * f)};
    }

    // Estado del avatar (rig_avatar_state.mjs): solo describe, para el panel
    // y la sesion. Los huesos los mueven aplicarFrame y las transiciones.
    const estadoAvatar = createAvatarStateTracker({onChange: (cambio) => {
      webCameraState.avatarState = cambio.to;
      eventoSesion('avatar_state', {from: cambio.from, to: cambio.to});
    }});
    function actualizarEstadoAvatar(ahoraMs) {
      const camaraEnVivo = standaloneWeb && webCameraState.running;
      const enGracia = (lado) => estadoPerdidaMano[lado].desde > 0 &&
        !estadoPerdidaMano[lado].enReposo;
      estadoAvatar.update({
        playing: reproduciendo,
        streamLive: camaraEnVivo || (!standaloneWeb && frameVivoExterno),
        streamStale: frameVivoStale,
        returning: volviendoAReposo(),
        holding: enGracia('left') || enGracia('right'),
        tracking: !!frameVivo && !frameVivoStale,
      }, ahoraMs);
    }

    // Pose que de verdad ve el usuario (tras compuerta, filtros, zona muerta
    // y transiciones): cuaterniones locales de brazos, manos y cabeza, una
    // vez por frame de camara web. Viaja en el registro de sesion del frame
    // siguiente; analizar_sesion.py mide jitter sobre ella (docs/10 fase 3).
    const kHuesosMedidos = ['LeftUpperArm', 'LeftLowerArm', 'LeftHand',
      'RightUpperArm', 'RightLowerArm', 'RightHand', 'Head'];
    let poseAvatarMedida = null;
    let ultimoSourceMedido = 0;
    function medirPoseAvatar() {
      if (!vrm || !frameVivo) return;
      if (!frameVivoFrameId || frameVivoFrameId === ultimoSourceMedido) return;
      ultimoSourceMedido = frameVivoFrameId;
      const q = {};
      for (const nombre of kHuesosMedidos) {
        const h = bone(VRMHumanBoneName[nombre]);
        if (!h) continue;
        const {x, y, z, w} = h.quaternion;
        q[nombre] = [x, y, z, w].map((v) => Math.round(v * 1e4) / 1e4);
      }
      poseAvatarMedida = {id: frameVivoSourceFrameId || frameVivoFrameId,
        state: webCameraState.avatarState, q};
      webCameraState.avatarPose = poseAvatarMedida;
    }

    // Fluidez visible: por render, el mayor giro de los huesos medidos. Si la
    // pose solo cambia cuando llega un frame de camara, el avatar avanza a
    // saltos (15 cambios/s aunque el render vaya a 144 Hz); esto lo cuenta
    // por segundo en el evento perf (render_motion).
    const fluidezRender = {renders: 0, cambios: 0, totalDeg: 0, maxDeg: 0,
      inicio: 0, segundos: [], previo: new Map()};
    function medirFluidezRender() {
      if (!vrm || !frameVivo) {
        fluidezRender.previo.clear();
        return;
      }
      let paso = 0;
      let huesoPaso = null;
      for (const nombre of kHuesosMedidos) {
        const h = bone(VRMHumanBoneName[nombre]);
        if (!h) continue;
        const previo = fluidezRender.previo.get(nombre);
        if (previo) {
          const giro = previo.angleTo(h.quaternion);
          if (giro > paso) {
            paso = giro;
            huesoPaso = nombre;
          }
          previo.copy(h.quaternion);
        } else {
          fluidezRender.previo.set(nombre, h.quaternion.clone());
        }
      }
      const grados = paso * 180 / Math.PI;
      const f = fluidezRender;
      f.renders++;
      if (grados > .05) f.cambios++;
      f.totalDeg += grados;
      if (grados > f.maxDeg) {
        f.maxDeg = grados;
        f.maxHueso = huesoPaso;
        f.maxEstado = webCameraState.avatarState;
      }
      const ahora = performance.now();
      if (!f.inicio) f.inicio = ahora;
      if (ahora - f.inicio >= 1000) {
        const segundo = {renders: f.renders, changed: f.cambios,
          total_deg: Math.round(f.totalDeg * 10) / 10,
          max_deg: Math.round(f.maxDeg * 100) / 100, max_bone: f.maxHueso,
          max_state: f.maxEstado};
        webCameraState.renderMotion = segundo;
        f.segundos.push(segundo);
        if (f.segundos.length > 10) f.segundos.shift();
        f.renders = 0; f.cambios = 0; f.totalDeg = 0; f.maxDeg = 0;
        f.maxHueso = null; f.maxEstado = null;
        f.inicio = ahora;
      }
    }
    // Segundos completos desde el ultimo evento perf, sumados.
    function drenarFluidezRender() {
      const out = {renders: 0, changed: 0, total_deg: 0, max_deg: 0};
      for (const s of fluidezRender.segundos) {
        out.renders += s.renders;
        out.changed += s.changed;
        out.total_deg = Math.round((out.total_deg + s.total_deg) * 10) / 10;
        if (s.max_deg >= out.max_deg) {
          out.max_deg = s.max_deg;
          out.max_bone = s.max_bone;
        }
      }
      fluidezRender.segundos.length = 0;
      return out;
    }

    // Telefono con el avatar quieto: sin frames en vivo (o stream cortado),
    // sin plantilla ni transiciones en curso y sin mover la camara.
    function avatarEnReposo() {
      return !standaloneWeb && !reproduciendo && !orbitaActiva &&
        transicionesPose.size === 0 && (!frameVivo || frameVivoStale);
    }

    let ultimoRenderAt = 0;
    function animar(t) {
      requestAnimationFrame(animar);
      const presupuesto = avatarEnReposo()
        ? idleBudgetFor(presupuestoRender) : presupuestoRender;
      if (!shouldRenderFrame(ultimoRenderAt, t, presupuesto)) return;
      ultimoRenderAt = t;
      const dt = ultimoT ? t - ultimoT : 16;
      ultimoT = t;

      if (reproduciendo) {
        // Un frame interpolado por render (no saltos de 33 ms): la
        // plantilla tiene 32 frames y el render corre a 60+ Hz.
        acumMs += dt;
        const msPorFrame = 1000 / kFps;
        const posicion = acumMs / msPorFrame;
        if (posicion >= colaFrames.length) {
          reproduciendo = false;
          // Mismo motivo que al empezar: el vivo que siga trae ids nuevos.
          resetSafetyGates();
          transicionReposo('fin',
            [...huesosBrazo('left'), ...huesosBrazo('right')], posarReposo);
          if (window.SenasChannel) window.SenasChannel.postMessage('fin');
        } else {
          const ultimo = colaFrames.length - 1;
          const i = Math.min(ultimo, Math.floor(posicion));
          const f = i < ultimo ? posicion - i : 0;
          frameActual = i;
          reproduccionRenderId++;
          RigBodyEngine.aplicarFrame(
            interpolarFramePlantilla(colaFrames[i], colaFrames[i + 1], f), {
              frameId: reproduccionRenderId,
              timestampMs: posicion * msPorFrame,
              signSpace: interpolarSignSpacePlantilla(
                colaSignSpace?.[i] ?? null, colaSignSpace?.[i + 1] ?? null, f),
            });
        }
      } else if (frameVivo) {
        // Último frame gana: render 60 FPS, entrada de tracking ~30 FPS,
        // cero cola y cero retraso acumulado.
        const camaraEnVivo = standaloneWeb && webCameraState.running;
        const streamExternoEnVivo = !standaloneWeb && frameVivoExterno;
        const streamEnVivo = camaraEnVivo || streamExternoEnVivo;
        const ultimoFrameAt = camaraEnVivo
          ? webCameraState.lastValidAt : frameVivoRecibidoAt;
        const staleMs = streamEnVivo && ultimoFrameAt
          ? Math.max(0, performance.now() - ultimoFrameAt) : 0;
        webCameraState.staleMs = staleMs;
        if (streamEnVivo && staleMs > kFrameStaleMs) {
          // Una oclusión breve conserva la última pose; después del margen,
          // volver a reposo evita dejar avatar congelado para siempre.
          if (!frameVivoStale) {
            frameVivoStale = true;
            webCameraState.stale = true;
            reiniciarEstadoPerdidaMano();
            transicionReposo('sin_senal',
              [...huesosBrazo('left'), ...huesosBrazo('right')], posarReposo);
            volverConCrossfade = true;
          }
        } else {
          frameVivoStale = false;
          webCameraState.stale = false;
          if (volverConCrossfade) {
            volverConCrossfade = false;
            crossfadePose('vivo', huesosCuerpo());
          }
          const espejo = vistaAvatar === 'espejo';
          // Edad desde la llegada al visor, no desde la captura: con
          // "ultimo frame gana" un frame lento sigue siendo el mas nuevo, y
          // medir latencia de captura congelaba todo en equipos lentos.
          const llegadaFrameVivo = frameVivoExterno
            ? frameVivoRecibidoAt : frameVivoLlegadaMs;
          RigBodyEngine.aplicarFrame(
            espejo ? mirrorMotionFrame(frameVivo) : frameVivo, {
              frameId: frameVivoFrameId,
              timestampMs: frameVivoTimestampMs,
              receivedAtMs: llegadaFrameVivo,
              sourceSkewMs: frameVivoSourceSkewMs,
              signSpace: espejo ? mirrorSignSpaceFrame(signSpaceVivo)
                : signSpaceVivo,
            });
          aplicarCara(caraVivo, espejo, {frameId: frameVivoFrameId,
            timestampMs: frameVivoTimestampMs, receivedAtMs: llegadaFrameVivo});
          if (streamExternoEnVivo) {
            perfEmbebido.frameRendered({frameId: frameVivoFrameId, renderedAtMs: t});
          }
          if (standaloneWeb && frameVivoSourceFrameId > 0 &&
              frameVivoSourceFrameId !== ultimoSourceFrameRenderizado) {
            webPerformanceMetrics.recordFrame({
              timestampMs: frameVivoTimestampMs,
              sourceFrameId: frameVivoSourceFrameId,
              capturedAtMs: frameVivoTimestampMs,
              renderedAtMs: t,
              valid: true,
            });
            ultimoSourceFrameRenderizado = frameVivoSourceFrameId;
            actualizarMetricasWeb();
          }
        }
      }

      avanzarTransicionesPose(performance.now());
      suavizarSalida(performance.now());
      actualizarEstadoAvatar(performance.now());
      medirPoseAvatar();
      medirFluidezRender();
      moverExpresionBasica(t / 1000);
      orbita.update();
      // three-vrm NO aplica solo lo que se escribe en los huesos
      // normalizados ni en el expressionManager. vrm.update() es lo que
      // baja las rotaciones al rig real y los valores de expresion a los
      // morph targets. Sin esta linea el modelo se queda clavado en la
      // pose de bind (T-pose, brazos en cruz) haga lo que haga el resto
      // del codigo -- posarReposo, el IK y el parpadeo se escriben pero
      // nunca se ven. Va despues de aplicarFrame/moverExpresionBasica y
      // antes de render.
      const renderStartedAt = performance.now();
      if (vrm) vrm.update(dt / 1000);
      renderer.render(scene, camera);
      if (!standaloneWeb) perfEmbebido.renderTick();
      if (standaloneWeb) {
        registrarTiempoWeb('render', performance.now() - renderStartedAt);
      }
      if (!renderFpsInicio) renderFpsInicio = t;
      renderFpsFrames++;
      if (t - renderFpsInicio >= 1000) {
        webCameraState.renderFps = renderFpsFrames;
        renderFpsFrames = 0;
        renderFpsInicio = t;
      }
    }
    requestAnimationFrame(animar);
  </script>
</body>
</html>
