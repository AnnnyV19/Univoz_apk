    // ---- inicio rig_hand_gate.mjs (antes importado por separado) ----
    const {gateHandCandidates, createHandBirthGate} = (() => {
      // Compuerta de manos ANTES de asignar lados: usa los hombros y munecas de la
      // pose como guia para que MediaPipe no "alucine" manos.
      //
      // Rechaza:
      //   hand_duplicate          la misma mano detectada dos veces (si no, se
      //                           asigna una a cada lado y el avatar mueve ambas
      //                           manos iguales, como espejo)
      //   hand_far_from_arm       mano lejos de las dos munecas visibles de la pose
      //                           (cara, fondo, otra persona)
      //   hand_scale_implausible  tamano de mano imposible respecto a los hombros
      // Una mano sin ancla (munecas de la pose no visibles, p. ej. fuera de
      // cuadro) pasa marcada como `unanchored`; createHandBirthGate le exige
      // varios frames seguidos antes de aceptarla.

      const MIN_VIS = 0.5;

      const pt = (p) => ({x: Number(p?.x ?? p?.[0]), y: Number(p?.y ?? p?.[1]),
        visibility: Number(p?.visibility ?? p?.[3] ?? 1)});
      const ok = (p) => Number.isFinite(p.x) && Number.isFinite(p.y);
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      function bbox(landmarks) {
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (const raw of landmarks) {
          const p = pt(raw);
          x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
          x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
        }
        return {x0, y0, x1, y1};
      }

      function overlap(a, b) {
        const w = Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0));
        const h = Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
        const area = (r) => Math.max(1e-9, (r.x1 - r.x0) * (r.y1 - r.y0));
        return (w * h) / Math.min(area(a), area(b));
      }

      /**
       * @param candidates [{landmarks: 21 puntos de imagen, confidence}]
       * @param pose 33 landmarks de imagen con visibility (o null)
       * @returns {{accepted: number[], rejected: {index, code}[], unanchored: number[]}}
       */
      function gateHandCandidates(candidates, pose, {
        maxWristDistance = 1.0,   // en anchos de hombro
        minHandScale = 0.12,      // muneca -> nudillo medio, en anchos de hombro
        maxHandScale = 0.9,
        duplicateDistance = 0.2,  // munecas, en anchos de hombro
        duplicateOverlap = 0.5,
      } = {}) {
        const list = Array.isArray(candidates) ? candidates : [];
        const accepted = [], rejected = [], unanchored = [];
        const valid = list.map((c, index) => ({c, index})).filter(({c}) =>
          Array.isArray(c?.landmarks) && c.landmarks.length === 21 &&
          c.landmarks.every((p) => ok(pt(p))));
        for (const {index} of list.map((c, index) => ({c, index})).filter(({c}) =>
          !valid.some((v) => v.c === c))) {
          rejected.push({index, code: 'hand_landmarks_invalid'});
        }

        const ls = pt(pose?.[11]), rs = pt(pose?.[12]);
        const shouldersOk = ok(ls) && ok(rs) && ls.visibility >= MIN_VIS &&
          rs.visibility >= MIN_VIS && dist(ls, rs) > 1e-3;
        if (!shouldersOk) {
          // Sin hombros no hay guia: no bloquear, el camino viejo decide.
          return {accepted: valid.map((v) => v.index), rejected, unanchored: []};
        }
        const sw = dist(ls, rs);
        const wrists = [pt(pose[15]), pt(pose[16])]
          .filter((w) => ok(w) && w.visibility >= MIN_VIS);

        // Mas confiable primero, para que el duplicado descartado sea el debil.
        const ordered = [...valid].sort((a, b) =>
          (Number(b.c.confidence) || 0) - (Number(a.c.confidence) || 0));
        const kept = [];
        for (const {c, index} of ordered) {
          const wrist = pt(c.landmarks[0]);
          const scale = dist(wrist, pt(c.landmarks[9])) / sw;
          if (!(scale >= minHandScale && scale <= maxHandScale)) {
            rejected.push({index, code: 'hand_scale_implausible'});
            continue;
          }
          const box = bbox(c.landmarks);
          if (kept.some((k) => dist(k.wrist, wrist) / sw < duplicateDistance &&
              overlap(k.box, box) > duplicateOverlap)) {
            rejected.push({index, code: 'hand_duplicate'});
            continue;
          }
          if (wrists.length) {
            const near = Math.min(...wrists.map((w) => dist(w, wrist))) / sw;
            if (near > maxWristDistance) {
              rejected.push({index, code: 'hand_far_from_arm'});
              continue;
            }
          } else {
            unanchored.push(index);
          }
          kept.push({index, wrist, box});
          accepted.push(index);
        }
        accepted.sort((a, b) => a - b);
        rejected.sort((a, b) => a.index - b.index);
        unanchored.sort((a, b) => a - b);
        return {accepted, rejected, unanchored};
      }

      /**
       * Exige `frames` detecciones seguidas en el mismo lugar a las manos sin
       * ancla antes de dejarlas pasar. Las ancladas al brazo pasan al instante.
       */
      function createHandBirthGate({frames = 3, maxJump = 0.08} = {}) {
        let pending = [];
        return {
          filter(candidates, accepted, unanchored) {
            const out = [];
            const next = [];
            for (const index of accepted) {
              if (!unanchored.includes(index)) {
                out.push(index);
                continue;
              }
              const wrist = pt(candidates[index].landmarks[0]);
              const prev = pending.find((p) => dist(p.wrist, wrist) <= maxJump);
              const count = (prev?.count ?? 0) + 1;
              next.push({wrist, count});
              if (count >= frames) out.push(index);
            }
            pending = next;
            return out;
          },
          reset() { pending = []; },
        };
      }
      return {gateHandCandidates, createHandBirthGate};
    })();
    // ---- fin rig_hand_gate.mjs ----

    // ---- inicio rig_session.mjs (antes importado por separado) ----
    const {SESSION_SCHEMA, compactLandmarks, newSessionId, createSessionRecorder} = (() => {
      // Grabador de sesion: registra TODO lo que pasa en una sesion de camara
      // (landmarks crudos, manos antes y despues de la compuerta, cara, vectores,
      // errores, tiempos y eventos) para encontrar fallos y mejorar el pipeline.
      // Nunca guarda video ni imagenes.
      //
      // Formato JSONL (SessionLogV1): una linea JSON por registro.
      //   {kind: 'session_start', schema, session_id, started_at_ms, meta}
      //   {kind: 'frame', ...}      un frame procesado
      //   {kind: 'event', type, ...} eventos (camara, perfil, fallback, errores)
      //   {kind: 'session_end', frames, events, dropped, reason}
      // Cada linea lleva `seq` (0, 1, 2...) para deduplicar al analizar.
      // Las lineas se mandan en bloques a un `sink` (servidor local); si falla,
      // se reintentan y, si la cola se llena, se descartan los frames mas viejos
      // (nunca la cabecera ni los eventos) contando cuantos se perdieron.

      const SESSION_SCHEMA = 'SessionLogV1';

      const round = (v, d = 4) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return null;
        const f = 10 ** d;
        return Math.round(n * f) / f;
      };

      /** Landmarks a arrays redondeados [x, y, z(, visibility)]. */
      function compactLandmarks(points, {indices = null, digits = 4} = {}) {
        if (!Array.isArray(points)) return null;
        const pick = indices ? indices.map((i) => points[i]) : points;
        return pick.map((p) => {
          const arr = Array.isArray(p) ? p : [p?.x, p?.y, p?.z,
            ...(p?.visibility != null ? [p.visibility] : [])];
          return arr.map((v) => round(v, digits));
        });
      }

      function newSessionId(date = new Date()) {
        const stamp = date.toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
        const rand = Math.random().toString(36).slice(2, 8).padEnd(6, '0');
        return `${stamp}-${rand}`;
      }

      function createSessionRecorder({
        sessionId = newSessionId(),
        meta = {},
        sink = async () => false,
        flushEvery = 60,
        maxPending = 20000,
        now = () => Date.now(),
      } = {}) {
        let pending = [];
        const local = [];            // copia para exportar si no hay servidor
        const maxLocal = maxPending;
        let frames = 0, events = 0, lines = 0, dropped = 0, sent = 0;
        let flushing = null;
        let closed = false;

        let seq = 0;
        const push = (record, droppable) => {
          // seq permite deduplicar: al cerrar la pagina un bloque en vuelo puede
          // llegar dos veces (fetch + sendBeacon); preferimos duplicar a perder.
          const line = JSON.stringify({seq: seq++, ...record});
          lines++;
          pending.push({line, droppable});
          local.push(line);
          if (local.length > maxLocal) {
            const i = local.findIndex((l, k) => k > 0 && l.startsWith('{"kind":"frame"'));
            local.splice(i > 0 ? i : 1, 1);
          }
          if (pending.length > maxPending) {
            const i = pending.findIndex((p) => p.droppable);
            if (i >= 0) {
              pending.splice(i, 1);
              dropped++;
            }
          }
          if (pending.length >= flushEvery) void api.flush();
        };

        const api = {
          sessionId,
          frame(data) {
            if (closed) return;
            frames++;
            push({kind: 'frame', ...data}, true);
          },
          event(type, data = {}) {
            if (closed) return;
            events++;
            push({kind: 'event', type, t_ms: now(), ...data}, false);
          },
          async flush() {
            if (flushing) return flushing;
            if (!pending.length) return true;
            const batch = pending.slice();
            flushing = (async () => {
              let ok = false;
              try { ok = await sink(sessionId, batch.map((p) => p.line)); } catch (_) {}
              if (ok) {
                pending = pending.slice(batch.length);
                sent += batch.length;
              }
              return ok;
            })();
            try { return await flushing; } finally { flushing = null; }
          },
          async close({reason = 'stop'} = {}) {
            if (closed) return;
            push({kind: 'session_end', t_ms: now(), frames, events, dropped,
              reason}, false);
            closed = true;
            await api.flush();
            if (pending.length) await api.flush();
          },
          /**
           * Cierre sincrono para cuando la pagina se va (pagehide): agrega el fin
           * de sesion y entrega TODO lo pendiente a `syncSink` (sendBeacon), que
           * no espera respuesta.
           */
          closeNow({reason = 'page_unload', maxBytes = 60000} = {},
            syncSink = null) {
            if (closed) return false;
            push({kind: 'session_end', t_ms: now(), frames, events, dropped,
              reason}, false);
            closed = true;
            // sendBeacon acepta ~64 KB: se manda en bloques, en orden.
            const send = (lines) => {
              try { return !!syncSink?.(sessionId, lines); } catch (_) { return false; }
            };
            let bloque = [], bytes = 0, ok = true;
            for (const p of pending) {
              if (bloque.length && bytes + p.line.length + 1 > maxBytes) {
                ok = send(bloque);
                if (!ok) break;
                sent += bloque.length;
                bloque = []; bytes = 0;
              }
              bloque.push(p.line);
              bytes += p.line.length + 1;
            }
            if (ok && bloque.length) {
              ok = send(bloque);
              if (ok) sent += bloque.length;
            }
            if (ok) {
              pending = [];
              return true;
            }
            // Al menos que quede registrado el cierre.
            const fin = pending.at(-1).line;
            if (send([fin])) sent += 1;
            return false;
          },
          stats: () => ({frames, events, lines, dropped, sent,
            pending: pending.length}),
          exportLines: () => local.slice(),
        };
        push({kind: 'session_start', schema: SESSION_SCHEMA, session_id: sessionId,
          started_at_ms: now(), meta}, false);
        return api;
      }
      return {SESSION_SCHEMA, compactLandmarks, newSessionId, createSessionRecorder};
    })();
    // ---- fin rig_session.mjs ----

    // ---- inicio rig_holistic_worker.mjs (antes importado por separado) ----
    const {holisticWorkerMain, separadoToTaskResults, holisticWorkerSource, holisticWorkerSupported, createHolisticWorkerClient} = (() => {
      // Captura MediaPipe en un Web Worker.
      //
      // detectForVideo es sincrono y tarda ~45 ms por frame (GPU, 2026-10-03):
      // en el hilo principal bloquea el render del avatar y el lazo rAF suma la
      // espera al siguiente frame (~57 ms entre frames, ~17 FPS). En un worker la
      // inferencia corre aparte, el avatar sigue a 60 FPS y el siguiente frame se
      // manda en cuanto el worker queda libre (tubo de un frame).
      //
      // Dos modos: 'holistic' (un modelo, producto por defecto) y 'separado'
      // (Pose lite + Hand + Face). Medido en Chromium GPU (2026-10-04, mismo frame):
      // Holistic p50 29 ms; Pose 7 + Hand 6 + Face 9 = ~22 ms.
      //
      // El worker se crea desde un Blob (sin archivo propio): el visor tambien
      // vive inline en Android y Flutter Web. Por eso todas las URL que recibe
      // deben ser absolutas. Solo GPU: si falla, el visor vuelve a la cadena del
      // hilo principal (GPU y luego CPU), que ya existe.

      // Cuerpo del worker. Se serializa con toString(): no puede usar nada de
      // fuera de la funcion. `scope` es el self del worker e `importar` hace el
      // import() dinamico (inyectables para las pruebas).
      function holisticWorkerMain(scope, importar) {
        let modo = 'holistic';
        let tarea = null;
        let tareas = null;
        const responder = (msg) => scope.postMessage(msg);
        const lista = (v) => (Array.isArray(v) ? v : []);
        const error = (e) => String(e?.message ?? e);
        // Solo los campos que usa holisticToTaskResults, como objetos planos.
        const plano = (r) => ({
          poseLandmarks: lista(r?.poseLandmarks),
          poseWorldLandmarks: lista(r?.poseWorldLandmarks),
          leftHandLandmarks: lista(r?.leftHandLandmarks),
          leftHandWorldLandmarks: lista(r?.leftHandWorldLandmarks),
          rightHandLandmarks: lista(r?.rightHandLandmarks),
          rightHandWorldLandmarks: lista(r?.rightHandWorldLandmarks),
          faceLandmarks: lista(r?.faceLandmarks),
          faceBlendshapes: lista(r?.faceBlendshapes).map((b) => ({
            categories: lista(b?.categories).map((c) => ({
              categoryName: c.categoryName, score: c.score})),
          })),
        });
        const categorias = (grupos) => lista(grupos).map((g) => lista(g).map((c) => ({
          categoryName: c.categoryName, score: c.score, index: c.index})));
        const detectar = (frame, timestampMs) => {
          if (modo === 'holistic') {
            if (!tarea) throw new Error('worker de captura sin inicializar');
            return {result: plano(tarea.detectForVideo(frame, timestampMs))};
          }
          if (!tareas) throw new Error('worker de captura sin inicializar');
          const t0 = performance.now();
          const pose = tareas.pose.detectForVideo(frame, timestampMs);
          const t1 = performance.now();
          const hand = tareas.hand.detectForVideo(frame, timestampMs);
          const t2 = performance.now();
          const face = tareas.face?.detectForVideo(frame, timestampMs);
          const t3 = performance.now();
          return {
            stages: {pose: t1 - t0, hand: t2 - t1, face: t3 - t2},
            result: {
              pose: {landmarks: lista(pose?.landmarks),
                worldLandmarks: lista(pose?.worldLandmarks)},
              hand: {landmarks: lista(hand?.landmarks),
                worldLandmarks: lista(hand?.worldLandmarks),
                handednesses: categorias(hand?.handednesses ?? hand?.handedness)},
              face: {faceLandmarks: lista(face?.faceLandmarks)},
            },
          };
        };
        // Modo stream: el worker lee la camara (ReadableStream de VideoFrame de
        // MediaStreamTrackProcessor) y procesa siempre el frame mas reciente en
        // cuanto queda libre, sin esperar al hilo principal (que renderiza el
        // avatar). Los frames que llegan mientras detecta se descartan.
        let ultimoTs = 0;
        const leerStream = async (readable) => {
          const lector = readable.getReader();
          let pendiente = null;
          let descartados = 0;
          let ocupado = false;
          const procesar = () => {
            if (ocupado || !pendiente) return;
            ocupado = true;
            const {frame, recibido} = pendiente;
            pendiente = null;
            const inicio = performance.now();
            // VIDEO exige timestamps crecientes; reloj propio del worker.
            ultimoTs = Math.max(ultimoTs + 1, inicio);
            try {
              const {result, stages} = detectar(frame, ultimoTs);
              responder({type: 'stream_result', result, stages,
                ms: performance.now() - inicio, capturedAt: recibido,
                workerTimeOrigin: performance.timeOrigin, dropped: descartados});
              descartados = 0;
            } catch (e) {
              responder({type: 'stream_error', error: error(e)});
            } finally {
              try { frame.close(); } catch (_) { /* ya cerrado */ }
              ocupado = false;
            }
            if (pendiente) setTimeout(procesar, 0);
          };
          try {
            for (;;) {
              const {value, done} = await lector.read();
              if (done) break;
              if (pendiente) {
                try { pendiente.frame.close(); } catch (_) { /* nada */ }
                descartados++;
              }
              pendiente = {frame: value, recibido: performance.now()};
              procesar();
            }
          } catch (e) {
            responder({type: 'stream_error', error: error(e)});
          } finally {
            try { pendiente?.frame.close(); } catch (_) { /* nada */ }
            pendiente = null;
            responder({type: 'stream_end'});
          }
        };
        scope.onmessage = async (event) => {
          const msg = event.data || {};
          if (msg.type === 'init') {
            const fallos = [];
            try {
              const vision = await importar(msg.bundleUrl);
              const fileset = await vision.FilesetResolver.forVisionTasks(msg.wasmUrl);
              // Un worker de modulo no tiene importScripts y MediaPipe no llega a
              // definir ModuleFactory ("ModuleFactory not set"): se evalua el
              // cargador wasm a mano en el ambito global. MediaPipe lo borra tras
              // crear cada tarea, asi que se repone antes de cada creacion.
              let cargador = null;
              if (fileset?.wasmLoaderPath && msg.loadWasmLoader !== false) {
                cargador = await (await fetch(fileset.wasmLoaderPath)).text();
              }
              const reponerCargador = () => {
                if (cargador && !scope.ModuleFactory) {
                  (0, eval)(cargador + '\n;self.ModuleFactory = ModuleFactory;');
                }
              };
              // Primer modelo de la lista que carga en GPU, o null.
              const crear = async (Clase, modelos, opciones) => {
                for (const modelo of lista(modelos)) {
                  try {
                    reponerCargador();
                    const t = await Clase.createFromOptions(fileset, {
                      ...opciones,
                      baseOptions: {modelAssetPath: modelo, delegate: 'GPU'},
                      runningMode: 'VIDEO',
                    });
                    return {tarea: t, modelo};
                  } catch (e) {
                    fallos.push({model: modelo, error: error(e)});
                  }
                }
                return null;
              };
              modo = msg.mode === 'separado' ? 'separado' : 'holistic';
              if (modo === 'holistic') {
                const r = await crear(vision.HolisticLandmarker, msg.models, msg.options);
                if (r) {
                  tarea = r.tarea;
                  responder({type: 'ready', mode: modo, model: r.modelo, failures: fallos});
                  return;
                }
              } else {
                const o = msg.options || {};
                const pose = await crear(vision.PoseLandmarker, msg.models?.pose, o.pose);
                const hand = pose &&
                  await crear(vision.HandLandmarker, msg.models?.hand, o.hand);
                if (pose && hand) {
                  // La cara es opcional: sin ella sigue el cuerpo y las manos.
                  const face = await crear(vision.FaceLandmarker, msg.models?.face, o.face);
                  tareas = {pose: pose.tarea, hand: hand.tarea, face: face?.tarea ?? null};
                  responder({type: 'ready', mode: modo, failures: fallos, model: {
                    pose: pose.modelo, hand: hand.modelo, face: face?.modelo ?? null}});
                  return;
                }
                try { pose?.tarea.close(); } catch (_) { /* nada */ }
              }
              responder({type: 'init_error', failures: fallos});

              try { msg.frame?.close?.(); } catch (_) { /* ya cerrado */ }

      // se correlacionan por id. Cualquier error rechaza la promesa pendiente.
      function createHolisticWorkerClient({

              (msg.failures ?? []).map((f) => f.error).join(' | '));
            error.failures = msg.failures ?? [];
            listo?.reject(error);
            listo = null;
          } else if (msg.type === 'stream_result') {

              stages: msg.stages ?? null, dropped: msg.dropped ?? 0,
              // Reloj del worker llevado al del hilo principal.

            alStream?.onError?.(new Error(msg.error));

            alStream?.onEnd?.();

            const p = pendientes.get(msg.id);
            if (!p) return;
            pendientes.delete(msg.id);

            }

              temporizador = setTimeout(() => {

    const {AVATAR_STATES, smoothingAlpha, blendWeight, avatarStateFrom, createAvatarStateTracker, slerpQuaternion, createPoseTransitions, adaptiveTauMs, createOutputSmoother} = (() => {
      // Estado del avatar y transiciones suaves de pose.
      //
      // El visor decidia "volver a reposo" escribiendo la pose de reposo de golpe
      // (mano perdida, stream sin frames, fin de reproduccion) y saltaba de reposo
      // a la pose en vivo al reaparecer la mano. Aqui vive la parte pura: que
      // estado tiene el avatar y como mezclar cuaterniones en el tiempo. El visor
      // pone los huesos (THREE) y llama step() una vez por render.

      const finite = (value) => Number.isFinite(Number(value));

        const dt = Number(dtMs);

        if (!finite(tau) || tau <= 0) return 1;
        return 1 - Math.exp(-dt / tau);

        const duration = Number(durationMs);

        const x = Math.max(0, Math.min(1, Number(elapsedMs) / duration));

       * perdida > siguiendo > reposo. Solo describe; no mueve huesos.

      function avatarStateFrom({
        playing = false, streamLive = false, streamStale = false,
        returning = false, holding = false, tracking = false,
      } = {}) {
        if (playing) return 'PLAYBACK';
        if (streamLive && streamStale) return 'NO_SIGNAL';
        if (returning) return 'RETURNING';
        if (holding) return 'HOLD';
        if (tracking) return 'TRACKING';
        return 'REST';
      }

        let state = 'REST';
        let sinceMs = null;

          update(flags, nowMs) {
            const next = avatarStateFrom(flags);
            if (next === state) return {state, changed: false, sinceMs};
            const previous = state;
            state = next;
            sinceMs = finite(nowMs) ? Number(nowMs) : null;
            onChange?.({from: previous, to: next, t: sinceMs});

          get state() { return state; },
          reset() { state = 'REST'; sinceMs = null; },

        if (!Array.isArray(q) || q.length !== 4 || !q.every(finite)) return null;

        const wa = Math.sin((1 - progress) * theta) / sinTheta;

       * - con `to`: va de `from` a una pose fija (reposo). Si otro codigo escribe

       * - sin `to` (crossfade): va de `from` a lo que el visor escribio en ese

       * Un hueso pertenece a una sola transicion: la mas nueva gana.

      function createPoseTransitions({durationMs = 250} = {}) {
        const transitions = new Map();

        const removeBone = (id, exceptKey) => {
          for (const [key, item] of transitions) {
            if (key === exceptKey) continue;
            item.bones.delete(id);
            if (!item.bones.size) transitions.delete(key);
          }
        };

        return {
          start(key, {from, to = null, nowMs, durationMs: duration = durationMs}) {
            const bones = new Map();
            for (const [id, quaternion] of Object.entries(from ?? {})) {
              const start = normalize(quaternion);
              if (!start) continue;
              const target = to ? normalize(to[id]) : null;
              if (to && !target) continue;
              removeBone(id, key);
              bones.set(id, {from: start, to: target, lastWritten: start,
                lastTarget: target ?? start});

            if (!bones.size) {
              transitions.delete(key);
              return false;
            }
            transitions.set(key, {startMs: Number(nowMs), durationMs: duration,
              fixed: !!to, bones});
            return true;
          },
          cancel(key) {
            transitions.delete(key);
          },
          has(key) {
            return transitions.has(key);
          },
          // El hueso esta en alguna transicion activa (ya se mueve suave).
          owns(id) {
            for (const item of transitions.values()) {
              if (item.bones.has(id)) return true;
            }
            return false;
          },
          get size() {
            return transitions.size;
          },
          keys() {
            return [...transitions.keys()];
          },
          // current(id) -> cuaternion actual del hueso [x, y, z, w].
          step(nowMs, current) {
            const writes = [];
            const done = [];
            for (const [key, item] of transitions) {
              const weight = blendWeight(Number(nowMs) - item.startMs, item.durationMs);
              for (const [id, bone] of item.bones) {
                const now = normalize(current?.(id));
                const externo = now && !same(now, bone.lastWritten);
                if (item.fixed && externo) {
                  item.bones.delete(id);
                  continue;
                }
                if (!item.fixed && externo) bone.lastTarget = now;
                const target = item.fixed ? bone.to : bone.lastTarget;
                const quaternion = weight >= 1
                  ? target.slice() : slerpQuaternion(bone.from, target, weight);
                bone.lastWritten = quaternion;
                writes.push({id, quaternion});
              }
              if (weight >= 1 || !item.bones.size) {
                transitions.delete(key);
                done.push(key);
              }
            }
            return {writes, done};
          },
          reset() {
            transitions.clear();
          },
        };
      }

      // Suavizado de salida a ritmo de render (estilo VTuber). La pose escrita
      // por el tracking cambia solo cuando llega un frame de camara (15-30/s) y
      // el render va a 60-144 Hz: sin esto el avatar avanza a saltos. Cada render
      // la pose mostrada avanza hacia la escrita con alpha = 1 - exp(-dt/tau); tau
      // es adaptativo: distancia chica (temblor) = tauMax, mucho suavizado;
      // distancia grande (movimiento real) = tauMin, poco retraso.
      function adaptiveTauMs(gapRad, {tauMinMs, tauMaxMs, fastRad}) {
        const k = Math.max(0, Math.min(1, Number(gapRad) / Number(fastRad)));
        return tauMaxMs + (tauMinMs - tauMaxMs) * k;
      }

      const quaternionGap = (a, b) => 2 * Math.acos(Math.min(1,
        Math.abs(a.reduce((sum, value, index) => sum + value * b[index], 0))));

      /**
       * Un estado por hueso (id). step(id, escrito, dtMs, params) devuelve la pose
       * a mostrar. Si nadie reescribio el hueso desde el ultimo step (el valor
       * actual es el que mostramos), el objetivo sigue siendo el ultimo visto.
       */
      function createOutputSmoother() {
        const bones = new Map();
        return {
          step(id, written, dtMs, params) {
            const now = normalize(written);
            if (!now) return null;
            const bone = bones.get(id);
            if (!bone) {
              bones.set(id, {shown: now, target: now});
              return now.slice();
            }
            if (!same(now, bone.shown)) bone.target = now;
            const gap = quaternionGap(bone.shown, bone.target);
            let alpha = smoothingAlpha(dtMs, adaptiveTauMs(gap, params));
            // Tope de velocidad: un giro enorme (volteo, salto de IK) se ve como
            // giro rapido y no como salto de un render.
            if (params.maxSpeedRadS && gap > 1e-9) {
              alpha = Math.min(alpha, params.maxSpeedRadS * Number(dtMs) / 1000 / gap);
            }
            bone.shown = alpha >= 1
              ? bone.target.slice() : slerpQuaternion(bone.shown, bone.target, alpha);
            return bone.shown.slice();
          },
          // Sin suavizar (reproduccion, flag apagado): seguir la pose escrita para
          // que al volver no haya salto.
          follow(id, written) {
            const now = normalize(written);
            if (now) bones.set(id, {shown: now, target: now});
          },
          reset() {
            bones.clear();
          },
          get size() {
            return bones.size;
          },
        };
      }
      return {AVATAR_STATES, smoothingAlpha, blendWeight, avatarStateFrom, createAvatarStateTracker, slerpQuaternion, createPoseTransitions, adaptiveTauMs, createOutputSmoother};
    })();

    const {TIER_RENDER, renderBudgetForTier, shouldRenderFrame, IDLE_FRAME_INTERVAL_MS, idleBudgetFor} = (() => {
      // Presupuesto de render por nivel de dispositivo (DeviceTier.kt manda el
      // nivel en sourceMeta.tier). Spec:
      // docs/superpowers/specs/2026-10-05-android-niveles-dispositivo-design.md

      const TIER_RENDER = Object.freeze({
        bajo: Object.freeze({frameIntervalMs: 1000 / 30, pixelRatio: .75}),
        medio: Object.freeze({frameIntervalMs: 1000 / 30, pixelRatio: 1}),
        alto: Object.freeze({frameIntervalMs: 1000 / 60, pixelRatio: 1.25}),
      });

      // de antes. Devuelve siempre el mismo objeto para comparar por identidad.
      function renderBudgetForTier(tier) {

        // telefonos de gama baja no lo tienen.
        return typeof tier === 'string' &&
          Object.prototype.hasOwnProperty.call(TIER_RENDER, tier)
          ? TIER_RENDER[tier] : TIER_RENDER.alto;
      }

      // cumplir el intervalo. 2 ms de margen absorben el jitter de rAF.
      function shouldRenderFrame(lastRenderAt, now, budget) {
        return !lastRenderAt || now - lastRenderAt >= budget.frameIntervalMs - 2;
      }

      // solo parpadea: 15 FPS bastan y el telefono no dibuja de mas. Mismo
      // pixelRatio que el nivel para que no cambie el tamano del lienzo.
      const IDLE_FRAME_INTERVAL_MS = 1000 / 15;
      const idleBudgets = new Map();
      function idleBudgetFor(budget) {
        if (!idleBudgets.has(budget)) {
          idleBudgets.set(budget, Object.freeze({
            frameIntervalMs: Math.max(budget.frameIntervalMs, IDLE_FRAME_INTERVAL_MS),
            pixelRatio: budget.pixelRatio,
          }));
        }
        return idleBudgets.get(budget);
      }
      return {TIER_RENDER, renderBudgetForTier, shouldRenderFrame, IDLE_FRAME_INTERVAL_MS, idleBudgetFor};
    })();

    const {createEmbeddedPerf} = (() => {

      // camara web (eventoPerfSesion en index.html), medido sobre los frames que
      // llegan por aplicarFrameVivo. Latencia = inferencia nativa + espera hasta
      // el render; no incluye el cruce Kotlin -> Dart -> WebView porque los
      // relojes no son comparables.

      const kMaxPendientes = 8;

      const p95 = (values) => {
        if (!values.length) return null;
        const sorted = [...values].sort((a, b) => a - b);
        return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * .95) - 1)];
      };

      function createEmbeddedPerf() {
        let received = 0;
        let withHand = 0;
        let rendered = 0;
        let latency = [];
        let infer = [];
        let tier = null;
        let thermal = null;
        const pending = new Map();

        const reset = () => {
          received = 0;
          withHand = 0;
          rendered = 0;
          latency = [];
          infer = [];
          pending.clear();
        };

        const frameReceived = ({frameId, receivedAtMs, inferMs, hasHand,
          tier: nivel, thermal: termico} = {}) => {
          received++;
          if (hasHand === true) withHand++;

          if (pending.size > kMaxPendientes) pending.delete(pending.keys().next().value);

          const p = pending.get(frameId);
          if (!p) return;
          pending.delete(frameId);
          latency.push(Math.round((renderedAtMs - p.receivedAtMs + p.inferMs) * 10) / 10);

        const renderTick = () => { rendered++; };

        const drain = (extra = {}) => {
          if (received === 0) {
            reset();
            return null;

          const out = {
            latency_ms: latency,
            fps: {input: received, inference: received, tracking: withHand,
              pose: received, render: rendered},
            tier,
            thermal,
            infer_ms_p95: p95(infer),
            ...extra,
          };
          reset();
          return out;

    const {HAND_MARGIN, BODY_MARGIN, HAND_CONNECTIONS, coord, finitePoint, pointInFrame, handUsable, poseGeometry, normalizeMotionFrame, frameQuality} = (() => {

      // Kotlin, Dart y Python. Espejo de normalizeFrame() en sign_norm.dart/py.

      const HAND_MARGIN = 0.15;
      const BODY_MARGIN = 0.15;
      const HAND_CONNECTIONS = Object.freeze([
        [0, 1], [1, 2], [2, 3], [3, 4],
        [0, 5], [5, 6], [6, 7], [7, 8],
        [0, 9], [9, 10], [10, 11], [11, 12],
        [0, 13], [13, 14], [14, 15], [15, 16],
        [0, 17], [17, 18], [18, 19], [19, 20],
        [5, 9], [9, 13], [13, 17],

      function coord(p) {

            x: Number(p[0]), y: Number(p[1]), z: Number(p[2]),
            visibility: Number(p[3] ?? 0),
          };

        return {
          x: Number(p?.x), y: Number(p?.y), z: Number(p?.z),
          visibility: Number(p?.visibility ?? 0),

      }

      function pointInFrame(p) {

      }

      const ok = {ok: true, code: null, landmark: null};

    const webPerformanceMetrics = createPerformanceMetrics([
      'pose', 'hand', 'process', 'render',
    ]);
    const rigSafetyGates = new Map();
    const ultimoAuditEmitido = new Map();
    let diagnosticoActivo = false;
    let diagnosticoCapturando = false;
    let diagnosticPointIssues = [];
    let diagnosticErrors = [];
    let diagnosticOverlayPoints = [];

    function guardarAudit(event) {
      const timestampMs = Number(event.timestampMs) || performance.now();
      // quaternion_flip con action 'apply' solo normaliza el signo (q y -q son
      // la misma rotacion): no es una anomalia y era el 75 % del registro.
      const soloSigno = event.code === 'quaternion_flip' && event.action === 'apply';
      if ((event.severity === 'error' || event.severity === 'warn') && !soloSigno) {
        eventoSesion('audit', {stage: event.stage, joint: event.joint ?? null,
          code: event.code ?? null, severity: event.severity,
          action: event.action ?? null});
      }
      const key = `${event.stage}:${event.joint ?? ''}:${event.code ?? ''}`;
      const previo = ultimoAuditEmitido.get(key);
      // Evita que una misma anomalía de 54 huesos consuma ventana completa;
      // conserva como máximo cuatro muestras por segundo y unión/código.
      if (event.code && previo != null && timestampMs - previo < 250) return;
      ultimoAuditEmitido.set(key, timestampMs);
      rigAudit.record(createAuditSnapshot({...event, timestampMs}));
    }

    function errorDiagnostico(stage, code, side = null, landmark = null,
        status = 'red') {
      const error = diagnosticError(stage, code, side, landmark);
      diagnosticErrors.push(error);
      if (Number.isInteger(landmark)) {
        diagnosticPointIssues.push({stage, code, side, landmark, status});
      }
      webCameraState.validation = code;
      guardarAudit({
        frame: frameVivoFrameId + 1,
        timestampMs: Number(frameVivoTimestampMs) || performance.now(),
        stage,
        joint: side ? `${side}:${landmark ?? 'hand'}` : null,
        score: 0,
        severity: status === 'yellow' ? 'warn' : 'error',
        state: 'REJECTED',
        action: 'drop_frame',
        code,
      });
      return error;
    }

    function registrarAuditSafety(event) {
      // Estado VALID no necesita un registro por hueso y consumiría la
      // ventana de 45 s en menos de dos segundos (54 huesos x 30 FPS).
      // Guardar anomalías y recuperaciones conserva señal útil sin video.
      if (!event.code && event.action === 'apply') return;
      // Deriva de longitud en modo auditoria: puede salir cada frame con z
      // ruidosa; se cuenta en safety_adjustments sin llenar esta ventana.
      if (event.action === 'apply' && event.code === 'bone_length_drift') return;
      guardarAudit({
        frame: event.frame,
        timestampMs: event.timestampMs ?? performance.now(),
        stage: event.stage,
        joint: event.joint,
        score: event.score,
        severity: event.severity,
        state: event.state,
        action: event.action,
        code: event.code,
      });
    }

    function safetyGateFor(jointId) {
      if (!rigSafetyGates.has(jointId)) {
        rigSafetyGates.set(jointId, createRigSafetyGate({
          // 200 ms = 3 frames a 15 FPS; por debajo de kFrameStaleMs (450).
          maxAgeMs: 200,
          maxSourceSkewMs: 120,
          // docs/14 H2: giro real rapido p95 ~5 rad/s; mas alla se recorta
          // (tope 100 grados por frame) y un salto > 120 grados en la mano
          // es volteo palma/dorso hasta que se repita 2 frames.
          maxAngularVelocityRadS: 20,
          maxStepRad: 100 * Math.PI / 180,
          palmFlipRad: 120 * Math.PI / 180,
          palmFlipConfirmFrames: 2,
          palmFlipRecoveryMs: 250,
          angularDeadbandRad: 1.5 * Math.PI / 180,
          recoveryMs: 100,
          // Longitud medida con z monocular: auditar antes de congelar.
          boneLengthMode: 'audit',
          jointLimits: {
            min: [-Math.PI, -Math.PI, -Math.PI],
            max: [Math.PI, Math.PI, Math.PI],
          },
          onAudit: registrarAuditSafety,
        }));
      }
      return rigSafetyGates.get(jointId);
    }

    function resetSafetyGates() {
      for (const gate of rigSafetyGates.values()) gate.reset();
    }

    function thumbCalibrationWire() {
      const one = (value) => ({
        calibrated: value?.calibrated === true,
        open_distance: Number(value?.openDistance),
        closed_distance: Number(value?.closedDistance),
        open_angles: value?.openAngles?.map(Number) ?? [],
        closed_angles: value?.closedAngles?.map(Number) ?? [],
        updated_at_ms: Number(value?.updatedAtMs) || 0,
      });
      return {
        left: one(cal.thumbCalibration.left),
        right: one(cal.thumbCalibration.right),
      };
    }

    function rigCalibrationWire() {
      return {version: 2, thumb_calibration: thumbCalibrationWire()};
    }

    function pintarDiagnostico() {
      const panel = document.getElementById('diagnosticoPanel');
      if (!panel) return;
      panel.style.display = diagnosticoActivo ? 'block' : 'none';
      const stats = document.getElementById('diagStats');
      const thumbs = document.getElementById('diagThumbs');
      const errores = document.getElementById('diagErrores');
      const capturar = document.getElementById('bCapturarDiag');
      const audit = rigAudit.report();
      if (stats) stats.textContent =
        `entrada ${webCameraState.inputFps || 0}/${webCameraState.captureFps || 0} · ` +
        `track ${webCameraState.trackingFps || 0} · pose ${webCameraState.poseFps || 0} · ` +
        `render ${webCameraState.renderFps || 0} FPS · ` +
        `M ${Number(webCameraState.motionScore ?? 0).toFixed(2)} · ` +
        `dedos ${Number(webCameraState.fingerMotionScore ?? 0).toFixed(2)} · ` +
        `${webCameraState.motionQuiet ? 'quieto' : 'movimiento'} · ` +
        `P/H ${webCameraState.poseP95Ms.toFixed(1)}/${webCameraState.handP95Ms.toFixed(1)} ms · ` +
        `proc p95 ${webCameraState.processP95Ms.toFixed(1)} ms · ` +
        `L ${webCameraState.latencyP50Ms.toFixed(1)}/` +
        `${webCameraState.latencyP95Ms.toFixed(1)}/` +
        `${webCameraState.latencyP99Ms.toFixed(1)} ms · ` +
        `drop ${webCameraState.framesSkipped || 0} · ` +
        `Q ${Math.round(webCameraState.quality * 100)}% · ` +
        `delay ${Number(ultimoDiagnosticoFiltro?.delayMs ?? 0).toFixed(1)} ms · ` +
        `deadband ${ultimoDiagnosticoFiltro?.deadbandHeld ?? 0} · ` +
        `fingerLag ${Math.max(
          ultimoDiagnosticoAngulos.left?.fingerLagMs ?? 0,
          ultimoDiagnosticoAngulos.right?.fingerLagMs ?? 0).toFixed(1)} ms · ` +
        `skew ${Number(ultimoSourceMeta?.source_skew_ms ?? 0).toFixed(0)} ms · ` +
        `avatar ${webCameraState.avatarState} · ` +
        `cal ${webCameraState.calibrationState} ${Number(webCameraState.bodyDeadband).toFixed(4)}/` +
        `${Number(webCameraState.wristDeadband).toFixed(4)} · stride ${webCameraState.poseStride} · ` +
        `surf ${webCameraState.leftSurface}/${webCameraState.rightSurface} · ` +
        `holds/swaps ${webCameraState.handHolds}/${webCameraState.handSwaps} · ` +
        `${ultimoTrackingWeb?.contact?.active ? 'contacto' : 'separadas'} · ` +
        `health ${Math.round(audit.summary.health_score)}% · ` +
        `${rigDiagnostics.frames.length}/300 · audit ${audit.summary.events_total}`;
      if (thumbs) {
        const texto = (lado) => {
          const estado = rigThumbState[lado];
          const marca = cal.thumbCalibration[lado]?.calibrated ? '✓' : '!';
          return `${marca}${lado === 'left' ? 'I' : 'D'} ` +
            (estado ? `${Math.round(estado.closure * 100)}%` : '—');
        };
        thumbs.textContent = `Pulgares: ${texto('left')} · ${texto('right')}`;
      }
      if (errores) errores.textContent = diagnosticErrors.length
        ? diagnosticErrors.slice(-4).map((e) =>
          `${e.stage}:${e.code}${e.side ? ':' + e.side : ''}` +
          `${Number.isInteger(e.landmark) ? ':' + e.landmark : ''}`).join(' · ')
        : 'Sin errores';
      if (capturar) capturar.textContent = diagnosticoCapturando ? 'Detener' : 'Capturar';
    }

    window.configurarDiagnostico = function (activo) {
      diagnosticoActivo = activo === true || activo === 'true';
      if (!diagnosticoActivo) diagnosticoCapturando = false;
      rigDiagnostics.setEnabled(diagnosticoActivo && diagnosticoCapturando);
      const overlay = document.getElementById('camaraOverlay');
      if (overlay) overlay.classList.toggle('diagnostico', diagnosticoActivo);
      pintarDiagnostico();
    };

    window.obtenerReporteDiagnostico = function () {
      const report = rigDiagnostics.report(
        rigCalibrationWire(), rigAudit.report());
      report.performance = webPerformanceMetrics.snapshot();
      return JSON.stringify(report);
    };

    function alternarCapturaDiagnostico() {
      diagnosticoCapturando = !diagnosticoCapturando;
      rigDiagnostics.setEnabled(diagnosticoCapturando);
      pintarDiagnostico();
    }

    function exportarDiagnostico() {
      const json = window.obtenerReporteDiagnostico();
      if (!standaloneWeb && window.SenasChannel) {
        window.SenasChannel.postMessage('diagnostic_report:' + json);
        return;
      }
      const blob = new Blob([json], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = `rig_diagnostic_${Date.now()}.json`;
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function registrarDiagnostico(raw, filtered, timestampMs, quality,
        sourceMeta = null) {
      if (!diagnosticoCapturando) return;
      const errors = diagnosticErrors.slice();
      if (!cal.thumbCalibration.left.calibrated) {
        errors.push(diagnosticError('thumb', 'thumb_uncalibrated', 'left'));
      }
      if (!cal.thumbCalibration.right.calibrated) {
        errors.push(diagnosticError('thumb', 'thumb_uncalibrated', 'right'));
      }
      rigDiagnostics.record({
        t: Number(timestampMs), quality: Number(quality) || 0,
        pose_t: Number(sourceMeta?.pose_t ?? timestampMs),
        hands_t: Number(sourceMeta?.hands_t ?? timestampMs),
        source_skew_ms: Number(sourceMeta?.source_skew_ms ?? 0),
        raw_frame: raw?.slice() ?? null,
        // Evidencia del mapeo corporal (docs/13): frame independiente del
        // cuerpo y modo de retarget activo en este instante.
        sign_space: signSpaceVivo ? {values: signSpaceVivo.values.slice(),
          mask: {...signSpaceVivo.mask}, mode: signSpaceVivo.mode} : null,
        retarget_mode: retargetMode,
        capture_mode: capturaModo,
        face_blendshapes: caraVivo?.blendshapes ?? null,
        render_frame: filtered?.slice() ?? null,
        filtered_frame: filtered?.slice() ?? null,
        point_issues: diagnosticPointIssues.slice(),
        thumb: {
          left: rigThumbState.left ? {...rigThumbState.left} : null,
          right: rigThumbState.right ? {...rigThumbState.right} : null,
        },
        filter: {
          delay_ms: Number(ultimoDiagnosticoFiltro?.delayMs ?? 0),
          finger_lag_ms: Math.max(
            ultimoDiagnosticoAngulos.left?.fingerLagMs ?? 0,
            ultimoDiagnosticoAngulos.right?.fingerLagMs ?? 0),
          raw_to_filtered_rms: Number(ultimoDiagnosticoFiltro?.rawToFilteredRms ?? 0),
          mad_outliers: ultimoDiagnosticoFiltro?.madOutliers?.slice() ?? [],
          mad_repaired: ultimoDiagnosticoFiltro?.madRepaired?.slice() ?? [],
          jump_rejected: [
            ...(ultimoDiagnosticoFiltro?.jumpRejected?.slice() ?? []),
            ...(ultimoDiagnosticoAngulos.left?.jumpRejectedChains ?? []).map(
              (chain) => `left:${chain}`),
            ...(ultimoDiagnosticoAngulos.right?.jumpRejectedChains ?? []).map(
              (chain) => `right:${chain}`),
          ],
        },
        tracks: sourceMeta?.tracks ?? ultimoTrackingWeb ? {
          left: sourceMeta?.tracks?.left ?? ultimoTrackingWeb?.left?.state ?? null,
          right: sourceMeta?.tracks?.right ?? ultimoTrackingWeb?.right?.state ?? null,
          costs: sourceMeta?.association?.costs ??
            ultimoTrackingWeb?.diagnostics?.costs ?? null,
        } : null,
        hand_points: sourceMeta?.hand_points ?? {
          left: webCameraState.leftHandPoints,
          right: webCameraState.rightHandPoints,
        },
        contact: sourceMeta?.contact ?? ultimoTrackingWeb?.contact ?? null,
        errors,
      });
    }

    // ---------------------------------------------------------------------
    // Escena
    // ---------------------------------------------------------------------
    const lienzo = document.getElementById('lienzo');
    // Cap GPU fill cost: camera inference blocks main thread, and high-DPI
    // antialiasing otherwise starves VRM render cadence on phones/WebViews.
    // Nivel por dispositivo: Android lo manda en sourceMeta.tier; en web se
    // fuerza con ?tier=bajo|medio|alto para simularlo. Sin nivel: alto.
    let presupuestoRender = renderBudgetForTier(standaloneWeb
      ? new URLSearchParams(window.location.search).get('tier') : null);
    const renderPixelRatio = Math.min(window.devicePixelRatio || 1,
      presupuestoRender.pixelRatio);
    const renderer = new THREE.WebGLRenderer({
      canvas: lienzo, alpha: true, antialias: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(renderPixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    function aplicarNivelRender(tier) {
      const presupuesto = renderBudgetForTier(tier);
      if (presupuesto === presupuestoRender) return;
      presupuestoRender = presupuesto;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, presupuesto.pixelRatio));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20);
    // Encuadre de la cintura para arriba: el punto que mira la camara
    // (lookAt) queda a la altura del pecho, y la distancia/FOV estan
    // calculados para que entre desde la cintura hasta la cabeza.
    camera.position.set(0, 1.25, 1.3);
    camera.lookAt(0, 1.22, 0);

    // Camara flotante: un dedo gira alrededor del avatar, dos dedos acercan
    // y desplazan. Imprescindible para revisar una pose de perfil -- de
    // frente es imposible ver si la mano quedo delante o detras del torso,
    // que es justo el error que mas costo encontrar.
    const orbita = new OrbitControls(camera, renderer.domElement);
    orbita.target.set(0, 1.22, 0);
    orbita.enableDamping = true;
    orbita.dampingFactor = 0.1;
    orbita.minDistance = 0.4;
    orbita.maxDistance = 4.0;
    orbita.update();
    // Mientras se gira la camara a mano, el render en reposo no se frena.
    let orbitaActiva = false;
    orbita.addEventListener('start', () => { orbitaActiva = true; });
    orbita.addEventListener('end', () => { orbitaActiva = false; });

    const camaraInicial = {
      pos: camera.position.clone(),
      target: orbita.target.clone(),
    };
    function resetCamara() {
      camera.position.copy(camaraInicial.pos);
      orbita.target.copy(camaraInicial.target);
      orbita.update();
    }

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const luzDirigida = new THREE.DirectionalLight(0xffffff, 0.9);
    luzDirigida.position.set(1, 2, 1.5);
    scene.add(luzDirigida);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ---------------------------------------------------------------------
    // Carga del VRM
    // ---------------------------------------------------------------------
    let vrm = null;
    let anchoHombrosAvatar = 0.34; // fallback tipico si no se puede medir

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    function onAvatarCargado(gltf) {
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      vrm.scene.rotation.y = Math.PI; // three-vrm mira a +Z, la camara esta en -Z
      if (Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
        vrm.scene.scale.setScalar(cal.avatarScale);
      }
      scene.add(vrm.scene);

      // Mide el ancho real de hombros del avatar (mundo) para poder
      // convertir las coordenadas normalizadas (shoulder-width = 1) a
      // metros de este modelo en particular.
      const hL = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.LeftUpperArm);
      const hR = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.RightUpperArm);
      if (hL && hR) {
        const pL = new THREE.Vector3(); hL.getWorldPosition(pL);
        const pR = new THREE.Vector3(); hR.getWorldPosition(pR);
        const d = pL.distanceTo(pR);
        if (d > 0.05) anchoHombrosAvatar = d;
      }

      // Postura de reposo: brazos un poco separados del cuerpo para que
      // el 2-bone IK de abajo tenga margen para moverlos sin chocar con
      // el torso.
      // Mide las direcciones de reposo del rig ANTES de posar: el solucionador
      // 3D las usa como referencia y necesita el modelo en T-pose.
      medirRig();
      calibrarEjesPulgar('left');
      calibrarEjesPulgar('right');
      transicionesPose.reset();
      huesosTransicion.clear();
      suavizadorSalida.reset();
      huesosSuavizados = null;
      posarReposo();
      window.parlanteVrmListo = true;
    }

    // El modelo NO se pide por fetch/URL: en un WebView cargado con
    // loadFlutterAsset() las rutas relativas a otros assets de Flutter no
    // son confiables (dependen de como cada plataforma arme el dominio
    // virtual del asset loader). En cambio, Dart lee los bytes del .vrm con
    // rootBundle (avatar_bridge.dart) y se los manda a esta funcion ya
    // codificados en base64, apenas la pagina esta lista para recibirlos.
    window.cargarAvatarBase64 = function (b64) {
      try {
        const binario = atob(b64);
        const bytes = new Uint8Array(binario.length);
        for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
        loader.parse(bytes.buffer, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err));
      } catch (e) {
        avisar('No se pudo decodificar el avatar: ' + e);
      }
    };

    // Modo desarrollo web: permite inspeccionar el RigBody sin Flutter ni
    // WebView. Este modo carga el mismo VRM desde el servidor estatico y
    // habilita MediaPipe web al pulsar "Iniciar cámara".
    if (standaloneWeb) {
      fetch('../avatar/univozM.vrm')
        .then((response) => {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.arrayBuffer();
        })
        .then((bytes) => loader.parse(bytes, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err)))
        .catch((err) => avisar('No se pudo descargar el avatar: ' + err));
    }

    // Avisa a Dart que la pagina ya cargo three.js/three-vrm y esta lista
    // para recibir el modelo.
    if (window.SenasChannel) window.SenasChannel.postMessage('js_listo');

    // Canal para Flutter Web: el avatar vive en un iframe porque
    // webview_flutter no renderiza WebView en navegador.
    window.addEventListener('message', (event) => {
      const mensaje = event.data;
      if (!mensaje || mensaje.channel !== 'univoz-avatar') return;
      if (mensaje.action === 'configurarRig') {
        window.configurarRig(mensaje.calibration);
      } else if (mensaje.action === 'configurarManos') {
        window.configurarManos(mensaje.izquierda, mensaje.derecha);
      } else if (mensaje.action === 'configurarVista') {
        window.configurarVista(mensaje.vista);
      } else if (mensaje.action === 'reproducir') {
        window.reproducirSecuencia(
          mensaje.seq, mensaje.fps, mensaje.normVersion,
          mensaje.signSpace ?? null);
      }
    });

    function bone(nombre) {
      return vrm ? vrm.humanoid.getNormalizedBoneNode(nombre) : null;
    }

    // ---------------------------------------------------------------------
    // Calibracion del rig.
    //
    // Todo lo que hubo que ajustar a mano vive aca junto, por brazo. Se toca
    // en vivo desde el panel de calibracion (buscar "PANEL DE CALIBRACION"),
    // idealmente en la pantalla Espejo, donde uno mueve su propio brazo y ve
    // el resultado al instante.
    //
    //   invertZ  Invierte profundidad de worldLandmarks si el modelo/camara
    //            queda con frente y dorso intercambiados.
    //   zInv     Invierte el sentido de rotacion del brazo (arriba/abajo).
    //            Se aplica tambien a la pose de reposo para que no se
    //            contradigan.
    //   dedos    Sentido de flexion de las falanges.
    //   palmaInv Sentido del giro de la muneca.
    //   palmaOff Donde queda el cero del giro de la muneca, en radianes.
    //
    // Deducir estos signos leyendo el codigo no funciono: el rig no se
    // comporta como dice la intuicion sobre los ejes de VRM. Calibrar en el
    // dispositivo es el camino corto.
    // ---------------------------------------------------------------------
    const kThumbFallback = () => ({
      calibrated: false,
      openDistance: 0.72,
      closedDistance: 0.22,
      openAngles: [0.45, 0.18, 0.12],
      closedAngles: [1.0, 0.85, 0.85],
      updatedAtMs: 0,
    });
    const leerThumbCalibration = (raw) => {
      const fallback = kThumbFallback();
      const numberOr = (value, other) => Number.isFinite(Number(value))
        ? Number(value) : other;
      const anglesOr = (value, other) => Array.isArray(value) &&
          value.length === 3 && value.every((item) => Number.isFinite(Number(item)))
        ? value.map(Number) : other.slice();
      return {
        calibrated: raw?.calibrated === true,
        openDistance: numberOr(
          raw?.openDistance ?? raw?.open_distance, fallback.openDistance),
        closedDistance: numberOr(
          raw?.closedDistance ?? raw?.closed_distance, fallback.closedDistance),
        openAngles: anglesOr(
          raw?.openAngles ?? raw?.open_angles, fallback.openAngles),
        closedAngles: anglesOr(
          raw?.closedAngles ?? raw?.closed_angles, fallback.closedAngles),
        updatedAtMs: numberOr(
          raw?.updatedAtMs ?? raw?.updated_at_ms, fallback.updatedAtMs),
      };
    };
    const cal = {
      version: 3,
      avatarScale: 1.0,
      // sign_norm emits +Z toward the person facing the avatar.
      // sign_norm: +Z = al frente de la persona (hacia la camara); el avatar
      // mira a +Z. No invertir: con true los brazos iban detras del avatar.
      invertZ: false,
      leftArmGain: 1.0,
      rightArmGain: 1.0,
      ikMin: 0.05,
      ikMax: 2.60,
      fingerSensitivity: 1.0,
      wristCompensation: 0.0,
      reposo: 1.40, // cuanto bajan los brazos desde T-pose (comun a los dos)
      // La mano usa un marco ortonormal 3D (dedos, ancho de palma, normal)
      // y un delta de cuaternion respecto al rig medido. No depende de Euler
      // X ni de signos distintos para izquierda/derecha.
      usarMuneca: true,
      // Si una mano desaparece, espera una gracia corta y devuelve sus
      // dedos/muñeca a bind pose. Desactivado conserva comportamiento legacy:
      // última pose válida hasta que mano reaparezca.
      resetHandOnLoss: true,
      thumbCalibration: {
        left: kThumbFallback(),
        right: kThumbFallback(),
      },
      // VRM de UNIVOZ: falanges izquierdas parten hacia -X y derechas hacia
      // +X. En ambos lados, +Z lleva la punta hacia arriba; por eso la
      // flexion anatomica hacia abajo usa signos opuestos.
      left:  { zInv: 1, dedos:  1, palmaInv: 1, palmaOff: 0 },
      right: { zInv: 1, dedos: -1, palmaInv: 1, palmaOff: 0 },
    };

    function sanitizarCalibracionRig() {
      const limitado = (value, fallback, min, max) => {
        const numeric = Number(value);
        return Number.isFinite(numeric)
          ? Math.max(min, Math.min(max, numeric)) : fallback;
      };
      cal.avatarScale = limitado(cal.avatarScale, 1, .1, 10);
      cal.leftArmGain = limitado(cal.leftArmGain, 1, .2, 2);
      cal.rightArmGain = limitado(cal.rightArmGain, 1, .2, 2);
      cal.ikMin = limitado(cal.ikMin, .05, 0, Math.PI);
      cal.ikMax = limitado(cal.ikMax, 2.60, cal.ikMin, Math.PI);
      cal.fingerSensitivity = limitado(cal.fingerSensitivity, 1, .75, 1.5);
      cal.wristCompensation = limitado(cal.wristCompensation, 0, -1.5, 1.5);
      cal.reposo = limitado(cal.reposo, 1.4, 0, Math.PI);
      for (const lado of ['left', 'right']) {
        cal[lado].dedos = Number(cal[lado].dedos) < 0 ? -1 : 1;
        cal[lado].zInv = Number(cal[lado].zInv) < 0 ? -1 : 1;
        cal[lado].palmaInv = Number(cal[lado].palmaInv) < 0 ? -1 : 1;
        cal[lado].palmaOff = limitado(cal[lado].palmaOff, 0, -1.5, 1.5);
      }
    }

    // Contrato persistible enviado por Dart. Se acepta string porque
    // webview_flutter cruza JavaScript como texto, pero se valida antes de
    // mutar el rig para no mezclar configuraciones incompatibles.
    window.configurarRig = function (json) {
      try {
        const c = typeof json === 'string' ? JSON.parse(json) : json;
        if (!c || (c.version != null && ![1, 2, 3].includes(Number(c.version)))) return;
        // V1/V2 traian invertZ=true por un defecto erroneo (ver cal).
        if (c.version != null && Number(c.version) < 3) delete c.invert_z;
        for (const key of ['avatarScale', 'invertZ', 'leftArmGain',
          'rightArmGain', 'ikMin', 'ikMax', 'fingerSensitivity',
          'wristCompensation']) {
          const wire = key.replace(/[A-Z]/g, (m) => '_' + m.toLowerCase());
          if (c[wire] != null) cal[key] = Number(c[wire]);
        }
        if (c.reset_hand_on_loss != null) {
          cal.resetHandOnLoss = c.reset_hand_on_loss !== false;
        }
        if (c.resetHandOnLoss != null) {
          cal.resetHandOnLoss = c.resetHandOnLoss !== false;
        }
        if (c.reposo != null) cal.reposo = Number(c.reposo);
        const thumbs = c.thumb_calibration ?? c.thumbCalibration;
        if (thumbs) {
          for (const lado of ['left', 'right']) {
            if (thumbs[lado]) {
              cal.thumbCalibration[lado] = leerThumbCalibration(thumbs[lado]);
            }
          }
        }
        for (const lado of ['left', 'right']) {
          if (c[lado]) Object.assign(cal[lado], c[lado]);
        }
        sanitizarCalibracionRig();
        if (vrm && Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
          vrm.scene.scale.setScalar(cal.avatarScale);
          // La escala cambia longitudes en mundo. Recalibrar referencias antes
          // de aceptar el siguiente frame evita falsos positivos de drift.
          medirRig();
          calibrarEjesPulgar('left');
          calibrarEjesPulgar('right');
        }
        posarReposo();
      } catch (e) { /* json invalido: se ignora */ }
    };

    if (standaloneWeb) {
      try {
        const guardada = JSON.parse(localStorage.getItem(
          'univoz.thumbCalibration.v2') || 'null');
        if (guardada) window.configurarRig({
          version: 2, thumb_calibration: guardada,
        });
      } catch (_) { /* almacenamiento bloqueado o valor viejo */ }
    }

    // Compatibilidad con editor_pose.html y versiones anteriores del panel.
    window.ajustarCalibracion = window.configurarRig;

    // Que brazos anima el visor. Muchas senas de LSM son de una sola mano;
    // forzar la otra a seguir landmarks que no existen la hace temblar sin
    // sentido. El brazo desactivado se queda en reposo, a un costado.
    // Lo controla Dart via window.configurarManos() (avatar_bridge.dart).
    const manosActivas = { left: true, right: true };

    window.configurarManos = function (izquierda, derecha) {
      manosActivas.left = !!izquierda;
      manosActivas.right = !!derecha;
      if (!manosActivas.left) posarReposoBrazo('left');
      if (!manosActivas.right) posarReposoBrazo('right');
    };

    // Deja UN brazo colgando a un costado. Los signos estan verificados en
    // el dispositivo: ver la nota larga de mas abajo.
    function posarReposoBrazo(lado, meta = {}) {
      const signo = (lado === 'left' ? 1 : -1) * cal[lado].zInv;
      const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
      const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
      const escribirReposo = (hueso, jointId, rotation) => {
        if (!hueso) return;
        safetyGateFor(jointId).reset();
        aplicarRotacionSegura(hueso, jointId, rotation, meta, {
          jointLimits: {
            min: [-Math.PI, -Math.PI, -Math.PI],
            max: [Math.PI, Math.PI, Math.PI],
          },
        });
      };
      escribirReposo(up, `${lado}:upperArm`, [0, 0, signo * cal.reposo]);
      escribirReposo(lo, `${lado}:lowerArm`, [0, 0, 0]);
      // Manos abiertas, relajadas y con la palma en bind pose.
      ponerManoReposo(lado);
      ponerMunecaReposo(lado, meta, true);
    }

    function posarReposo() {
      // Para este rig, rotation 0 en los huesos normalizados es el T-pose
      // (brazos horizontales) -- no la pose de reposo. Hay que rotar cada
      // brazo casi 90 grados desde ahi para que caiga a los costados del
      // cuerpo.
      //
      // Los signos: en VRM el eje +X apunta hacia la izquierda del
      // personaje, pero -- verificado en el dispositivo con este rig -- la
      // rotacion positiva sobre +Z es la que BAJA el brazo izquierdo. El
      // derecho, al apuntar a -X, necesita el signo opuesto. No cambiar
      // estos signos sin volver a probar en el telefono: la primera vez
      // salieron los dos brazos hacia arriba.
      posarReposoBrazo('left');
      posarReposoBrazo('right');
    }

    // ---------------------------------------------------------------------
    // Transiciones suaves (rig_avatar_state.mjs). Volver a reposo ya no se
    // ve de golpe: se escribe el reposo como antes (compuertas y estado
    // quedan igual), se lee esa pose y se vuelve a la previa para que
    // avanzarTransicionesPose() la lleve en el tiempo. Al revés, reposo o
    // reproduccion -> pose nueva entra con crossfade corto.
    // ?transiciones=0 vuelve al comportamiento de golpe para comparar.
    // ---------------------------------------------------------------------
    const kReposoMezclaMs = 250;
    const kCrossfadeMs = 150;
    let transicionesActivas = true;
    try {
      transicionesActivas =
        new URLSearchParams(location.search).get('transiciones') !== '0';
    } catch (_) { /* sin URL: activas */ }
    const transicionesPose = createPoseTransitions({durationMs: kReposoMezclaMs});
    const huesosTransicion = new Map();
    const kDedosTransicion = ['Thumb', 'Index', 'Middle', 'Ring', 'Little'];

    function huesosMano(lado) {
      const L = lado === 'left' ? 'Left' : 'Right';
      const nombres = [`${L}Hand`];
      for (const dedo of kDedosTransicion) {
        const fases = dedo === 'Thumb' ? kFasesPulgar : kFasesGenericas;
        for (const fase of fases) nombres.push(`${L}${dedo}${fase}`);
      }
      return nombres;
    }

    function huesosBrazo(lado) {
      const L = lado === 'left' ? 'Left' : 'Right';
      return [`${L}UpperArm`, `${L}LowerArm`, ...huesosMano(lado)];
    }

    function huesosCuerpo() {
      return ['Hips', 'Spine', 'Chest', 'UpperChest', 'LeftShoulder',
        'RightShoulder', 'Neck', 'Head',
        ...huesosBrazo('left'), ...huesosBrazo('right')];
    }

    function capturarPose(nombres) {
      const pose = {};
      for (const nombre of nombres) {
        const h = VRMHumanBoneName[nombre] ? bone(VRMHumanBoneName[nombre]) : null;
        if (!h) continue;
        huesosTransicion.set(nombre, h);
        const q = h.quaternion;
        pose[nombre] = [q.x, q.y, q.z, q.w];
      }
      return pose;
    }

    function transicionReposo(clave, nombres, escribirReposo) {
      if (!vrm || !transicionesActivas) {
        escribirReposo();
        return;
      }
      const desde = capturarPose(nombres);
      escribirReposo();
      const hasta = capturarPose(nombres);
      for (const [nombre, q] of Object.entries(desde)) {
        huesosTransicion.get(nombre)?.quaternion.set(...q);
      }
      transicionesPose.start(`reposo:${clave}`,
        {from: desde, to: hasta, nowMs: performance.now()});
    }

    function crossfadePose(clave, nombres, duracionMs = kCrossfadeMs) {
      if (!vrm || !transicionesActivas) return;
      // En vivo el suavizado de salida ya entra suave a la pose nueva; un
      // crossfade encima lo anularia (el hueso en transicion no se suaviza).
      // La plantilla si lo usa: durante la reproduccion no hay suavizado.
      if (suavizadoSalidaActivo && clave !== 'reproduccion') return;
      transicionesPose.start(`entrada:${clave}`, {from: capturarPose(nombres),
        nowMs: performance.now(), durationMs: duracionMs});
    }

    function avanzarTransicionesPose(ahoraMs) {
      if (!transicionesPose.size) return;
      const {writes} = transicionesPose.step(ahoraMs, (nombre) => {
        const q = huesosTransicion.get(nombre)?.quaternion;
        return q ? [q.x, q.y, q.z, q.w] : null;
      });
      for (const {id, quaternion} of writes) {
        huesosTransicion.get(id)?.quaternion.set(...quaternion);
      }
    }

    // ---------------------------------------------------------------------
    // Suavizado de salida a ritmo de render (rig_avatar_state.mjs). La pose
    // escrita por el tracking solo cambia cuando llega un frame de camara:
    // sin esto el avatar avanza a saltos (sesion 2026-10-19: 15 cambios por
    // segundo con render a 144 Hz). tau adaptativo por grupo: temblor =
    // tauMax, movimiento real = tauMin. Cabeza y cuello quedan fuera (la cara
    // ya se suaviza por render). ?suavizado=0 lo apaga para comparar.
    // ---------------------------------------------------------------------
    let suavizadoSalidaActivo = true;
    try {
      suavizadoSalidaActivo =
        new URLSearchParams(location.search).get('suavizado') !== '0';
    } catch (_) { /* sin URL: activo */ }
    const kGrados = Math.PI / 180;
    const kSuavizadoGrupos = {
      cuerpo: {tauMinMs: 40, tauMaxMs: 90, fastRad: 15 * kGrados,
        maxSpeedRadS: 360 * kGrados},
      brazo: {tauMinMs: 30, tauMaxMs: 80, fastRad: 20 * kGrados,
        maxSpeedRadS: 900 * kGrados},
      mano: {tauMinMs: 30, tauMaxMs: 90, fastRad: 25 * kGrados,
        maxSpeedRadS: 720 * kGrados},
      // Dedos: la forma de la mano en LSM necesita respuesta rapida.
      dedos: {tauMinMs: 15, tauMaxMs: 45, fastRad: 20 * kGrados,
        maxSpeedRadS: 1440 * kGrados},
    };
    const suavizadorSalida = createOutputSmoother();
    let huesosSuavizados = null;
    let ultimoSuavizadoMs = 0;

    function listaHuesosSuavizados() {
      const lista = ['Hips', 'Spine', 'Chest', 'UpperChest', 'LeftShoulder',
        'RightShoulder'].map((nombre) => [nombre, 'cuerpo']);
      for (const lado of ['left', 'right']) {
        const L = lado === 'left' ? 'Left' : 'Right';
        lista.push([`${L}UpperArm`, 'brazo'], [`${L}LowerArm`, 'brazo'],
          [`${L}Hand`, 'mano']);
        for (const nombre of huesosMano(lado).slice(1)) lista.push([nombre, 'dedos']);
      }
      return lista.map(([nombre, grupo]) => [nombre, grupo,
        VRMHumanBoneName[nombre] ? bone(VRMHumanBoneName[nombre]) : null])
        .filter(([, , h]) => h);
    }

    function suavizarSalida(ahoraMs) {
      if (!vrm) return;
      huesosSuavizados ??= listaHuesosSuavizados();
      const dt = ultimoSuavizadoMs
        ? Math.min(100, Math.max(0, ahoraMs - ultimoSuavizadoMs)) : 16;
      ultimoSuavizadoMs = ahoraMs;
      // La plantilla ya viene interpolada y limpia: solo seguirla.
      const seguir = !suavizadoSalidaActivo || reproduciendo;
      for (const [nombre, grupo, h] of huesosSuavizados) {
        const q = h.quaternion;
        const escrito = [q.x, q.y, q.z, q.w];
        if (seguir || transicionesPose.owns(nombre)) {
          suavizadorSalida.follow(nombre, escrito);
          continue;
        }
        const mostrado = suavizadorSalida.step(nombre, escrito, dt,
          kSuavizadoGrupos[grupo]);
        if (mostrado) q.set(...mostrado);
      }
    }

    function volviendoAReposo() {
      return transicionesPose.keys().some((clave) => clave.startsWith('reposo:'));
    }

    // ---------------------------------------------------------------------
    // Resolucion de brazos en 3D.
    //
    // sign_norm 2.0.0 entrega cuerpo 3D. Al cargar el modelo se miden sus
    // longitudes y direcciones de reposo; cada frame resuelve posicion de
    // muñeca con IK de dos huesos y conserva plano de flexion capturado.
    // ---------------------------------------------------------------------
    const refRig = { left: null, right: null };
    const refHand = { left: null, right: null };
    const refTorso = {};
    let refRostro = null;
    const avDerecha = new THREE.Vector3();
    const avArriba = new THREE.Vector3(0, 1, 0);
    // El avatar mira a +Z: es VRM 0.0 (mira a -Z) y la escena se voltea media
    // vuelta al cargarlo, arriba.
    const avFrente = new THREE.Vector3(0, 0, 1);

    function marcoMano(x, y, cmc = null) {
      const vectorValido = (v) => v?.isVector3 === true &&
        typeof v.lengthSq === 'function' &&
        Number.isFinite(v.x) && Number.isFinite(v.y) &&
        Number.isFinite(v.z) && v.lengthSq() > 1e-8;
      // Contract: all frame axes and optional CMC are THREE.Vector3. A raw
      // landmark array must fail closed instead of throwing in the render loop.
      if (!vectorValido(x) || !vectorValido(y) ||
          (cmc != null && !vectorValido(cmc))) return null;
      const ejeX = x.clone();
      ejeX.normalize();
      const ejeY = y.clone().addScaledVector(ejeX, -y.dot(ejeX));
      if (!vectorValido(ejeY)) return null;
      ejeY.normalize();
      const ejeZ = new THREE.Vector3().crossVectors(ejeX, ejeY);
      if (!vectorValido(ejeZ)) return null;
      ejeZ.normalize();
      // CMC fixes radial-axis sign. Without this check, the same hand seen
      // from palm/dorsum can produce a quaternion with reversed surface.
      if (cmc &&
          cmc.clone().normalize().dot(ejeY) < 0) {
        ejeY.negate();
        ejeZ.negate();
      }
      return { x: ejeX, y: ejeY, z: ejeZ };
    }

    function medirRig() {
      // Hay que medir con TODO en cero: la pose de reposo ya rota los brazos
      // y falsearia las direcciones de referencia.
      for (const n of Object.values(VRMHumanBoneName)) {
        const h = bone(n); if (h) h.rotation.set(0, 0, 0);
      }
      vrm.scene.updateMatrixWorld(true);

      const pL = new THREE.Vector3(), pR = new THREE.Vector3();
      bone(VRMHumanBoneName.LeftUpperArm).getWorldPosition(pL);
      bone(VRMHumanBoneName.RightUpperArm).getWorldPosition(pR);
      avDerecha.subVectors(pR, pL).normalize();

      // Ojos en reposo: anclas de cara para el retarget (faceAnchorsFromEyes).
      const ojoI = bone(VRMHumanBoneName.LeftEye);
      const ojoD = bone(VRMHumanBoneName.RightEye);
      refRostro = ojoI && ojoD ? {
        eyeL: ojoI.getWorldPosition(new THREE.Vector3()).toArray(),
        eyeR: ojoD.getWorldPosition(new THREE.Vector3()).toArray(),
        shoulderMid: pL.clone().add(pR).multiplyScalar(0.5).toArray(),
      } : null;

      for (const clave of ['Hips', 'Spine', 'Chest', 'UpperChest',
        'LeftShoulder', 'RightShoulder', 'Neck', 'Head']) {
        const nombre = VRMHumanBoneName[clave];
        const h = nombre ? bone(nombre) : null;
        refTorso[clave] = h ? {
          bone: h,
          world: h.getWorldQuaternion(new THREE.Quaternion()),
        } : null;
      }

      for (const lado of ['left', 'right']) {
        const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
        const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
        const ma = bone(lado === 'left' ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
        if (!up || !lo || !ma) {
          refRig[lado] = null;
          refHand[lado] = null;
          continue;
        }
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        up.getWorldPosition(a); lo.getWorldPosition(b); ma.getWorldPosition(c);
        refRig[lado] = {
          dirUp: b.clone().sub(a).normalize(),
          dirLo: c.clone().sub(b).normalize(),
          lenUp: a.distanceTo(b),
          lenLo: b.distanceTo(c),
          qUp: up.getWorldQuaternion(new THREE.Quaternion()),
          qLo: lo.getWorldQuaternion(new THREE.Quaternion()),
          qPadre: up.parent.getWorldQuaternion(new THREE.Quaternion()),
        };

        // Marco anatomico estable del bind pose. El mismo orden se arma con
        // landmarks de MediaPipe, por eso no introduce espejo por lado.
        const prefijo = lado === 'left' ? 'Left' : 'Right';
        const indice = bone(VRMHumanBoneName[`${prefijo}IndexProximal`]);
        const medio = bone(VRMHumanBoneName[`${prefijo}MiddleProximal`]);
        const menique = bone(VRMHumanBoneName[`${prefijo}LittleProximal`]);
        if (!indice || !medio || !menique) {
          refHand[lado] = null;
          continue;
        }
        const pi = new THREE.Vector3(), pm = new THREE.Vector3();
        const pl = new THREE.Vector3();
        indice.getWorldPosition(pi);
        medio.getWorldPosition(pm);
        menique.getWorldPosition(pl);
        const marco = marcoMano(pm.clone().sub(c), pi.clone().sub(pl));
        refHand[lado] = marco ? {
          bone: ma,
          qWorld: ma.getWorldQuaternion(new THREE.Quaternion()),
          marco,
        } : null;
      }
    }

    // Cada hueso VRM puede usar eje local distinto. Se prueban X/Y/Z en
    // ambos sentidos contra centro real de palma del avatar. Criterio:
    // rotación elegida debe acercar punta del pulgar a palma, nunca a Y global.
    const thumbRigMap = { left: {}, right: {} };

    function objetivoPalmaAvatar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const nombres = ['Hand', 'IndexProximal', 'MiddleProximal', 'LittleProximal'];
      const puntos = nombres.map((nombre) =>
        bone(VRMHumanBoneName[`${prefijo}${nombre}`])).filter(Boolean)
        .map((hueso) => hueso.getWorldPosition(new THREE.Vector3()));
      if (!puntos.length) return null;
      return puntos.reduce((suma, punto) => suma.add(punto), new THREE.Vector3())
        .multiplyScalar(1 / puntos.length);
    }

    function puntaPulgarAvatar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const proximal = bone(VRMHumanBoneName[`${prefijo}ThumbProximal`]);
      const distal = bone(VRMHumanBoneName[`${prefijo}ThumbDistal`]) || proximal;
      if (!distal) return null;
      const origen = distal.getWorldPosition(new THREE.Vector3());
      // Normalized VRM no siempre expone nodo tip. Extrapolar último segmento
      // en espacio local hace que rotar Distal sí cambie punto medido.
      let longitud = 0.018;
      if (proximal && proximal !== distal) {
        const p = proximal.getWorldPosition(new THREE.Vector3());
        longitud = Math.max(0.008, origen.distanceTo(p));
      }
      const ejeLocal = distal.position.lengthSq() > 1e-8
        ? distal.position.clone().normalize() : new THREE.Vector3(
          lado === 'left' ? -1 : 1, 0, 0);
