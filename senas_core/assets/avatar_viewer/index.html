            ...(ultimoDiagnosticoAngulos.left?.jumpRejectedChains ?? []).map(
              (chain) => `left:${chain}`),
            ...(ultimoDiagnosticoAngulos.right?.jumpRejectedChains ?? []).map(
              (chain) => `right:${chain}`),
          ],
        },
        tracks: sourceMeta?.tracks ?? ultimoTrackingWeb ? {
          left: sourceMeta?.tracks?.left ?? ultimoTrackingWeb?.left?.state ?? null,
          right: sourceMeta?.tracks?.right ?? ultimoTrackingWeb?.right?.state ?? null,
          costs: sourceMeta?.association?.costs ??
            ultimoTrackingWeb?.diagnostics?.costs ?? null,
        } : null,
        hand_points: sourceMeta?.hand_points ?? {
          left: webCameraState.leftHandPoints,
          right: webCameraState.rightHandPoints,
        },
        contact: sourceMeta?.contact ?? ultimoTrackingWeb?.contact ?? null,
        errors,
      });
    }

    // ---------------------------------------------------------------------
    // Escena
    // ---------------------------------------------------------------------
    const lienzo = document.getElementById('lienzo');
    // Cap GPU fill cost: camera inference blocks main thread, and high-DPI
    // antialiasing otherwise starves VRM render cadence on phones/WebViews.
    const renderPixelRatio = Math.min(window.devicePixelRatio || 1, 1.25);
    const renderer = new THREE.WebGLRenderer({
      canvas: lienzo, alpha: true, antialias: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(renderPixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20);
    // Encuadre de la cintura para arriba: el punto que mira la camara
    // (lookAt) queda a la altura del pecho, y la distancia/FOV estan
    // calculados para que entre desde la cintura hasta la cabeza.
    camera.position.set(0, 1.25, 1.3);
    camera.lookAt(0, 1.22, 0);

    // Camara flotante: un dedo gira alrededor del avatar, dos dedos acercan
    // y desplazan. Imprescindible para revisar una pose de perfil -- de
    // frente es imposible ver si la mano quedo delante o detras del torso,
    // que es justo el error que mas costo encontrar.
    const orbita = new OrbitControls(camera, renderer.domElement);
    orbita.target.set(0, 1.22, 0);
    orbita.enableDamping = true;
    orbita.dampingFactor = 0.1;
    orbita.minDistance = 0.4;
    orbita.maxDistance = 4.0;
    orbita.update();

    const camaraInicial = {
      pos: camera.position.clone(),
      target: orbita.target.clone(),
    };
    function resetCamara() {
      camera.position.copy(camaraInicial.pos);
      orbita.target.copy(camaraInicial.target);
      orbita.update();
    }

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const luzDirigida = new THREE.DirectionalLight(0xffffff, 0.9);
    luzDirigida.position.set(1, 2, 1.5);
    scene.add(luzDirigida);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ---------------------------------------------------------------------
    // Carga del VRM
    // ---------------------------------------------------------------------
    let vrm = null;
    let anchoHombrosAvatar = 0.34; // fallback tipico si no se puede medir

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    function onAvatarCargado(gltf) {
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      vrm.scene.rotation.y = Math.PI; // three-vrm mira a +Z, la camara esta en -Z
      if (Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
        vrm.scene.scale.setScalar(cal.avatarScale);
      }
      scene.add(vrm.scene);

      // Mide el ancho real de hombros del avatar (mundo) para poder
      // convertir las coordenadas normalizadas (shoulder-width = 1) a
      // metros de este modelo en particular.
      const hL = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.LeftUpperArm);
      const hR = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.RightUpperArm);
      if (hL && hR) {
        const pL = new THREE.Vector3(); hL.getWorldPosition(pL);
        const pR = new THREE.Vector3(); hR.getWorldPosition(pR);
        const d = pL.distanceTo(pR);
        if (d > 0.05) anchoHombrosAvatar = d;
      }

      // Postura de reposo: brazos un poco separados del cuerpo para que
      // el 2-bone IK de abajo tenga margen para moverlos sin chocar con
      // el torso.
      // Mide las direcciones de reposo del rig ANTES de posar: el solucionador
      // 3D las usa como referencia y necesita el modelo en T-pose.
      medirRig();
      calibrarEjesPulgar('left');
      calibrarEjesPulgar('right');
      posarReposo();
      window.parlanteVrmListo = true;
    }

    // El modelo NO se pide por fetch/URL: en un WebView cargado con
    // loadFlutterAsset() las rutas relativas a otros assets de Flutter no
    // son confiables (dependen de como cada plataforma arme el dominio
    // virtual del asset loader). En cambio, Dart lee los bytes del .vrm con
    // rootBundle (avatar_bridge.dart) y se los manda a esta funcion ya
    // codificados en base64, apenas la pagina esta lista para recibirlos.
    window.cargarAvatarBase64 = function (b64) {
      try {
        const binario = atob(b64);
        const bytes = new Uint8Array(binario.length);
        for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
        loader.parse(bytes.buffer, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err));
      } catch (e) {
        avisar('No se pudo decodificar el avatar: ' + e);
      }
    };

    // Modo desarrollo web: permite inspeccionar el RigBody sin Flutter ni
    // WebView. Este modo carga el mismo VRM desde el servidor estatico y
    // habilita MediaPipe web al pulsar "Iniciar cámara".
    if (standaloneWeb) {
      fetch('../avatar/univozM.vrm')
        .then((response) => {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.arrayBuffer();
        })
        .then((bytes) => loader.parse(bytes, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err)))
        .catch((err) => avisar('No se pudo descargar el avatar: ' + err));
    }

    // Avisa a Dart que la pagina ya cargo three.js/three-vrm y esta lista
    // para recibir el modelo.
    if (window.SenasChannel) window.SenasChannel.postMessage('js_listo');

    // Canal para Flutter Web: el avatar vive en un iframe porque
    // webview_flutter no renderiza WebView en navegador.
    window.addEventListener('message', (event) => {
      const mensaje = event.data;
      if (!mensaje || mensaje.channel !== 'univoz-avatar') return;
      if (mensaje.action === 'configurarRig') {
        window.configurarRig(mensaje.calibration);
      } else if (mensaje.action === 'configurarManos') {
        window.configurarManos(mensaje.izquierda, mensaje.derecha);
      } else if (mensaje.action === 'configurarVista') {
        window.configurarVista(mensaje.vista);
      } else if (mensaje.action === 'reproducir') {
        window.reproducirSecuencia(
          mensaje.seq, mensaje.fps, mensaje.normVersion,
          mensaje.signSpace ?? null);
      }
    });

    function bone(nombre) {
      return vrm ? vrm.humanoid.getNormalizedBoneNode(nombre) : null;
    }

    // ---------------------------------------------------------------------
    // Calibracion del rig.
    //
    // Todo lo que hubo que ajustar a mano vive aca junto, por brazo. Se toca
    // en vivo desde el panel de calibracion (buscar "PANEL DE CALIBRACION"),
    // idealmente en la pantalla Espejo, donde uno mueve su propio brazo y ve
    // el resultado al instante.
    //
    //   invertZ  Invierte profundidad de worldLandmarks si el modelo/camara
    //            queda con frente y dorso intercambiados.
    //   zInv     Invierte el sentido de rotacion del brazo (arriba/abajo).
    //            Se aplica tambien a la pose de reposo para que no se
    //            contradigan.
    //   dedos    Sentido de flexion de las falanges.
    //   palmaInv Sentido del giro de la muneca.
    //   palmaOff Donde queda el cero del giro de la muneca, en radianes.
    //
    // Deducir estos signos leyendo el codigo no funciono: el rig no se
    // comporta como dice la intuicion sobre los ejes de VRM. Calibrar en el
    // dispositivo es el camino corto.
    // ---------------------------------------------------------------------
    const kThumbFallback = () => ({
      calibrated: false,
      openDistance: 0.72,
      closedDistance: 0.22,
      openAngles: [0.45, 0.18, 0.12],
      closedAngles: [1.0, 0.85, 0.85],
      updatedAtMs: 0,
    });
    const leerThumbCalibration = (raw) => {
      const fallback = kThumbFallback();
      const numberOr = (value, other) => Number.isFinite(Number(value))
        ? Number(value) : other;
      const anglesOr = (value, other) => Array.isArray(value) &&
          value.length === 3 && value.every((item) => Number.isFinite(Number(item)))
        ? value.map(Number) : other.slice();
      return {
        calibrated: raw?.calibrated === true,
        openDistance: numberOr(
          raw?.openDistance ?? raw?.open_distance, fallback.openDistance),
        closedDistance: numberOr(
          raw?.closedDistance ?? raw?.closed_distance, fallback.closedDistance),
        openAngles: anglesOr(
          raw?.openAngles ?? raw?.open_angles, fallback.openAngles),
        closedAngles: anglesOr(
          raw?.closedAngles ?? raw?.closed_angles, fallback.closedAngles),
        updatedAtMs: numberOr(
          raw?.updatedAtMs ?? raw?.updated_at_ms, fallback.updatedAtMs),
      };
    };
    const cal = {
      version: 3,
      avatarScale: 1.0,
      // sign_norm emits +Z toward the person facing the avatar.
      // sign_norm: +Z = al frente de la persona (hacia la camara); el avatar
      // mira a +Z. No invertir: con true los brazos iban detras del avatar.
      invertZ: false,
      leftArmGain: 1.0,
      rightArmGain: 1.0,
      ikMin: 0.05,
      ikMax: 2.60,
      fingerSensitivity: 1.0,
      wristCompensation: 0.0,
      reposo: 1.40, // cuanto bajan los brazos desde T-pose (comun a los dos)
      // La mano usa un marco ortonormal 3D (dedos, ancho de palma, normal)
      // y un delta de cuaternion respecto al rig medido. No depende de Euler
      // X ni de signos distintos para izquierda/derecha.
      usarMuneca: true,
      // Si una mano desaparece, espera una gracia corta y devuelve sus
      // dedos/muñeca a bind pose. Desactivado conserva comportamiento legacy:
      // última pose válida hasta que mano reaparezca.
      resetHandOnLoss: true,
      thumbCalibration: {
        left: kThumbFallback(),
        right: kThumbFallback(),
      },
      // VRM de UNIVOZ: falanges izquierdas parten hacia -X y derechas hacia
      // +X. En ambos lados, +Z lleva la punta hacia arriba; por eso la
      // flexion anatomica hacia abajo usa signos opuestos.
      left:  { zInv: 1, dedos:  1, palmaInv: 1, palmaOff: 0 },
      right: { zInv: 1, dedos: -1, palmaInv: 1, palmaOff: 0 },
    };

    function sanitizarCalibracionRig() {
      const limitado = (value, fallback, min, max) => {
        const numeric = Number(value);
        return Number.isFinite(numeric)
          ? Math.max(min, Math.min(max, numeric)) : fallback;
      };
      cal.avatarScale = limitado(cal.avatarScale, 1, .1, 10);
      cal.leftArmGain = limitado(cal.leftArmGain, 1, .2, 2);
      cal.rightArmGain = limitado(cal.rightArmGain, 1, .2, 2);
      cal.ikMin = limitado(cal.ikMin, .05, 0, Math.PI);
      cal.ikMax = limitado(cal.ikMax, 2.60, cal.ikMin, Math.PI);
      cal.fingerSensitivity = limitado(cal.fingerSensitivity, 1, .75, 1.5);
      cal.wristCompensation = limitado(cal.wristCompensation, 0, -1.5, 1.5);
      cal.reposo = limitado(cal.reposo, 1.4, 0, Math.PI);
      for (const lado of ['left', 'right']) {
        cal[lado].dedos = Number(cal[lado].dedos) < 0 ? -1 : 1;
        cal[lado].zInv = Number(cal[lado].zInv) < 0 ? -1 : 1;
        cal[lado].palmaInv = Number(cal[lado].palmaInv) < 0 ? -1 : 1;
        cal[lado].palmaOff = limitado(cal[lado].palmaOff, 0, -1.5, 1.5);
      }
    }

    // Contrato persistible enviado por Dart. Se acepta string porque
    // webview_flutter cruza JavaScript como texto, pero se valida antes de
    // mutar el rig para no mezclar configuraciones incompatibles.
    window.configurarRig = function (json) {
      try {
        const c = typeof json === 'string' ? JSON.parse(json) : json;
        if (!c || (c.version != null && ![1, 2, 3].includes(Number(c.version)))) return;
        // V1/V2 traian invertZ=true por un defecto erroneo (ver cal).
        if (c.version != null && Number(c.version) < 3) delete c.invert_z;
        for (const key of ['avatarScale', 'invertZ', 'leftArmGain',
          'rightArmGain', 'ikMin', 'ikMax', 'fingerSensitivity',
          'wristCompensation']) {
          const wire = key.replace(/[A-Z]/g, (m) => '_' + m.toLowerCase());
          if (c[wire] != null) cal[key] = Number(c[wire]);
        }
        if (c.reset_hand_on_loss != null) {
          cal.resetHandOnLoss = c.reset_hand_on_loss !== false;
        }
        if (c.resetHandOnLoss != null) {
          cal.resetHandOnLoss = c.resetHandOnLoss !== false;
        }
        if (c.reposo != null) cal.reposo = Number(c.reposo);
        const thumbs = c.thumb_calibration ?? c.thumbCalibration;
        if (thumbs) {
          for (const lado of ['left', 'right']) {
            if (thumbs[lado]) {
              cal.thumbCalibration[lado] = leerThumbCalibration(thumbs[lado]);
            }
          }
        }
        for (const lado of ['left', 'right']) {
          if (c[lado]) Object.assign(cal[lado], c[lado]);
        }
        sanitizarCalibracionRig();
        if (vrm && Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
          vrm.scene.scale.setScalar(cal.avatarScale);
          // La escala cambia longitudes en mundo. Recalibrar referencias antes
          // de aceptar el siguiente frame evita falsos positivos de drift.
          medirRig();
          calibrarEjesPulgar('left');
          calibrarEjesPulgar('right');
        }
        posarReposo();
      } catch (e) { /* json invalido: se ignora */ }
    };

    if (standaloneWeb) {
      try {
        const guardada = JSON.parse(localStorage.getItem(
          'univoz.thumbCalibration.v2') || 'null');
        if (guardada) window.configurarRig({
          version: 2, thumb_calibration: guardada,
        });
      } catch (_) { /* almacenamiento bloqueado o valor viejo */ }
    }

    // Compatibilidad con editor_pose.html y versiones anteriores del panel.
    window.ajustarCalibracion = window.configurarRig;

    // Que brazos anima el visor. Muchas senas de LSM son de una sola mano;
    // forzar la otra a seguir landmarks que no existen la hace temblar sin
    // sentido. El brazo desactivado se queda en reposo, a un costado.
    // Lo controla Dart via window.configurarManos() (avatar_bridge.dart).
    const manosActivas = { left: true, right: true };

    window.configurarManos = function (izquierda, derecha) {
      manosActivas.left = !!izquierda;
      manosActivas.right = !!derecha;
      if (!manosActivas.left) posarReposoBrazo('left');
      if (!manosActivas.right) posarReposoBrazo('right');
    };

    // Deja UN brazo colgando a un costado. Los signos estan verificados en
    // el dispositivo: ver la nota larga de mas abajo.
    function posarReposoBrazo(lado, meta = {}) {
      const signo = (lado === 'left' ? 1 : -1) * cal[lado].zInv;
      const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
      const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
      const escribirReposo = (hueso, jointId, rotation) => {
        if (!hueso) return;
        safetyGateFor(jointId).reset();
        aplicarRotacionSegura(hueso, jointId, rotation, meta, {
          jointLimits: {
            min: [-Math.PI, -Math.PI, -Math.PI],
            max: [Math.PI, Math.PI, Math.PI],
          },
        });
      };
      escribirReposo(up, `${lado}:upperArm`, [0, 0, signo * cal.reposo]);
      escribirReposo(lo, `${lado}:lowerArm`, [0, 0, 0]);
      // Manos abiertas, relajadas y con la palma en bind pose.
      ponerManoReposo(lado);
      ponerMunecaReposo(lado, meta, true);
    }

    function posarReposo() {
      // Para este rig, rotation 0 en los huesos normalizados es el T-pose
      // (brazos horizontales) -- no la pose de reposo. Hay que rotar cada
      // brazo casi 90 grados desde ahi para que caiga a los costados del
      // cuerpo.
      //
      // Los signos: en VRM el eje +X apunta hacia la izquierda del
      // personaje, pero -- verificado en el dispositivo con este rig -- la
      // rotacion positiva sobre +Z es la que BAJA el brazo izquierdo. El
      // derecho, al apuntar a -X, necesita el signo opuesto. No cambiar
      // estos signos sin volver a probar en el telefono: la primera vez
      // salieron los dos brazos hacia arriba.
      posarReposoBrazo('left');
      posarReposoBrazo('right');
    }

    // ---------------------------------------------------------------------
    // Resolucion de brazos en 3D.
    //
    // sign_norm 2.0.0 entrega cuerpo 3D. Al cargar el modelo se miden sus
    // longitudes y direcciones de reposo; cada frame resuelve posicion de
    // muñeca con IK de dos huesos y conserva plano de flexion capturado.
    // ---------------------------------------------------------------------
    const refRig = { left: null, right: null };
    const refHand = { left: null, right: null };
    const refTorso = {};
    let refRostro = null;
    const avDerecha = new THREE.Vector3();
    const avArriba = new THREE.Vector3(0, 1, 0);
    // El avatar mira a +Z: es VRM 0.0 (mira a -Z) y la escena se voltea media
    // vuelta al cargarlo, arriba.
    const avFrente = new THREE.Vector3(0, 0, 1);

    function marcoMano(x, y, cmc = null) {
      const vectorValido = (v) => v?.isVector3 === true &&
        typeof v.lengthSq === 'function' &&
        Number.isFinite(v.x) && Number.isFinite(v.y) &&
        Number.isFinite(v.z) && v.lengthSq() > 1e-8;
      // Contract: all frame axes and optional CMC are THREE.Vector3. A raw
      // landmark array must fail closed instead of throwing in the render loop.
      if (!vectorValido(x) || !vectorValido(y) ||
          (cmc != null && !vectorValido(cmc))) return null;
      const ejeX = x.clone();
      ejeX.normalize();
      const ejeY = y.clone().addScaledVector(ejeX, -y.dot(ejeX));
      if (!vectorValido(ejeY)) return null;
      ejeY.normalize();
      const ejeZ = new THREE.Vector3().crossVectors(ejeX, ejeY);
      if (!vectorValido(ejeZ)) return null;
      ejeZ.normalize();
      // CMC fixes radial-axis sign. Without this check, the same hand seen
      // from palm/dorsum can produce a quaternion with reversed surface.
      if (cmc &&
          cmc.clone().normalize().dot(ejeY) < 0) {
        ejeY.negate();
        ejeZ.negate();
      }
      return { x: ejeX, y: ejeY, z: ejeZ };
    }

    function medirRig() {
      // Hay que medir con TODO en cero: la pose de reposo ya rota los brazos
      // y falsearia las direcciones de referencia.
      for (const n of Object.values(VRMHumanBoneName)) {
        const h = bone(n); if (h) h.rotation.set(0, 0, 0);
      }
      vrm.scene.updateMatrixWorld(true);

      const pL = new THREE.Vector3(), pR = new THREE.Vector3();
      bone(VRMHumanBoneName.LeftUpperArm).getWorldPosition(pL);
      bone(VRMHumanBoneName.RightUpperArm).getWorldPosition(pR);
      avDerecha.subVectors(pR, pL).normalize();

      // Ojos en reposo: anclas de cara para el retarget (faceAnchorsFromEyes).
      const ojoI = bone(VRMHumanBoneName.LeftEye);
      const ojoD = bone(VRMHumanBoneName.RightEye);
      refRostro = ojoI && ojoD ? {
        eyeL: ojoI.getWorldPosition(new THREE.Vector3()).toArray(),
        eyeR: ojoD.getWorldPosition(new THREE.Vector3()).toArray(),
        shoulderMid: pL.clone().add(pR).multiplyScalar(0.5).toArray(),
      } : null;

      for (const clave of ['Hips', 'Spine', 'Chest', 'UpperChest',
        'LeftShoulder', 'RightShoulder', 'Neck', 'Head']) {
        const nombre = VRMHumanBoneName[clave];
        const h = nombre ? bone(nombre) : null;
        refTorso[clave] = h ? {
          bone: h,
          world: h.getWorldQuaternion(new THREE.Quaternion()),
        } : null;
      }

      for (const lado of ['left', 'right']) {
        const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
        const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
        const ma = bone(lado === 'left' ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
        if (!up || !lo || !ma) {
          refRig[lado] = null;
          refHand[lado] = null;
          continue;
        }
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        up.getWorldPosition(a); lo.getWorldPosition(b); ma.getWorldPosition(c);
        refRig[lado] = {
          dirUp: b.clone().sub(a).normalize(),
          dirLo: c.clone().sub(b).normalize(),
          lenUp: a.distanceTo(b),
          lenLo: b.distanceTo(c),
          qUp: up.getWorldQuaternion(new THREE.Quaternion()),
          qLo: lo.getWorldQuaternion(new THREE.Quaternion()),
          qPadre: up.parent.getWorldQuaternion(new THREE.Quaternion()),
        };

        // Marco anatomico estable del bind pose. El mismo orden se arma con
        // landmarks de MediaPipe, por eso no introduce espejo por lado.
        const prefijo = lado === 'left' ? 'Left' : 'Right';
        const indice = bone(VRMHumanBoneName[`${prefijo}IndexProximal`]);
        const medio = bone(VRMHumanBoneName[`${prefijo}MiddleProximal`]);
        const menique = bone(VRMHumanBoneName[`${prefijo}LittleProximal`]);
        if (!indice || !medio || !menique) {
          refHand[lado] = null;
          continue;
        }
        const pi = new THREE.Vector3(), pm = new THREE.Vector3();
        const pl = new THREE.Vector3();
        indice.getWorldPosition(pi);
        medio.getWorldPosition(pm);
        menique.getWorldPosition(pl);
        const marco = marcoMano(pm.clone().sub(c), pi.clone().sub(pl));
        refHand[lado] = marco ? {
          bone: ma,
          qWorld: ma.getWorldQuaternion(new THREE.Quaternion()),
          marco,
        } : null;
      }
    }

    // Cada hueso VRM puede usar eje local distinto. Se prueban X/Y/Z en
    // ambos sentidos contra centro real de palma del avatar. Criterio:
    // rotación elegida debe acercar punta del pulgar a palma, nunca a Y global.
    const thumbRigMap = { left: {}, right: {} };

    function objetivoPalmaAvatar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const nombres = ['Hand', 'IndexProximal', 'MiddleProximal', 'LittleProximal'];
      const puntos = nombres.map((nombre) =>
        bone(VRMHumanBoneName[`${prefijo}${nombre}`])).filter(Boolean)
        .map((hueso) => hueso.getWorldPosition(new THREE.Vector3()));
      if (!puntos.length) return null;
      return puntos.reduce((suma, punto) => suma.add(punto), new THREE.Vector3())
        .multiplyScalar(1 / puntos.length);
    }

    function puntaPulgarAvatar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const proximal = bone(VRMHumanBoneName[`${prefijo}ThumbProximal`]);
      const distal = bone(VRMHumanBoneName[`${prefijo}ThumbDistal`]) || proximal;
      if (!distal) return null;
      const origen = distal.getWorldPosition(new THREE.Vector3());
      // Normalized VRM no siempre expone nodo tip. Extrapolar último segmento
      // en espacio local hace que rotar Distal sí cambie punto medido.
      let longitud = 0.018;
      if (proximal && proximal !== distal) {
        const p = proximal.getWorldPosition(new THREE.Vector3());
        longitud = Math.max(0.008, origen.distanceTo(p));
      }
      const ejeLocal = distal.position.lengthSq() > 1e-8
        ? distal.position.clone().normalize() : new THREE.Vector3(
          lado === 'left' ? -1 : 1, 0, 0);
      return distal.localToWorld(ejeLocal.multiplyScalar(longitud));
    }

    function calibrarEjesPulgar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const objetivo = objetivoPalmaAvatar(lado);
      if (!objetivo) return;
      for (const fase of ['Metacarpal', 'Proximal', 'Distal']) {
        const hueso = bone(VRMHumanBoneName[`${prefijo}Thumb${fase}`]);
        if (!hueso) continue;
        const original = {
          x: hueso.rotation.x, y: hueso.rotation.y, z: hueso.rotation.z,
        };
        vrm.scene.updateMatrixWorld(true);
        const puntaAntes = puntaPulgarAvatar(lado);
        if (!puntaAntes) continue;
        const antes = puntaAntes.distanceTo(objetivo);
        const probes = [];
        for (const axis of ['x', 'y', 'z']) {
          for (const sign of [-1, 1]) {
            hueso.rotation.set(original.x, original.y, original.z);
            hueso.rotation[axis] += sign * 0.20;
            vrm.scene.updateMatrixWorld(true);
            const punta = puntaPulgarAvatar(lado);
            if (punta) probes.push({
              axis, sign, distance: punta.distanceTo(objetivo),
            });
          }
        }
        hueso.rotation.set(original.x, original.y, original.z);
        thumbRigMap[lado][fase] = chooseThumbBoneAxis(antes, probes) ?? {
          axis: 'z', sign: lado === 'left' ? 1 : -1, improvement: 0,
        };
      }
      vrm.scene.updateMatrixWorld(true);
    }

    // Base del cuerpo. Desde sign_norm 2.0.0 el bloque de cuerpo YA viene
    // proyectado sobre los ejes de la persona: +X a su derecha, +Y arriba,
    // +Z al frente. Asi que no hay nada que deducir, la base es la identidad.
    //
    // No volver a calcularla de los hombros y caderas: daria +Z hacia atras
    // y el avatar senaria en espejo de profundidad.
    const kBase = {
      pDer: new THREE.Vector3(1, 0, 0),
      pArr: new THREE.Vector3(0, 1, 0),
      pFre: new THREE.Vector3(0, 0, 1),
    };
    function baseCuerpo(p) {
      // Solo comprueba que el frame tenga cuerpo utilizable.
      return (Math.abs(p.hombroD.x - p.hombroI.x) > 1e-4) ? kBase : null;
    }

    function vectorBaseAvatar(v, base) {
      const z = cal.invertZ ? -v.dot(base.pFre) : v.dot(base.pFre);
      return new THREE.Vector3()
        .addScaledVector(avDerecha, v.dot(base.pDer))
        .addScaledVector(avArriba, v.dot(base.pArr))
        .addScaledVector(avFrente, z);
    }

    function aBaseAvatar(v, base) {
      return vectorBaseAvatar(v, base).normalize();
    }

    function vectorManoAAvatar(p, base) {
      // p ya pertenece al bloque de FORMA normalizado: sign_norm transforma
      // imagen Y hacia abajo a Y hacia arriba antes de cruzar este puente.
      // Negar Y aqui volvía a invertir dedos y palma verticalmente. MediaPipe
      // mano usa Z negativo hacia la camara, mientras que el avatar usa +Z
      // hacia su frente; corregir esa convencion solo en render.
      const zFrente = cal.invertZ ? p[2] : -p[2];
      return aBaseAvatar(new THREE.Vector3(p[0], p[1], zFrente), base);
    }

    // Utilidades para angulos de falanges, que usan arrays [x,y,z].
    function _largo(v) { return Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]); }
    function _norm(v) { const m = _largo(v) || 1; return [v[0] / m, v[1] / m, v[2] / m]; }
    function _pto(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function _resta(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

    function metaRigFrame(meta = {}) {
      const timestampMs = Number(meta.timestampMs);
      const t = Number.isFinite(timestampMs) ? timestampMs : performance.now();
      return {
        frameId: meta.frameId ?? null,
        timestampMs: t,
        nowMs: t,
        sourceSkewMs: Number(meta.sourceSkewMs ?? 0),
      };
    }

    function reportSafetyAnomaly(result, jointId) {
      if (!result?.code) return;
      webCameraState.invalidTransforms++;
      if (result.code === 'teleport_detected') webCameraState.teleports++;
      const side = String(jointId).startsWith('left') ? 'left' :
        String(jointId).startsWith('right') ? 'right' : null;
      errorDiagnostico('safety_gate', result.code, side);
    }

    function aplicarRotacionSegura(hueso, jointId, rotation, meta = {}, options = {}) {
      if (!hueso || !Array.isArray(rotation)) return null;
      const result = safetyGateFor(jointId).check({
        ...metaRigFrame(meta),
        jointId,
        rotation,
        handId: options.handId,
        expectedHandId: options.expectedHandId,
        parentId: hueso.parent?.uuid ?? null,
        jointLimits: options.jointLimits,
        referenceBoneLength: options.referenceBoneLength,
        boneLength: options.boneLength,
        recovery: options.recovery,
      });
      if (result.accepted && Array.isArray(result.value)) {
        hueso.rotation.set(...result.value);
      } else {
        reportSafetyAnomaly(result, jointId);
      }
      return result;
    }

    function aplicarQuaternionSegura(hueso, jointId, quaternion, meta = {}, options = {}) {
      if (!hueso || !quaternion) return null;
      let rotation = options.rotation ?? null;
      try {
        if (!rotation && typeof THREE !== 'undefined') {
          const euler = new THREE.Euler().setFromQuaternion(quaternion);
          rotation = [euler.x, euler.y, euler.z];
        }
      } catch (_) { rotation = null; }
      const result = safetyGateFor(jointId).check({
        ...metaRigFrame(meta),
        jointId,
        rotation,
        quaternion: [quaternion.x, quaternion.y, quaternion.z, quaternion.w],
        handId: options.handId,
        expectedHandId: options.expectedHandId,
        parentId: hueso.parent?.uuid ?? null,
        jointLimits: options.jointLimits,
        referenceBoneLength: options.referenceBoneLength,
        boneLength: options.boneLength,
        recovery: options.recovery,
      });
      if (result.accepted && Array.isArray(result.quaternion)) {
        hueso.quaternion.set(...result.quaternion);
      } else {
        reportSafetyAnomaly(result, jointId);
      }
      return result;
    }

    function aplicarTorso(p, meta = {}) {
      const hombros = p.hombroD.clone().sub(p.hombroI);
      const medioHombros = p.hombroD.clone().add(p.hombroI).multiplyScalar(0.5);
      const medioCaderas = p.caderaD.clone().add(p.caderaI).multiplyScalar(0.5);
      const arriba = medioHombros.clone().sub(medioCaderas).normalize();
      const derecha = hombros.normalize();
      if (arriba.lengthSq() < 1e-6 || derecha.lengthSq() < 1e-6) return;
      const frente = new THREE.Vector3().crossVectors(arriba, derecha).normalize();
      if (frente.lengthSq() < 1e-6) return;

      // El vector normalizado conserva inclinacion de pelvis/torso aunque
      // elimina traslacion. Aplicar una base rota huesos sin mover raiz.
      const referencia = new THREE.Matrix4().makeBasis(
        avDerecha, avArriba, avFrente);
      const objetivo = new THREE.Matrix4().makeBasis(derecha, arriba, frente);
      const qReferencia = new THREE.Quaternion().setFromRotationMatrix(referencia);
      const qObjetivo = new THREE.Quaternion().setFromRotationMatrix(objetivo);
      const delta = qObjetivo.multiply(qReferencia.invert());

      const aplicar = (clave, proporcion) => {
        const r = refTorso[clave];
        if (!r) return;
        const parcial = new THREE.Quaternion().slerpQuaternions(
          new THREE.Quaternion(), delta, proporcion);
        const mundo = parcial.multiply(r.world);
        const padre = r.bone.parent.getWorldQuaternion(new THREE.Quaternion());
        aplicarQuaternionSegura(r.bone, `torso:${clave}`,
          padre.invert().multiply(mundo), meta);
      };

      aplicar('Hips', 1.0);
      aplicar('Spine', 0.75);
      aplicar('Chest', 0.55);
      aplicar('UpperChest', 0.40);
      aplicar('LeftShoulder', 0.30);
      aplicar('RightShoulder', 0.30);
    }

    // Retarget por anclas (docs/13-mapeo-corporal-universal.md). 'legacy'
    // escala la muneca por ancho de hombros (comportamiento historico);
    // 'anchors' aplica direcciones del usuario a los huesos del avatar y
    // resuelve contactos contra SU cara y pecho. Queda en 'legacy' por
    // defecto hasta validar en camara fisica (gates de docs/07).
    const kRetargetModes = ['legacy', 'anchors'];
    const kRetargetStorageKey = 'univoz.retargetMode.v1';
    let retargetMode = 'legacy';
    try {
      const pedido = new URLSearchParams(location.search).get('retarget') ??
        localStorage.getItem(kRetargetStorageKey);
      if (kRetargetModes.includes(pedido)) retargetMode = pedido;
    } catch (_) { /* sin storage: queda legacy */ }
    window.configurarRetarget = function (modo) {
      if (!kRetargetModes.includes(modo)) return retargetMode;
      retargetMode = modo;
      try { localStorage.setItem(kRetargetStorageKey, modo); } catch (_) {}
      return retargetMode;
    };

    // Vista del avatar. 'interlocutor' (defecto): el avatar te mira y usa SU
    // mano derecha cuando tu usas la tuya, como una persona frente a ti; es
    // lo correcto al traducir para otra persona. 'espejo': se mueve como tu
    // reflejo, solo para practicar o verte a ti mismo. Afecta solo al frame
    // en vivo; la biblioteca se reproduce siempre como interlocutor.
    const kVistas = ['interlocutor', 'espejo'];
    const kVistaStorageKey = 'univoz.vistaAvatar.v1';
    let vistaAvatar = 'interlocutor';
    try {
      const pedida = new URLSearchParams(location.search).get('vista') ??
        localStorage.getItem(kVistaStorageKey);
      if (kVistas.includes(pedida)) vistaAvatar = pedida;
    } catch (_) { /* sin storage: interlocutor */ }
    window.configurarVista = function (vista) {
      if (!kVistas.includes(vista)) return vistaAvatar;
      vistaAvatar = vista;
      try { localStorage.setItem(kVistaStorageKey, vista); } catch (_) {}
      return vistaAvatar;
    };

    let perfilAvatarCache = null;
    function perfilAvatarRetarget() {
      const l = refRig.left, r = refRig.right;
      if (!l || !r) return null;
      const clave = [anchoHombrosAvatar, l.lenUp, l.lenLo, r.lenUp, r.lenLo,
        refRostro?.eyeL?.join(',') ?? '-'].join('|');
      if (perfilAvatarCache?.clave !== clave) {
        const sw = anchoHombrosAvatar;
        try {
          const cara = refRostro ? faceAnchorsFromEyes({...refRostro,
            right: avDerecha.toArray(), up: avArriba.toArray(),
            front: avFrente.toArray()}) : null;
          perfilAvatarCache = {clave, perfil: createAvatarRigProfile({
            shoulderL: [-sw / 2, 0, 0], shoulderR: [sw / 2, 0, 0],
            upperL: l.lenUp, foreL: l.lenLo, upperR: r.lenUp, foreR: r.lenLo,
            nose: cara?.nose ?? null, mouth: cara?.mouth ?? null,
          })};
        } catch (_) {
          perfilAvatarCache = {clave, perfil: null};
        }
      }
      return perfilAvatarCache.perfil;
    }

    // Desplazamiento hombro -> muneca en mundo del avatar, o null para usar
    // el camino legacy (modo apagado, sin SignSpace o brazo enmascarado).
    function deltaMunecaRetarget(lado, signSpace) {
      if (retargetMode !== 'anchors' || !signSpace) return null;
      const perfil = perfilAvatarRetarget();
      if (!perfil) return null;
      const side = lado === 'left' ? 'L' : 'R';
      const arm = retargetArm(signSpace, perfil, side);
      if (!arm) return null;
      const hombro = perfil.shoulders[side];
      return vectorBaseAvatar(new THREE.Vector3(arm.wrist[0] - hombro[0],
        arm.wrist[1] - hombro[1], arm.wrist[2] - hombro[2]), kBase);
    }

    function resolverBrazo(lado, base, hombro, codo, muneca, meta = {}) {
      const r = refRig[lado];
      if (!r) return;
      const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
      const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);

      const hombroAvatar = new THREE.Vector3();
      up.getWorldPosition(hombroAvatar);
      // sign_norm entrega posiciones en anchos de hombro. Se convierten a
      // unidades del avatar para que la mano apunte al mismo punto, no solo
      // en la misma direccion. El gain permite compensar rigs exportados con
      // brazos proporcionalmente distintos.
      const ganancia = lado === 'left' ? cal.leftArmGain : cal.rightArmGain;
      const deltaMano = deltaMunecaRetarget(lado, meta.signSpace) ??
        vectorBaseAvatar(muneca.clone().sub(hombro), base)
          .multiplyScalar(anchoHombrosAvatar * Math.max(0.2, Math.min(2.0, ganancia)));
      const objetivoMuneca = hombroAvatar.clone().add(deltaMano);
      const radioObjetivo = objetivoMuneca.distanceTo(hombroAvatar);
      if (radioObjetivo < 1e-4 || r.lenUp < 1e-4 || r.lenLo < 1e-4) return;

      const limiteMin = Math.max(0, Math.min(Math.PI, cal.ikMin));
      const limiteMax = Math.max(limiteMin, Math.min(Math.PI, cal.ikMax));
      const radioFisicoMin = Math.abs(r.lenUp - r.lenLo) + 1e-5;
      const radioFisicoMax = r.lenUp + r.lenLo - 1e-5;
      // En esta convencion 0 rad es brazo estirado y PI es codo totalmente
      // plegado. La distancia equivalente mantiene límites estables aunque
      // el usuario acerque la mano más de lo que el rig puede alcanzar.
      const radioPorAngulo = (angulo) => Math.sqrt(Math.max(0,
        r.lenUp * r.lenUp + r.lenLo * r.lenLo +
        2 * r.lenUp * r.lenLo * Math.cos(angulo)));
      const radioMin = Math.max(radioFisicoMin, radioPorAngulo(limiteMax));
      const radioMax = Math.min(radioFisicoMax, radioPorAngulo(limiteMin));
      const radio = Math.max(radioMin, Math.min(radioMax, radioObjetivo));
      const direccionObjetivo = objetivoMuneca.clone().sub(hombroAvatar).normalize();
      const objetivoMunecaResuelto = hombroAvatar.clone()
        .addScaledVector(direccionObjetivo, radio);

      // Plano de codo: conserva hacia donde se dobla el brazo capturado,
      // evitando que una solución ambigua salte delante/detrás del torso.
      const codoDeseado = vectorBaseAvatar(codo.clone().sub(hombro), base);
      let planoCodo = codoDeseado.clone()
        .addScaledVector(direccionObjetivo, -codoDeseado.dot(direccionObjetivo));
      if (planoCodo.lengthSq() < 1e-8) {
        planoCodo = r.dirUp.clone()
          .addScaledVector(direccionObjetivo, -r.dirUp.dot(direccionObjetivo));
      }
      if (planoCodo.lengthSq() < 1e-8) planoCodo.copy(avArriba);
      planoCodo.addScaledVector(direccionObjetivo,
        -planoCodo.dot(direccionObjetivo)).normalize();

      const avance = (r.lenUp * r.lenUp - r.lenLo * r.lenLo + radio * radio) /
        (2 * radio);
      const altura = Math.sqrt(Math.max(0, r.lenUp * r.lenUp - avance * avance));
      const elbowTarget = hombroAvatar.clone()
        .addScaledVector(direccionObjetivo, avance)
        .addScaledVector(planoCodo, altura);
      const dirUp = elbowTarget.clone().sub(hombroAvatar).normalize();
      // Upper y lower deben resolver contra mismo punto alcanzable. Usar
      // objetivoMuneca original aquí anulaba límites cuando estaba fuera
      // del alcance: codo se calculaba limitado, antebrazo apuntaba lejos.
      const dirLo = objetivoMunecaResuelto.clone()
        .sub(elbowTarget).normalize();

      const qU = new THREE.Quaternion().setFromUnitVectors(r.dirUp, dirUp);
      const mundoU = qU.clone().multiply(r.qUp);
      const padreActual = up.parent.getWorldQuaternion(new THREE.Quaternion());
      const localUp = padreActual.invert().multiply(mundoU);
      if (typeof aplicarQuaternionSegura === 'function') {
        aplicarQuaternionSegura(up, `${lado}:upperArm`, localUp, meta,
          {referenceBoneLength: r.lenUp, boneLength: r.lenUp,
            recovery: meta.recovery === true});
      } else {
        up.quaternion.copy(localUp);
      }

      // El antebrazo parte de referencia ya girada por el upper arm.
      const partida = r.dirLo.clone().applyQuaternion(qU);
      const qL = new THREE.Quaternion().setFromUnitVectors(partida, dirLo);
      const mundoL = qL.clone().multiply(qU).multiply(r.qLo);
      const localLo = mundoU.clone().invert().multiply(mundoL);
      if (typeof aplicarQuaternionSegura === 'function') {
        aplicarQuaternionSegura(lo, `${lado}:lowerArm`, localLo, meta,
          {referenceBoneLength: r.lenLo, boneLength: r.lenLo,
            recovery: meta.recovery === true});
      } else {
        lo.quaternion.copy(localLo);
      }
    }

    // Los cuatro dedos largos van Proximal -> Intermediate -> Distal en
    // las dos versiones del spec. El pulgar NO: three-vrm v2 expone los
    // huesos con la nomenclatura de VRM 1.0, donde el pulgar es
    // Metacarpal -> Proximal -> Distal y no existe "ThumbIntermediate".
    // Con la lista generica, ese nombre resolvia a undefined y el
    // metacarpiano -- el hueso que abre y cierra la pinza -- se quedaba
    // quieto. Se detecta en tiempo de carga para no depender de la
    // version exacta de la libreria que sirva el CDN.
    const kFasesGenericas = ['Proximal', 'Intermediate', 'Distal'];
    const kFasesPulgar = VRMHumanBoneName.LeftThumbMetacarpal
      ? ['Metacarpal', 'Proximal', 'Distal']
      : kFasesGenericas;
    const rigThumbState = { left: null, right: null };

    function reiniciarNeutralPulgar() {
      rigThumbState.left = null;
      rigThumbState.right = null;
    }

    // Una sola deteccion perdida no debe resetear mano: oclusion, blur o
    // inferencia lenta producen huecos aislados. Pasado margen, devolver
    // mano a reposo evita dejar dedos congelados en pose imposible.
    const kHandLossGraceMs = 250;
    const estadoPerdidaMano = {
      left: { desde: 0, enReposo: false, reposoAplicado: false, recoveryFrames: 0 },
      right: { desde: 0, enReposo: false, reposoAplicado: false, recoveryFrames: 0 },
    };

    function reiniciarEstadoPerdidaMano() {
      estadoPerdidaMano.left.desde = 0;
      estadoPerdidaMano.left.enReposo = false;
      estadoPerdidaMano.left.reposoAplicado = false;
      estadoPerdidaMano.left.recoveryFrames = 0;
      estadoPerdidaMano.right.desde = 0;
      estadoPerdidaMano.right.enReposo = false;
      estadoPerdidaMano.right.reposoAplicado = false;
      estadoPerdidaMano.right.recoveryFrames = 0;
    }

    function actualizarEstadoPerdidaMano(lado, presente, ahoraMs) {
      const estado = estadoPerdidaMano[lado];
      if (presente) {
        const reaparecioTrasReposo = estado.enReposo;
        estado.desde = 0;
        estado.enReposo = false;
        estado.reposoAplicado = false;
        estado.recoveryFrames = reaparecioTrasReposo ? 3 : 0;
        if (reaparecioTrasReposo) {
          rigThumbState[lado] = null;
          if (typeof handAngleFilters !== 'undefined') {
            for (const filtro of handAngleFilters[lado]) filtro.reset();
          }
        }
        return true;
      }
      if (!cal.resetHandOnLoss) {
        estado.desde = 0;
        estado.enReposo = false;
        estado.reposoAplicado = false;
        estado.recoveryFrames = 0;
        return false;
      }
      if (!estado.desde) estado.desde = ahoraMs;
      if (ahoraMs - estado.desde < kHandLossGraceMs) return false;
      if (!estado.enReposo) {
        ponerManoReposo(lado);
        ponerMunecaReposo(lado);
        estado.enReposo = true;
        estado.reposoAplicado = false;
      }
      return false;
    }

    // Angulo entre dos vectores, en radianes. Siempre positivo: los dedos
    // solo flexionan hacia un lado, asi que la magnitud alcanza y no hay
    // signo que adivinar.
    function _angulo(u, v) {
      const c = _pto(_norm(u), _norm(v));
      return Math.acos(Math.max(-1, Math.min(1, c)));
    }

    function moverMano(lado, presente, puntos, meta = {}) {
      // Si tracking pierde mano, presencia=0 significa conservar ultima
      // posicion valida. Asi no aparece un puño abierto durante un gap breve.
      if (!presente || !puntos) return;
      // puntos: 20 landmarks [x,y,z] relativos a la muneca, ya rotados y
      // escalados por sign_norm.dart.
      //
      // Cada dedo llega con sus cuatro puntos (nudillo, y las tres
      // articulaciones hasta la yema), asi que el angulo de cada falange se
      // mide directo: es el angulo entre un segmento del dedo y el anterior.
      //
      // La version anterior resumia el dedo entero en un solo numero -- la
      // distancia de la yema a la muneca -- y doblaba las tres falanges por
      // igual. Con eso un dedo doblado solo en el nudillo y uno en garra
      // daban la misma pose, y casi cualquier configuracion manual terminaba
      // viendose como un puno a medio cerrar. En LSM la configuracion manual
      // es la mitad del significado, asi que esa aproximacion se comia la
      // seña.
      const dedos = [
        ['Thumb', [0, 1, 2, 3]],
        ['Index', [4, 5, 6, 7]],
        ['Middle', [8, 9, 10, 11]],
        ['Ring', [12, 13, 14, 15]],
        ['Little', [16, 17, 18, 19]],
      ];
      const kFlexMax = 1.6; // tope por falange, para que no se doble de mas

      for (let dedoIndex = 0; dedoIndex < dedos.length; dedoIndex++) {
        const [nombreDedo, idx] = dedos[dedoIndex];
        const fases = nombreDedo === 'Thumb' ? kFasesPulgar : kFasesGenericas;
        let flex = [0, 0, 0];
        let datosValidos = false;

        if (presente && puntos) {
          const nudillo = puntos[idx[0]];
          const a = puntos[idx[1]];
          const b = puntos[idx[2]];
          const c = puntos[idx[3]];
          // Segmentos: palma->nudillo, y luego cada falange.
          const s0 = nudillo;              // la muneca es el origen
          const s1 = _resta(a, nudillo);
          const s2 = _resta(b, a);
          const s3 = _resta(c, b);
          if (_largo(s1) > 1e-5 && _largo(s2) > 1e-5 && _largo(s3) > 1e-5 &&
              _largo(s0) > 1e-5) {
          // Pulgar MediaPipe: wrist->CMC, CMC->MCP, MCP->IP, IP->punta.
          // VRM de este avatar expone exactamente tres huesos articulados:
          // Metacarpal (CMC), Proximal (MCP) y Distal (IP). Mapear cada
          // angulo a su hueso evita dejar la base rigida y evita duplicar CMC
          // en dos huesos, que producia una flexion artificial.
          const anguloCmc = _angulo(s0, s1);
          const anguloMcp = _angulo(s1, s2);
          const anguloIp = _angulo(s2, s3);
          let angulos = [anguloCmc, anguloMcp, anguloIp];
          if (nombreDedo === 'Thumb' && fases[0] === 'Metacarpal') {
            const medida = measureThumbPose(puntos);
            const resuelto = solveThumbPose(
              medida, cal.thumbCalibration[lado]);
            rigThumbState[lado] = resuelto;
            angulos = resuelto.flexions;
          }
          flex = angulos.map((x) => Math.min(kFlexMax,
            Math.max(0, x * cal.fingerSensitivity)));
          datosValidos = true;
          }
        }

        // Punto degenerado no debe abrir dedo de golpe: conservar ultima
        // rotacion valida hasta que cadena vuelva a ser utilizable.
        if (!datosValidos) continue;

        // XYZ de landmarks no se suaviza. One Euro opera sobre ángulos
        // articulares; un spike congela únicamente esta cadena un frame.
        const flexSemantico = flex.slice();
        const frameTime = Number(meta.timestampMs) ||
          (typeof frameVivoTimestampMs !== 'undefined'
            ? Number(frameVivoTimestampMs) : 0);
        const t = frameTime || (typeof performance !== 'undefined' && performance.now
          ? performance.now() : Date.now());
        if (typeof handAngleFilters !== 'undefined' &&
            webCameraState.smoothing) {
          if (ultimoAnguloTimestamp[lado] !== t) {
            ultimoAnguloTimestamp[lado] = t;
            ultimoDiagnosticoAngulos[lado] = {
              madOutliers: [], jumpRejectedChains: [], delayMs: 0,
              fingerLagMs: 0,
              rawToFilteredRms: 0,
            };
          }
          const filtrado = handAngleFilters[lado][dedoIndex].filter(
            flex, t, frameVivoQuality || 1);
          if (filtrado) {
            flex = filtrado.angles;
            const diag = ultimoDiagnosticoAngulos[lado];
            diag.madOutliers.push(...filtrado.diagnostics.madOutliers.map(
              (joint) => dedoIndex * 3 + joint));
            if (filtrado.diagnostics.jumpRejectedChains.length) {
              diag.jumpRejectedChains.push(dedoIndex);
            }
            diag.delayMs = Math.max(diag.delayMs,
              filtrado.diagnostics.delayMs);
            diag.rawToFilteredRms = Math.max(diag.rawToFilteredRms,
              filtrado.diagnostics.rawToFilteredRms);
          }
        }

        const estadoDedo = typeof fingerRenderState !== 'undefined'
          ? fingerRenderState[lado]?.[dedoIndex] : null;
        if (estadoDedo) {
          const media = (values) => values.reduce((sum, value) => sum + value, 0) /
            Math.max(1, values.length);
          estadoDedo.input = flexSemantico.slice();
          estadoDedo.render = flex.slice();
          estadoDedo.timestampMs = t;
          estadoDedo.samples.push({
            timestampMs: t,
            input: Math.min(1, media(flexSemantico) / kFlexMax),
            avatar: Math.min(1, media(flex) / kFlexMax),
          });
          if (estadoDedo.samples.length > 120) estadoDedo.samples.shift();
          estadoDedo.lagMs = measureFingerLag(estadoDedo.samples);
          ultimoDiagnosticoAngulos[lado].fingerLagMs = Math.max(
            ultimoDiagnosticoAngulos[lado].fingerLagMs ?? 0,
            estadoDedo.lagMs,
          );
          if (estadoDedo.lagMs > 66) {
            guardarAudit({
              frame: meta.frameId ?? null,
              timestampMs: t,
              stage: 'finger_render',
              joint: `${lado}:${nombreDedo}`,
              score: Math.max(0, 1 - estadoDedo.lagMs / 250),
              severity: 'error',
              state: 'VALID',
              action: 'inspect_filter_chain',
              code: 'finger_response_lag',
            });
          }
        }

        for (let i = 0; i < fases.length; i++) {
          const nombreHueso = VRMHumanBoneName[
            `${lado === 'left' ? 'Left' : 'Right'}${nombreDedo}${fases[i]}`];
          const h = nombreHueso ? bone(nombreHueso) : null;
          if (!h) continue;
          const rotacion = nombreDedo === 'Thumb'
            ? (() => {
              const mapa = thumbRigMap[lado][fases[i]] ?? {
                axis: 'z', sign: lado === 'left' ? 1 : -1,
              };
              const result = [0, 0, 0];
              result[['x', 'y', 'z'].indexOf(mapa.axis)] = mapa.sign * flex[i];
              return result;
            })()
            : [h.rotation.x, h.rotation.y, cal[lado].dedos * flex[i]];
          if (typeof aplicarRotacionSegura === 'function') {
            aplicarRotacionSegura(h, `${lado}:${nombreDedo}:${fases[i]}`,
              rotacion, meta, {
                handId: lado,
                expectedHandId: lado,
                recovery: meta.recovery === true,
                jointLimits: {
                  min: [-1.6, -1.6, -1.6],
                  max: [1.6, 1.6, 1.6],
                },
              });
          } else if (nombreDedo === 'Thumb') {
            const mapa = thumbRigMap[lado][fases[i]] ?? {
              axis: 'z', sign: lado === 'left' ? 1 : -1,
            };
            h.rotation.set(0, 0, 0);
            h.rotation[mapa.axis] = mapa.sign * flex[i];
          } else {
            h.rotation.z = cal[lado].dedos * flex[i];
          }
        }
      }
    }

    function ponerManoReposo(lado) {
      const dedos = [
        ['Thumb', kFasesPulgar], ['Index', kFasesGenericas],
        ['Middle', kFasesGenericas], ['Ring', kFasesGenericas],
        ['Little', kFasesGenericas],
      ];
      for (const [nombreDedo, fases] of dedos) {
        for (const fase of fases) {
          const nombreHueso = VRMHumanBoneName[
            `${lado === 'left' ? 'Left' : 'Right'}${nombreDedo}${fase}`];
          const h = nombreHueso ? bone(nombreHueso) : null;
          if (h) {
            if (nombreDedo === 'Thumb') h.rotation.set(0, 0, 0);
            else h.rotation.z = 0;
          }
        }
      }
    }

    // ---------------------------------------------------------------------
    // Orientacion 3D de la palma.
    //
    // Hand landmarks llegan relativos a muneca. Sus tres ejes utiles son:
    // X: muneca -> nudillo medio; Y: indice -> menique; Z: normal de palma.
    // Se construye el mismo marco en bind pose VRM y en cada frame. El delta
    // entre ambos se aplica en mundo y despues se convierte a local; asi la
    // solucion sigue al antebrazo y no depende de Euler X global.
    // ---------------------------------------------------------------------
    const kIdxIndiceMcp = 4, kIdxMedioMcp = 8, kIdxMeniqueMcp = 16;

    function orientarMuneca(lado, presente, puntos, base, meta = {}) {
      const mano = bone(lado === 'left'
        ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
      const referencia = refHand[lado];
      if (!mano || !referencia || !cal.usarMuneca) return;
      // Presencia=0 conserva ultima orientacion valida durante un gap.
      if (!presente || !puntos || !base) return;
      const puntoValido = (punto) => Array.isArray(punto) && punto.length >= 3 &&
        punto.slice(0, 3).every(Number.isFinite);
      const puntosClave = [0, kIdxIndiceMcp, kIdxMedioMcp, kIdxMeniqueMcp];
      if (!Array.isArray(puntos) ||
          !puntosClave.every((indice) => puntoValido(puntos[indice]))) return;

      const dedos = vectorManoAAvatar(puntos[kIdxMedioMcp], base);
      const ancho = vectorManoAAvatar([
        puntos[kIdxIndiceMcp][0] - puntos[kIdxMeniqueMcp][0],
        puntos[kIdxIndiceMcp][1] - puntos[kIdxMeniqueMcp][1],
        puntos[kIdxIndiceMcp][2] - puntos[kIdxMeniqueMcp][2],
      ], base);
      const cmc = vectorManoAAvatar(puntos[0], base);
      const objetivo = marcoMano(dedos, ancho, cmc);
      if (!objetivo) return; // landmarks degenerados: conservar ultima pose

      const qRest = new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          referencia.marco.x, referencia.marco.y, referencia.marco.z));
      const qObjetivo = new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          objetivo.x, objetivo.y, objetivo.z));
      const delta = qObjetivo.multiply(qRest.invert());
      const ajuste = new THREE.Quaternion().setFromAxisAngle(
        objetivo.x,
        cal[lado].palmaInv * (cal[lado].palmaOff + cal.wristCompensation));
      const mundo = ajuste.multiply(delta).multiply(referencia.qWorld);
      const padre = mano.parent.getWorldQuaternion(new THREE.Quaternion());
      if (typeof aplicarQuaternionSegura === 'function') {
        aplicarQuaternionSegura(mano, `${lado}:hand`,
          padre.invert().multiply(mundo), meta, {
            handId: lado, expectedHandId: lado,
            recovery: meta.recovery === true,
          });
      } else {
        mano.quaternion.copy(padre.invert().multiply(mundo));
      }
    }

    function ponerMunecaReposo(lado, meta = {}, seguro = false) {
      const mano = bone(lado === 'left'
        ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
      if (!mano) return;
      if (seguro && typeof aplicarQuaternionSegura === 'function') {
        const jointId = `${lado}:hand`;
        safetyGateFor(jointId).reset();
        aplicarQuaternionSegura(mano, jointId,
          new THREE.Quaternion(), meta, {
            handId: lado, expectedHandId: lado,
          });
        return;
      }
      mano.rotation.set(0, 0, 0);
    }

    // Cara rastreada (captura Holistic). Mientras haya cara reciente, las
    // expresiones y la cabeza vienen del usuario; si no, parpadeo generico.
    let caraAplicadaAt = 0;
    let aspectoImagenVivo = null;
    const caraSuave = {expressions: {}, head: null};
    function aplicarCara(cara, espejo, meta = {}) {
      if (!vrm || !cara) return false;
      // Web: proporcion del <video>; Android: la que manda Kotlin.
      const video = document.getElementById('camaraVideo');
      const aspect = video?.videoWidth > 0 && video?.videoHeight > 0
        ? video.videoWidth / video.videoHeight : (aspectoImagenVivo ?? 4 / 3);
      let expresiones = Object.keys(cara.blendshapes ?? {}).length
        ? blendshapesToVrmExpressions(cara.blendshapes)
        : expressionsFromFaceLandmarks(cara.landmarks, {aspect});
      let cabeza = headRotationFromFace(cara.landmarks, {aspect});
      if (espejo) {
        ({expressions: expresiones, head: cabeza} =
          mirrorFaceSignals(expresiones, cabeza));
      }
      // Suavizado exponencial ligero: la malla facial tiembla mas que el
      // cuerpo y una ceja saltando cambia el significado.
      const a = 0.5;
      for (const [k, v] of Object.entries(expresiones)) {
        const previo = caraSuave.expressions[k] ?? v;
        caraSuave.expressions[k] = previo + a * (v - previo);
      }
      if (cabeza) {
        const p = caraSuave.head ?? cabeza;
        caraSuave.head = {yaw: p.yaw + a * (cabeza.yaw - p.yaw),
          pitch: p.pitch + a * (cabeza.pitch - p.pitch),
          roll: p.roll + a * (cabeza.roll - p.roll)};
      }
      const em = vrm.expressionManager;
      if (em) {
        for (const [k, v] of Object.entries(caraSuave.expressions)) {
          try { em.setValue(k, v); } catch (_) { /* expresion ausente */ }
        }
      }
      const h = caraSuave.head;
      if (h) {
        // Avatar mira a +Z (camara): yaw gira hacia +X (su izquierda),
        // pitch positivo mira arriba, roll inclina hacia -X (su derecha).
        const q = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(-h.pitch, h.yaw, h.roll, 'YXZ'));
        for (const [clave, proporcion] of [['Neck', 0.4], ['Head', 1.0]]) {
          const r = refTorso[clave];
          if (!r) continue;
          const parcial = new THREE.Quaternion().slerpQuaternions(
            new THREE.Quaternion(), q, proporcion);
          const mundo = parcial.multiply(r.world);
          r.bone.parent.updateWorldMatrix(true, false);
          const padre = r.bone.parent.getWorldQuaternion(new THREE.Quaternion());
          aplicarQuaternionSegura(r.bone, `cabeza:${clave}`,
            padre.invert().multiply(mundo), meta);
        }
      }
      caraAplicadaAt = performance.now();
      return true;
    }

    function moverExpresionBasica(t) {
      // Sin cara rastreada (captura separada pose + manos) esto es generico:
      // un parpadeo cada tanto para que no se sienta un maniqui.
      if (!vrm || !vrm.expressionManager) return;
      if (performance.now() - caraAplicadaAt < 500) return;
      const ciclo = (t % 3.6);
      const parpadeo = ciclo > 3.4 ? (1 - (ciclo - 3.4) / 0.2) : (ciclo > 3.3 ? (ciclo - 3.3) / 0.1 : 0);
      vrm.expressionManager.setValue('blink', Math.max(0, Math.min(1, parpadeo)));
    }

    // ---------------------------------------------------------------------
    // Reproduccion de una secuencia de frames (ver dtw.dart / Template.seq)
    // ---------------------------------------------------------------------
    // Layout del vector normalizado, version 2.0.0 (152 dims). Ver
    // lib/sign_norm.dart. El cuerpo son 8 puntos x (x, y, z): hombros,
    // codos, munecas y caderas.
    const kOffBody = 0, kOffLocL = 24, kOffLocR = 27, kOffPresL = 30,
      kOffPresR = 31, kOffShapeL = 32, kOffShapeR = 92,
      kFrameDim = 152, kTFrames = 32;
    // Indices dentro del bloque de cuerpo, en PUNTOS (no en dimensiones).
    const kPtHombroI = 0, kPtHombroD = 1, kPtCodoI = 2, kPtCodoD = 3,
      kPtMunI = 4, kPtMunD = 5, kPtCaderaI = 6, kPtCaderaD = 7;

    // Suavizado visual único y sensible a grupo. MAD solo informa; no
    // sustituye movimientos válidos. Reconocimiento y grabación usan raw.
    const responsiveRigFilter = createResponsiveRigFilter({
      deadbands: {body: .003, wrist: .004, shape: 0},
    });
    const adaptiveMotionCalibrator = createAdaptiveMotionCalibrator({
      warmupMs: 1500,
      deadbands: {body: .003, wrist: .004},
    });
    const adaptivePoseScheduler = createAdaptivePoseScheduler({
      minStride: 2, maxStride: 4, processLimitMs: 50,
    });
    const handAngleFilters = {
      left: Array.from({length: 5}, () => createFastFingerAngleFilter(3)),
      right: Array.from({length: 5}, () => createFastFingerAngleFilter(3)),
    };
    // Estado de render separado del vector semántico. Conserva evidencia
    // numérica de entrada/salida para medir fingerLag sin guardar imágenes.
    const fingerRenderState = {
      left: Array.from({length: 5}, () => ({
        input: [0, 0, 0], render: [0, 0, 0], timestampMs: 0,
        samples: [], lagMs: 0,
      })),
      right: Array.from({length: 5}, () => ({
        input: [0, 0, 0], render: [0, 0, 0], timestampMs: 0,
        samples: [], lagMs: 0,
      })),
    };
    let ultimoAnguloTimestamp = {left: -1, right: -1};
    let ultimoDiagnosticoAngulos = {
      left: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
      right: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
    };
    let ultimoDiagnosticoFiltro = {
      madOutliers: [], madRepaired: [], jumpRejected: [], deadbandHeld: 0,
      delayMs: 0, rawToFilteredRms: 0, timestampRejected: false,
    };
    let ultimoModoSuavizado = webCameraState.smoothing;
    // Filtro de SignSpaceFrame (ver filtrarSignSpace). Declarado antes de
    // reiniciarFiltroWeb para que exista en cualquier reinicio temprano.
    const filtroSignSpace = createSignSpaceFilter();
    function reiniciarFiltroWeb() {
      filtroFrameWeb = null;
      filtroTimestampWeb = 0;
      filtroSignSpace.reset();
      responsiveRigFilter.reset();
      adaptiveMotionCalibrator.reset();
      adaptivePoseScheduler.reset();
      responsiveRigFilter.setDeadbands({body: .003, wrist: .004});
      for (const lado of ['left', 'right']) {
        for (const filtro of handAngleFilters[lado]) filtro.reset();
      }
      ultimoAnguloTimestamp = {left: -1, right: -1};
      ultimoDiagnosticoAngulos = {
        left: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
        right: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
      };
      for (const lado of ['left', 'right']) {
        for (const dedo of fingerRenderState[lado]) {
          dedo.input = [0, 0, 0]; dedo.render = [0, 0, 0];
          dedo.timestampMs = 0; dedo.samples = []; dedo.lagMs = 0;
        }
      }
      resetSafetyGates();
      ultimoDiagnosticoFiltro = {
        madOutliers: [], madRepaired: [], jumpRejected: [], deadbandHeld: 0,
        delayMs: 0, rawToFilteredRms: 0, timestampRejected: false,
        motionScore: 0, motionByGroup: {body: 0, wrist: 0, shape: 0, presence: 0},
        fingerMotionScore: 0,
        intentionalMotion: false, quiet: true,
      };
      ultimoModoSuavizado = webCameraState.smoothing;
    }

    function suavizarFrameWeb(frame, timestampMs) {
      if (!Array.isArray(frame) || frame.length !== kFrameDim) return null;
      if (webCameraState.smoothing !== ultimoModoSuavizado) {
        reiniciarFiltroWeb();
      }
      const t = Number(timestampMs);
      const confianza = typeof frameVivoQuality !== 'undefined' &&
          Number(frameVivoQuality) > 0
        ? Math.max(0, Math.min(1, Number(frameVivoQuality))) : 1;
      const result = responsiveRigFilter.filter(frame, t, confianza);
      if (!result) return null;
      filtroFrameWeb = result.frame;
      filtroTimestampWeb = Number.isFinite(t) ? t : 0;
      ultimoDiagnosticoFiltro = result.diagnostics;
      const calibration = adaptiveMotionCalibrator.update(
        frame, t, result.diagnostics.motionScore);
      responsiveRigFilter.setDeadbands(calibration.deadbands);
      webCameraState.calibrationState = calibration.state;
      webCameraState.bodyDeadband = calibration.deadbands.body;
      webCameraState.wristDeadband = calibration.deadbands.wrist;
      webCameraState.motionScore = Number(result.diagnostics.motionScore ?? 0);
      webCameraState.fingerMotionScore = Number(
        result.diagnostics.fingerMotionScore ?? 0);
      webCameraState.motionQuiet = result.diagnostics.quiet === true;
      if (result.diagnostics.timestampRejected) {
        guardarAudit({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(), stage: 'filter', joint: null,
          score: 0, severity: 'error', state: 'REJECTED',
          action: 'hold_last', code: 'stale_frame',
        });
      }
      if (!webCameraState.smoothing) return frame.slice();
      return result.frame.slice();
    }

    window.suavizarFrameWeb = suavizarFrameWeb;

    let colaFrames = [];
    let frameActual = 0;
    let reproduciendo = false;
    let kFps = 30; // tracking y replay usan 30 FPS; render sigue a 60 FPS.
    let frameVivo = null;
    let frameVivoTimestampMs = 0;
    let frameVivoQuality = 0;
    let frameVivoFrameId = 0;
    let frameVivoSourceFrameId = 0;
    let ultimoSourceFrameRenderizado = 0;
    let frameVivoSourceSkewMs = 0;
    // SignSpaceFrame v1 del frame vivo (independiente del cuerpo). Solo lo
    // usa resolverBrazo en modo de retarget 'anchors'; 152D sigue mandando.
    let signSpaceVivo = null;
    function filtrarSignSpace(frame, timestampMs) {
      if (!frame) return null;
      return webCameraState.smoothing === false
        ? frame : filtroSignSpace.filter(frame, timestampMs);
    }
    // Reloj local de recepcion. timestampMs puede venir de DateTime de Dart
    // (epoch) o de performance.now() web; no sirve para medir silencio entre
    // mensajes. Esto cubre tambien stream nativo detenido dentro de WebView.
    let frameVivoRecibidoAt = 0;
    let frameVivoExterno = false;
    let frameVivoStale = false;
    const kFrameStaleMs = 450;
    let filtroFrameWeb = null;
    let filtroTimestampWeb = 0;

    const kThumbCalibrationSteps = [
      {side: 'left', pose: 'open', text: 'Abre mano izquierda y extiende pulgar'},
      {side: 'left', pose: 'closed', text: 'Lleva pulgar izquierdo hacia palma'},
      {side: 'right', pose: 'open', text: 'Abre mano derecha y extiende pulgar'},
      {side: 'right', pose: 'closed', text: 'Lleva pulgar derecho hacia palma'},
    ];
    let thumbCalibrationSession = null;

    function medianValue(values) {
      const sorted = values.slice().sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[middle] :
        (sorted[middle - 1] + sorted[middle]) / 2;
    }

    function thumbPointsFromFrame(frame, side) {
      const presence = side === 'left' ? kOffPresL : kOffPresR;
      const offset = side === 'left' ? kOffShapeL : kOffShapeR;
      if (!Array.isArray(frame) || Number(frame[presence]) < .5) return null;
      return Array.from({length: 20}, (_, index) => [
        Number(frame[offset + index * 3]),
        Number(frame[offset + index * 3 + 1]),
        Number(frame[offset + index * 3 + 2]),
      ]);
    }

    function pintarPasoCalibracion(message = null) {
      const element = document.getElementById('diagCalibracion');
      if (!element) return;
      if (!thumbCalibrationSession) {
        element.textContent = message ?? 'Calibración inactiva';
        return;
      }
      const step = kThumbCalibrationSteps[thumbCalibrationSession.step];
      element.textContent = message ??
        `Paso ${thumbCalibrationSession.step + 1}/4: ${step.text}. ` +
        `${thumbCalibrationSession.samples.length}/20 estables`;
    }

    window.iniciarCalibracionPulgares = function () {
      window.configurarDiagnostico(true);
      thumbCalibrationSession = {step: 0, samples: [], measurements: {}};
      pintarPasoCalibracion();
      return true;
    };

    function resumenCalibracion(samples) {
      const distanceValues = samples.map((sample) => sample.distance);
      const angleValues = [0, 1, 2].map((index) =>
        samples.map((sample) => sample.angles[index]));
      const spreadDistance = Math.max(...distanceValues) - Math.min(...distanceValues);
      const spreadAngles = angleValues.map((values) =>
        Math.max(...values) - Math.min(...values));
      if (spreadDistance > .05 || spreadAngles.some((spread) => spread > .15)) {
        return null;
      }
      return {
        distance: medianValue(distanceValues),
        angles: angleValues.map(medianValue),
      };
    }

    function procesarCalibracionPulgares(frame, quality) {
      if (!thumbCalibrationSession) return;
      const step = kThumbCalibrationSteps[thumbCalibrationSession.step];
      const points = thumbPointsFromFrame(frame, step.side);
      if (!points || Number(quality) < .65) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion(`Paso ${thumbCalibrationSession.step + 1}/4: ` +
          `${step.text}. Tracking bajo; mantén pose y mano completa.`);
        return;
      }
      const measurement = measureThumbPose(points);
      if (!measurement) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion('Geometría de pulgar inválida; muestra mano completa.');

      if (thumbCalibrationSession.samples.length < 20) {
        pintarPasoCalibracion();
        return;
      }
      const summary = resumenCalibracion(thumbCalibrationSession.samples);
      if (!summary) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion('Movimiento detectado. Repite pose y mantenla estable.');
        return;
      }
      thumbCalibrationSession.measurements[`${step.side}_${step.pose}`] = summary;
      thumbCalibrationSession.step++;
      thumbCalibrationSession.samples = [];
      if (thumbCalibrationSession.step < kThumbCalibrationSteps.length) {
        pintarPasoCalibracion();
        return;
      }
      try {
        const measurements = thumbCalibrationSession.measurements;
        cal.thumbCalibration.left = createThumbCalibration(
          measurements.left_open, measurements.left_closed, Date.now());
        cal.thumbCalibration.right = createThumbCalibration(
          measurements.right_open, measurements.right_closed, Date.now());
        const wire = thumbCalibrationWire();
        if (standaloneWeb) {

        pintarPasoCalibracion('Calibración guardada para ambas manos.');

    // ---------------------------------------------------------------------
    // Cámara web + MediaPipe Tasks Vision

    // mismo RigBody que usa Flutter. detectForVideo es sincrono, asi que esta
    // unica rAF funciona como compuerta natural: tracking cerca de 30 FPS,

    // ---------------------------------------------------------------------
    let camaraStream = null;
    let poseLandmarkerWeb = null;
    let handLandmarkerWeb = null;
    // Captura del producto (docs/13): un solo HolisticLandmarker para cuerpo,
    // manos y cara. 'separado' (Pose + Hand) queda solo como respaldo
    // automatico si Holistic no carga, o para depurar con ?captura=separado.
    const kCapturaModos = ['separado', 'holistic'];

    try {
      const pedido = new URLSearchParams(location.search).get('captura');

    let holisticReintentando = false;

    // Con consentimiento (una vez), cada vez que se enciende la camara se

    // errores. Se manda al servidor local (tools/servidor_visor.py) y queda
    // tambien en memoria para exportarla desde el panel.
    const kConsentimientoKey = 'univoz.consentimientoSesion.v1';
    let sesionActual = null;
    let ultimaSesionLineas = null;
    let servidorSesionesOk = null;
    let sesionFlushTimer = null;
    // Puntos de cara que se guardan (la malla completa son 478).
    const kCaraClave = FACE_KEYPOINTS;
    function consentimientoSesion() {
      try { return localStorage.getItem(kConsentimientoKey) === 'si'; }
      catch (_) { return false; }
    }
    function pedirConsentimientoSesion() {
      if (consentimientoSesion()) return true;
      const ok = window.confirm('Para adaptar el avatar a tu cuerpo y mejorar ' +
        'la deteccion, cada vez que enciendas la camara se mediran tus ' +
        'proporciones y se registrara la sesion (puntos del cuerpo, manos y ' +
        'cara; nunca video ni imagenes). Se guarda solo en este equipo y ' +
        'puedes borrarlo con "Borrar mis datos". ¿Aceptas?');

    async function sinkSesion(id, lineas) {

        } catch (_) { servidorSesionesOk = false; }
      }
      if (!servidorSesionesOk) return false;
      try {
        const r = await fetch('/api/sesiones/' + encodeURIComponent(id), {
          // Sin keepalive: comparte cuota (~64 KB) con sendBeacon del cierre.
          method: 'POST', body: lineas.join('\n'),

          capture_mode: capturaModo,
          holistic_model: holisticLandmarkerWeb ? holisticModelo : null,
          holistic_cpu: holisticEnCpu,

    function eventoSesion(type, data) {

        {type: 'application/x-ndjson'});

      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = `sesion_${JSON.parse(lineas[0]).session_id}.jsonl`;

    }
    window.borrarMisDatos = function () {
      try { localStorage.removeItem(kConsentimientoKey); } catch (_) {}
      window.borrarPerfilCorporal();
      ultimaSesionLineas = null;
      void cerrarSesionAutomatica('consent_revoked');

    // Entrada de manos del ultimo frame (antes y despues de la compuerta).
    let ultimaEntradaManosWeb = null;

    // Centinela: frame saltado a proposito (no es un error de camara).
    const kSaltarFrameWeb = Symbol('saltar_frame');
    function caerHolisticACpu(error) {
      if (holisticEnCpu || holisticReintentando || !holisticCrear) throw error;
      holisticReintentando = true;
      avisar('Holistic GPU fallo; reintentando en CPU…');
      eventoSesion('holistic_gpu_failed', {
        error: String(error?.message ?? error).slice(0, 300)});
      const anterior = holisticLandmarkerWeb;
      holisticLandmarkerWeb = null;
      try { anterior?.close(); } catch (_) {}
      holisticCrear(false).then((tarea) => {
        holisticEnCpu = true;
        holisticLandmarkerWeb = tarea;
        avisar('Holistic en CPU');
      }).catch((e) => {
        avisar('Holistic no disponible: ' + (e?.message ?? e));
      }).finally(() => { holisticReintentando = false; });
    }
    // Ultima cara detectada por Holistic: {landmarks, blendshapes} o null.
    let caraVivo = null;
    let preloadedLandmarkersWeb = null;
    let detectorWarmupWeb = null;
    let camaraLoopId = 0;
    let camaraUltimoVideoTime = -1;
    let camaraUltimoTimestampMs = 0;
    let camaraFpsInicio = 0;
    let camaraFpsFrames = 0;
    let camaraInputQualityInicio = 0;
    let camaraInputQualityFrames = 0;
    let camaraInputQualityDropped = 0;
    const camaraTimings = {pose: [], hand: [], process: [], render: []};
    let renderFpsInicio = 0;
    let renderFpsFrames = 0;
    let camaraTrackingFpsFrames = 0;
    let camaraPoseFpsFrames = 0;
    let webCaptureFrameIndex = 0;
    let webPoseCache = null;
    let webGrabacion = [];
    let webUltimaSecuencia = null;
    // Perfil corporal (Fast User Capture). Local, versionado y borrable:
    // solo se guardan medianas, nunca video ni landmarks.
    let capturaPerfil = null;
    let perfilCorporal = null;
    try {
      perfilCorporal = parseBodyProfile(
        localStorage.getItem(BODY_PROFILE_STORAGE_KEY));
    } catch (_) { /* sin storage */ }
    window.obtenerPerfilCorporal = () => perfilCorporal;
    window.borrarPerfilCorporal = function () {
      perfilCorporal = null;
      capturaPerfil = null;
      try { localStorage.removeItem(BODY_PROFILE_STORAGE_KEY); } catch (_) {}
      pintarEstadoCamaraWeb();
      return true;
    };
    window.iniciarCapturaPerfil = function ({consent = false, declared = {},
        framesPerPhase = 45} = {}) {
      capturaPerfil = createBodyProfileCapture({declared, framesPerPhase});
      const estado = capturaPerfil.start({consent});
      avisar('Perfil corporal: ' + estado.instruction);
      pintarEstadoCamaraWeb();
      return estado;
    };
    function alimentarCapturaPerfil(pose, poseMundo) {
      if (!capturaPerfil) return;
      const previo = capturaPerfil.status();
      const antes = previo.phase;
      const estado = capturaPerfil.push(pose, poseMundo);
      if (estado.hint === 'arms_not_visible' && previo.hint !== estado.hint) {
        avisar('Perfil corporal: aléjate un poco, que se vean tus brazos');
      }
      if (estado.state === 'done') {
        // Nunca perder medidas buenas por una captura con brazos ocultos.

        capturaPerfil = null;
        try {
          localStorage.setItem(BODY_PROFILE_STORAGE_KEY,
            JSON.stringify(perfilCorporal));
