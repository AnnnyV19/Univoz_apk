<!DOCTYPE html>
<!--
  Visor del avatar VRM. Corre dentro de un WebView (webview_flutter), cargado
  como asset local de Flutter (avatar_bridge.dart). No es parte del proyecto
  npm de nadie: es una pagina suelta que importa three.js y three-vrm como
  modulos ES directamente desde un CDN.

  OJO: esto necesita internet la primera vez que se abre la pantalla del
  avatar (para bajar las librerias del CDN). Si el telefono lo abre offline
  la primera vez, el visor va a quedar en blanco. Una vez que el WebView las
  cachea puede que sigan andando offline, pero no esta garantizado. Si esto
  llega a ser un problema, la solucion es bajar three.module.js y
  three-vrm.module.js a mano y ponerlos en assets/avatar_viewer/lib/, y
  cambiar los imports de abajo por rutas locales.

  Como lo maneja Dart (ver avatar_bridge.dart):
    - Flutter llama a window.reproducirSecuencia(seqJson) con una lista de
      frames, cada uno un array de 152 numeros (el mismo formato que usa
      sign_norm.dart / dtw.dart para reconocer).
    - Esta pagina aplica frames al RigBody y renderiza el humanoid VRM a 60 FPS;
      el modo vivo suaviza solo la salida visual.
    - Cuando termina, llama a window.SenasChannel.postMessage('fin') para
      que Dart sepa que puede reproducir la siguiente palabra.
-->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    #lienzo { width: 100vw; height: 100vh; display: block; }
    #estado {
      position: fixed; left: 12px; right: 12px; top: 12px; z-index: 50;
      display: none; align-items: center; gap: 8px;
      font: 13px/1.4 sans-serif; color: #fff; background: #b00c;
      padding: 10px 12px; border-radius: 8px; box-shadow: 0 2px 8px #0006;
    }
    #estado span { flex: 1; }
    #estado button {
      border: 0; background: #fff; color: #b00; border-radius: 4px;
      font-size: 12px; font-weight: 700; padding: 6px 10px; cursor: pointer;
      white-space: nowrap;
    }
    #camaraPanel {
      display: none; position: fixed; left: 8px; bottom: 8px; z-index: 25;
      width: 250px; padding: 8px; color: #222; background: #fffefeee;
      border-radius: 8px; box-shadow: 0 1px 6px #0004;
      font: 11px/1.35 sans-serif;
    }
    #camaraVista {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      overflow: hidden; border-radius: 6px; background: #111;
    }
    #camaraVideo, #camaraOverlay {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    #camaraOverlay { pointer-events: none; }
    #camaraOverlay.diagnostico { pointer-events: auto; cursor: crosshair; }
    #camaraPanel .camaraCabecera {
      display: flex; justify-content: space-between; align-items: center;
      margin: 5px 0;
    }
    #camaraPanel .camaraEstado { color: #555; }
    #camaraPanel .camaraEstado.ok { color: #176b2c; }
    #camaraPanel .camaraEstado.error { color: #a00; }
    #camaraPanel .camaraBotones { display: flex; gap: 4px; }
    #camaraPanel button {
      flex: 1; border: 0; background: #e9e9ef; border-radius: 4px;

    #camaraPanel button:disabled { opacity: .55; cursor: wait; }
    #camaraStats { color: #555; margin-top: 5px; min-height: 15px; }
    #camaraPanel label { display: inline-flex; gap: 4px; align-items: center; }
    #camaraPanel .camaraAcciones { display: flex; gap: 4px; margin-top: 4px; }
    #diagnosticoPanel {

      width: 270px; padding: 8px; color: #222; background: #fffef5f2;

      font: 11px/1.35 sans-serif;

    #diagnosticoPanel.plegado .diagCuerpo { display: none; }

    #diagnosticoPanel button {
      border: 0; background: #e5e7eb; border-radius: 4px;

    }
    #diagnosticoPanel .diagBotones { display: flex; gap: 4px; margin-top: 6px; }
    #diagnosticoPanel .diagBotones button { flex: 1; }
    #diagCalibracion { margin-top: 6px; padding: 5px; border-radius: 4px; background: #eef3ff; }
    #diagErrores { max-height: 58px; overflow: auto; color: #9b1c1c; }
  </style>
</head>

  <script>
    // Diagnóstico temprano: imports de módulo ocurren antes de avisar().
    // Mostrar causa evita pantalla blanca muda en WebView/navegador. Este
    // visor necesita internet la primera vez que se abre (baja three.js y
    // three-vrm de un CDN — ver la nota grande al principio del archivo),
    // así que la causa más común de un fallo acá es simplemente que el
    // teléfono no tenía conexión en ese momento.
    (() => {
      const estado = document.getElementById('estado');
      const texto = document.getElementById('estadoTexto');
      const boton = document.getElementById('estadoReintentar');
      let yaMostrado = false;
      const mostrarFalloArranque = (mensaje) => {
        if (!estado || !texto || yaMostrado) return;
        yaMostrado = true;
        const sinInternet =
          typeof navigator !== 'undefined' && navigator.onLine === false;
        texto.textContent = sinInternet
          ? 'Sin conexión a internet: el avatar 3D necesita internet la ' +
            'primera vez que se abre para descargar sus archivos de ' +
            'animación. Conectate a wifi o datos móviles y volvé a intentar.'
          : 'No se pudo cargar un recurso necesario para el avatar 3D ' +
            '(' + (mensaje || 'recurso no cargado') + '). Revisá tu ' +
            'conexión a internet — puede que una red restringida o un ' +
            'firewall esté bloqueando la descarga — y volvé a intentar.';
        estado.style.display = 'flex';
      };
      if (boton) {
        boton.addEventListener('click', () => window.location.reload());
      }
      window.addEventListener('error', (evento) => {
        mostrarFalloArranque(evento.message || evento.error?.message || 'recurso no cargado');
      }, true);
      window.addEventListener('unhandledrejection', (evento) => {
        mostrarFalloArranque(evento.reason?.message || String(evento.reason || 'promesa rechazada'));
      });
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2/lib/three-vrm.module.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils, VRMHumanBoneName } from '@pixiv/three-vrm';
    // ---------------------------------------------------------------------
    // Los 5 modulos de abajo (rig_math, rig_metrics, rig_diagnostics,
    // rig_safety, rig_tracking) vivian en archivos .mjs separados,
    // importados con "import {...} from './rig_x.mjs'". Se inlinearon aca
    // porque Android carga esta pagina con loadFlutterAsset(), que la sirve
    // como 'file:///android_asset/flutter_assets/...' -- un origen "null"
    // segun el navegador. Por spec, un origen "null" no puede hacer fetch
    // cross-origin de un recurso file:// (ni siquiera uno relativo, en el
    // mismo directorio): el "import" de un archivo separado se bloqueaba
    // en silencio por CORS (visible en logcat como "Access to script at
    // 'file:///.../rig_math.mjs' from origin 'null' has been blocked by
    // CORS policy"), lo que hacia fallar TODO el <script type="module">
    // sin avisar nada visible: por eso nunca aparecia el avatar. Los
    // imports a 'three'/'three-vrm' (CDN, https://) no tenian este
    // problema porque https si es un esquema permitido para cross-origin
    // aunque el origen sea "null" -- por eso primero se sospecho de la
    // conexion a internet, pero el problema real era este.
    //
    // Cada modulo se envuelve en su propia funcion (como antes cada uno
    // vivia en su propio archivo/modulo) y solo expone hacia afuera los
    // mismos nombres que esta pagina ya importaba de el.
    // ---------------------------------------------------------------------
    // ---- inicio rig_math.mjs (antes importado por separado) ----
    const {chooseThumbBoneAxis, createFastFingerAngleFilter, createAdaptiveMotionCalibrator, createAdaptivePoseScheduler, createResponsiveRigFilter, createThumbCalibration, measureThumbPose, measureFingerLag, solveThumbPose} = (() => {
      const FRAME_DIM = 152;
      const OFF_LOC_LEFT = 24;
      const OFF_LOC_RIGHT = 27;
      const OFF_PRES_LEFT = 30;
      const OFF_PRES_RIGHT = 31;
      const OFF_SHAPE_LEFT = 32;
      const OFF_SHAPE_RIGHT = 92;

      const clamp = (value, min = 0, max = 1) =>
        Math.max(min, Math.min(max, Number(value)));
      const subtract = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const length = (v) => Math.hypot(v[0], v[1], v[2]);
      const unit = (v) => {
        const size = length(v);
        return size > 1e-8 ? v.map((x) => x / size) : null;
      };
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const angle = (a, b) => {
        const ua = unit(a), ub = unit(b);
        if (!ua || !ub) return NaN;
        return Math.acos(clamp(dot(ua, ub), -1, 1));
      };

      function measureThumbPose(points) {
        if (!Array.isArray(points) || points.length < 17) return null;
        const values = points.map((p) => Array.isArray(p)
          ? [Number(p[0]), Number(p[1]), Number(p[2])]
          : [Number(p?.x), Number(p?.y), Number(p?.z)]);
        if (values.some((p) => p.some((v) => !Number.isFinite(v)))) return null;
        const s0 = values[0];
        const s1 = subtract(values[1], values[0]);
        const s2 = subtract(values[2], values[1]);
        const s3 = subtract(values[3], values[2]);
        const angles = [angle(s0, s1), angle(s1, s2), angle(s2, s3)];
        const distance = length(subtract(values[3], values[8]));
        if (!Number.isFinite(distance) || angles.some((v) => !Number.isFinite(v))) {
          return null;
        }
        return {distance, angles};
      }

      function createThumbCalibration(open, closed, updatedAtMs = Date.now()) {
        if (!open || !closed || !Array.isArray(open.angles) ||
            !Array.isArray(closed.angles) || open.angles.length !== 3 ||
            closed.angles.length !== 3) {
          throw new TypeError('thumb calibration requires open and closed measurements');
        }
        if (!Number.isFinite(open.distance) || !Number.isFinite(closed.distance) ||
            Math.abs(open.distance - closed.distance) < .04) {
          throw new RangeError('thumb calibration poses are not distinct');
        }
        return {
          calibrated: true,
          openDistance: Number(open.distance),
          closedDistance: Number(closed.distance),
          openAngles: open.angles.map(Number),
          closedAngles: closed.angles.map(Number),
          updatedAtMs: Number(updatedAtMs) || 0,
        };
      }

      function progress(value, open, closed) {
        const span = closed - open;
        return Math.abs(span) < .03 ? null : clamp((value - open) / span);
      }

      function solveThumbPose(measurement, calibration) {
        if (!measurement || !calibration) {
          return {closure: 0, flexions: [0, 0, 0], calibrated: false};
        }
        const closure = progress(
          measurement.distance,
          Number(calibration.openDistance),
          Number(calibration.closedDistance),
        );
        const globalClosure = closure == null ? 0 : closure;
        const maxima = [.85, 1, .75];
        const flexions = maxima.map((maximum, index) => {
          const joint = progress(
            Number(measurement.angles?.[index]),
            Number(calibration.openAngles?.[index]),
            Number(calibration.closedAngles?.[index]),
          );
          const mixed = joint == null ? globalClosure :
            clamp(globalClosure * .65 + joint * .35);
          return mixed * maximum;
        });
        return {
          closure: globalClosure,
          flexions,
          calibrated: calibration.calibrated === true,
          distance: measurement.distance,
          angles: measurement.angles.slice(),
        };
      }

      function chooseThumbBoneAxis(beforeDistance, probes) {
        const before = Number(beforeDistance);
        if (!Number.isFinite(before) || !Array.isArray(probes)) return null;
        let best = null;
        for (const probe of probes) {
          if (!['x', 'y', 'z'].includes(probe?.axis) ||
              ![-1, 1].includes(Number(probe?.sign)) ||
              !Number.isFinite(Number(probe?.distance))) continue;
          const improvement = before - Number(probe.distance);
          if (!best || improvement > best.improvement) {
            best = {axis: probe.axis, sign: Number(probe.sign), improvement};
          }
        }
        if (!best || best.improvement <= 1e-5) return null;
        return {...best, improvement: Number(best.improvement.toFixed(12))};
      }

      function createHandAngleFilter(size = 15, options = {}) {
        const count = Math.max(3, Number(size) || 15);
        const settings = {
          minCutoff: Math.max(.1, Number(options.minCutoff ?? 5)),
          beta: Math.max(0, Number(options.beta ?? .25)),
          dCutoff: Math.max(.1, Number(options.dCutoff ?? 1)),
          intentionalAlpha: clamp(options.intentionalAlpha ?? .92),
          intentionalThreshold: Math.max(0, Number(
            options.intentionalThreshold ?? .08)),
          jumpLimit: Math.max(.1, Number(options.jumpLimit ?? 1.2)),
        };
        let previous = null;
        let previousRaw = null;
        let previousTime = 0;
        let filters = [];
        let histories = [];

        const reset = () => {
          previous = null;
          previousRaw = null;
          previousTime = 0;
          filters = [];
          histories = [];
        };

        const filter = (angles, timestampMs, quality = 1) => {
          if (!Array.isArray(angles) || angles.length !== count) return null;
          const input = angles.map((value) => Number(value));
          if (input.some((value) => !Number.isFinite(value))) return null;
          const t = Number(timestampMs);
          if (!previous || !Number.isFinite(t) || t < previousTime) {
            previous = input.slice();
            previousRaw = input.slice();
            previousTime = Number.isFinite(t) ? t : 0;
            filters = input.map(() => createOneEuroFilter(settings));
            histories = input.map((value) => [value]);
            return {angles: input.slice(), diagnostics: {
              madOutliers: [], jumpRejectedChains: [], delayMs: 0,
              rawToFilteredRms: 0,
            }};
          }
          if (t === previousTime) {
            return {angles: previous.slice(), diagnostics: {
              madOutliers: [], jumpRejectedChains: [], delayMs: 0,
              rawToFilteredRms: 0,
            }};
          }

          const dtMs = clamp(t - previousTime, 1, 200);
          const output = previous.slice();
          const madOutliers = [];
          const jumpRejectedChains = [];
          const delays = [];
          const chains = Math.ceil(count / 3);
          for (let chain = 0; chain < chains; chain++) {
            const start = chain * 3;
            const end = Math.min(count, start + 3);
            let maximumJump = 0;
            for (let i = start; i < end; i++) {
              maximumJump = Math.max(maximumJump, Math.abs(input[i] - previousRaw[i]));
            }
            if (maximumJump > settings.jumpLimit) {
              jumpRejectedChains.push(chain);
              continue;
            }
            for (let i = start; i < end; i++) {
              if (madState(histories[i], input[i])) madOutliers.push(i);
              histories[i].push(input[i]);
              if (histories[i].length > 5) histories[i].shift();
              const intentional = Math.abs(input[i] - previous[i]) >=
                settings.intentionalThreshold;
              output[i] = filters[i].filter(input[i], t, quality, intentional);
              const velocity = Math.abs(input[i] - previousRaw[i]) / (dtMs / 1000);
              if (velocity > .01) {
                delays.push(Math.min(500,
                  Math.abs(input[i] - output[i]) / velocity * 1000));
              }
            }
          }
          const error = output.reduce((sum, value, index) =>
            sum + (value - input[index]) ** 2, 0);
          previous = output;
          previousRaw = input;
          previousTime = t;
          return {angles: output.slice(), diagnostics: {
            madOutliers,
            jumpRejectedChains,
            delayMs: median(delays),
            rawToFilteredRms: Math.sqrt(error / count),
          }};
        };
        return {filter, reset};
      }

      /** Low-latency route for articulated finger angles. Shape XYZ stays raw. */
      function createFastFingerAngleFilter(size = 15) {
        return createHandAngleFilter(size, {
          minCutoff: 11,
          beta: .35,
          dCutoff: 1.5,
          intentionalAlpha: .98,
          intentionalThreshold: .045,
          jumpLimit: 1.6,
        });
      }

      /** t_avatar_90% - t_input_90%, deduplicated by source timestamp. */
      function measureFingerLag(samples, threshold = .9) {
        if (!Array.isArray(samples)) return 0;
        const unique = [];
        let lastTimestamp = null;
        for (const sample of samples) {
          const timestampMs = Number(sample?.timestampMs);
          if (!Number.isFinite(timestampMs) || timestampMs === lastTimestamp) continue;
          const input = Number(sample?.input);
          const avatar = Number(sample?.avatar);
          if (!Number.isFinite(input) || !Number.isFinite(avatar)) continue;
          unique.push({timestampMs, input, avatar});
          lastTimestamp = timestampMs;
        }
        const input90 = unique.find((sample) => sample.input >= threshold)?.timestampMs;
        const avatar90 = unique.find((sample) => sample.avatar >= threshold)?.timestampMs;
        return input90 == null || avatar90 == null ? 0 : avatar90 - input90;
      }

      function createOneEuroFilter({minCutoff, beta, dCutoff = 1, intentionalAlpha = 0}) {
        let initialized = false;
        let previous = 0;
        let previousRaw = 0;
        let previousVelocity = 0;
        let previousTime = 0;
        const alpha = (cutoff, dtMs) => {
          const dt = Math.max(1, dtMs) / 1000;
          const tau = 1 / (2 * Math.PI * Math.max(1e-6, cutoff));
          return 1 / (1 + tau / dt);
        };
        return {
          filter(value, timeMs, quality = 1, intentional = false) {
            const x = Number(value), t = Number(timeMs);
            if (!Number.isFinite(x) || !Number.isFinite(t)) return previous;
            if (!initialized) {
              initialized = true;
              previous = previousRaw = x;
              previousTime = t;
              return x;
            }
            const dtMs = clamp(t - previousTime, 1, 200);
            const rawVelocity = (x - previousRaw) / (dtMs / 1000);
            const derivativeAlpha = alpha(dCutoff, dtMs);
            const velocity = derivativeAlpha * rawVelocity +
              (1 - derivativeAlpha) * previousVelocity;
            const qualityFactor = .8 + .2 * clamp(quality);
            const cutoff = (minCutoff + beta * Math.abs(velocity)) * qualityFactor;
            const weight = Math.max(alpha(cutoff, dtMs),
              intentional ? intentionalAlpha : 0);
            const output = weight * x + (1 - weight) * previous;
            previous = output;
            previousRaw = x;
            previousVelocity = velocity;
            previousTime = t;
            return output;
          },
        };
      }

      function groupFor(index) {
        if (index === OFF_PRES_LEFT || index === OFF_PRES_RIGHT) return 'presence';
        if ((index >= OFF_LOC_LEFT && index < OFF_LOC_LEFT + 3) ||
            (index >= OFF_LOC_RIGHT && index < OFF_LOC_RIGHT + 3)) return 'wrist';
        if (index >= OFF_SHAPE_LEFT) return 'shape';
        return 'body';
      }

      function median(values) {
        if (!values.length) return 0;
        const sorted = values.slice().sort((a, b) => a - b);
        const middle = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[middle] :
          (sorted[middle - 1] + sorted[middle]) / 2;
      }

      function madState(history, value) {
        if (history.length < 4) return false;
        const center = median(history);
        const mad = median(history.map((x) => Math.abs(x - center)));
        const sigma = Math.max(1.4826 * mad, .005);
        return Math.abs(value - center) / sigma > 3.5;
      }

      function createResponsiveRigFilter(options = {}) {
        const configs = {
          body: {minCutoff: 1.5, beta: .05, jump: 1.0, intentional: .08, alpha: .72},
          wrist: {minCutoff: 3, beta: .12, jump: 1.0, intentional: .06, alpha: .85},
          shape: {minCutoff: 5, beta: .25, jump: 2.0, intentional: .08, alpha: .92},
        };
        const deadbands = {
          body: Math.max(0, Number(options.deadbands?.body ?? .003)),
          wrist: Math.max(0, Number(options.deadbands?.wrist ?? .004)),
          shape: Math.max(0, Number(options.deadbands?.shape ?? 0)),
          presence: 0,
        };
        let previous = null;
        let previousRaw = null;
        let previousTime = 0;
        let filters = [];
        let histories = [];
        let jumpStreak = [];

        const emptyMotion = () => ({
          motionScore: 0,
          fingerMotionScore: 0,

        const aa = bounds(a), bb = bounds(b);
        if (!aa || !bb) return 0;
        const width = Math.max(0, Math.min(aa.maxX, bb.maxX) - Math.max(aa.minX, bb.minX));
        const height = Math.max(0, Math.min(aa.maxY, bb.maxY) - Math.max(aa.minY, bb.minY));
        const intersection = width * height;
        const areaA = Math.max(1e-8, (aa.maxX - aa.minX) * (aa.maxY - aa.minY));
        const areaB = Math.max(1e-8, (bb.maxX - bb.minX) * (bb.maxY - bb.minY));
        return clamp(intersection / Math.min(areaA, areaB));
      }

      function detectHandContact(left, right, shoulderWidth) {
        const lw = xyz(left?.[0]), rw = xyz(right?.[0]);
        const width = Math.max(.05, Number(shoulderWidth) || .4);
        const wristRatio = finite(lw) && finite(rw) ? distance(lw, rw) / width : Infinity;
        const overlap = overlapRatio(left, right);
        return {
          active: wristRatio < .22 || overlap > .25,
          wristDistanceShoulders: Number.isFinite(wristRatio) ? wristRatio : null,
          boxOverlap: overlap,
        };
      }

      function classifySourceSkew(sourceSkewMs) {
        const skewMs = Math.abs(Number(sourceSkewMs));
        if (!Number.isFinite(skewMs)) return {mode: 'reject', skewMs: null};
        if (skewMs <= 50) return {mode: 'direct', skewMs};
        if (skewMs <= 120) return {mode: 'project', skewMs};
        return {mode: 'reject', skewMs};
      }

      function posePoint(pose, side, part, index) {
        return pose?.[`${side}${part}`] ?? pose?.[index] ?? null;
      }

      function normalizedVector(from, to) {
        const vector = {
          x: to.x - from.x, y: to.y - from.y, z: to.z - from.z,
        };
        const length = Math.hypot(vector.x, vector.y, vector.z);
        return length > 1e-8 ? {
          x: vector.x / length, y: vector.y / length, z: vector.z / length,
        } : null;
      }

      function armChainCost(candidate, side, pose, shoulderWidth) {
        const sideIndexes = side === 'left'
          ? {shoulder: 11, elbow: 13, wrist: 15}
          : {shoulder: 12, elbow: 14, wrist: 16};
        // Solo x/y de imagen, como LandmarkEngine.kt: la z de la pose es relativa
        // a la cadera (~-1.5 en munecas) y la de la mano relativa a su muneca (0);
        // mezclarlas hacia que la profundidad ruidosa decidiera el lado.
        const shoulder = xy(posePoint(pose, side, 'Shoulder', sideIndexes.shoulder));
        const elbow = xy(posePoint(pose, side, 'Elbow', sideIndexes.elbow));
        const expectedWrist = xy(posePoint(pose, side, 'Wrist', sideIndexes.wrist));
        const wrist = xy(candidate?.landmarks?.[0]);
        if (![shoulder, elbow, expectedWrist, wrist].every(finite)) return Infinity;

        const endpoint = distance(wrist, expectedWrist) / shoulderWidth;
        const expectedDirection = normalizedVector(shoulder, expectedWrist);
        const observedDirection = normalizedVector(shoulder, wrist);
        const direction = expectedDirection && observedDirection
          ? 1 - clamp((expectedDirection.x * observedDirection.x +
              expectedDirection.y * observedDirection.y +
              expectedDirection.z * observedDirection.z + 1) / 2)
          : .5;
        const expectedLower = distance(elbow, expectedWrist);
        const observedLower = distance(elbow, wrist);
        const chain = Math.abs(observedLower - expectedLower) / shoulderWidth;
        // Una muneca que la pose no ve es una estimacion (MediaPipe la inventa,
        // a veces encima de la otra mano): pesa menos que una visible.
        const visibility = Number(pose?.[`${side}WristVisibility`]);
        const unseen = Number.isFinite(visibility) ? (1 - clamp(visibility)) * .6 : 0;
        return endpoint + direction * .35 + chain * .20 + unseen;
      }

      /** Assigns complete hand detections to physical sides using pose arm chains. */
      function assignHandsByArmChain(rawCandidates, pose = {}) {
        const raw = Array.isArray(rawCandidates) ? rawCandidates : [];
        const valid = raw.map((candidate, index) => ({candidate, index})).filter(({candidate}) =>
          validHandLandmarks(candidate?.landmarks));
        const sideByIndex = Array(raw.length).fill(null);
        const leftShoulder = xyz(posePoint(pose, 'left', 'Shoulder', 11));
        const rightShoulder = xyz(posePoint(pose, 'right', 'Shoulder', 12));
        const shoulderWidth = Math.max(.05, Number(pose.shoulderWidth) ||
          (finite(leftShoulder) && finite(rightShoulder)
            ? distance(leftShoulder, rightShoulder) : .4));
        if (!valid.length || !finite(leftShoulder) || !finite(rightShoulder)) {
          return {sideByIndex, mode: 'fallback', costs: []};
        }

        const costs = valid.map(({candidate}) => ({
          left: armChainCost(candidate, 'left', pose, shoulderWidth),
          right: armChainCost(candidate, 'right', pose, shoulderWidth),
        }));
        const margin = Math.max(.06, shoulderWidth * .16);
        if (valid.length >= 2) {
          const normal = costs[0].left + costs[1].right;
          const crossed = costs[0].right + costs[1].left;
          if (Number.isFinite(normal) && Number.isFinite(crossed) &&
              Math.abs(normal - crossed) >= margin) {
            const leftIndex = normal < crossed ? 0 : 1;
            const rightIndex = leftIndex === 0 ? 1 : 0;
            sideByIndex[valid[leftIndex].index] = 'left';
            sideByIndex[valid[rightIndex].index] = 'right';
            return {sideByIndex, mode: 'pose_arm_chain', costs};
          }
        } else {
          const only = costs[0];
          if (Number.isFinite(only.left) && Number.isFinite(only.right) &&
              Math.abs(only.left - only.right) >= margin) {
            sideByIndex[valid[0].index] = only.left < only.right ? 'left' : 'right';
            return {sideByIndex, mode: 'pose_arm_chain', costs};
          }
        }
        return {sideByIndex, mode: 'ambiguous', costs};
      }

      /**
       * Resolves a candidate side only from the authoritative pose arm chain.
       * Handedness labels are not safe before that chain is available: front-camera
       * inputs can report the category in the opposite convention.
       */
      function resolveAnatomicalHandSide(assignment, index) {
        const side = assignment?.mode === 'pose_arm_chain'
          ? assignment.sideByIndex?.[index] ?? null
          : null;
        return {
          side,
          sideLocked: side != null,
          sideAmbiguous: side == null,
        };
      }

      function shouldRunPoseFrame(frameIndex, hasPose) {
        const index = Math.max(0, Math.floor(Number(frameIndex) || 0));
        return hasPose !== true || index % 2 === 0;
      }

      const kAssignmentConfirmFrames = 3;
      const kAssignmentAdvantage = .15;

      function gateAssignmentMode(currentMode, pendingMode, pendingCount,
        proposedMode, advantage) {
        if (!proposedMode) {
          return {mode: currentMode, pendingMode: null, pendingCount: 0, held: false};
        }
        if (!currentMode || proposedMode === currentMode) {
          return {mode: proposedMode, pendingMode: null, pendingCount: 0, held: false};
        }
        if (!Number.isFinite(advantage) || advantage < kAssignmentAdvantage) {
          return {mode: currentMode, pendingMode: null, pendingCount: 0, held: true};
        }
        const nextCount = pendingMode === proposedMode ? pendingCount + 1 : 1;
        if (nextCount < kAssignmentConfirmFrames) {
          return {mode: currentMode, pendingMode: proposedMode,
            pendingCount: nextCount, held: true};
        }
        return {mode: proposedMode, pendingMode: null, pendingCount: 0, held: false};
      }

      function emptyTrack(side) {
        return {
          side,
          sideLocked: false,
          state: 'LOST',
          landmarks: null,
          rawLandmarks: null,
          acceptedLandmarks: null,
          renderLandmarks: null,
          velocity: {x: 0, y: 0, z: 0},
          frame: null,
          surface: null,
          surfaceConfidence: 0,
          surfaceChanges: 0,
          pendingSurface: null,
          pendingSurfaceCount: 0,
          confidence: 0,
          lastSeenMs: null,
          hits: 0,
          pendingOrientationFrame: null,
          pendingOrientationCount: 0,
          pendingPosition: null,
          pendingPositionCount: 0,
          recoveryFrom: null,
          recoveryTarget: null,
          recoveryFrames: 0,
          lastRejectCode: null,
          lastEventCode: null,
        };
      }

      function expectedWrist(track, timestampMs) {
        const wrist = xyz(track.landmarks?.[0]);
        if (!finite(wrist) || track.lastSeenMs == null) return null;
        const dt = clamp((timestampMs - track.lastSeenMs) / 1000, 0, .3);
        return {
          x: wrist.x + track.velocity.x * dt,
          y: wrist.y + track.velocity.y * dt,
          z: wrist.z + track.velocity.z * dt,
        };
      }

      function handCandidateCost(track, candidate, pose, timestampMs, contact,
        ignoreSide = false) {
        if (!ignoreSide && candidate?.sideLocked === true && candidate.side &&
            candidate.side !== track.side) return Infinity;
        const wrist = xyz(candidate.landmarks?.[0]);
        if (!finite(wrist)) return Infinity;
        const width = Math.max(.05, Number(pose?.shoulderWidth) || .4);
        // Sin historial: muneca de la pose solo en x/y (su z es relativa a la
        // cadera y la de la mano a su propia muneca; no se comparan).
        const expected = expectedWrist(track, timestampMs) ?? xy(
          track.side === 'left' ? pose?.leftWrist : pose?.rightWrist);
        const position = finite(expected) ? clamp(distance(wrist, expected) / width) : .5;
        let velocity = .5;
        if (track.landmarks && track.lastSeenMs != null && timestampMs > track.lastSeenMs) {
          const previous = xyz(track.landmarks[0]);
          const dt = Math.max(.001, (timestampMs - track.lastSeenMs) / 1000);
          const observed = {
            x: (wrist.x - previous.x) / dt,
            y: (wrist.y - previous.y) / dt,
            z: (wrist.z - previous.z) / dt,
          };
          velocity = clamp(Math.hypot(
            observed.x - track.velocity.x,
            observed.y - track.velocity.y,
            observed.z - track.velocity.z,
          ) * .25);
        }
        const orientation = orientationDistance(
          track.frame, palmFrameV2(candidate.landmarks, candidate.side));
        // Antes de pose_arm_chain, handedness de MediaPipe puede venir invertido
        // con cámara frontal. No dejar que etiqueta contradiga continuidad.
        const stated = ignoreSide || candidate.sideAmbiguous === true
          ? '' : String(candidate.side ?? '').toLowerCase();
        const side = stated && stated !== track.side ? 1 : stated ? 0 : .5;
        const confidence = 1 - clamp(candidate.confidence ?? .5);
        const sideWeight = contact ? .02 : .10;
        return .45 * position + .20 * velocity + .20 * orientation +
          sideWeight * side + .05 * confidence;
      }

      function translatedLandmarks(landmarks, dx, dy, dz) {
        return landmarks.map((point) => {
          const value = xyz(point);
          return {...point, x: value.x + dx, y: value.y + dy, z: value.z + dz};
        });
      }

      function blendLandmarks(from, to, amount) {
        const alpha = clamp(amount);
        return to.map((point, index) => {
          const start = xyz(from?.[index] ?? point);
          const end = xyz(point);
          return {...point,
            x: start.x + (end.x - start.x) * alpha,
            y: start.y + (end.y - start.y) * alpha,
            z: start.z + (end.z - start.z) * alpha,
          };
        });
      }

      function boundedRenderLandmarks(landmarks, previous, maxStep) {
        if (!Array.isArray(previous) || !previous.length) return cloneLandmarks(landmarks);
        const target = xyz(landmarks[0]);
        const start = xyz(previous[0]);
        if (!finite(target) || !finite(start)) return cloneLandmarks(landmarks);
        const dx = target.x - start.x, dy = target.y - start.y, dz = target.z - start.z;
        const step = Math.hypot(dx, dy, dz);
        if (step <= maxStep || step <= 1e-8) return cloneLandmarks(landmarks);
        const scale = maxStep / step;
        return translatedLandmarks(landmarks, dx * (scale - 1), dy * (scale - 1), dz * (scale - 1));
      }

      function updateVisible(track, candidate, timestampMs, shoulderWidth) {
        track.rawLandmarks = validHandLandmarks(candidate?.landmarks)
          ? cloneLandmarks(candidate.landmarks) : null;
        if (track.lastSeenMs != null && timestampMs <= track.lastSeenMs) {
          track.lastRejectCode = 'stale_frame';
          return false;
        }
        const landmarks = cloneLandmarks(candidate.landmarks);
        const wrist = xyz(landmarks[0]);
        const previous = xyz(track.landmarks?.[0]);
        const previousRender = track.renderLandmarks ?? track.landmarks;
        const previousState = track.state;
        const previousRestBlend = track.restBlend ?? 0;
        const hadHistory = track.lastSeenMs != null;
        const frame = palmFrameV2(landmarks, candidate.side);
        if (!frame || !frame.normal) {
          track.lastRejectCode = 'hand_geometry_degenerate';
          return false;
        }
        const surface = classifyHandSurface(landmarks, track.side);
        if (surface.surface === 'ambiguous') {
          track.lastRejectCode = 'hand_surface_ambiguous';
          return false;
        }
        const surfaceChanged = track.surface && surface.surface !== track.surface;
        const transition = handSurfaceTransition(track.frame, frame, {
          shoulderWidth,
          wristDisplacement: finite(previous) ? distance(wrist, previous) : 0,
          pendingFrame: track.pendingOrientationFrame,
          pendingCount: track.pendingOrientationCount,
        });
        track.pendingOrientationFrame = transition.pendingFrame;
        track.pendingOrientationCount = transition.pendingCount;
        if (!transition.accepted) {
          if (surfaceChanged) {
            track.pendingSurface = surface.surface;
            track.pendingSurfaceCount = track.pendingSurface === surface.surface
              ? track.pendingSurfaceCount + 1 : 1;
          }
          track.lastRejectCode = 'hand_surface_flip';
          return false;
        }
        if (surfaceChanged) {
          const repeats = track.pendingSurface === surface.surface
            ? track.pendingSurfaceCount + 1 : 1;
          track.pendingSurface = surface.surface;
          track.pendingSurfaceCount = repeats;
          if (repeats < 2) {
            track.lastRejectCode = 'hand_surface_flip';
            return false;
          }
          track.pendingSurface = null;
          track.pendingSurfaceCount = 0;
          track.surfaceChanges++;
        } else {
          track.pendingSurface = null;
          track.pendingSurfaceCount = 0;
        }
        const dt = track.lastSeenMs != null && timestampMs > track.lastSeenMs
          ? Math.max(.001, (timestampMs - track.lastSeenMs) / 1000) : 0;
        const step = finite(previous) ? distance(wrist, previous) : 0;
        const predicted = expectedWrist(track, timestampMs);
        const predictionError = finite(predicted) ? distance(wrist, predicted) / shoulderWidth : 0;
        // Normal hand motion remains responsive. Large endpoint jumps require the
        // same endpoint twice, then render advances with a bounded step.
        const maxStep = Math.max(shoulderWidth * .04,
          (shoulderWidth * 3.0 + .8) * Math.min(.2, dt || 1 / 60));
        const positionJump = finite(previous) &&
          (step > maxStep || predictionError > .55);
        if (positionJump) {
          const repeats = track.pendingPosition &&
              distance(wrist, xyz(track.pendingPosition)) <= shoulderWidth * .10
            ? track.pendingPositionCount + 1 : 1;
          track.pendingPosition = {...wrist};
          track.pendingPositionCount = repeats;
          if (repeats < 2) {
            track.lastEventCode = 'hand_position_jump';
            track.lastRejectCode = 'hand_position_held';
            return false;
          }
          track.pendingPosition = null;
          track.pendingPositionCount = 0;
        } else {
          track.pendingPosition = null;
          track.pendingPositionCount = 0;
        }
        if (finite(previous) && track.lastSeenMs != null && timestampMs > track.lastSeenMs) {
          const measured = {
            x: (wrist.x - previous.x) / dt,
            y: (wrist.y - previous.y) / dt,
            z: (wrist.z - previous.z) / dt,
          };
          track.velocity = {
            x: measured.x * .65 + track.velocity.x * .35,
            y: measured.y * .65 + track.velocity.y * .35,
            z: measured.z * .65 + track.velocity.z * .35,
          };
        }
        track.landmarks = landmarks;
        track.acceptedLandmarks = landmarks;
        track.frame = frame;
        if (!track.surface || track.surface !== surface.surface) {
          track.surface = surface.surface;
          track.surfaceConfidence = surface.confidence;
        } else {
          track.surfaceConfidence = surface.confidence;
        }
        track.confidence = clamp(candidate.confidence ?? .5);
        track.sideLocked = candidate.sideLocked === true || track.sideLocked === true;
        track.lastSeenMs = timestampMs;
        track.hits++;
        track.state = track.hits >= 2 ? 'TRACKING' : 'TENTATIVE';
        track.detected = landmarks;
        const wasRecovering = (previousState === 'LOST' && hadHistory) ||
          previousRestBlend > 0 ||
          track.recoveryFrames > 0;
        if (wasRecovering) {
          if (track.recoveryFrames <= 0) {
            track.recoveryFrames = 3;
            track.recoveryFrom = previousRender ? cloneLandmarks(previousRender) : landmarks;
          }
          track.recoveryTarget = cloneLandmarks(landmarks);
          const progress = (4 - track.recoveryFrames) / 3;
          track.renderLandmarks = blendLandmarks(
            track.recoveryFrom, track.recoveryTarget, progress);
          track.recoveryFrames--;
          if (track.recoveryFrames <= 0) {
            track.renderLandmarks = cloneLandmarks(track.recoveryTarget);
            track.recoveryFrom = null;
            track.recoveryTarget = null;
          }
          track.lastEventCode = 'hand_recovered';
        } else {
          track.renderLandmarks = boundedRenderLandmarks(
            landmarks, previousRender, maxStep);
        }
        track.restBlend = 0;
        track.lastRejectCode = null;
        return true;
      }

      function updateHidden(track, timestampMs) {
        track.detected = null;
        if (!track.landmarks || track.lastSeenMs == null) {
          track.state = 'LOST';
          track.renderLandmarks = null;
          track.restBlend = 1;
          return;
        }
        const elapsed = Math.max(0, timestampMs - track.lastSeenMs);
        if (elapsed > 500) {
          track.state = 'LOST';
          track.renderLandmarks = null;
          track.restBlend = 1;
          return;
        }
        track.state = 'OCCLUDED';
        const predictMs = Math.min(300, elapsed);
        const dx = track.velocity.x * predictMs / 1000;
        const dy = track.velocity.y * predictMs / 1000;
        const dz = track.velocity.z * predictMs / 1000;
        track.renderLandmarks = track.landmarks.map((point) => ({
          ...point,
          x: Number(point.x ?? point[0]) + dx,
          y: Number(point.y ?? point[1]) + dy,
          z: Number(point.z ?? point[2] ?? 0) + dz,
        }));
        track.restBlend = elapsed <= 300 ? 0 : clamp((elapsed - 300) / 200);
      }

      function snapshot(track) {
        return {
          side: track.side,
          sideLocked: track.sideLocked,
          state: track.state,
          landmarks: track.landmarks,
          raw: track.rawLandmarks,
          accepted: track.acceptedLandmarks,
          detected: track.detected ?? null,
          renderLandmarks: track.renderLandmarks ?? null,
          render: track.renderLandmarks ?? null,
          velocity: {...track.velocity},
          palmFrame: track.frame,
          surface: track.surface,
          surfaceConfidence: track.surfaceConfidence,
          surfaceChanges: track.surfaceChanges,
          recoveryFrames: track.recoveryFrames,
          confidence: track.confidence,
          restBlend: track.restBlend ?? 0,
        };
      }

      function createHandTrackCoordinator() {
        const tracks = {left: emptyTrack('left'), right: emptyTrack('right')};
        let assignmentMode = null;
        let pendingAssignmentMode = null;
        let pendingAssignmentCount = 0;

        const reset = () => {
          tracks.left = emptyTrack('left');
          tracks.right = emptyTrack('right');
          assignmentMode = null;
          pendingAssignmentMode = null;
          pendingAssignmentCount = 0;
        };

        const update = (rawCandidates, pose = {}, timestampMs = 0) => {
          const t = Number(timestampMs) || 0;
          const raw = Array.isArray(rawCandidates) ? rawCandidates : [];
          const tooMany = raw.length > 2;
          const incomplete = raw.filter((candidate) =>
            Array.isArray(candidate?.landmarks) && candidate.landmarks.length !== 21);
          const invalid = raw.filter((candidate) =>
            Array.isArray(candidate?.landmarks) && candidate.landmarks.length === 21 &&
            !validHandLandmarks(candidate.landmarks));
          const malformed = raw.filter((candidate) =>
            candidate != null && !Array.isArray(candidate?.landmarks));
          const candidates = raw
            .filter((candidate) => validHandLandmarks(candidate?.landmarks))
            .slice(0, 2);
          const shoulderWidth = Math.max(.05, Number(pose?.shoulderWidth) || .4);
          const contactBefore = detectHandContact(
            candidates[0]?.landmarks, candidates[1]?.landmarks, shoulderWidth);
          const costs = candidates.map((candidate) => ({
            left: handCandidateCost(tracks.left, candidate, pose, t, contactBefore.active),
            right: handCandidateCost(tracks.right, candidate, pose, t, contactBefore.active),
          }));
          const assigned = {left: null, right: null};
          const assignedCosts = {left: null, right: null};
          let assignmentHysteresis = false;
          tracks.left.lastRejectCode = null;
          tracks.right.lastRejectCode = null;
          tracks.left.lastEventCode = null;
          tracks.right.lastEventCode = null;

          const canAssign = (candidate, cost) => cost <= .65 ||
            (candidate?.sideLocked === true && cost <= .95);
          if (candidates.length === 2) {
            const normal = costs[0].left + costs[1].right;
            const crossed = costs[0].right + costs[1].left;
            const margin = Math.max(.06, shoulderWidth * .16);
            const ambiguous = candidates.every((candidate) =>
              candidate?.sideAmbiguous === true) &&
              Number.isFinite(normal) && Number.isFinite(crossed) &&
              Math.abs(normal - crossed) < margin;
            if (!ambiguous) {
              // Pose arm-chain labels are authoritative only when they agree with
              // temporal continuity. A one-frame arm-chain glitch during a fast
              // crossing must not exchange physical hands in the avatar.
              const neutralCosts = candidates.map((candidate) => ({
                left: handCandidateCost(tracks.left,
                  {...candidate, side: null, sideLocked: false, sideAmbiguous: true},
                  pose, t, contactBefore.active, true),
                right: handCandidateCost(tracks.right,
                  {...candidate, side: null, sideLocked: false, sideAmbiguous: true},
                  pose, t, contactBefore.active, true),
              }));
              const temporalNormal = neutralCosts[0].left + neutralCosts[1].right;
              const temporalCrossed = neutralCosts[0].right + neutralCosts[1].left;
              const labelMode = Number.isFinite(normal) &&
                  (!Number.isFinite(crossed) || normal <= crossed)
                ? 'normal' : Number.isFinite(crossed) ? 'crossed' : null;
              const temporalMode = Number.isFinite(temporalNormal) &&
                  Number.isFinite(temporalCrossed) &&
                  Math.abs(temporalNormal - temporalCrossed) >= margin
                ? (temporalNormal <= temporalCrossed ? 'normal' : 'crossed') : null;
              let selectedMode = labelMode;
              // One paired frame already establishes positional identity. Waiting
              // for TRACKING state (second hit) leaves first fast crossing exposed.
              const established = tracks.left.hits >= 1 && tracks.right.hits >= 1;
              if (established && labelMode && temporalMode &&
                  labelMode !== temporalMode) {
                selectedMode = temporalMode;
                assignmentHysteresis = true;
              }
              const evidence = Math.abs(temporalNormal - temporalCrossed);
              // Gate only a proposed remap supported by both independent signals.
              // When label and temporal evidence disagree, temporal matching keeps
              // existing behavior; that disagreement is already reported as a
              // transient label contradiction, not a confirmed identity change.
              const gateCandidate = candidates.every((candidate) =>
                candidate?.sideLocked === true) && labelMode && temporalMode &&
                labelMode === temporalMode ? selectedMode : null;
              const gated = gateAssignmentMode(
                assignmentMode, pendingAssignmentMode, pendingAssignmentCount,
                gateCandidate, evidence,
              );
              if (gateCandidate) {
                selectedMode = gated.mode;
                pendingAssignmentMode = gated.pendingMode;
                pendingAssignmentCount = gated.pendingCount;
                assignmentHysteresis ||= gated.held;
              } else if (selectedMode === assignmentMode) {
                pendingAssignmentMode = null;
                pendingAssignmentCount = 0;
              }
              if (gateCandidate || !assignmentMode) {
                if (selectedMode) assignmentMode = selectedMode;
              }
              const pairs = selectedMode === 'normal'
                ? [['left', 0], ['right', 1]]
                : selectedMode === 'crossed'
                  ? [['left', 1], ['right', 0]] : [];
              for (const [side, index] of pairs) {
                const selectedCosts = selectedMode === labelMode ? costs : neutralCosts;
                if (canAssign(candidates[index], selectedCosts[index][side])) {
                  assigned[side] = candidates[index];
                  assignedCosts[side] = selectedCosts[index][side];
                }
              }
            }
          } else if (candidates.length === 1) {
            const side = costs[0].left <= costs[0].right ? 'left' : 'right';
            const margin = Math.max(.06, shoulderWidth * .16);
            const ambiguous = candidates[0]?.sideAmbiguous === true &&
              Math.abs(costs[0].left - costs[0].right) < margin;
            if (!ambiguous && canAssign(candidates[0], costs[0][side])) {
              assigned[side] = candidates[0];
              assignedCosts[side] = costs[0][side];
            }
          }

          for (const side of ['left', 'right']) {

    const {SIGN_SPACE_VERSION, SIGN_SPACE_DIM, SS, SS_CHEST, signSpaceFrame, parseSignSpaceFrame, parseSignSpaceSequence, createSignSpaceFilter} = (() => {

      const SIGN_SPACE_DIM = 35;

        L_SHOULDER: 11, R_SHOULDER: 12, L_ELBOW: 13, R_ELBOW: 14,
        L_WRIST: 15, R_WRIST: 16, L_PINKY: 17, R_PINKY: 18,

        OFF_HANDDIR_L: 24, OFF_HANDDIR_R: 27, OFF_CONTACT: 30,

              samples[`fore${side}`].push(fore);

            continue;

          if (n >= minSamples && ratio >= OK_RATIO) capability[limb] = 'ok';
          else if (n >= minSamples && ratio < SEEN_RATIO) capability[limb] = 'not_observed';
          else capability[limb] = 'partial';

        return {version: BODY_PROFILE_VERSION, samples: n, measures, rom, capability,

      /** Valida un perfil cargado de almacenamiento; null si no sirve. */
      function parseBodyProfile(raw) {

          const value = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (!value || value.version !== BODY_PROFILE_VERSION) return null;
          if (!value.measures || !value.capability) return null;
          return value;

      }

      const BODY_CAPTURE_PHASES = Object.freeze([
        {id: 'neutral', instruction: 'Quieto, brazos relajados a los lados'},
        {id: 'arms_forward', instruction: 'Estira los brazos al frente y muevelos despacio'},
        {id: 'hands', instruction: 'Abre y cierra las manos frente al pecho'},
      ]);

       * visibles). Sin consentimiento explicito no arranca. Al terminar estima el
       * perfil; nunca guarda los frames, solo el perfil resultante.
       */
      function createBodyProfileCapture({
        framesPerPhase = 45,
        maxFrames = 900,          // ~30 s a 30 FPS: luego termina con lo que haya
        declared = {},
        minVisibility = MIN_VISIBILITY,
      } = {}) {
        let state = 'idle';
        let phase = 0;
        let count = 0;
        let seen = 0;
        let frames = [];
        let profile = null;
        let hint = null;
        let complete = false;

        const status = () => ({
          state,
          phase: BODY_CAPTURE_PHASES[phase]?.id ?? null,
          instruction: BODY_CAPTURE_PHASES[phase]?.instruction ?? null,
          progress: state === 'done' ? 1 :
            (phase * framesPerPhase + count) / (BODY_CAPTURE_PHASES.length * framesPerPhase),
          // 'arms_not_visible': hay hombros pero ningun brazo completo en cuadro.
          hint,
          complete,
          profile,
        });

        const finish = () => {
          profile = estimateBodyProfile(frames, {declared,
            minSamples: Math.min(MIN_SAMPLES, framesPerPhase), minVisibility});
          frames = []; // no se conservan landmarks
          state = 'done';
          phase = Math.min(phase, BODY_CAPTURE_PHASES.length - 1);
          hint = null;
        };

        return {
          start({consent = false} = {}) {
            if (consent !== true) throw new Error('consentimiento requerido');
            state = 'capturing';
            phase = 0;
            count = 0;
            seen = 0;
            frames = [];
            profile = null;
            hint = null;
            complete = false;
            return status();
          },
          push(pose, world) {
            if (state !== 'capturing') return status();
            if (!Array.isArray(pose) || pose.length < 33 ||
                visibility(pose[I.L_SHOULDER]) < minVisibility ||
                visibility(pose[I.R_SHOULDER]) < minVisibility) return status();

            frames.push([pose, world]);

            // brazos no hay nada que medir de ellos (sesion 20261003T162413Z).
            const arm = (e, w) => visibility(pose[e]) >= minVisibility &&

              count += 1;
              if (count >= framesPerPhase) {
                phase += 1;
                count = 0;
                if (phase >= BODY_CAPTURE_PHASES.length) {
                  complete = true;
                  finish();

        if (!next?.measures) return previous;

          [...new Set([...Object.keys(a ?? {}), ...Object.keys(b ?? {})])]
            .map((k) => [k, b?.[k] ?? a?.[k] ?? null]));

        for (const [k, v] of Object.entries(declared)) capability[k] = v;

          rom: keep(previous.rom, next.rom), capability, declared};

    // ---- inicio rig_retarget.mjs (antes importado por separado) ----
    const {RETARGET_ANCHOR_NEAR, RETARGET_ANCHOR_FAR, createAvatarRigProfile, retargetArm, faceAnchorsFromEyes} = (() => {
      // Retargeter SignSpaceFrame -> avatar con proporciones propias.
      //
      // Lejos del cuerpo manda la DIRECCION de cada segmento del usuario aplicada
      // a los huesos del avatar (cinematica directa): un brazo largo o corto no
      // deforma la pose. Cerca de un ancla (nariz, boca, pecho) manda el LUGAR: la
      // palma se resuelve contra el ancla equivalente del avatar con el mismo
      // desplazamiento en anchos de hombro, para que tocar el menton siga siendo
      // tocar el menton. Entre ambos extremos se mezcla con smoothstep.
      //
      // Marco del cuerpo del avatar: origen en el centro de hombros, +x derecha
      // del personaje, +y arriba, +z al frente, en metros del avatar.

      // import {SS, SS_CHEST} from './rig_sign_space.mjs'; (nombres ya en ambito)

      const RETARGET_ANCHOR_NEAR = 0.25;
      const RETARGET_ANCHOR_FAR = 0.60;

      const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
      const len = (a) => Math.hypot(a[0], a[1], a[2]);
      const lerp = (a, b, t) => add(a, mul(sub(b, a), t));
      const slice3 = (v, off) => [v[off], v[off + 1], v[off + 2]];
      const smoothstep = (e0, e1, x) => {
        const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return t * t * (3 - 2 * t);
      };

      /**
       * Perfil del avatar en su marco del cuerpo. `shoulderL`/`shoulderR` y las
       * anclas en metros; si faltan anclas se usan proporciones humanas tipicas.
       */
      function createAvatarRigProfile({
        shoulderL, shoulderR, upperL, upperR, foreL, foreR,
        palmOffset = null, nose = null, mouth = null, chest = null,
      }) {
        const shoulderWidth = len(sub(shoulderR, shoulderL));
        if (!(shoulderWidth > 0)) throw new RangeError('avatar sin ancho de hombros');
        for (const [k, v] of Object.entries({upperL, upperR, foreL, foreR})) {
          if (!(v > 0)) throw new RangeError(`avatar sin largo ${k}`);
        }
        const sw = shoulderWidth;
        return {
          shoulderWidth: sw,
          shoulders: {L: shoulderL, R: shoulderR},
          upper: {L: upperL, R: upperR},
          fore: {L: foreL, R: foreR},
          palmOffset: palmOffset ?? 0.25 * sw,
          anchors: {
            nose: nose ?? [0, 0.62 * sw, 0.22 * sw],
            mouth: mouth ?? [0, 0.48 * sw, 0.20 * sw],
            chest: chest ?? mul(SS_CHEST, sw),
          },
        };
      }

      /**
       * @param frame SignSpaceFrame (de signSpaceFrame o de la biblioteca)
       * @param avatar perfil de createAvatarRigProfile
       * @param side 'L' | 'R'
       * @returns {{palm, wrist, elbow, anchor, anchorWeight}|null} null si el
       *   brazo no existe en el frame (mascara): el visor conserva su estado.
       */
      function retargetArm(frame, avatar, side) {
        if (!frame?.mask?.[`arm${side}`]) return null;
        const v = frame.values;
        const L = side === 'L';
        const upperDir = slice3(v, L ? SS.OFF_UPPER_L : SS.OFF_UPPER_R);
        const foreDir = slice3(v, L ? SS.OFF_FORE_L : SS.OFF_FORE_R);
        const hasHand = !!frame.mask[`hand${side}`];
        const handDir = hasHand ? slice3(v, L ? SS.OFF_HANDDIR_L : SS.OFF_HANDDIR_R)
          : foreDir;

        const shoulder = avatar.shoulders[side];
        const upper = avatar.upper[side];
        const fore = avatar.fore[side];
        const elbow = add(shoulder, mul(upperDir, upper));
        const wristFk = add(elbow, mul(foreDir, fore));
        const palmFk = add(wristFk, mul(handDir, avatar.palmOffset));

        let palm = palmFk;
        let anchor = null;
        let anchorWeight = 0;
        if (hasHand) {
          const palmUser = slice3(v, L ? SS.OFF_PALM_L : SS.OFF_PALM_R);
          const candidates = [['chest', SS_CHEST]];
          if (frame.mask.face) {
            candidates.push(['nose', slice3(v, SS.OFF_NOSE)],
              ['mouth', slice3(v, SS.OFF_MOUTH)]);
          }
          let best = null;
          for (const [name, userAnchor] of candidates) {
            const offset = sub(palmUser, userAnchor);
            const d = len(offset);
            if (!best || d < best.d) best = {name, offset, d};
          }
          anchorWeight = 1 - smoothstep(RETARGET_ANCHOR_NEAR, RETARGET_ANCHOR_FAR, best.d);
          if (anchorWeight > 0) {
            anchor = best.name;
            const palmAnchor = add(avatar.anchors[best.name],
              mul(best.offset, avatar.shoulderWidth));
            palm = lerp(palmFk, palmAnchor, anchorWeight);
          }
        }

        let wrist = sub(palm, mul(handDir, avatar.palmOffset));
        const reach = sub(wrist, shoulder);
        const maxReach = (upper + fore) * 0.999;
        if (len(reach) > maxReach) {
          wrist = add(shoulder, mul(reach, maxReach / len(reach)));
          palm = add(wrist, mul(handDir, avatar.palmOffset));
        }
        return {palm, wrist, elbow, anchor, anchorWeight};
      }

      /**
       * Anclas de la cara del avatar (marco del cuerpo del avatar) desde sus
       * huesos de ojos. Todo en coordenadas de mundo del visor; `right`, `up`,
       * `front` son los ejes del avatar. Las distancias faciales se escalan por la
       * distancia entre ojos (IPD), asi sirven para avatares realistas o
       * estilizados. null si faltan ojos o los ejes son degenerados.
       */
      function faceAnchorsFromEyes({shoulderMid, eyeL, eyeR, right, up, front}) {
        const pts = [shoulderMid, eyeL, eyeR, right, up, front];
        if (pts.some((p) => !Array.isArray(p) || p.length < 3 ||
            !p.every(Number.isFinite))) return null;
        const ipd = len(sub(eyeL, eyeR));
        if (!(ipd > 1e-4)) return null;
        const mid = mul(add(eyeL, eyeR), 0.5);
        const toBody = (p) => {
          const q = sub(p, shoulderMid);
          return [q[0] * right[0] + q[1] * right[1] + q[2] * right[2],
            q[0] * up[0] + q[1] * up[1] + q[2] * up[2],
            q[0] * front[0] + q[1] * front[1] + q[2] * front[2]];
        };
        const eyes = toBody(mid);
        // Proporciones faciales humanas en IPD: nariz ~0.6 bajo los ojos y ~0.5
        // al frente; boca ~1.15 bajo los ojos y ~0.4 al frente.
        return {
          nose: [eyes[0], eyes[1] - 0.6 * ipd, eyes[2] + 0.5 * ipd],
          mouth: [eyes[0], eyes[1] - 1.15 * ipd, eyes[2] + 0.4 * ipd],
        };
      }
      return {RETARGET_ANCHOR_NEAR, RETARGET_ANCHOR_FAR, createAvatarRigProfile, retargetArm, faceAnchorsFromEyes};
    })();
    // ---- fin rig_retarget.mjs ----

    // ---- inicio rig_mirror.mjs (antes importado por separado) ----
    const {mirrorMotionFrame, mirrorSignSpaceFrame} = (() => {
      // Vista espejo: el avatar se mueve como un reflejo del usuario (levantas la
      // derecha y se mueve el brazo del mismo lado de la pantalla). Solo para
      // verse a uno mismo; para traducir a otra persona el avatar NO se espeja.
      //
      // mirrorMotionFrame es espejo exacto de sign_norm.mirror_frame (Python) y
      // mirrorFrame (Dart): golden en test/golden/golden_cases.json.

      // import {SS, SIGN_SPACE_DIM} from './rig_sign_space.mjs'; (nombres ya en ambito)

      const MF_DIM = 152;
      const OFF_LOC_L = 24, OFF_LOC_R = 27, OFF_PRES_L = 30, OFF_PRES_R = 31;
      const OFF_SHAPE_L = 32, OFF_SHAPE_R = 92, HAND_PTS = 20;
      const BODY_PAIRS = [[0, 1], [2, 3], [4, 5], [6, 7]];

      function swapX(src, out, a, b) {
        out[a] = -src[b]; out[a + 1] = src[b + 1]; out[a + 2] = src[b + 2];
        out[b] = -src[a]; out[b + 1] = src[a + 1]; out[b + 2] = src[a + 2];
      }

      /** Espeja un MotionFrameV2 (152D). null si no tiene 152 valores. */
      function mirrorMotionFrame(v) {
        if (!Array.isArray(v) || v.length !== MF_DIM) return null;
        const out = new Array(MF_DIM).fill(0);
        for (const [a, b] of BODY_PAIRS) swapX(v, out, a * 3, b * 3);
        swapX(v, out, OFF_LOC_L, OFF_LOC_R);
        out[OFF_PRES_L] = v[OFF_PRES_R];
        out[OFF_PRES_R] = v[OFF_PRES_L];
        for (let j = 0; j < HAND_PTS; j++) {
          swapX(v, out, OFF_SHAPE_L + j * 3, OFF_SHAPE_R + j * 3);
        }
        return out;
      }

      /** Espeja un SignSpaceFrame: lados, eje x, contactos y mascara. */
      function mirrorSignSpaceFrame(frame) {
        if (!frame || !Array.isArray(frame.values) ||
            frame.values.length !== SIGN_SPACE_DIM) return null;
        const v = frame.values;
        const out = new Array(SIGN_SPACE_DIM).fill(0);
        for (const [a, b] of [[SS.OFF_UPPER_L, SS.OFF_UPPER_R],
          [SS.OFF_FORE_L, SS.OFF_FORE_R], [SS.OFF_PALM_L, SS.OFF_PALM_R],
          [SS.OFF_HANDDIR_L, SS.OFF_HANDDIR_R]]) swapX(v, out, a, b);
        for (const off of [SS.OFF_NOSE, SS.OFF_MOUTH]) {
          out[off] = -v[off]; out[off + 1] = v[off + 1]; out[off + 2] = v[off + 2];
        }
        const c = SS.OFF_CONTACT;
        out[c + SS.C_FACE_L] = v[c + SS.C_FACE_R];
        out[c + SS.C_FACE_R] = v[c + SS.C_FACE_L];
        out[c + SS.C_CHEST_L] = v[c + SS.C_CHEST_R];
        out[c + SS.C_CHEST_R] = v[c + SS.C_CHEST_L];
        out[c + SS.C_HANDS] = v[c + SS.C_HANDS];
        const m = frame.mask;
        const r = frame.reconstructed ?? {};
        return {...frame, values: out, mask: {armL: m.armR, armR: m.armL,
          handL: m.handR, handR: m.handL, face: m.face},
        reconstructed: {armL: r.armR === true, armR: r.armL === true}};
      }
      return {mirrorMotionFrame, mirrorSignSpaceFrame};
    })();
    // ---- fin rig_mirror.mjs ----

    // ---- inicio rig_holistic.mjs (antes importado por separado) ----
    const {HOLISTIC_MODEL_LOCAL, HOLISTIC_MODEL_URL, holisticToTaskResults} = (() => {

      // cuerpo, manos y cara (543 puntos), con manos ancladas a la pose y landmarks
      // metricos tambien para las manos.
      //
      // holisticToTaskResults traduce su resultado al MISMO formato que hoy
      // entregan PoseLandmarker + HandLandmarker por separado. Asi toda la cadena
      // existente (asignacion por cadena de brazo, filtros, 152D, SignSpace) queda
      // igual y solo cambia la fuente. Las etiquetas Left/Right de Holistic se
      // pasan como pista; el lado fisico lo sigue decidiendo assignHandsByArmChain.

      // Modelo oficial float16 (13.7 MB), empaquetado junto al visor para
      // funcionar sin red. La URL oficial queda como respaldo.
      const HOLISTIC_MODEL_LOCAL = 'holistic_landmarker.task';

        const poseWorld = first(result?.poseWorldLandmarks);

        const landmarks = [], worldLandmarks = [], handednesses = [];

          ['Left', result?.leftHandLandmarks, result?.leftHandWorldLandmarks],
          ['Right', result?.rightHandLandmarks, result?.rightHandWorldLandmarks],

          const hand = first(image);
          if (!hand) continue;
          landmarks.push(hand);
          worldLandmarks.push(first(world));
          handednesses.push([{categoryName: label, score: 1, index: label === 'Left' ? 0 : 1}]);

          landmarks: faceLandmarks,

    // ---- inicio rig_face.mjs (antes importado por separado) ----
    const {FACE_KEYPOINTS, faceFromKeypoints, FACE_IDX, headRotationFromFace, blendshapesToVrmExpressions, mirrorFaceSignals, expressionsFromFaceLandmarks} = (() => {
      // Cara del usuario -> avatar (FaceFrameV1, canal aparte de 152D).
      //
      // Los rasgos no manuales (cejas, boca, mirada, giro de cabeza) son parte de
      // la lengua de senas. Holistic entrega 478 puntos de cara y blendshapes; aqui
      // se traducen a expresiones VRM 1.0 y a un giro de cabeza.
      //
      // Convencion de la cabeza (vista de interlocutor): yaw > 0 = gira hacia SU
      // izquierda (la nariz va a la derecha de la imagen); pitch > 0 = mira arriba;
      // roll > 0 = inclina hacia su hombro derecho (lado izquierdo de la imagen).

      // Puntos clave que viajan desde Android (FACE_KEYPOINTS en Kotlin,
      // kFaceKeypoints en Dart). Cubren todo lo que usan las funciones de abajo.
      const FACE_KEYPOINTS = Object.freeze([1, 10, 152, 33, 133, 159, 145,
        263, 362, 386, 374, 13, 14, 61, 291, 105, 334]);

      /**
       * Reconstruye una malla dispersa (478 posiciones, solo las clave llenas)
       * desde los puntos clave [[x, y, z], ...] en el orden de FACE_KEYPOINTS.
       */
      function faceFromKeypoints(points) {
        if (!Array.isArray(points) || points.length !== FACE_KEYPOINTS.length) return null;
        const out = new Array(478).fill(null);
        for (let k = 0; k < FACE_KEYPOINTS.length; k++) {
          const p = points[k];
          if (!Array.isArray(p) || p.length < 3 || !p.every((v) => Number.isFinite(Number(v)))) {
            return null;
          }
          out[FACE_KEYPOINTS[k]] = {x: Number(p[0]), y: Number(p[1]), z: Number(p[2])};
        }
        return out;
      }

      const FACE_IDX = Object.freeze({
        NOSE_TIP: 1, FOREHEAD: 10, CHIN: 152,
        RIGHT_EYE_OUTER: 33, LEFT_EYE_OUTER: 263,
      });

      const clamp01 = (v) => Math.max(0, Math.min(1, Number(v) || 0));
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]];
      const unit = (a) => {
        const m = Math.hypot(a[0], a[1], a[2]);
        return m > 1e-9 ? [a[0] / m, a[1] / m, a[2] / m] : null;
      };

      /**
       * Giro de cabeza desde la malla facial en coordenadas de imagen.
       * [aspect] = ancho / alto del video (x y z vienen normalizados por el ancho).
       */
      function headRotationFromFace(landmarks, {aspect = 1} = {}) {
        if (!Array.isArray(landmarks) || landmarks.length < 264) return null;
        // imagen (x der, y abajo, z se aleja) -> camara (x der, y arriba, z hacia
        // la camara), x y z en las mismas unidades que y.
        const p = (i) => {
          const q = landmarks[i];
          return [Number(q?.x) * aspect, -Number(q?.y), -Number(q?.z) * aspect];
        };
        const ejeX = unit(sub(p(FACE_IDX.LEFT_EYE_OUTER), p(FACE_IDX.RIGHT_EYE_OUTER)));
        const arriba = sub(p(FACE_IDX.FOREHEAD), p(FACE_IDX.CHIN));
        if (!ejeX || ![...ejeX, ...arriba].every(Number.isFinite)) return null;
        const ejeY = unit(sub(arriba, ejeX.map((v) => v * dot(arriba, ejeX))));
        if (!ejeY) return null;
        const ejeZ = cross(ejeX, ejeY); // normal de la cara, hacia la camara
        // R = Ry(yaw) Rx(pitch) Rz(roll); columnas = ejeX, ejeY, ejeZ.
        const pitch = Math.asin(Math.max(-1, Math.min(1, ejeZ[1])));
        const yaw = Math.atan2(ejeZ[0], ejeZ[2]);
        const roll = Math.atan2(ejeX[1], ejeY[1]);
        return {yaw, pitch, roll};
      }

      /** Blendshapes de MediaPipe (ARKit) -> expresiones VRM 1.0 en [0, 1]. */
      function blendshapesToVrmExpressions(bs) {
        if (!bs || typeof bs !== 'object') return {};
        const g = (k) => clamp01(bs[k]);
        return {
          blinkLeft: g('eyeBlinkLeft'),
          blinkRight: g('eyeBlinkRight'),
          aa: g('jawOpen'),
          ou: Math.max(g('mouthPucker'), g('mouthFunnel')),
          ee: clamp01((g('mouthStretchLeft') + g('mouthStretchRight')) / 2),
          happy: clamp01((g('mouthSmileLeft') + g('mouthSmileRight')) / 2),
          angry: clamp01((g('browDownLeft') + g('browDownRight')) / 2),
          surprised: clamp01((g('browInnerUp') +
            (g('eyeWideLeft') + g('eyeWideRight')) / 2) / 2),
        };
      }

      /** Vista espejo: ojos intercambiados, yaw y roll invertidos. */
      function mirrorFaceSignals(expressions, head) {
        const e = {...expressions};
        if ('blinkLeft' in e || 'blinkRight' in e) {
          [e.blinkLeft, e.blinkRight] = [expressions.blinkRight, expressions.blinkLeft];
        }
        return {
          expressions: e,
          head: head ? {yaw: -head.yaw, pitch: head.pitch, roll: -head.roll} : null,
        };
      }

      // Indices de la malla facial de MediaPipe (478 puntos). "Derecho" = de la
      // persona.
      const EYE = {
        right: {outer: 33, inner: 133, top: 159, bottom: 145, brow: 105},
        left: {outer: 263, inner: 362, top: 386, bottom: 374, brow: 334},
      };
      const LIP_TOP = 13, LIP_BOTTOM = 14, MOUTH_RIGHT = 61, MOUTH_LEFT = 291;

      // Umbrales sobre proporciones de la propia cara (no dependen de distancia a
      // la camara). Aproximados para un adulto; ajustables tras prueba fisica.
      const EAR_OPEN = 0.25, EAR_CLOSED = 0.10;      // alto/ancho del ojo
      const JAW_FULL = 0.18;                          // labios / alto de cara
      const SMILE_NEUTRAL = 0.52, SMILE_FULL = 0.65;  // boca / ancho entre ojos
      const BROW_NEUTRAL = 0.22, BROW_FULL = 0.30;    // ceja-ojo / alto de cara

      /**
       * Expresiones VRM 1.0 desde la geometria de la malla facial. Funciona sin
       * blendshapes (el subgrafo de blendshapes de Holistic no corre en GPU
       * WebGL).
       */
      function expressionsFromFaceLandmarks(landmarks, {aspect = 1} = {}) {
        if (!Array.isArray(landmarks) || landmarks.length < 400) return {};
        const p = (i) => [Number(landmarks[i]?.x) * aspect, Number(landmarks[i]?.y)];
        const d = (a, b) => Math.hypot(p(a)[0] - p(b)[0], p(a)[1] - p(b)[1]);
        const alto = d(FACE_IDX.FOREHEAD, FACE_IDX.CHIN);
        const entreOjos = d(EYE.right.outer, EYE.left.outer);
        if (!(alto > 1e-6) || !(entreOjos > 1e-6)) return {};
        const lin = (v, a, b) => clamp01((v - a) / (b - a));
        const blink = (e) => lin(d(e.top, e.bottom) / Math.max(1e-6, d(e.outer, e.inner)),
          EAR_OPEN, EAR_CLOSED);
        const ceja = (d(EYE.right.brow, EYE.right.top) + d(EYE.left.brow, EYE.left.top)) /
          (2 * alto);
        return {
          blinkLeft: blink(EYE.left),
          blinkRight: blink(EYE.right),
          aa: lin(d(LIP_TOP, LIP_BOTTOM) / alto, 0, JAW_FULL),
          happy: lin(d(MOUTH_RIGHT, MOUTH_LEFT) / entreOjos, SMILE_NEUTRAL, SMILE_FULL),
          surprised: lin(ceja, BROW_NEUTRAL, BROW_FULL),
        };
      }
      return {FACE_KEYPOINTS, faceFromKeypoints, FACE_IDX, headRotationFromFace, blendshapesToVrmExpressions, mirrorFaceSignals, expressionsFromFaceLandmarks};
