org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=true
android.enableR8=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Compilacion incremental de Kotlin APAGADA a proposito.
#
# El proyecto vive en D: y la cache de paquetes de Flutter en
# C:\Users\...\AppData\Local\Pub\Cache. La cache incremental de Kotlin es
# "relocatable": guarda las rutas de los fuentes como rutas RELATIVAS a la
# raiz del proyecto. En Windows no existe una ruta relativa entre dos
# unidades distintas, asi que al intentar calcularla revienta con:
#
#   IllegalArgumentException: this and base files have different roots:
#   C:\...\Pub\Cache\hosted\pub.dev\flutter_tts-4.2.5\...
#   and D:\...\senas_core\android
#
# Eso deja las caches a medio cerrar, el demonio de Kotlin cae con
# "Daemon compilation failed: null", y la compilacion termina sin generar
# el .apk. El error de arriba aparece cientos de veces en el log y ninguna
# de sus lineas menciona que el problema sean las unidades distintas.
#
# Apagar el incremental cuesta que los modulos Kotlin se recompilen enteros
# cada vez. En este proyecto son pocos y chicos, asi que la diferencia es
# de segundos.
#
# La alternativa, si algun dia molesta: mover la cache de paquetes a la
# misma unidad que el proyecto, con la variable de entorno
# PUB_CACHE=D:\pub-cache y despues 'flutter pub get'. Eso ataca la causa y
# permite volver a activar el incremental.
kotlin.incremental=false
