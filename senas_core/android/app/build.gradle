plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.univoz.senas_app"
    // Compilar contra 36 aunque targetSdk siga en 34: es compatible hacia
    // atras y es lo que pide Gradle cuando algun plugin ya se compila
    // contra 36. No cambia el comportamiento en el telefono.
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // Fixtures compartidos con node, Dart y Python (paridad_manos, golden).
        test.resources.srcDirs += '../../test/golden'
    }

    defaultConfig {
        applicationId "com.univoz.senas_app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Leer los fixtures JSON en JUnit (org.json de android.jar es un stub).
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // Flutter
    implementation 'com.google.guava:guava:30.1-android'
    
    // MediaPipe
    // tasks 1.0.0 declara protobuf-javalite pero llama Any.Builder.build()
    // con la firma de protobuf-java: con javalite, crear Holistic tira
    // NoSuchMethodError y la app se cierra (MediaPipeProtobufTest).
    // protobuf-java trae tambien el runtime lite de sus protos.
    implementation('com.google.mediapipe:tasks-vision:1.0.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
    }
    implementation 'com.google.protobuf:protobuf-java:4.26.1'
    
    // CameraX
    implementation 'androidx.camera:camera-core:1.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-process:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-common:2.6.1'
}
