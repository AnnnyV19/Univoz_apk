<!DOCTYPE html>
<!--
  Visor del avatar VRM. Corre dentro de un WebView (webview_flutter), cargado
  como asset local de Flutter (avatar_bridge.dart). No es parte del proyecto
  npm de nadie: es una pagina suelta que importa three.js y three-vrm como
  modulos ES directamente desde un CDN.

  OJO: esto necesita internet la primera vez que se abre la pantalla del
  avatar (para bajar las librerias del CDN). Si el telefono lo abre offline
  la primera vez, el visor va a quedar en blanco. Una vez que el WebView las
  cachea puede que sigan andando offline, pero no esta garantizado. Si esto
  llega a ser un problema, la solucion es bajar three.module.js y
  three-vrm.module.js a mano y ponerlos en assets/avatar_viewer/lib/, y
  cambiar los imports de abajo por rutas locales.

  Como lo maneja Dart (ver avatar_bridge.dart):
    - Flutter llama a window.reproducirSecuencia(seqJson) con una lista de
      frames, cada uno un array de 152 numeros (el mismo formato que usa
      sign_norm.dart / dtw.dart para reconocer).
    - Esta pagina aplica frames al RigBody y renderiza el humanoid VRM a 60 FPS;
      el modo vivo suaviza solo la salida visual.
    - Cuando termina, llama a window.SenasChannel.postMessage('fin') para
      que Dart sepa que puede reproducir la siguiente palabra.
-->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    #lienzo { width: 100vw; height: 100vh; display: block; }
    #estado {
      position: fixed; left: 12px; right: 12px; top: 12px; z-index: 50;
      display: none; align-items: center; gap: 8px;
      font: 13px/1.4 sans-serif; color: #fff; background: #b00c;
      padding: 10px 12px; border-radius: 8px; box-shadow: 0 2px 8px #0006;
    }
    #estado span { flex: 1; }
    #estado button {
      border: 0; background: #fff; color: #b00; border-radius: 4px;
      font-size: 12px; font-weight: 700; padding: 6px 10px; cursor: pointer;
      white-space: nowrap;
    }
    #camaraPanel {
      display: none; position: fixed; left: 8px; bottom: 8px; z-index: 25;
      width: 250px; padding: 8px; color: #222; background: #fffefeee;
      border-radius: 8px; box-shadow: 0 1px 6px #0004;
      font: 11px/1.35 sans-serif;
    }
    #camaraVista {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      overflow: hidden; border-radius: 6px; background: #111;
    }
    #camaraVideo, #camaraOverlay {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    #camaraOverlay { pointer-events: none; }
    #camaraOverlay.diagnostico { pointer-events: auto; cursor: crosshair; }
    #camaraPanel .camaraCabecera {
      display: flex; justify-content: space-between; align-items: center;
      margin: 5px 0;
    }
    #camaraPanel .camaraEstado { color: #555; }
    #camaraPanel .camaraEstado.ok { color: #176b2c; }
    #camaraPanel .camaraEstado.error { color: #a00; }
    #camaraPanel .camaraBotones { display: flex; gap: 4px; }
    #camaraPanel button {
      flex: 1; border: 0; background: #e9e9ef; border-radius: 4px;
      font-size: 10px; padding: 5px 3px; cursor: pointer;
    }
    #camaraPanel button:disabled { opacity: .55; cursor: wait; }
    #camaraStats { color: #555; margin-top: 5px; min-height: 15px; }
    #camaraPanel label { display: inline-flex; gap: 4px; align-items: center; }
    #camaraPanel .camaraAcciones { display: flex; gap: 4px; margin-top: 4px; }
    #diagnosticoPanel {
      display: none; position: fixed; left: 8px; top: 8px; z-index: 30;
      width: 270px; padding: 8px; color: #222; background: #fffef5f2;
      border-radius: 8px; box-shadow: 0 1px 7px #0005;
      font: 11px/1.35 sans-serif;
    }
    #diagnosticoPanel.plegado .diagCuerpo { display: none; }
    #diagnosticoPanel header { display: flex; justify-content: space-between; }
    #diagnosticoPanel button {
      border: 0; background: #e5e7eb; border-radius: 4px;
      font-size: 10px; padding: 5px; cursor: pointer;
    }
    #diagnosticoPanel .diagBotones { display: flex; gap: 4px; margin-top: 6px; }
    #diagnosticoPanel .diagBotones button { flex: 1; }
    #diagCalibracion { margin-top: 6px; padding: 5px; border-radius: 4px; background: #eef3ff; }
    #diagErrores { max-height: 58px; overflow: auto; color: #9b1c1c; }
  </style>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <div id="estado">
    <span id="estadoTexto"></span>
    <button id="estadoReintentar" type="button">Reintentar</button>
  </div>

  <section id="camaraPanel" aria-label="Cámara MediaPipe web">
    <div id="camaraVista">
      <video id="camaraVideo" autoplay muted playsinline></video>
      <canvas id="camaraOverlay"></canvas>
    </div>
    <div class="camaraCabecera">
      <b>MediaPipe web</b>
      <span id="camaraEstado" class="camaraEstado">Apagada</span>
    </div>
    <div class="camaraBotones">
      <button id="bIniciarCamara" type="button">Iniciar cámara</button>
      <button id="bDetenerCamara" type="button" disabled>Detener</button>

    </div>
    <label><input id="camaraSuavizar" type="checkbox" checked> Suavizar movimiento</label>

    <label><input id="camaraDiagnostico" type="checkbox"> Modo diagnóstico</label>

  </section>

  <section id="diagnosticoPanel" aria-label="Diagnóstico RigBody">
    <header><b>Diagnóstico RigBody</b><button id="bPlegarDiag" type="button">–</button></header>
    <div class="diagCuerpo">
      <div id="diagStats">Sin captura</div>
      <div id="diagThumbs">Pulgares: —</div>
      <div id="diagErrores">Sin errores</div>
      <div id="diagCalibracion">Calibración inactiva</div>
      <div class="diagBotones">
        <button id="bCapturarDiag" type="button">Capturar</button>
        <button id="bLimpiarDiag" type="button">Limpiar</button>
        <button id="bExportarDiag" type="button">Exportar</button>
      </div>
      <div class="diagBotones">
        <button id="bCalibrarPulgares" type="button">Calibrar pulgares</button>
      </div>
    </div>
  </section>

  <script>
    // Diagnóstico temprano: imports de módulo ocurren antes de avisar().
    // Mostrar causa evita pantalla blanca muda en WebView/navegador. Este
    // visor necesita internet la primera vez que se abre (baja three.js y
    // three-vrm de un CDN — ver la nota grande al principio del archivo),
    // así que la causa más común de un fallo acá es simplemente que el
    // teléfono no tenía conexión en ese momento.
    (() => {
      const estado = document.getElementById('estado');
      const texto = document.getElementById('estadoTexto');
      const boton = document.getElementById('estadoReintentar');
      let yaMostrado = false;
      const mostrarFalloArranque = (mensaje) => {
        if (!estado || !texto || yaMostrado) return;
        yaMostrado = true;
        const sinInternet =
          typeof navigator !== 'undefined' && navigator.onLine === false;
        texto.textContent = sinInternet
          ? 'Sin conexión a internet: el avatar 3D necesita internet la ' +
            'primera vez que se abre para descargar sus archivos de ' +
            'animación. Conectate a wifi o datos móviles y volvé a intentar.'
          : 'No se pudo cargar un recurso necesario para el avatar 3D ' +
            '(' + (mensaje || 'recurso no cargado') + '). Revisá tu ' +
            'conexión a internet — puede que una red restringida o un ' +
            'firewall esté bloqueando la descarga — y volvé a intentar.';
        estado.style.display = 'flex';
      };
      if (boton) {
        boton.addEventListener('click', () => window.location.reload());
      }
      window.addEventListener('error', (evento) => {
        mostrarFalloArranque(evento.message || evento.error?.message || 'recurso no cargado');
      }, true);
      window.addEventListener('unhandledrejection', (evento) => {
        mostrarFalloArranque(evento.reason?.message || String(evento.reason || 'promesa rechazada'));
      });
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2/lib/three-vrm.module.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils, VRMHumanBoneName } from '@pixiv/three-vrm';
    // ---------------------------------------------------------------------
    // Los 5 modulos de abajo (rig_math, rig_metrics, rig_diagnostics,
    // rig_safety, rig_tracking) vivian en archivos .mjs separados,
    // importados con "import {...} from './rig_x.mjs'". Se inlinearon aca
    // porque Android carga esta pagina con loadFlutterAsset(), que la sirve
    // como 'file:///android_asset/flutter_assets/...' -- un origen "null"
    // segun el navegador. Por spec, un origen "null" no puede hacer fetch
    // cross-origin de un recurso file:// (ni siquiera uno relativo, en el
    // mismo directorio): el "import" de un archivo separado se bloqueaba
    // en silencio por CORS (visible en logcat como "Access to script at
    // 'file:///.../rig_math.mjs' from origin 'null' has been blocked by
    // CORS policy"), lo que hacia fallar TODO el <script type="module">
    // sin avisar nada visible: por eso nunca aparecia el avatar. Los
    // imports a 'three'/'three-vrm' (CDN, https://) no tenian este
    // problema porque https si es un esquema permitido para cross-origin
    // aunque el origen sea "null" -- por eso primero se sospecho de la
    // conexion a internet, pero el problema real era este.
    //
    // Cada modulo se envuelve en su propia funcion (como antes cada uno
    // vivia en su propio archivo/modulo) y solo expone hacia afuera los
    // mismos nombres que esta pagina ya importaba de el.
    // ---------------------------------------------------------------------
    // ---- inicio rig_math.mjs (antes importado por separado) ----
    const {chooseThumbBoneAxis, createFastFingerAngleFilter, createAdaptiveMotionCalibrator, createAdaptivePoseScheduler, createResponsiveRigFilter, createThumbCalibration, measureThumbPose, measureFingerLag, solveThumbPose} = (() => {
      const FRAME_DIM = 152;
      const OFF_LOC_LEFT = 24;
      const OFF_LOC_RIGHT = 27;
      const OFF_PRES_LEFT = 30;
      const OFF_PRES_RIGHT = 31;
      const OFF_SHAPE_LEFT = 32;
      const OFF_SHAPE_RIGHT = 92;

      const clamp = (value, min = 0, max = 1) =>
        Math.max(min, Math.min(max, Number(value)));
      const subtract = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const length = (v) => Math.hypot(v[0], v[1], v[2]);
      const unit = (v) => {
        const size = length(v);
        return size > 1e-8 ? v.map((x) => x / size) : null;
      };
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const angle = (a, b) => {
        const ua = unit(a), ub = unit(b);
        if (!ua || !ub) return NaN;
        return Math.acos(clamp(dot(ua, ub), -1, 1));
      };

      function measureThumbPose(points) {
        if (!Array.isArray(points) || points.length < 17) return null;
        const values = points.map((p) => Array.isArray(p)
          ? [Number(p[0]), Number(p[1]), Number(p[2])]
          : [Number(p?.x), Number(p?.y), Number(p?.z)]);
        if (values.some((p) => p.some((v) => !Number.isFinite(v)))) return null;
        const s0 = values[0];
        const s1 = subtract(values[1], values[0]);
        const s2 = subtract(values[2], values[1]);
        const s3 = subtract(values[3], values[2]);
        const angles = [angle(s0, s1), angle(s1, s2), angle(s2, s3)];
        const distance = length(subtract(values[3], values[8]));
        if (!Number.isFinite(distance) || angles.some((v) => !Number.isFinite(v))) {
          return null;
        }
        return {distance, angles};
      }

      function createThumbCalibration(open, closed, updatedAtMs = Date.now()) {
        if (!open || !closed || !Array.isArray(open.angles) ||
            !Array.isArray(closed.angles) || open.angles.length !== 3 ||
            closed.angles.length !== 3) {
          throw new TypeError('thumb calibration requires open and closed measurements');
        }
        if (!Number.isFinite(open.distance) || !Number.isFinite(closed.distance) ||
            Math.abs(open.distance - closed.distance) < .04) {
          throw new RangeError('thumb calibration poses are not distinct');
        }
        return {
          calibrated: true,
          openDistance: Number(open.distance),
          closedDistance: Number(closed.distance),
          openAngles: open.angles.map(Number),
          closedAngles: closed.angles.map(Number),
          updatedAtMs: Number(updatedAtMs) || 0,
        };
      }

      function progress(value, open, closed) {
        const span = closed - open;
        return Math.abs(span) < .03 ? null : clamp((value - open) / span);
      }

      function solveThumbPose(measurement, calibration) {
        if (!measurement || !calibration) {
          return {closure: 0, flexions: [0, 0, 0], calibrated: false};
        }
        const closure = progress(
          measurement.distance,
          Number(calibration.openDistance),
          Number(calibration.closedDistance),
        );
        const globalClosure = closure == null ? 0 : closure;
        const maxima = [.85, 1, .75];
        const flexions = maxima.map((maximum, index) => {
          const joint = progress(
            Number(measurement.angles?.[index]),
            Number(calibration.openAngles?.[index]),
            Number(calibration.closedAngles?.[index]),
          );
          const mixed = joint == null ? globalClosure :
            clamp(globalClosure * .65 + joint * .35);
          return mixed * maximum;
        });
        return {
          closure: globalClosure,
          flexions,
          calibrated: calibration.calibrated === true,
          distance: measurement.distance,
          angles: measurement.angles.slice(),
        };
      }

      function chooseThumbBoneAxis(beforeDistance, probes) {
        const before = Number(beforeDistance);
        if (!Number.isFinite(before) || !Array.isArray(probes)) return null;
        let best = null;
        for (const probe of probes) {
          if (!['x', 'y', 'z'].includes(probe?.axis) ||
              ![-1, 1].includes(Number(probe?.sign)) ||
              !Number.isFinite(Number(probe?.distance))) continue;
          const improvement = before - Number(probe.distance);
          if (!best || improvement > best.improvement) {
            best = {axis: probe.axis, sign: Number(probe.sign), improvement};
          }
        }
        if (!best || best.improvement <= 1e-5) return null;
        return {...best, improvement: Number(best.improvement.toFixed(12))};
      }

      function createHandAngleFilter(size = 15, options = {}) {
        const count = Math.max(3, Number(size) || 15);
        const settings = {
          minCutoff: Math.max(.1, Number(options.minCutoff ?? 5)),
          beta: Math.max(0, Number(options.beta ?? .25)),
          dCutoff: Math.max(.1, Number(options.dCutoff ?? 1)),
          intentionalAlpha: clamp(options.intentionalAlpha ?? .92),
          intentionalThreshold: Math.max(0, Number(
            options.intentionalThreshold ?? .08)),
          jumpLimit: Math.max(.1, Number(options.jumpLimit ?? 1.2)),
        };
        let previous = null;
        let previousRaw = null;
        let previousTime = 0;
        let filters = [];
        let histories = [];

        const reset = () => {
          previous = null;
          previousRaw = null;
          previousTime = 0;
          filters = [];
          histories = [];
        };

        const filter = (angles, timestampMs, quality = 1) => {
          if (!Array.isArray(angles) || angles.length !== count) return null;
          const input = angles.map((value) => Number(value));
          if (input.some((value) => !Number.isFinite(value))) return null;
          const t = Number(timestampMs);
          if (!previous || !Number.isFinite(t) || t < previousTime) {
            previous = input.slice();
            previousRaw = input.slice();
            previousTime = Number.isFinite(t) ? t : 0;
            filters = input.map(() => createOneEuroFilter(settings));
            histories = input.map((value) => [value]);
            return {angles: input.slice(), diagnostics: {
              madOutliers: [], jumpRejectedChains: [], delayMs: 0,
              rawToFilteredRms: 0,
            }};
          }
          if (t === previousTime) {
            return {angles: previous.slice(), diagnostics: {
              madOutliers: [], jumpRejectedChains: [], delayMs: 0,
              rawToFilteredRms: 0,
            }};
          }

          const dtMs = clamp(t - previousTime, 1, 200);
          const output = previous.slice();
          const madOutliers = [];
          const jumpRejectedChains = [];
          const delays = [];
          const chains = Math.ceil(count / 3);
          for (let chain = 0; chain < chains; chain++) {
            const start = chain * 3;
            const end = Math.min(count, start + 3);
            let maximumJump = 0;
            for (let i = start; i < end; i++) {
              maximumJump = Math.max(maximumJump, Math.abs(input[i] - previousRaw[i]));
            }
            if (maximumJump > settings.jumpLimit) {
              jumpRejectedChains.push(chain);
              continue;
            }
            for (let i = start; i < end; i++) {
              if (madState(histories[i], input[i])) madOutliers.push(i);
              histories[i].push(input[i]);
              if (histories[i].length > 5) histories[i].shift();
              const intentional = Math.abs(input[i] - previous[i]) >=
                settings.intentionalThreshold;
              output[i] = filters[i].filter(input[i], t, quality, intentional);
              const velocity = Math.abs(input[i] - previousRaw[i]) / (dtMs / 1000);
              if (velocity > .01) {
                delays.push(Math.min(500,
                  Math.abs(input[i] - output[i]) / velocity * 1000));
              }
            }
          }
          const error = output.reduce((sum, value, index) =>
            sum + (value - input[index]) ** 2, 0);
          previous = output;
          previousRaw = input;
          previousTime = t;
          return {angles: output.slice(), diagnostics: {
            madOutliers,
            jumpRejectedChains,
            delayMs: median(delays),
            rawToFilteredRms: Math.sqrt(error / count),
          }};
        };
        return {filter, reset};
      }

      /** Low-latency route for articulated finger angles. Shape XYZ stays raw. */
      function createFastFingerAngleFilter(size = 15) {
        return createHandAngleFilter(size, {
          minCutoff: 11,
          beta: .35,
          dCutoff: 1.5,
          intentionalAlpha: .98,
          intentionalThreshold: .045,
          jumpLimit: 1.6,
        });
      }

      /** t_avatar_90% - t_input_90%, deduplicated by source timestamp. */
      function measureFingerLag(samples, threshold = .9) {
        if (!Array.isArray(samples)) return 0;
        const unique = [];
        let lastTimestamp = null;
        for (const sample of samples) {
          const timestampMs = Number(sample?.timestampMs);
          if (!Number.isFinite(timestampMs) || timestampMs === lastTimestamp) continue;
          const input = Number(sample?.input);
          const avatar = Number(sample?.avatar);
          if (!Number.isFinite(input) || !Number.isFinite(avatar)) continue;
          unique.push({timestampMs, input, avatar});
          lastTimestamp = timestampMs;
        }
        const input90 = unique.find((sample) => sample.input >= threshold)?.timestampMs;
        const avatar90 = unique.find((sample) => sample.avatar >= threshold)?.timestampMs;
        return input90 == null || avatar90 == null ? 0 : avatar90 - input90;
      }

      function createOneEuroFilter({minCutoff, beta, dCutoff = 1, intentionalAlpha = 0}) {
        let initialized = false;
        let previous = 0;
        let previousRaw = 0;
        let previousVelocity = 0;
        let previousTime = 0;
        const alpha = (cutoff, dtMs) => {
          const dt = Math.max(1, dtMs) / 1000;
          const tau = 1 / (2 * Math.PI * Math.max(1e-6, cutoff));
          return 1 / (1 + tau / dt);
        };
        return {
          filter(value, timeMs, quality = 1, intentional = false) {
            const x = Number(value), t = Number(timeMs);
            if (!Number.isFinite(x) || !Number.isFinite(t)) return previous;
            if (!initialized) {
              initialized = true;
              previous = previousRaw = x;
              previousTime = t;
              return x;
            }
            const dtMs = clamp(t - previousTime, 1, 200);
            const rawVelocity = (x - previousRaw) / (dtMs / 1000);
            const derivativeAlpha = alpha(dCutoff, dtMs);
            const velocity = derivativeAlpha * rawVelocity +
              (1 - derivativeAlpha) * previousVelocity;
            const qualityFactor = .8 + .2 * clamp(quality);
            const cutoff = (minCutoff + beta * Math.abs(velocity)) * qualityFactor;
            const weight = Math.max(alpha(cutoff, dtMs),
              intentional ? intentionalAlpha : 0);
            const output = weight * x + (1 - weight) * previous;
            previous = output;
            previousRaw = x;
            previousVelocity = velocity;
            previousTime = t;
            return output;
          },
        };
      }

      function groupFor(index) {
        if (index === OFF_PRES_LEFT || index === OFF_PRES_RIGHT) return 'presence';
        if ((index >= OFF_LOC_LEFT && index < OFF_LOC_LEFT + 3) ||
            (index >= OFF_LOC_RIGHT && index < OFF_LOC_RIGHT + 3)) return 'wrist';
        if (index >= OFF_SHAPE_LEFT) return 'shape';
        return 'body';
      }

      function median(values) {
        if (!values.length) return 0;
        const sorted = values.slice().sort((a, b) => a - b);
        const middle = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[middle] :
          (sorted[middle - 1] + sorted[middle]) / 2;
      }

      function madState(history, value) {
        if (history.length < 4) return false;
        const center = median(history);
        const mad = median(history.map((x) => Math.abs(x - center)));
        const sigma = Math.max(1.4826 * mad, .005);
        return Math.abs(value - center) / sigma > 3.5;
      }

      function createResponsiveRigFilter(options = {}) {
        const configs = {
          body: {minCutoff: 1.5, beta: .05, jump: 1.0, intentional: .08, alpha: .72},
          wrist: {minCutoff: 3, beta: .12, jump: 1.0, intentional: .06, alpha: .85},
          shape: {minCutoff: 5, beta: .25, jump: 2.0, intentional: .08, alpha: .92},
        };
        const deadbands = {
          body: Math.max(0, Number(options.deadbands?.body ?? .003)),
          wrist: Math.max(0, Number(options.deadbands?.wrist ?? .004)),
          shape: Math.max(0, Number(options.deadbands?.shape ?? 0)),
          presence: 0,
        };
        let previous = null;
        let previousRaw = null;
        let previousTime = 0;
        let filters = [];
        let histories = [];
        let jumpStreak = [];

        const emptyMotion = () => ({
          motionScore: 0,
          fingerMotionScore: 0,
          motionByGroup: {body: 0, wrist: 0, shape: 0, presence: 0},
          intentionalMotion: false,
          quiet: true,
        });
        const motionDiagnostics = (frame) => {
          if (!previousRaw) return emptyMotion();
          const sums = {body: 0, wrist: 0, shape: 0, presence: 0};
          const thresholds = {
            body: Math.max(deadbands.body * 2, configs.body.intentional),
            wrist: Math.max(deadbands.wrist * 2, configs.wrist.intentional),
            shape: configs.shape.intentional,
            presence: .5,
          };
          for (let i = 0; i < FRAME_DIM; i++) {
            const group = groupFor(i);
            const delta = Math.abs(Number(frame[i]) - previousRaw[i]);

    let diagnosticErrors = [];
    let diagnosticOverlayPoints = [];

    function guardarAudit(event) {
      const timestampMs = Number(event.timestampMs) || performance.now();
      const key = `${event.stage}:${event.joint ?? ''}:${event.code ?? ''}`;
      const previo = ultimoAuditEmitido.get(key);
      // Evita que una misma anomalía de 54 huesos consuma ventana completa;
      // conserva como máximo cuatro muestras por segundo y unión/código.
      if (event.code && previo != null && timestampMs - previo < 250) return;
      ultimoAuditEmitido.set(key, timestampMs);
      rigAudit.record(createAuditSnapshot({...event, timestampMs}));
    }

    function errorDiagnostico(stage, code, side = null, landmark = null,
        status = 'red') {
      const error = diagnosticError(stage, code, side, landmark);
      diagnosticErrors.push(error);
      if (Number.isInteger(landmark)) {
        diagnosticPointIssues.push({stage, code, side, landmark, status});
      }
      webCameraState.validation = code;
      guardarAudit({
        frame: frameVivoFrameId + 1,
        timestampMs: Number(frameVivoTimestampMs) || performance.now(),
        stage,
        joint: side ? `${side}:${landmark ?? 'hand'}` : null,
        score: 0,
        severity: status === 'yellow' ? 'warn' : 'error',
        state: 'REJECTED',
        action: 'drop_frame',
        code,
      });
      return error;
    }

    function registrarAuditSafety(event) {
      // Estado VALID no necesita un registro por hueso y consumiría la
      // ventana de 45 s en menos de dos segundos (54 huesos x 30 FPS).
      // Guardar anomalías y recuperaciones conserva señal útil sin video.
      if (!event.code && event.action === 'apply') return;
      guardarAudit({
        frame: event.frame,
        timestampMs: event.timestampMs ?? performance.now(),
        stage: event.stage,
        joint: event.joint,
        score: event.score,
        severity: event.severity,
        state: event.state,
        action: event.action,
        code: event.code,
      });
    }

    // Limite de velocidad angular de la compuerta: 24 rad/s en vivo (frena los
    // saltos del detector); 40 rad/s al reproducir una seña grabada, ya sin
    // huecos ni ruido, para que un gesto rapido legitimo no se congele.
    const kVelGateVivo = 24;
    const kVelGateReplay = 40;
    let velocidadMaxGate = kVelGateVivo;
    // Con direccion 3D cada falange tambien gira de lado y el pulgar tiene dos
    // grados mas por hueso: un gesto legitimo de dedos (cerrar la R, juntar la
    // pinza de la O) recorre mas angulo por cuadro que una sola flexion. Medido
    // con las plantillas reales, con el limite original la compuerta congelaba
    // ~3 veces mas dedos que con el metodo anterior; con x1.6 congela lo mismo
    // o menos que el metodo anterior con su limite original.
    const kFactorGateDedos = 1.6;
    const velocidadGateDe = (jointId, base) =>
      /:(Thumb|Index|Middle|Ring|Little):/.test(String(jointId))
        ? base * kFactorGateDedos : base;
    function fijarVelocidadGates(valor) {
      velocidadMaxGate = valor;
      for (const [jointId, gate] of rigSafetyGates.entries()) {
        gate.setMaxAngularVelocity(velocidadGateDe(jointId, valor));
      }
    }

    function safetyGateFor(jointId) {
      if (!rigSafetyGates.has(jointId)) {
        rigSafetyGates.set(jointId, createRigSafetyGate({
          maxAgeMs: 500,
          maxSourceSkewMs: 120,
          maxAngularVelocityRadS: velocidadGateDe(jointId, velocidadMaxGate),
          recoveryFrames: 3,
          jointLimits: {
            min: [-Math.PI, -Math.PI, -Math.PI],
            max: [Math.PI, Math.PI, Math.PI],
          },
          onAudit: registrarAuditSafety,
        }));
      }
      return rigSafetyGates.get(jointId);
    }

    function resetSafetyGates() {
      for (const gate of rigSafetyGates.values()) gate.reset();
    }

    function thumbCalibrationWire() {
      const one = (value) => ({
        calibrated: value?.calibrated === true,
        open_distance: Number(value?.openDistance),
        closed_distance: Number(value?.closedDistance),
        open_angles: value?.openAngles?.map(Number) ?? [],
        closed_angles: value?.closedAngles?.map(Number) ?? [],
        updated_at_ms: Number(value?.updatedAtMs) || 0,
      });
      return {
        left: one(cal.thumbCalibration.left),
        right: one(cal.thumbCalibration.right),
      };
    }

    function rigCalibrationWire() {
      return {version: 2, thumb_calibration: thumbCalibrationWire()};
    }

    function pintarDiagnostico() {
      const panel = document.getElementById('diagnosticoPanel');
      if (!panel) return;
      panel.style.display = diagnosticoActivo ? 'block' : 'none';
      const stats = document.getElementById('diagStats');
      const thumbs = document.getElementById('diagThumbs');
      const errores = document.getElementById('diagErrores');
      const capturar = document.getElementById('bCapturarDiag');
      const audit = rigAudit.report();
      if (stats) stats.textContent =
        `entrada ${webCameraState.inputFps || 0}/${webCameraState.captureFps || 0} · ` +
        `track ${webCameraState.trackingFps || 0} · pose ${webCameraState.poseFps || 0} · ` +
        `render ${webCameraState.renderFps || 0} FPS · ` +
        `M ${Number(webCameraState.motionScore ?? 0).toFixed(2)} · ` +
        `dedos ${Number(webCameraState.fingerMotionScore ?? 0).toFixed(2)} · ` +
        `${webCameraState.motionQuiet ? 'quieto' : 'movimiento'} · ` +
        `P/H ${webCameraState.poseP95Ms.toFixed(1)}/${webCameraState.handP95Ms.toFixed(1)} ms · ` +
        `proc p95 ${webCameraState.processP95Ms.toFixed(1)} ms · ` +
        `L ${webCameraState.latencyP50Ms.toFixed(1)}/` +
        `${webCameraState.latencyP95Ms.toFixed(1)}/` +
        `${webCameraState.latencyP99Ms.toFixed(1)} ms · ` +
        `drop ${webCameraState.framesSkipped || 0} · ` +
        `Q ${Math.round(webCameraState.quality * 100)}% · ` +
        `delay ${Number(ultimoDiagnosticoFiltro?.delayMs ?? 0).toFixed(1)} ms · ` +
        `deadband ${ultimoDiagnosticoFiltro?.deadbandHeld ?? 0} · ` +
        `fingerLag ${Math.max(
          ultimoDiagnosticoAngulos.left?.fingerLagMs ?? 0,
          ultimoDiagnosticoAngulos.right?.fingerLagMs ?? 0).toFixed(1)} ms · ` +
        `skew ${Number(ultimoSourceMeta?.source_skew_ms ?? 0).toFixed(0)} ms · ` +
        `cal ${webCameraState.calibrationState} ${Number(webCameraState.bodyDeadband).toFixed(4)}/` +
        `${Number(webCameraState.wristDeadband).toFixed(4)} · stride ${webCameraState.poseStride} · ` +
        `surf ${webCameraState.leftSurface}/${webCameraState.rightSurface} · ` +
        `holds/swaps ${webCameraState.handHolds}/${webCameraState.handSwaps} · ` +
        `${ultimoTrackingWeb?.contact?.active ? 'contacto' : 'separadas'} · ` +
        `health ${Math.round(audit.summary.health_score)}% · ` +
        `${rigDiagnostics.frames.length}/300 · audit ${audit.summary.events_total}`;
      if (thumbs) {
        const texto = (lado) => {
          const estado = rigThumbState[lado];
          const marca = cal.thumbCalibration[lado]?.calibrated ? '✓' : '!';
          return `${marca}${lado === 'left' ? 'I' : 'D'} ` +
            (estado ? `${Math.round(estado.closure * 100)}%` : '—');
        };
        thumbs.textContent = `Pulgares: ${texto('left')} · ${texto('right')}`;
      }
      if (errores) errores.textContent = diagnosticErrors.length
        ? diagnosticErrors.slice(-4).map((e) =>
          `${e.stage}:${e.code}${e.side ? ':' + e.side : ''}` +
          `${Number.isInteger(e.landmark) ? ':' + e.landmark : ''}`).join(' · ')
        : 'Sin errores';
      if (capturar) capturar.textContent = diagnosticoCapturando ? 'Detener' : 'Capturar';
    }

    window.configurarDiagnostico = function (activo) {
      diagnosticoActivo = activo === true || activo === 'true';
      if (!diagnosticoActivo) diagnosticoCapturando = false;
      rigDiagnostics.setEnabled(diagnosticoActivo && diagnosticoCapturando);
      const overlay = document.getElementById('camaraOverlay');
      if (overlay) overlay.classList.toggle('diagnostico', diagnosticoActivo);
      pintarDiagnostico();
    };

    window.obtenerReporteDiagnostico = function () {
      const report = rigDiagnostics.report(
        rigCalibrationWire(), rigAudit.report());
      report.performance = webPerformanceMetrics.snapshot();
      return JSON.stringify(report);
    };

    function alternarCapturaDiagnostico() {
      diagnosticoCapturando = !diagnosticoCapturando;
      rigDiagnostics.setEnabled(diagnosticoCapturando);
      pintarDiagnostico();
    }

    function exportarDiagnostico() {
      const json = window.obtenerReporteDiagnostico();
      if (!standaloneWeb && window.SenasChannel) {
        window.SenasChannel.postMessage('diagnostic_report:' + json);
        return;
      }
      const blob = new Blob([json], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = `rig_diagnostic_${Date.now()}.json`;
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function registrarDiagnostico(raw, filtered, timestampMs, quality,
        sourceMeta = null) {
      if (!diagnosticoCapturando) return;
      const errors = diagnosticErrors.slice();
      if (!cal.thumbCalibration.left.calibrated) {
        errors.push(diagnosticError('thumb', 'thumb_uncalibrated', 'left'));
      }
      if (!cal.thumbCalibration.right.calibrated) {
        errors.push(diagnosticError('thumb', 'thumb_uncalibrated', 'right'));
      }
      rigDiagnostics.record({
        t: Number(timestampMs), quality: Number(quality) || 0,
        pose_t: Number(sourceMeta?.pose_t ?? timestampMs),
        hands_t: Number(sourceMeta?.hands_t ?? timestampMs),
        source_skew_ms: Number(sourceMeta?.source_skew_ms ?? 0),
        raw_frame: raw?.slice() ?? null,
        render_frame: filtered?.slice() ?? null,
        filtered_frame: filtered?.slice() ?? null,
        point_issues: diagnosticPointIssues.slice(),
        thumb: {
          left: rigThumbState.left ? {...rigThumbState.left} : null,
          right: rigThumbState.right ? {...rigThumbState.right} : null,
        },
        filter: {
          delay_ms: Number(ultimoDiagnosticoFiltro?.delayMs ?? 0),
          finger_lag_ms: Math.max(
            ultimoDiagnosticoAngulos.left?.fingerLagMs ?? 0,
            ultimoDiagnosticoAngulos.right?.fingerLagMs ?? 0),
          raw_to_filtered_rms: Number(ultimoDiagnosticoFiltro?.rawToFilteredRms ?? 0),
          mad_outliers: ultimoDiagnosticoFiltro?.madOutliers?.slice() ?? [],
          mad_repaired: ultimoDiagnosticoFiltro?.madRepaired?.slice() ?? [],
          jump_rejected: [
            ...(ultimoDiagnosticoFiltro?.jumpRejected?.slice() ?? []),
            ...(ultimoDiagnosticoAngulos.left?.jumpRejectedChains ?? []).map(
              (chain) => `left:${chain}`),
            ...(ultimoDiagnosticoAngulos.right?.jumpRejectedChains ?? []).map(
              (chain) => `right:${chain}`),
          ],
        },
        tracks: sourceMeta?.tracks ?? ultimoTrackingWeb ? {
          left: sourceMeta?.tracks?.left ?? ultimoTrackingWeb?.left?.state ?? null,
          right: sourceMeta?.tracks?.right ?? ultimoTrackingWeb?.right?.state ?? null,
          costs: sourceMeta?.association?.costs ??
            ultimoTrackingWeb?.diagnostics?.costs ?? null,
        } : null,
        hand_points: sourceMeta?.hand_points ?? {
          left: webCameraState.leftHandPoints,
          right: webCameraState.rightHandPoints,
        },
        contact: sourceMeta?.contact ?? ultimoTrackingWeb?.contact ?? null,
        errors,
      });
    }

    // ---------------------------------------------------------------------
    // Escena
    // ---------------------------------------------------------------------
    const lienzo = document.getElementById('lienzo');
    // Cap GPU fill cost: camera inference blocks main thread, and high-DPI
    // antialiasing otherwise starves VRM render cadence on phones/WebViews.
    const renderPixelRatio = Math.min(window.devicePixelRatio || 1, 1.25);
    const renderer = new THREE.WebGLRenderer({
      canvas: lienzo, alpha: true, antialias: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(renderPixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20);
    // Encuadre de la cintura para arriba: el punto que mira la camara
    // (lookAt) queda a la altura del pecho, y la distancia/FOV estan
    // calculados para que entre desde la cintura hasta la cabeza.
    camera.position.set(0, 1.25, 1.3);
    camera.lookAt(0, 1.22, 0);

    // Camara flotante: un dedo gira alrededor del avatar, dos dedos acercan
    // y desplazan. Imprescindible para revisar una pose de perfil -- de
    // frente es imposible ver si la mano quedo delante o detras del torso,
    // que es justo el error que mas costo encontrar.
    const orbita = new OrbitControls(camera, renderer.domElement);
    orbita.target.set(0, 1.22, 0);
    orbita.enableDamping = true;
    orbita.dampingFactor = 0.1;
    orbita.minDistance = 0.4;
    orbita.maxDistance = 4.0;
    orbita.update();

    const camaraInicial = {
      pos: camera.position.clone(),
      target: orbita.target.clone(),
    };
    function resetCamara() {
      camera.position.copy(camaraInicial.pos);
      orbita.target.copy(camaraInicial.target);
      orbita.update();
    }

    // ---------------------------------------------------------------------
    // Encuadres de la camara.
    //
    //   'cintura' (por defecto): el de siempre -- espejo y pantalla del
    //             avatar, donde interesa ver los brazos completos.
    //   'codos':  de los codos hacia arriba, mas cerca. Es el de Aprender:
    //             las lecciones muestran al avatar en una tarjeta bajita y
    //             ancha, y con el encuadre de cintura quedaba chico y lejos.
    //
    // 'codos' se calcula con las medidas del modelo (no con numeros fijos)
    // para que siga bien si se cambia el avatar. Dart lo elige con
    // AvatarBridge.encuadrar().
    // ---------------------------------------------------------------------
    let encuadreModo = 'cintura';
    // Cuanto se baja (mundo) el borde de abajo del encuadre 'codos' para que
    // quepa la mano de la seña en curso, y a cuanto va (se suaviza en animar).
    let encuadreExtra = 0;
    let encuadreExtraObjetivo = 0;
    // Medidas del modelo a escala 1 (se multiplican por la escala actual):
    // alto del hombro, largo del brazo y tope de la cabeza.
    let medidasEncuadre = null;

    // Pura (sin three ni DOM): se puede probar con numeros sueltos.
    //   m      = { hombroY, brazo, topeY } a escala 1
    //   escala = escala actual del avatar
    //   reposo = cuanto bajan los brazos desde la T-pose (rad)
    function calcularEncuadreCodos(m, escala, reposo, fovGrados, aspecto,
        extraAbajo = 0) {
      // Con el brazo en reposo el codo queda a brazo*sin(reposo) bajo el hombro.
      const codoY = (m.hombroY - m.brazo * Math.sin(reposo)) * escala;
      // el codo se ve entero; extraAbajo (mundo) baja el borde si la seña lo pide
      const abajo = codoY - 0.03 * escala - Math.max(0, extraAbajo);
      const arriba = m.topeY * escala + 0.05 * escala; // aire sobre la cabeza
      const alto = arriba - abajo;
      const tanMedio = Math.tan((fovGrados * Math.PI) / 360);
      const distAlto = alto / (2 * tanMedio);
      // A lo ancho tienen que caber los dos brazos abiertos. En una tarjeta
      // ancha manda el alto; en una angosta, esto evita cortar las manos.
      const ancho = 3.6 * m.brazo * escala;
      const distAncho = ancho / (2 * tanMedio * aspecto);
      return {
        y: (arriba + abajo) / 2,
        dist: Math.min(Math.max(distAlto, distAncho, 0.55), 1.8),
        alto,
      };
    }

    // Se llama una vez al cargar el modelo (T-pose, antes de posarlo).
    function medirEncuadre() {
      medidasEncuadre = null;
      if (!vrm) return;
      vrm.scene.updateMatrixWorld(true);
      const esc = vrm.scene.scale.y || 1;
      const posDe = (nombre) => {
        const nodo = vrm.humanoid.getNormalizedBoneNode(nombre);
        return nodo ? nodo.getWorldPosition(new THREE.Vector3()) : null;
      };
      const hombro = posDe(VRMHumanBoneName.LeftUpperArm);
      const codo = posDe(VRMHumanBoneName.LeftLowerArm);
      const cabeza = posDe(VRMHumanBoneName.Head);
      if (!hombro || !codo || !cabeza) return;
      const brazo = hombro.distanceTo(codo);
      if (!(brazo > 0.05 * esc)) return;
      // Tope de la cabeza (pelo incluido) con la caja del modelo; si sale
      // algo absurdo, la cabeza mide ~0.2 sobre el hueso de la cabeza.
      let tope = new THREE.Box3().setFromObject(vrm.scene).max.y;
      if (!Number.isFinite(tope) || tope < cabeza.y ||
          tope > cabeza.y + 0.6 * esc) {
        tope = cabeza.y + 0.2 * esc;
      }
      medidasEncuadre = {
        hombroY: hombro.y / esc,
        brazo: brazo / esc,
        topeY: tope / esc,
      };
    }

    function aplicarEncuadre() {
      let y = 1.22;
      let yCamara = 1.25;
      let dist = 1.3;
      if (encuadreModo === 'codos') {
        const aspecto = Number.isFinite(camera.aspect) && camera.aspect > 0.2
          ? camera.aspect : 1.6;
        const reposo = Number.isFinite(cal.reposo) ? cal.reposo : 1.4;
        // Mientras el modelo carga: medidas tipicas de un VRoid de 1.55 m.
        const m = medidasEncuadre || { hombroY: 1.25, brazo: 0.25, topeY: 1.56 };
        const escala = medidasEncuadre && vrm ? (vrm.scene.scale.y || 1) : 1;
        const e = calcularEncuadreCodos(m, escala, reposo, camera.fov, aspecto,
          encuadreExtra);
        y = e.y;
        yCamara = e.y + 0.02;
        dist = e.dist;
      }
      camera.position.set(0, yCamara, dist);
      orbita.target.set(0, y, 0);
      orbita.update();
      camaraInicial.pos.copy(camera.position);
      camaraInicial.target.copy(orbita.target);
    }

    window.encuadrarCamara = function (modo) {
      encuadreModo = modo === 'codos' ? 'codos' : 'cintura';
      aplicarEncuadre();
    };

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const luzDirigida = new THREE.DirectionalLight(0xffffff, 0.9);
    luzDirigida.position.set(1, 2, 1.5);
    scene.add(luzDirigida);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      if (encuadreModo !== 'cintura') aplicarEncuadre();
    });

    // ---------------------------------------------------------------------
    // Carga del VRM
    // ---------------------------------------------------------------------
    let vrm = null;
    let anchoHombrosAvatar = 0.34; // fallback tipico si no se puede medir

    const loader = new GLTFLoader();
    // VRM 1.0 -> mismo marco que VRM 0.0.
    //
    // Todo el rig de este visor (signos de los brazos, giro de los dedos, IK)
    // se escribio y se verifico en el telefono con VRM 0.0: el personaje mira
    // a -Z y su izquierda es -X, y se gira media vuelta al cargarlo (ver
    // onAvatarCargado). Un VRM 1.0 viene al reves (mira a +Z, izquierda en
    // +X): cargado tal cual, el rig queda espejado y los brazos suben en vez
    // de bajar. Para no tocar el rig, un 1.0 se cuelga de un nodo girado
    // media vuelta sobre Y ANTES de que three-vrm arme los huesos
    // normalizados; asi queda en el mismo marco que un 0.0 y el resto del
    // codigo no se entera. Los 0.0 pasan sin ningun cambio.
    loader.register((parser) => ({
      name: 'UNIVOZ_marco_vrm0',
      beforeRoot() {
        const json = parser.json || {};
        const ext = json.extensions || {};
        if (!ext.VRMC_vrm || ext.VRM) return null;
        const escena = json.scenes && json.scenes[json.scene || 0];
        if (!escena || !Array.isArray(escena.nodes) || !Array.isArray(json.nodes)) {
          return null;
        }
        json.nodes.push({
          name: 'UNIVOZ_giro_vrm1',
          rotation: [0, 1, 0, 0], // media vuelta sobre Y
          children: escena.nodes.slice(),
        });
        escena.nodes = [json.nodes.length - 1];
        return null;
      },
    }));
    loader.register((parser) => new VRMLoaderPlugin(parser));

    function onAvatarCargado(gltf) {
      vrm = gltf.userData.vrm;
      suavizador.items = null;
      suavizador.activo = false;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      vrm.scene.rotation.y = Math.PI; // three-vrm mira a +Z, la camara esta en -Z
      if (Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
        vrm.scene.scale.setScalar(cal.avatarScale);
      }
      scene.add(vrm.scene);

      // Mide el ancho real de hombros del avatar (mundo) para poder
      // convertir las coordenadas normalizadas (shoulder-width = 1) a
      // metros de este modelo en particular.
      const hL = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.LeftUpperArm);
      const hR = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.RightUpperArm);
      if (hL && hR) {
        const pL = new THREE.Vector3(); hL.getWorldPosition(pL);
        const pR = new THREE.Vector3(); hR.getWorldPosition(pR);
        const d = pL.distanceTo(pR);
        if (d > 0.05) anchoHombrosAvatar = d;
      }

      // Medidas para el encuadre de Aprender (ver 'Encuadres de la camara').
      medirEncuadre();
      if (encuadreModo !== 'cintura') aplicarEncuadre();

      // Postura de reposo: brazos un poco separados del cuerpo para que
      // el 2-bone IK de abajo tenga margen para moverlos sin chocar con
      // el torso.
      // Mide las direcciones de reposo del rig ANTES de posar: el solucionador
      // 3D las usa como referencia y necesita el modelo en T-pose.
      medirRig();
      calibrarEjesPulgar('left');
      calibrarEjesPulgar('right');
      posarReposo();
      window.parlanteVrmListo = true;
    }

    // El modelo NO se pide por fetch/URL: en un WebView cargado con
    // loadFlutterAsset() las rutas relativas a otros assets de Flutter no
    // son confiables (dependen de como cada plataforma arme el dominio
    // virtual del asset loader). En cambio, Dart lee los bytes del .vrm con
    // rootBundle (avatar_bridge.dart) y se los manda a esta funcion ya
    // codificados en base64, apenas la pagina esta lista para recibirlos.
    window.cargarAvatarBase64 = function (b64) {
      try {
        const binario = atob(b64);
        const bytes = new Uint8Array(binario.length);
        for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
        loader.parse(bytes.buffer, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err));
      } catch (e) {
        avisar('No se pudo decodificar el avatar: ' + e);
      }
    };

    // Modo desarrollo web: permite inspeccionar el RigBody sin Flutter ni
    // WebView. Este modo carga el mismo VRM desde el servidor estatico y
    // habilita MediaPipe web al pulsar "Iniciar cámara".
    if (standaloneWeb) {
      fetch('../avatar/MODELO_UNIVOZ_v0.vrm')
        .then((response) => {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.arrayBuffer();
        })
        .then((bytes) => loader.parse(bytes, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err)))
        .catch((err) => avisar('No se pudo descargar el avatar: ' + err));
    }

    // Avisa a Dart que la pagina ya cargo three.js/three-vrm y esta lista
    // para recibir el modelo.
    if (window.SenasChannel) window.SenasChannel.postMessage('js_listo');

    function bone(nombre) {
      return vrm ? vrm.humanoid.getNormalizedBoneNode(nombre) : null;
    }

    // ---------------------------------------------------------------------
    // Calibracion del rig.
    //
    // Todo lo que hubo que ajustar a mano vive aca junto, por brazo. Se toca
    // en vivo desde el panel de calibracion (buscar "PANEL DE CALIBRACION"),
    // idealmente en la pantalla Espejo, donde uno mueve su propio brazo y ve
    // el resultado al instante.
    //
    //   invertZ  Invierte profundidad de worldLandmarks si el modelo/camara
    //            queda con frente y dorso intercambiados.
    //   zInv     Invierte el sentido de rotacion del brazo (arriba/abajo).
    //            Se aplica tambien a la pose de reposo para que no se
    //            contradigan.
    //   dedos    Sentido de flexion de las falanges.
    //   palmaInv Sentido del giro de la muneca.
    //   palmaOff Donde queda el cero del giro de la muneca, en radianes.
    //
    // Deducir estos signos leyendo el codigo no funciono: el rig no se
    // comporta como dice la intuicion sobre los ejes de VRM. Calibrar en el
    // dispositivo es el camino corto.
    // ---------------------------------------------------------------------
    const kThumbFallback = () => ({
      calibrated: false,
      openDistance: 0.72,
      closedDistance: 0.22,
      openAngles: [0.45, 0.18, 0.12],
      closedAngles: [1.0, 0.85, 0.85],
      updatedAtMs: 0,
    });
    const leerThumbCalibration = (raw) => {
      const fallback = kThumbFallback();
      const numberOr = (value, other) => Number.isFinite(Number(value))
        ? Number(value) : other;
      const anglesOr = (value, other) => Array.isArray(value) &&
          value.length === 3 && value.every((item) => Number.isFinite(Number(item)))
        ? value.map(Number) : other.slice();
      return {
        calibrated: raw?.calibrated === true,
        openDistance: numberOr(
          raw?.openDistance ?? raw?.open_distance, fallback.openDistance),
        closedDistance: numberOr(
          raw?.closedDistance ?? raw?.closed_distance, fallback.closedDistance),
        openAngles: anglesOr(
          raw?.openAngles ?? raw?.open_angles, fallback.openAngles),
        closedAngles: anglesOr(
          raw?.closedAngles ?? raw?.closed_angles, fallback.closedAngles),
        updatedAtMs: numberOr(
          raw?.updatedAtMs ?? raw?.updated_at_ms, fallback.updatedAtMs),
      };
    };
    const cal = {
      version: 2,
      avatarScale: 1.0,
      invertZ: false,
      leftArmGain: 1.0,
      rightArmGain: 1.0,
      ikMin: 0.05,
      ikMax: 2.60,
      fingerSensitivity: 1.0,
      wristCompensation: 0.0,
      reposo: 1.40, // cuanto bajan los brazos desde T-pose (comun a los dos)
      // La mano usa un marco ortonormal 3D (dedos, ancho de palma, normal)
      // y un delta de cuaternion respecto al rig medido. No depende de Euler
      // X ni de signos distintos para izquierda/derecha.
      usarMuneca: true,
      // Dedos con direccion 3D completa (ManoIK): cada falange copia hacia
      // donde apunta el dedo del usuario, asi salen los cruces (R), el
      // circulo de la O y las pinzas. false vuelve al metodo anterior de un
      // solo angulo por falange.
      dedos3d: true,
      // Separador de cuerpo: evita que muñecas, manos y antebrazos atraviesen
      // el torso del avatar sin cambiar nunca la altura de la muñeca (ver
      // SeparadorCuerpo). false = IK sola, como antes.
      separarCuerpo: true,
      // Separador de manos: una mano no atraviesa a la otra ni a su antebrazo
      // (la mano que queda delante se adelanta; la altura de la muñeca no
      // cambia nunca). false = solo el separador de cuerpo, como antes.
      separarManos: true,
      // Si una mano desaparece, espera una gracia corta y devuelve sus
      // dedos/muñeca a bind pose. Desactivado conserva comportamiento legacy:
      // última pose válida hasta que mano reaparezca.
      resetHandOnLoss: true,
      thumbCalibration: {
        left: kThumbFallback(),
        right: kThumbFallback(),
      },
      // VRM de UNIVOZ: falanges izquierdas parten hacia -X y derechas hacia
      // +X. En ambos lados, +Z lleva la punta hacia arriba; por eso la
      // flexion anatomica hacia abajo usa signos opuestos.
      left:  { zInv: 1, dedos:  1, palmaInv: 1, palmaOff: 0 },
      right: { zInv: 1, dedos: -1, palmaInv: 1, palmaOff: 0 },
    };

    // Estado de ManoIK. Va aqui, antes de configurarRig, porque en el modo
    // web configurarRig corre al evaluar el script y llega a ponerManoReposo.
    const estadoManoIK = {left: {}, right: {}};
    const ultimoSolveManoIK = {left: null, right: null};
    // Modelo de la mano para ManoIK (se arma al primer cuadro y se descarta
    // cada vez que medirRig() vuelve a medir el rig).
    const cacheManoIK = {left: null, right: null};
    // ManoIK filtra 6 parametros por dedo (3 flexiones + 3 separaciones
    // laterales; el pulgar, 3 giros de 2 componentes), en dos cadenas de 3.
    const handAngleFilters3D = {
      left: Array.from({length: 5}, () => createFastFingerAngleFilter(6)),
      right: Array.from({length: 5}, () => createFastFingerAngleFilter(6)),
    };

    function sanitizarCalibracionRig() {
      const limitado = (value, fallback, min, max) => {
        const numeric = Number(value);
        return Number.isFinite(numeric)
          ? Math.max(min, Math.min(max, numeric)) : fallback;
      };
      cal.avatarScale = limitado(cal.avatarScale, 1, .1, 10);
      cal.leftArmGain = limitado(cal.leftArmGain, 1, .2, 2);
      cal.rightArmGain = limitado(cal.rightArmGain, 1, .2, 2);
      cal.ikMin = limitado(cal.ikMin, .05, 0, Math.PI);
      cal.ikMax = limitado(cal.ikMax, 2.60, cal.ikMin, Math.PI);
      cal.fingerSensitivity = limitado(cal.fingerSensitivity, 1, .75, 1.5);
      cal.wristCompensation = limitado(cal.wristCompensation, 0, -1.5, 1.5);
      cal.dedos3d = cal.dedos3d !== false;
      cal.separarCuerpo = cal.separarCuerpo !== false;
      cal.separarManos = cal.separarManos !== false;
      cal.reposo = limitado(cal.reposo, 1.4, 0, Math.PI);
      for (const lado of ['left', 'right']) {
        cal[lado].dedos = Number(cal[lado].dedos) < 0 ? -1 : 1;
        cal[lado].zInv = Number(cal[lado].zInv) < 0 ? -1 : 1;
        cal[lado].palmaInv = Number(cal[lado].palmaInv) < 0 ? -1 : 1;
        cal[lado].palmaOff = limitado(cal[lado].palmaOff, 0, -1.5, 1.5);
      }
    }

    // Contrato persistible enviado por Dart. Se acepta string porque
    // webview_flutter cruza JavaScript como texto, pero se valida antes de
    // mutar el rig para no mezclar configuraciones incompatibles.
    window.configurarRig = function (json) {
      try {
        const c = typeof json === 'string' ? JSON.parse(json) : json;
        if (!c || (c.version != null && ![1, 2].includes(Number(c.version)))) return;
        for (const key of ['avatarScale', 'invertZ', 'leftArmGain',
          'rightArmGain', 'ikMin', 'ikMax', 'fingerSensitivity',
          'wristCompensation']) {
          const wire = key.replace(/[A-Z]/g, (m) => '_' + m.toLowerCase());
          if (c[wire] != null) cal[key] = Number(c[wire]);
        }
        if (c.reset_hand_on_loss != null) {
          cal.resetHandOnLoss = c.reset_hand_on_loss !== false;
        }
        if (c.resetHandOnLoss != null) {
          cal.resetHandOnLoss = c.resetHandOnLoss !== false;
        }
        if (c.dedos_3d != null) cal.dedos3d = c.dedos_3d !== false;
        if (c.dedos3d != null) cal.dedos3d = c.dedos3d !== false;
        if (c.separar_cuerpo != null) cal.separarCuerpo = c.separar_cuerpo !== false;
        if (c.separarCuerpo != null) cal.separarCuerpo = c.separarCuerpo !== false;
        if (c.separar_manos != null) cal.separarManos = c.separar_manos !== false;
        if (c.separarManos != null) cal.separarManos = c.separarManos !== false;
        if (c.reposo != null) cal.reposo = Number(c.reposo);
        const thumbs = c.thumb_calibration ?? c.thumbCalibration;
        if (thumbs) {
          for (const lado of ['left', 'right']) {
            if (thumbs[lado]) {
              cal.thumbCalibration[lado] = leerThumbCalibration(thumbs[lado]);
            }
          }
        }
        for (const lado of ['left', 'right']) {
          if (c[lado]) Object.assign(cal[lado], c[lado]);
        }
        sanitizarCalibracionRig();
        if (vrm && Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
          vrm.scene.scale.setScalar(cal.avatarScale);
          // La escala cambia longitudes en mundo. Recalibrar referencias antes
          // de aceptar el siguiente frame evita falsos positivos de drift.
          medirRig();
          calibrarEjesPulgar('left');
          calibrarEjesPulgar('right');
        }
        posarReposo();
        if (encuadreModo !== 'cintura') aplicarEncuadre();
      } catch (e) { /* json invalido: se ignora */ }
    };

    if (standaloneWeb) {
      try {
        const guardada = JSON.parse(localStorage.getItem(
          'univoz.thumbCalibration.v2') || 'null');
        if (guardada) window.configurarRig({
          version: 2, thumb_calibration: guardada,
        });
      } catch (_) { /* almacenamiento bloqueado o valor viejo */ }
    }

    // Compatibilidad con editor_pose.html y versiones anteriores del panel.
    window.ajustarCalibracion = window.configurarRig;

    // Que brazos anima el visor. Muchas senas de LSM son de una sola mano;
    // forzar la otra a seguir landmarks que no existen la hace temblar sin
    // sentido. El brazo desactivado se queda en reposo, a un costado.
    // Lo controla Dart via window.configurarManos() (avatar_bridge.dart).
    const manosActivas = { left: true, right: true };

    window.configurarManos = function (izquierda, derecha) {
      manosActivas.left = !!izquierda;
      manosActivas.right = !!derecha;
      if (!manosActivas.left) posarReposoBrazo('left');
      if (!manosActivas.right) posarReposoBrazo('right');
    };

    // Deja UN brazo colgando a un costado. Los signos estan verificados en
    // el dispositivo: ver la nota larga de mas abajo.
    function posarReposoBrazo(lado, meta = {}) {
      const signo = (lado === 'left' ? 1 : -1) * cal[lado].zInv;
      const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
      const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
      const escribirReposo = (hueso, jointId, rotation) => {
        if (!hueso) return;
        safetyGateFor(jointId).reset();
        aplicarRotacionSegura(hueso, jointId, rotation, meta, {
          jointLimits: {
            min: [-Math.PI, -Math.PI, -Math.PI],
            max: [Math.PI, Math.PI, Math.PI],
          },
        });
      };
      escribirReposo(up, `${lado}:upperArm`, [0, 0, signo * cal.reposo]);
      escribirReposo(lo, `${lado}:lowerArm`, [0, 0, 0]);
      // Manos abiertas, relajadas y con la palma en bind pose.
      ponerManoReposo(lado);
      ponerMunecaReposo(lado, meta, true);
    }

    function posarReposo() {
      // Para este rig, rotation 0 en los huesos normalizados es el T-pose
      // (brazos horizontales) -- no la pose de reposo. Hay que rotar cada
      // brazo casi 90 grados desde ahi para que caiga a los costados del
      // cuerpo.
      //
      // Los signos: en VRM el eje +X apunta hacia la izquierda del
      // personaje, pero -- verificado en el dispositivo con este rig -- la
      // rotacion positiva sobre +Z es la que BAJA el brazo izquierdo. El
      // derecho, al apuntar a -X, necesita el signo opuesto. No cambiar
      // estos signos sin volver a probar en el telefono: la primera vez
      // salieron los dos brazos hacia arriba.
      posarReposoBrazo('left');
      posarReposoBrazo('right');
    }

    // ---------------------------------------------------------------------
    // Resolucion de brazos en 3D.
    //
    // sign_norm 2.0.0 entrega cuerpo 3D. Al cargar el modelo se miden sus
    // longitudes y direcciones de reposo; cada frame resuelve posicion de
    // muñeca con IK de dos huesos y conserva plano de flexion capturado.
    // ---------------------------------------------------------------------
    const refRig = { left: null, right: null };
    const refHand = { left: null, right: null };
    const refTorso = {};
    // Referencia del torso en reposo para el separador de cuerpo (se mide en
    // medirRig): hueso del pecho, su matriz de mundo en reposo y el punto medio
    // de los hombros.
    let cuerpoRef = null;
    const avDerecha = new THREE.Vector3();
    const avArriba = new THREE.Vector3(0, 1, 0);
    // El avatar mira a +Z: es VRM 0.0 (mira a -Z) y la escena se voltea media
    // vuelta al cargarlo, arriba.
    const avFrente = new THREE.Vector3(0, 0, 1);

    function marcoMano(x, y, cmc = null) {
      const vectorValido = (v) => v?.isVector3 === true &&
        typeof v.lengthSq === 'function' &&
        Number.isFinite(v.x) && Number.isFinite(v.y) &&
        Number.isFinite(v.z) && v.lengthSq() > 1e-8;
      // Contract: all frame axes and optional CMC are THREE.Vector3. A raw
      // landmark array must fail closed instead of throwing in the render loop.
      if (!vectorValido(x) || !vectorValido(y) ||
          (cmc != null && !vectorValido(cmc))) return null;
      const ejeX = x.clone();
      ejeX.normalize();
      const ejeY = y.clone().addScaledVector(ejeX, -y.dot(ejeX));
      if (!vectorValido(ejeY)) return null;
      ejeY.normalize();
      const ejeZ = new THREE.Vector3().crossVectors(ejeX, ejeY);
      if (!vectorValido(ejeZ)) return null;
      ejeZ.normalize();
      // CMC fixes radial-axis sign. Without this check, the same hand seen
      // from palm/dorsum can produce a quaternion with reversed surface.
      if (cmc &&
          cmc.clone().normalize().dot(ejeY) < 0) {
        ejeY.negate();
        ejeZ.negate();
      }
      return { x: ejeX, y: ejeY, z: ejeZ };
    }

    function medirRig() {
      cacheManoIK.left = null;
      cacheManoIK.right = null;
      // Hay que medir con TODO en cero: la pose de reposo ya rota los brazos
      // y falsearia las direcciones de referencia.
      for (const n of Object.values(VRMHumanBoneName)) {
        const h = bone(n); if (h) h.rotation.set(0, 0, 0);
      }
      vrm.scene.updateMatrixWorld(true);

      const pL = new THREE.Vector3(), pR = new THREE.Vector3();
      bone(VRMHumanBoneName.LeftUpperArm).getWorldPosition(pL);
      bone(VRMHumanBoneName.RightUpperArm).getWorldPosition(pR);
      avDerecha.subVectors(pR, pL).normalize();

      for (const clave of ['Hips', 'Spine', 'Chest', 'UpperChest',
        'LeftShoulder', 'RightShoulder']) {
        const nombre = VRMHumanBoneName[clave];
        const h = nombre ? bone(nombre) : null;
        refTorso[clave] = h ? {
          bone: h,
          world: h.getWorldQuaternion(new THREE.Quaternion()),
        } : null;
      }

      const pecho = bone(VRMHumanBoneName.Chest) || bone(VRMHumanBoneName.Spine);
      cuerpoRef = pecho ? {
        bone: pecho,
        restWorld: pecho.matrixWorld.clone(),
        origen: pL.clone().add(pR).multiplyScalar(0.5),
      } : null;

      for (const lado of ['left', 'right']) {
        const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
        const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
        const ma = bone(lado === 'left' ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
        if (!up || !lo || !ma) {
          refRig[lado] = null;
          refHand[lado] = null;
          continue;
        }
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        up.getWorldPosition(a); lo.getWorldPosition(b); ma.getWorldPosition(c);
        refRig[lado] = {
          dirUp: b.clone().sub(a).normalize(),
          dirLo: c.clone().sub(b).normalize(),
          lenUp: a.distanceTo(b),
          lenLo: b.distanceTo(c),
          qUp: up.getWorldQuaternion(new THREE.Quaternion()),
          qLo: lo.getWorldQuaternion(new THREE.Quaternion()),
          qPadre: up.parent.getWorldQuaternion(new THREE.Quaternion()),
        };

        // Marco anatomico estable del bind pose. El mismo orden se arma con
        // landmarks de MediaPipe, por eso no introduce espejo por lado.
        const prefijo = lado === 'left' ? 'Left' : 'Right';
        const indice = bone(VRMHumanBoneName[`${prefijo}IndexProximal`]);
        const medio = bone(VRMHumanBoneName[`${prefijo}MiddleProximal`]);
        const menique = bone(VRMHumanBoneName[`${prefijo}LittleProximal`]);
        if (!indice || !medio || !menique) {
          refHand[lado] = null;
          continue;
        }
        const pi = new THREE.Vector3(), pm = new THREE.Vector3();
        const pl = new THREE.Vector3();
        indice.getWorldPosition(pi);
        medio.getWorldPosition(pm);
        menique.getWorldPosition(pl);
        const marco = marcoMano(pm.clone().sub(c), pi.clone().sub(pl));
        // Largo muñeca -> nudillo del medio: escala de la mano para el
        // separador de cuerpo.
        refRig[lado].palma = c.distanceTo(pm);
        refHand[lado] = marco ? {
          bone: ma,
          qWorld: ma.getWorldQuaternion(new THREE.Quaternion()),
          marco,
        } : null;
      }
    }

    // Cada hueso VRM puede usar eje local distinto. Se prueban X/Y/Z en
    // ambos sentidos contra centro real de palma del avatar. Criterio:
    // rotación elegida debe acercar punta del pulgar a palma, nunca a Y global.
    const thumbRigMap = { left: {}, right: {} };

    function objetivoPalmaAvatar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const nombres = ['Hand', 'IndexProximal', 'MiddleProximal', 'LittleProximal'];
      const puntos = nombres.map((nombre) =>
        bone(VRMHumanBoneName[`${prefijo}${nombre}`])).filter(Boolean)
        .map((hueso) => hueso.getWorldPosition(new THREE.Vector3()));
      if (!puntos.length) return null;
      return puntos.reduce((suma, punto) => suma.add(punto), new THREE.Vector3())
        .multiplyScalar(1 / puntos.length);
    }

    function puntaPulgarAvatar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const proximal = bone(VRMHumanBoneName[`${prefijo}ThumbProximal`]);
      const distal = bone(VRMHumanBoneName[`${prefijo}ThumbDistal`]) || proximal;
      if (!distal) return null;
      const origen = distal.getWorldPosition(new THREE.Vector3());
      // Normalized VRM no siempre expone nodo tip. Extrapolar último segmento
      // en espacio local hace que rotar Distal sí cambie punto medido.
      let longitud = 0.018;
      if (proximal && proximal !== distal) {
        const p = proximal.getWorldPosition(new THREE.Vector3());
        longitud = Math.max(0.008, origen.distanceTo(p));
      }
      const ejeLocal = distal.position.lengthSq() > 1e-8
        ? distal.position.clone().normalize() : new THREE.Vector3(
          lado === 'left' ? -1 : 1, 0, 0);
      return distal.localToWorld(ejeLocal.multiplyScalar(longitud));
    }

    function calibrarEjesPulgar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const objetivo = objetivoPalmaAvatar(lado);
      if (!objetivo) return;
      for (const fase of ['Metacarpal', 'Proximal', 'Distal']) {
        const hueso = bone(VRMHumanBoneName[`${prefijo}Thumb${fase}`]);
        if (!hueso) continue;
        const original = {
          x: hueso.rotation.x, y: hueso.rotation.y, z: hueso.rotation.z,
        };
        vrm.scene.updateMatrixWorld(true);
        const puntaAntes = puntaPulgarAvatar(lado);
        if (!puntaAntes) continue;
        const antes = puntaAntes.distanceTo(objetivo);
        const probes = [];
        for (const axis of ['x', 'y', 'z']) {
          for (const sign of [-1, 1]) {
            hueso.rotation.set(original.x, original.y, original.z);
            hueso.rotation[axis] += sign * 0.20;
            vrm.scene.updateMatrixWorld(true);
            const punta = puntaPulgarAvatar(lado);
            if (punta) probes.push({
              axis, sign, distance: punta.distanceTo(objetivo),
            });
          }
        }
        hueso.rotation.set(original.x, original.y, original.z);
        thumbRigMap[lado][fase] = chooseThumbBoneAxis(antes, probes) ?? {
          axis: 'z', sign: lado === 'left' ? 1 : -1, improvement: 0,
        };
      }
      vrm.scene.updateMatrixWorld(true);
    }

    // Base del cuerpo. Desde sign_norm 2.0.0 el bloque de cuerpo YA viene
    // proyectado sobre los ejes de la persona: +X a su derecha, +Y arriba,
    // +Z al frente. Asi que no hay nada que deducir, la base es la identidad.
    //
    // No volver a calcularla de los hombros y caderas: daria +Z hacia atras
    // y el avatar senaria en espejo de profundidad.
    const kBase = {
      pDer: new THREE.Vector3(1, 0, 0),
      pArr: new THREE.Vector3(0, 1, 0),
      pFre: new THREE.Vector3(0, 0, 1),
    };
    function baseCuerpo(p) {
      // Solo comprueba que el frame tenga cuerpo utilizable.
      return (Math.abs(p.hombroD.x - p.hombroI.x) > 1e-4) ? kBase : null;
    }

    function vectorBaseAvatar(v, base) {
      const z = cal.invertZ ? -v.dot(base.pFre) : v.dot(base.pFre);
      return new THREE.Vector3()
        .addScaledVector(avDerecha, v.dot(base.pDer))
        .addScaledVector(avArriba, v.dot(base.pArr))
        .addScaledVector(avFrente, z);
    }

    function aBaseAvatar(v, base) {
      return vectorBaseAvatar(v, base).normalize();
    }

    function vectorManoAAvatar(p, base) {
      // p ya pertenece al bloque de FORMA normalizado: sign_norm transforma
      // imagen Y hacia abajo a Y hacia arriba antes de cruzar este puente.
      // Negar Y aqui volvía a invertir dedos y palma verticalmente. MediaPipe
      // mano usa Z negativo hacia la camara, mientras que el avatar usa +Z
      // hacia su frente; corregir esa convencion solo en render.
      const zFrente = cal.invertZ ? p[2] : -p[2];
      return aBaseAvatar(new THREE.Vector3(p[0], p[1], zFrente), base);
    }

    // Utilidades para angulos de falanges, que usan arrays [x,y,z].
    function _largo(v) { return Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]); }
    function _norm(v) { const m = _largo(v) || 1; return [v[0] / m, v[1] / m, v[2] / m]; }
    function _pto(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function _resta(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

    function metaRigFrame(meta = {}) {
      const timestampMs = Number(meta.timestampMs);
      const t = Number.isFinite(timestampMs) ? timestampMs : performance.now();
      return {
        frameId: meta.frameId ?? null,
        timestampMs: t,
        nowMs: t,
        sourceSkewMs: Number(meta.sourceSkewMs ?? 0),
      };
    }

    function reportSafetyAnomaly(result, jointId) {
      if (!result?.code) return;
      webCameraState.invalidTransforms++;
      if (result.code === 'teleport_detected') webCameraState.teleports++;
      const side = String(jointId).startsWith('left') ? 'left' :
        String(jointId).startsWith('right') ? 'right' : null;
      errorDiagnostico('safety_gate', result.code, side);
    }

    function aplicarRotacionSegura(hueso, jointId, rotation, meta = {}, options = {}) {
      if (!hueso || !Array.isArray(rotation)) return null;
      const result = safetyGateFor(jointId).check({
        ...metaRigFrame(meta),
        jointId,
        rotation,
        handId: options.handId,
        expectedHandId: options.expectedHandId,
        parentId: hueso.parent?.uuid ?? null,
        jointLimits: options.jointLimits,
        referenceBoneLength: options.referenceBoneLength,
        boneLength: options.boneLength,
        recovery: options.recovery,
      });
      if (result.accepted && Array.isArray(result.value)) {
        hueso.rotation.set(...result.value);
      } else {
        reportSafetyAnomaly(result, jointId);
      }
      return result;
    }

    function aplicarQuaternionSegura(hueso, jointId, quaternion, meta = {}, options = {}) {
      if (!hueso || !quaternion) return null;
      let rotation = options.rotation ?? null;
      try {
        if (!rotation && typeof THREE !== 'undefined') {
          const euler = new THREE.Euler().setFromQuaternion(quaternion);
          rotation = [euler.x, euler.y, euler.z];
        }
      } catch (_) { rotation = null; }
      const result = safetyGateFor(jointId).check({
        ...metaRigFrame(meta),
        jointId,
        rotation,
        quaternion: [quaternion.x, quaternion.y, quaternion.z, quaternion.w],
        handId: options.handId,
        expectedHandId: options.expectedHandId,
        parentId: hueso.parent?.uuid ?? null,
        jointLimits: options.jointLimits,
        referenceBoneLength: options.referenceBoneLength,
        boneLength: options.boneLength,
        recovery: options.recovery,
      });
      if (result.accepted && Array.isArray(result.quaternion)) {
        hueso.quaternion.set(...result.quaternion);
      } else {
        reportSafetyAnomaly(result, jointId);
      }
      return result;
    }

    function aplicarTorso(p, meta = {}) {
      const hombros = p.hombroD.clone().sub(p.hombroI);
      const medioHombros = p.hombroD.clone().add(p.hombroI).multiplyScalar(0.5);
      const medioCaderas = p.caderaD.clone().add(p.caderaI).multiplyScalar(0.5);
      const arriba = medioHombros.clone().sub(medioCaderas).normalize();
      const derecha = hombros.normalize();
      if (arriba.lengthSq() < 1e-6 || derecha.lengthSq() < 1e-6) return;
      const frente = new THREE.Vector3().crossVectors(arriba, derecha).normalize();
      if (frente.lengthSq() < 1e-6) return;

      // El vector normalizado conserva inclinacion de pelvis/torso aunque
      // elimina traslacion. Aplicar una base rota huesos sin mover raiz.
      const referencia = new THREE.Matrix4().makeBasis(
        avDerecha, avArriba, avFrente);
      const objetivo = new THREE.Matrix4().makeBasis(derecha, arriba, frente);
      const qReferencia = new THREE.Quaternion().setFromRotationMatrix(referencia);
      const qObjetivo = new THREE.Quaternion().setFromRotationMatrix(objetivo);
      const delta = qObjetivo.multiply(qReferencia.invert());

      const aplicar = (clave, proporcion) => {
        const r = refTorso[clave];
        if (!r) return;
        const parcial = new THREE.Quaternion().slerpQuaternions(
          new THREE.Quaternion(), delta, proporcion);
        const mundo = parcial.multiply(r.world);
        const padre = r.bone.parent.getWorldQuaternion(new THREE.Quaternion());
        aplicarQuaternionSegura(r.bone, `torso:${clave}`,
          padre.invert().multiply(mundo), meta);
      };

      aplicar('Hips', 1.0);
      aplicar('Spine', 0.75);
      aplicar('Chest', 0.55);
      aplicar('UpperChest', 0.40);
      aplicar('LeftShoulder', 0.30);
      aplicar('RightShoulder', 0.30);
    }

    // <<CUERPO_INICIO>>
    // ---------------------------------------------------------------------
    // Separador de cuerpo: que las manos y los antebrazos del avatar no
    // atraviesen su propio torso.
    //
    // Por que pasa: las plantillas guardan la muñeca en "anchos de hombro"
    // medidos en una persona real; la mano de quien firma queda ~0.6 anchos
    // delante de los hombros (el pecho de una persona delgada). El torso de
    // este avatar (VRoid, con ropa) llega a ~0.67 anchos delante del plano
    // de los hombros, asi que la IK dejaba la muñeca, la palma y el codo
    // DENTRO del pecho.
    //
    // Que hace (matematica pura, sin THREE, probada en Node):
    //  1. EMPUJE: si la mano o la muñeca quedan dentro del torso, el objetivo
    //     de la muñeca se corre hacia ADELANTE (eje horizontal del avatar) lo
    //     justo para salir. Nunca cambia la altura: el desplazamiento es
    //     horizontal y se limita para que la IK no tenga que recortar el
    //     alcance (si lo recortara, la muñeca cambiaria de altura).
    //  2. GIRO DEL CODO: el codo gira alrededor del eje hombro-muñeca (±90°,
    //     pasos de 10°) hasta que codo y antebrazo salen del torso, con el
    //     menor giro posible. No mueve la muñeca ni la mano.
    //  El torso se aproxima por una tabla de cortes medida en la malla del
    //  modelo (superelipse N=2.4 por altura); se escala con el ancho de
    //  hombros del avatar y sigue la inclinacion del pecho.
    // ---------------------------------------------------------------------
    const SeparadorCuerpo = (() => {
      // Ancho de hombros (m) del modelo con el que se midio la tabla.
      const ANCHO_REF = 0.2171117844;
      // [altura respecto a los hombros, semiancho, frente, espalda] en
      // metros del modelo de referencia. frente/espalda: distancia hacia
      // delante (+) o atras (-) del plano de los hombros.
      const TABLA = [
        [-0.44975, 0.03959, 0.12749, -0.06461],
        [-0.40975, 0.10216, 0.13767, -0.07384],
        [-0.36975, 0.14139, 0.14769, -0.07623],
        [-0.32975, 0.14360, 0.14929, -0.07325],
        [-0.28975, 0.14154, 0.15114, -0.07024],
        [-0.24975, 0.12474, 0.14455, -0.05285],
        [-0.20975, 0.11377, 0.14352, -0.03949],
        [-0.16975, 0.11194, 0.14599, -0.02193],
        [-0.12975, 0.11715, 0.14581, -0.02410],
        [-0.08975, 0.13830, 0.14622, -0.04259],
        [-0.04975, 0.14151, 0.13412, -0.05232],
        [-0.00975, 0.11926, 0.10004, -0.05647],
        [0.03025, 0.05898, 0.06941, -0.05298],
        [0.07025, 0.05170, 0.04617, -0.04899],
      ];
      const V0 = TABLA[0][0];
      const V1 = TABLA[TABLA.length - 1][0];
      const EXPONENTE = 2.4;
      const MARGEN = 0.004;
      const BANDA_U = 0.03;
      const BANDA_V = 0.04;
      const TOLERANCIA = 0.0015;
      const MAX_EMPUJE = 0.20;
      const TASA_GIRO = 12 * Math.PI / 180;
      const GIROS = [];
      for (let g = -90; g <= 90; g += 10) GIROS.push(g * Math.PI / 180);
      const PASO_GIRO = 10 * Math.PI / 180;
      const MAX_GIRO = 90 * Math.PI / 180;
      // Radios (m, modelo de referencia) de lo que se prueba contra el torso.
      const RADIO_MUNECA = 0.028;
      const RADIOS_DEDO = [];
      for (let i = 0; i < 20; i++) {
        RADIOS_DEDO.push(i % 4 === 0 ? 0.022 : (i % 4 === 3 ? 0.004 : 0.009));
      }

      const suave = (x) => {
        const t = x < 0 ? 0 : (x > 1 ? 1 : x);
        return t * t * (3 - 2 * t);
      };
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const cruz = (a, b) => [a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const suma = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
      const largo = (a) => Math.sqrt(dot(a, a));

      function fila(v) {
        let i = 0;
        while (i < TABLA.length - 2 && v > TABLA[i + 1][0]) i++;
        const a = TABLA[i], b = TABLA[i + 1];
        const t = (v - a[0]) / (b[0] - a[0]);
        return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t,
          a[3] + (b[3] - a[3]) * t];
      }

      // Cuanto hay que adelantar (m del modelo de referencia) una esfera de
