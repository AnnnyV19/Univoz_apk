          if (peor < 5e-5) { iter++; break; }
        }
        // Redondear el lazo pulgar-dedo cuando hay un contacto claro
        let redondez = null;
        if (principal && pul && porNombre[principal] && opciones.redondear !== false) {
          const F = porNombre[principal];
          const r0 = redondezLazo(lazoPuntos(modelo, pul, F));
          const wP = contactos[principal].w;
          // solo si el lazo deja un hueco (no un puño apretado)
          const gate = smooth01((wP - 0.4) / 0.4) * smooth01((r0.q - 0.015) / 0.03);
          if (gate > 0.02) {
            // Continuidad: si el cuadro anterior ya redondeo este mismo lazo, se
            // parte de su resultado y se ancla a el (sin esto, el lazo salta
            // entre soluciones parecidas de un cuadro a otro).
            const prev = estado && estado.prevLazo;
            if (prev && prev.dedo === principal && prev.pulgar && prev.dedoTh) {
              pul.thPrev = prev.pulgar; F.thPrev = prev.dedoTh;
              pul.th = prev.pulgar.slice(); F.th = prev.dedoTh.slice();
              limitarCadena(pul); limitarCadena(F);
            }
            const rondas = opciones.rondasRedondez ?? 5;
            let ro = 0;
            for (; ro < rondas; ro++) {
              const mayor = pasoRedondez(modelo, pul, F, gate, contacto, grupos);
              for (let p = 0; p < (opciones.pasadasRonda ?? 2); p++) {
                pasadaRestricciones(modelo, contacto, grupos);
              }
              if (mayor < 0.004) break;
            }
            // cierre final: contacto y choques, sin redondear mas
            for (let p = 0; p < (opciones.pasadasFinal ?? 4); p++) {
              if (pasadaRestricciones(modelo, contacto, grupos) < 5e-5) break;
            }
            const r1 = redondezLazo(lazoPuntos(modelo, pul, F));
            redondez = {gate, antes: r0, despues: r1, rondas: ro};
            if (estado) estado.prevLazo = {dedo: principal, pulgar: pul.th.slice(), dedoTh: F.th.slice()};
          } else if (estado) estado.prevLazo = null;
        } else if (estado) estado.prevLazo = null;
        // Niveles tras el contacto. El dedo que toca el pulgar se baja (o sube)
        // hasta la yema del pulgar, que en el avatar queda mas lejos que en los
        // landmarks; si los dedos vecinos estaban al mismo nivel que el, deben
        // acompanarlo con el mismo cambio, no quedarse a otra altura (en la D el
        // medio llegaba al pulgar y el anular y el menique se quedaban 3 cm mas
        // cerca de la palma). Cada seguidor parte de lo que vio la camara y recibe
        // el cambio del dedo principal, ponderado por lo parecido que era su nivel.
        let seguidores = null;
        if (principal && pul && porNombre[principal] && opciones.nivelar !== 0) {
          const Pr = porNombre[principal];
          const sg = modelo.signoFlex;
          const nivel0 = (c) => sg * (c.th0[0] + c.th0[1] + c.th0[2]);
          const cambio = [0, 1, 2].map((k) => Pr.th[k] - Pr.th0[k]);
          const fuerza = opciones.nivelar ?? 1;
          for (const nb of kNombresLargos) {
            if (nb === principal) continue;
            const F = porNombre[nb];
            if (!F) continue;
            const w = fuerza * smooth01((kNivelLejos - Math.abs(nivel0(F) - nivel0(Pr))) /
              (kNivelLejos - kNivelCerca));
            if (w <= 0.001) continue;
            for (let k = 0; k < 3; k++) F.th[k] = F.th0[k] + w * cambio[k];
            limitarCadena(F);
            (seguidores = seguidores || {})[nb] = w;
          }
          if (seguidores) {
            for (let p = 0; p < (opciones.pasadasNivel ?? 6); p++) {
              if (pasadaRestricciones(modelo, contacto, grupos) < 5e-5) break;
            }
          }
        }
        if (opciones.dep) {
          for (const g of grupos) for (const rc of contacto.concat(g.lista)) {
            estadoCadena(modelo, rc.A); estadoCadena(modelo, rc.B);
            const sa = rc.A.segs[rc.i], sb = rc.B.segs[rc.j];
            const c = puntoMasCercano(sa[0], sa[1], sb[0], sb[1]);
            const C = c.d - rc.A.rad[rc.i] - rc.B.rad[rc.j] - rc.obj;
            if (rc.modo === 'igual' || C < 0) {
              opciones.dep.push(`${rc.modo} ${rc.A.nombre}${rc.i}-${rc.B.nombre}${rc.j} C=${(C * 1000).toFixed(2)} obj=${(rc.obj * 1000).toFixed(1)} relax=${rc.relax}`);
            }
          }
        }
        // volcar a la salida
        const signo = modelo.signoFlex;
        for (const c of cad) {
          if (c.pulgar) {
            const giros = girosDeParams(c.base, c.th);
            const fk = fkPulgar(modelo, giros);
            out.pulgar.params = c.th.slice();
            out.pulgar.giros = giros;
            out.pulgar.quats = giros.map(aCuaternion);
            out.pulgar.pts = fk.pts;
          } else {
            const r = out.dedos[c.nombre];
            for (let k = 0; k < 3; k++) {
              r[k].f = c.th[k]; r[k].a = c.th[3 + k]; r[k].flex = signo * c.th[k];
            }
          }
        }
        return {iter, peor, redondez, seguidores};
      }

      // ----------------------------- Mano completa -----------------------------
      /**
       * `P`: 20 puntos [x,y,z] en el marco local de la mano, en metros del
       * avatar. Devuelve {dedos:{Index:[{f,a,flex}x3],...}, pulgar:{params,...},
       * contacto}. `opciones.estado` guarda la capa (dorso/palma) de cada cruce.
       */
      // Un dedo solo se dobla hacia la palma. Si los landmarks de una mano traen
      // las articulaciones doblandose hacia el dorso en conjunto, la mano esta
      // "al reves" (el detector la asigno al lado contrario: pasa en senas con
      // las manos juntas, como PERDON o GRACIAS). Se refleja contra el plano de
      // la palma para que el avatar doble los dedos hacia su palma, que es lo que
      // hacia el metodo anterior al medir solo el valor absoluto del angulo.
      function evidenciaEspejo(modelo, P) {
        let suma = 0;
        for (const nombre of kNombresLargos) {
          const M = kIdx[nombre].map((i) => P[i]);
          const t = [unit(sub(M[1], M[0])), unit(sub(M[2], M[1])),
            unit(sub(M[3], M[2]))];
          if (!t[0] || !t[1] || !t[2]) continue;
          const d = modelo.dedos[nombre];
          let Q = I3();
          for (let k = 0; k < 3; k++) {
            const u = mv(tr(Q), t[k]);
            const e = dosEjes(d.r[k], u, Math.PI / 2);
            Q = mm(Q, mm(rotZ(e.f), rotY(e.a)));
            if (k > 0) suma += clamp(modelo.signoFlex * e.f, -1.5, 1.5);
          }
        }
        return suma;
      }

      // ------------------------------ Niveles de los dedos ------------------------------
      // Cuando varios dedos estan en el MISMO estado (varios doblados, varios
      // estirados) la mano se ve ordenada si los dedos de ese estado quedan al
      // mismo nivel, y no cada uno con la flexion suelta que dejo la camara (uno
      // curvado en el nudillo, otro doblado hasta el tope en la articulacion
      // media). Los dedos en estados distintos conservan niveles distintos.
      //   - Nivel de un dedo = suma de la flexion de sus 3 articulaciones.
      //   - Dos dedos comparten nivel si sus niveles se parecen (peso suave, sin
      //     saltos entre cuadros): total hasta kNivelCerca, nada desde kNivelLejos.
      //   - El dedo que toca la yema del pulgar (D, O, F...) hace de ancla: es el
      //     que forma el circulo, asi que los demas toman SU forma y no al reves.
      //   - Solo cambia la flexion; la separacion lateral de cada dedo se queda.
      const kNivelCerca = 0.7;     // rad de flexion total
      const kNivelLejos = 1.3;
      const kAnclaContacto = 8;

      function nivelarDedos(modelo, dedos, P, opciones = {}) {
        const fuerza = opciones.nivelar ?? 1;
        if (!(fuerza > 0)) return;
        const nombres = kNombresLargos.filter((n) => dedos[n]);
        if (nombres.length < 2) return;
        const palma = modelo.palma || kPalmaRef;
        const cerca = opciones.contactoCerca ?? 0.15;
        const lejos = opciones.contactoLejos ?? 0.32;
        const info = nombres.map((n) => {
          const fl = dedos[n].map((r) => r.flex);
          const vl = largo(sub(P[3], P[kIdx[n][3]]));
          const wC = 1 - smooth01((vl / palma - cerca) / (lejos - cerca));
          return {n, fl, nivel: fl[0] + fl[1] + fl[2], ancla: 1 + kAnclaContacto * wC};
        });
        const signo = modelo.signoFlex;
        const nuevos = info.map((a) => {
          let den = 0;
          const num = [0, 0, 0];
          for (const b of info) {
            const w = a === b ? 1
              : smooth01((kNivelLejos - Math.abs(a.nivel - b.nivel)) / (kNivelLejos - kNivelCerca));
            if (w <= 0) continue;
            const peso = w * b.ancla;
            den += peso;
            for (let k = 0; k < 3; k++) num[k] += peso * b.fl[k];
          }
          return a.fl.map((v, k) => v + fuerza * (num[k] / den - v));
        });
        info.forEach((a, i) => {
          for (let k = 0; k < 3; k++) {
            const flex = clamp(nuevos[i][k], kFlexMin[k], kFlexMax[k]);
            dedos[a.n][k].flex = flex;
            dedos[a.n][k].f = signo * flex;
          }
        });
      }

      // ------------------------ Pulgar sobre la palma (B, 5...) ------------------------
      // Con el pulgar cruzado sobre la palma la camara lo ve de canto y suele
      // darle la ultima falange apuntando hacia adelante, junto al indice, como
      // si el pulgar estuviera a un lado. Para que se lea "va dentro de la palma"
      // se gira un poco esa ultima falange hacia el centro de la mano (a lo
      // ancho, sin mandar la punta hacia atras). El giro es pequeno (hasta
      // kPulgarPalmaMax) y solo cuando la punta ya esta sobre la palma y cerca de
      // su plano; si el pulgar toca otro dedo (O, F, D...) no se toca.
      const kPulgarPalmaMax = 0.45;   // rad (~26 deg)
      function pulgarHaciaPalma(modelo, P, pesoContacto, dedos, opciones = {}) {
        const maxGiro = opciones.pulgarPalma ?? kPulgarPalmaMax;
        if (!(maxGiro > 0)) return P;
        const q = kIdx.Thumb.map((i) => P[i]);
        const dist = sub(q[3], q[2]);
        const largoFal = largo(dist);
        const u = unit(dist);
        if (!u) return P;
        let c = [0, 0, 0];
        for (const n of kNombresLargos) c = add(c, P[kIdx[n][0]]);
        c = mul(c, 1 / 5);               // muneca (origen) + 4 nudillos
        const palma = modelo.palma || kPalmaRef;
        const dTip = largo(sub(q[3], c)) / palma;
        const wPos = 1 - smooth01((dTip - 0.6) / 0.4);
        const wPlano = 1 - smooth01((Math.abs(q[3][1] - c[1]) / palma - 0.2) / 0.3);
        // Solo con la palma al descubierto: si los dedos estan doblados (T, A,
        // S...) el pulgar queda debajo o entre ellos y girarlo lo atravesaria.
        let suma = 0, cuenta = 0;
        for (const n of kNombresLargos) {
          if (!dedos || !dedos[n]) continue;
          suma += dedos[n][0].flex + dedos[n][1].flex + dedos[n][2].flex;
          cuenta++;
        }
        const wDedos = cuenta ? 1 - smooth01((suma / cuenta - 0.5) / 0.8) : 1;
        const w = wPos * wPlano * wDedos * (1 - clamp(pesoContacto, 0, 1));
        if (w < 0.01) return P;
        const lado = (c[2] - q[2][2]) >= 0 ? 1 : -1;
        const obj = [0, 0, lado];
        const ang = Math.acos(clamp(dot(u, obj), -1, 1));
        const giro = Math.min(maxGiro * w, ang);
        if (giro < 1e-4) return P;
        const eje = unit(cross(u, obj));
        if (!eje) return P;
        const u2 = mv(rotEje(eje, giro), u);
        const P2 = P.slice();
        P2[3] = add(q[2], mul(u2, largoFal));
        return P2;
      }

      const kCurvaContactoMin = 0.7;   // flexion total (rad) bajo la cual el contacto no cuenta
      const kCurvaContactoPaso = 0.8;

      function resolverMano(modelo, P, opciones = {}) {
        if (!modelo || !P || P.length < 20 || P.some((p) => !p || !finito(p))) {
          return null;
        }
        let espejo = false;
        if (opciones.espejo !== false) {
          const ev = evidenciaEspejo(modelo, P);
          const est = opciones.estado;
          const previo = est ? est.espejo === true : false;
          // histeresis: cambiar de estado solo con evidencia clara
          espejo = ev < -0.9 || (previo && ev < 0.9);
          if (est) est.espejo = espejo;
        }
        if (espejo) P = P.map((p) => [p[0], -p[1], p[2]]);
        const out = {dedos: {}, pulgar: null};
        const sens = opciones.sensibilidad ?? 1;
        for (const nombre of kNombresLargos) {
          const M = kIdx[nombre].map((i) => P[i]);
          const r = resolverDedoLargo(modelo, nombre, M, sens);
          if (r) out.dedos[nombre] = r;
        }
        if (opciones.nivelar !== 0) nivelarDedos(modelo, out.dedos, P, opciones);
        if (opciones.separar !== false) {
          separarDedos(modelo, out.dedos, P, opciones.estado);
        }
        const largos = {};
        for (const nombre of Object.keys(out.dedos)) {
          largos[nombre] = fkDedoLargo(modelo, nombre, out.dedos[nombre]);
        }
        // Contacto del pulgar: promedio ponderado de las yemas que, en los
        // landmarks, estan al alcance de la punta del pulgar.
        const tipPulgar = P[3];
        const palma = modelo.palma || 0.067;
        const cerca = opciones.contactoCerca ?? 0.15;   // en palmas
        const lejos = opciones.contactoLejos ?? 0.32;
        const sepMin = opciones.separacionMin ?? 0.009;
        let sumaW = 0, sumaB = [0, 0, 0], peso = 0, mejor = null, dMejor = Infinity;
        const pesosContacto = {};
        for (const nombre of kNombresLargos) {
          if (!largos[nombre]) continue;
          const v = sub(tipPulgar, P[kIdx[nombre][3]]);
          const vl = largo(v);
          if (vl < dMejor) { dMejor = vl; mejor = nombre; }
          // El contacto del pulgar con un dedo recto (K, P: el pulgar toca el
          // medio por el lado) no debe doblar ese dedo hasta la yema del pulgar:
          // solo cuenta cuando el dedo ya viene curvado (D, O, F, U...).
          const rd = out.dedos[nombre];
          const curva = rd ? rd[0].flex + rd[1].flex + rd[2].flex : 3;
          const w = (1 - smooth01((vl / palma - cerca) / (lejos - cerca))) *
            smooth01((curva - kCurvaContactoMin) / kCurvaContactoPaso);
          pesosContacto[nombre] = {w, vl};
          if (w <= 0.001) continue;
          const dir = vl > 1e-9 ? mul(v, 1 / vl) : [0, 0, 0];
          const b = add(largos[nombre][3], mul(dir, Math.max(vl, sepMin)));
          sumaW += w; sumaB = add(sumaB, mul(b, w));
          peso = Math.max(peso, w);
        }
        const blanco = sumaW > 0 ? mul(sumaB, 1 / sumaW) : null;
        const Ppul = pulgarHaciaPalma(modelo, P, peso, out.dedos, opciones);
        out.pulgar = resolverPulgar(modelo, Ppul, blanco, peso);
        out.contacto = {dedo: mejor, distancia: dMejor / palma, peso};
        out.espejo = espejo;
        if (opciones.refinar !== false && out.pulgar) {
          out.refinado = refinarMano(modelo, out, P, opciones.estado || {},
            pesosContacto, opciones);
        }
        return out;
      }

      // Cuaterniones [x,y,z,w] del dedo largo (R = Rz(f)·Ry(a)) y del pulgar
      const cuaternionDedo = (f, a) => aCuaternion(mm(rotZ(f), rotY(a)));
      function cuaternionesPulgar(modelo, params) {
        const base = modelo.dedos.Thumb.r.map(baseTangente);
        return girosDeParams(base, params).map(aCuaternion);
      }

      return {
        crearModelo, resolverMano, resolverDedoLargo, resolverPulgar,
        fkDedoLargo, fkPulgar, dosEjes, aCuaternion, rotZ, rotY, mm, mv, tr, I3,
        cuaternionDedo, cuaternionesPulgar, separarDedos, nivelarDedos, pulgarHaciaPalma, marcoMano, aMarcoLocal, giroMinimo, kIdx, kNombresLargos, kFlexMin, kFlexMax, kSepMax,
      };
    })();
    // <<DEDOS3D_FIN>>

    // <<DEDOS3D_ADAPTADOR_INICIO>>
    // ---------------------------------------------------------------------
    // Dedos en 3D: adaptador entre el visor y ManoIK.
    //
    // moverMano() llama primero a moverMano3D(). Si devuelve false (el modelo
    // no trae los huesos, no hay marco de reposo, o cal.dedos3d esta apagado)
    // se usa el metodo anterior de un angulo por falange. Un cuadro con datos
    // degenerados NO cae al metodo anterior: devuelve true y conserva la ultima
    // pose, igual que antes.
    // ---------------------------------------------------------------------
    // El avatar no trae hueso de yema. Se estima con la proporcion medida en el
    // modelo de UNIVOZ (largo de la yema / distancia muneca-nudillo medio).
    const kYemaPalma = 0.352, kYemaPulgarPalma = 0.367;
    const kDedosIK = ['Thumb', 'Index', 'Middle', 'Ring', 'Little'];
    const kFlexReferenciaIK = 1.6;

    function reiniciarManoIK(lado = null) {
      for (const l of ['left', 'right']) {
        if (lado && lado !== l) continue;
        estadoManoIK[l] = {};
        ultimoSolveManoIK[l] = null;
        if (typeof handAngleFilters3D !== 'undefined') {
          for (const filtro of handAngleFilters3D[l]) filtro.reset();
        }
      }
    }

    // Modelo de la mano del avatar (largos y direcciones de reposo de cada
    // falange) leido de los huesos normalizados. En el rig normalizado todos los
    // huesos parten con rotacion identidad, asi que `position` de cada falange ya
    // esta en el marco local de la mano.
    function modeloManoIK(lado) {
      const signo = cal[lado].dedos < 0 ? -1 : 1;
      const hecho = cacheManoIK[lado];
      if (hecho && hecho.modelo.signoFlex === signo) return hecho;
      if (!vrm || typeof ManoIK === 'undefined') return null;
      const ref = refHand[lado];
      if (!ref) return null;
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const huesos = {}, nodos = {}, fases = {};
      for (const nombre of kDedosIK) {
        const lista = nombre === 'Thumb' ? kFasesPulgar : kFasesGenericas;
        const hs = lista.map((fase) =>
          bone(VRMHumanBoneName[`${prefijo}${nombre}${fase}`]));
        if (hs.some((h) => !h)) return null;
        huesos[nombre] = {offs: hs.map((h) => h.position.toArray()), punta: 0};
        nodos[nombre] = hs;
        fases[nombre] = lista;
      }
      const palma = Math.hypot(...huesos.Middle.offs[0]);
      if (!(palma > 1e-4)) return null;
      for (const nombre of kDedosIK) {
        huesos[nombre].punta =
          (nombre === 'Thumb' ? kYemaPulgarPalma : kYemaPalma) * palma;
      }
      const modelo = ManoIK.crearModelo(lado, huesos, signo);
      // mundo -> marco local de la mano en reposo (fila mayor)
      const m = new THREE.Matrix4().makeRotationFromQuaternion(
        ref.qWorld.clone().invert()).elements;
      const mundoALocal = [m[0], m[4], m[8], m[1], m[5], m[9], m[2], m[6], m[10]];
      const marco = {
        x: ref.marco.x.toArray(), y: ref.marco.y.toArray(),
        z: ref.marco.z.toArray(),
      };
      cacheManoIK[lado] = {modelo, nodos, fases, marco, mundoALocal, palma};
      return cacheManoIK[lado];
    }

    function escribirDedosIK(lado, items, meta) {
      for (const it of items) {
        aplicarQuaternionSegura(it.hueso, it.jointId, it.q, meta, {
          handId: lado,
          expectedHandId: lado,
          recovery: meta.recovery === true,
        });
      }
    }

    function registrarDedoIK(lado, dedoIndex, nombreDedo, entrada, salida,
        filtrado, t, meta) {
      if (filtrado) {
        const diag = ultimoDiagnosticoAngulos[lado];
        diag.madOutliers.push(...filtrado.diagnostics.madOutliers.map(
          (joint) => dedoIndex * 3 + (joint % 3)));
        if (filtrado.diagnostics.jumpRejectedChains.length) {
          diag.jumpRejectedChains.push(dedoIndex);
        }
        diag.delayMs = Math.max(diag.delayMs, filtrado.diagnostics.delayMs);
        diag.rawToFilteredRms = Math.max(diag.rawToFilteredRms,
          filtrado.diagnostics.rawToFilteredRms);
      }
      const estadoDedo = fingerRenderState[lado]?.[dedoIndex];
      if (!estadoDedo) return;
      const media = (values) => values.reduce((sum, value) => sum + value, 0) /
        Math.max(1, values.length);
      estadoDedo.input = entrada.slice();
      estadoDedo.render = salida.slice();
      estadoDedo.timestampMs = t;
      estadoDedo.samples.push({
        timestampMs: t,
        input: Math.min(1, media(entrada) / kFlexReferenciaIK),
        avatar: Math.min(1, media(salida) / kFlexReferenciaIK),
      });
      if (estadoDedo.samples.length > 120) estadoDedo.samples.shift();
      estadoDedo.lagMs = measureFingerLag(estadoDedo.samples);
      ultimoDiagnosticoAngulos[lado].fingerLagMs = Math.max(
        ultimoDiagnosticoAngulos[lado].fingerLagMs ?? 0, estadoDedo.lagMs);
      if (estadoDedo.lagMs > 66) {
        guardarAudit({
          frame: meta.frameId ?? null,
          timestampMs: t,
          stage: 'finger_render',
          joint: `${lado}:${nombreDedo}`,
          score: Math.max(0, 1 - estadoDedo.lagMs / 250),
          severity: 'error',
          state: 'VALID',
          action: 'inspect_filter_chain',
          code: 'finger_response_lag',
        });
      }
    }

    function moverMano3D(lado, puntos, meta, base) {
      if (cal.dedos3d === false || !base) return false;
      const rig = modeloManoIK(lado);
      if (!rig) return false;
      const frameTime = Number(meta.timestampMs) ||
        (typeof frameVivoTimestampMs !== 'undefined'
          ? Number(frameVivoTimestampMs) : 0);
      const t = frameTime || (typeof performance !== 'undefined' && performance.now
        ? performance.now() : Date.now());
      // El modo vivo llama a 60 Hz con el mismo cuadro de camara (~30 Hz): no se
      // vuelve a resolver lo que ya se resolvio, solo se reaplica.
      const ultimo = ultimoSolveManoIK[lado];
      if (ultimo && ultimo.t === t) {
        escribirDedosIK(lado, ultimo.items, meta);
        return true;
      }

      // Landmarks -> ejes del avatar (misma conversion que orientarMuneca) -> marco
      // local de la mano.
      const w = new Array(20);
      for (let i = 0; i < 20; i++) {
        const p = puntos[i];
        if (!Array.isArray(p) || p.length < 3 || !Number.isFinite(p[0]) ||
            !Number.isFinite(p[1]) || !Number.isFinite(p[2])) return true;
        const v = vectorBaseAvatar(new THREE.Vector3(
          p[0], p[1], cal.invertZ ? p[2] : -p[2]), base);
        w[i] = [v.x, v.y, v.z];
      }
      const P = ManoIK.aMarcoLocal(w, rig.marco, rig.mundoALocal, rig.palma);
      if (!P) return true; // landmarks degenerados: conservar ultima pose
      const resultado = ManoIK.resolverMano(rig.modelo, P, {
        estado: estadoManoIK[lado],
        sensibilidad: cal.fingerSensitivity,
      });
      if (!resultado) return true;

      const filtrar = typeof handAngleFilters3D !== 'undefined' &&
        webCameraState.smoothing;
      if (filtrar && ultimoAnguloTimestamp[lado] !== t) {
        ultimoAnguloTimestamp[lado] = t;
        ultimoDiagnosticoAngulos[lado] = {
          madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0,
          rawToFilteredRms: 0,
        };
      }
      const signo = rig.modelo.signoFlex;
      const items = [];
      for (let dedoIndex = 0; dedoIndex < kDedosIK.length; dedoIndex++) {
        const nombre = kDedosIK[dedoIndex];
        const esPulgar = nombre === 'Thumb';
        let entrada = null;
        if (esPulgar) {
          if (resultado.pulgar) entrada = resultado.pulgar.params.slice();
        } else {
          const r = resultado.dedos[nombre];
          if (r) entrada = [r[0].f, r[1].f, r[2].f, r[0].a, r[1].a, r[2].a];
        }
        if (!entrada) continue; // dedo sin datos: se queda como estaba
        let salida = entrada;
        let filtrado = null;
        if (filtrar) {
          filtrado = handAngleFilters3D[lado][dedoIndex].filter(
            entrada, t, frameVivoQuality || 1);
          if (filtrado) salida = filtrado.angles;
        }
        const quats = esPulgar
          ? ManoIK.cuaternionesPulgar(rig.modelo, salida)
          : [0, 1, 2].map((k) => ManoIK.cuaternionDedo(salida[k], salida[3 + k]));
        quats.forEach((q, k) => {
          items.push({
            hueso: rig.nodos[nombre][k],
            jointId: `${lado}:${nombre}:${rig.fases[nombre][k]}`,
            q: new THREE.Quaternion(q[0], q[1], q[2], q[3]),
          });
        });
        // Para el diagnostico: "cuanto se dobla" cada falange, en radianes.
        const magnitud = (v) => esPulgar
          ? [0, 1, 2].map((k) => Math.hypot(v[2 * k], v[2 * k + 1]))
          : [0, 1, 2].map((k) => Math.max(0, signo * v[k]));
        registrarDedoIK(lado, dedoIndex, nombre, magnitud(entrada), magnitud(salida),
          filtrado, t, meta);
        if (esPulgar) {
          const mags = magnitud(salida);
          rigThumbState[lado] = {
            closure: Math.max(0, Math.min(1, media3(mags) / 1.0)),
            flexions: mags,
            contacto: resultado.contacto?.peso ?? 0,
            dedoContacto: resultado.contacto?.dedo ?? null,
            espejo: resultado.espejo === true,
          };
        }
      }
      ultimoSolveManoIK[lado] = {t, items};
      escribirDedosIK(lado, items, meta);
      return true;
    }

    function media3(v) { return (v[0] + v[1] + v[2]) / 3; }
    // <<DEDOS3D_ADAPTADOR_FIN>>

    function moverMano(lado, presente, puntos, meta = {}, base = null) {
      // Si tracking pierde mano, presencia=0 significa conservar ultima
      // posicion valida. Asi no aparece un puño abierto durante un gap breve.
      if (!presente || !puntos) return;
      // Camino principal: direccion 3D de cada falange (ManoIK). El resto de
      // esta funcion es el metodo anterior (un angulo por falange); solo se
      // usa si el 3D no esta disponible.
      if (moverMano3D(lado, puntos, meta, base)) return;
      // puntos: 20 landmarks [x,y,z] relativos a la muneca, ya rotados y
      // escalados por sign_norm.dart.
      //
      // Cada dedo llega con sus cuatro puntos (nudillo, y las tres
      // articulaciones hasta la yema), asi que el angulo de cada falange se
      // mide directo: es el angulo entre un segmento del dedo y el anterior.
      //
      // La version anterior resumia el dedo entero en un solo numero -- la
      // distancia de la yema a la muneca -- y doblaba las tres falanges por
      // igual. Con eso un dedo doblado solo en el nudillo y uno en garra
      // daban la misma pose, y casi cualquier configuracion manual terminaba
      // viendose como un puno a medio cerrar. En LSM la configuracion manual
      // es la mitad del significado, asi que esa aproximacion se comia la
      // seña.
      const dedos = [
        ['Thumb', [0, 1, 2, 3]],
        ['Index', [4, 5, 6, 7]],
        ['Middle', [8, 9, 10, 11]],
        ['Ring', [12, 13, 14, 15]],
        ['Little', [16, 17, 18, 19]],
      ];
      const kFlexMax = 1.6; // tope por falange, para que no se doble de mas

      for (let dedoIndex = 0; dedoIndex < dedos.length; dedoIndex++) {
        const [nombreDedo, idx] = dedos[dedoIndex];
        const fases = nombreDedo === 'Thumb' ? kFasesPulgar : kFasesGenericas;
        let flex = [0, 0, 0];
        let datosValidos = false;

        if (presente && puntos) {
          const nudillo = puntos[idx[0]];
          const a = puntos[idx[1]];
          const b = puntos[idx[2]];
          const c = puntos[idx[3]];
          // Segmentos: palma->nudillo, y luego cada falange.
          const s0 = nudillo;              // la muneca es el origen
          const s1 = _resta(a, nudillo);
          const s2 = _resta(b, a);
          const s3 = _resta(c, b);
          if (_largo(s1) > 1e-5 && _largo(s2) > 1e-5 && _largo(s3) > 1e-5 &&
              _largo(s0) > 1e-5) {
          // Pulgar MediaPipe: wrist->CMC, CMC->MCP, MCP->IP, IP->punta.
          // VRM de este avatar expone exactamente tres huesos articulados:
          // Metacarpal (CMC), Proximal (MCP) y Distal (IP). Mapear cada
          // angulo a su hueso evita dejar la base rigida y evita duplicar CMC
          // en dos huesos, que producia una flexion artificial.
          const anguloCmc = _angulo(s0, s1);
          const anguloMcp = _angulo(s1, s2);
          const anguloIp = _angulo(s2, s3);
          let angulos = [anguloCmc, anguloMcp, anguloIp];
          if (nombreDedo === 'Thumb' && fases[0] === 'Metacarpal') {
            const medida = measureThumbPose(puntos);
            const resuelto = solveThumbPose(
              medida, cal.thumbCalibration[lado]);
            rigThumbState[lado] = resuelto;
            angulos = resuelto.flexions;
          }
          flex = angulos.map((x) => Math.min(kFlexMax,
            Math.max(0, x * cal.fingerSensitivity)));
          datosValidos = true;
          }
        }

        // Punto degenerado no debe abrir dedo de golpe: conservar ultima
        // rotacion valida hasta que cadena vuelva a ser utilizable.
        if (!datosValidos) continue;

        // XYZ de landmarks no se suaviza. One Euro opera sobre ángulos
        // articulares; un spike congela únicamente esta cadena un frame.
        const flexSemantico = flex.slice();
        const frameTime = Number(meta.timestampMs) ||
          (typeof frameVivoTimestampMs !== 'undefined'
            ? Number(frameVivoTimestampMs) : 0);
        const t = frameTime || (typeof performance !== 'undefined' && performance.now
          ? performance.now() : Date.now());
        if (typeof handAngleFilters !== 'undefined' &&
            webCameraState.smoothing) {
          if (ultimoAnguloTimestamp[lado] !== t) {
            ultimoAnguloTimestamp[lado] = t;
            ultimoDiagnosticoAngulos[lado] = {
              madOutliers: [], jumpRejectedChains: [], delayMs: 0,
              fingerLagMs: 0,
              rawToFilteredRms: 0,
            };
          }
          const filtrado = handAngleFilters[lado][dedoIndex].filter(
            flex, t, frameVivoQuality || 1);
          if (filtrado) {
            flex = filtrado.angles;
            const diag = ultimoDiagnosticoAngulos[lado];
            diag.madOutliers.push(...filtrado.diagnostics.madOutliers.map(
              (joint) => dedoIndex * 3 + joint));
            if (filtrado.diagnostics.jumpRejectedChains.length) {
              diag.jumpRejectedChains.push(dedoIndex);
            }
            diag.delayMs = Math.max(diag.delayMs,
              filtrado.diagnostics.delayMs);
            diag.rawToFilteredRms = Math.max(diag.rawToFilteredRms,
              filtrado.diagnostics.rawToFilteredRms);
          }
        }

        const estadoDedo = typeof fingerRenderState !== 'undefined'
          ? fingerRenderState[lado]?.[dedoIndex] : null;
        if (estadoDedo) {
          const media = (values) => values.reduce((sum, value) => sum + value, 0) /
            Math.max(1, values.length);
          estadoDedo.input = flexSemantico.slice();
          estadoDedo.render = flex.slice();
          estadoDedo.timestampMs = t;
          estadoDedo.samples.push({
            timestampMs: t,
            input: Math.min(1, media(flexSemantico) / kFlexMax),
            avatar: Math.min(1, media(flex) / kFlexMax),
          });
          if (estadoDedo.samples.length > 120) estadoDedo.samples.shift();
          estadoDedo.lagMs = measureFingerLag(estadoDedo.samples);
          ultimoDiagnosticoAngulos[lado].fingerLagMs = Math.max(
            ultimoDiagnosticoAngulos[lado].fingerLagMs ?? 0,
            estadoDedo.lagMs,
          );
          if (estadoDedo.lagMs > 66) {
            guardarAudit({
              frame: meta.frameId ?? null,
              timestampMs: t,
              stage: 'finger_render',
              joint: `${lado}:${nombreDedo}`,
              score: Math.max(0, 1 - estadoDedo.lagMs / 250),
              severity: 'error',
              state: 'VALID',
              action: 'inspect_filter_chain',
              code: 'finger_response_lag',
            });
          }
        }

        for (let i = 0; i < fases.length; i++) {
          const nombreHueso = VRMHumanBoneName[
            `${lado === 'left' ? 'Left' : 'Right'}${nombreDedo}${fases[i]}`];
          const h = nombreHueso ? bone(nombreHueso) : null;
          if (!h) continue;
          const rotacion = nombreDedo === 'Thumb'
            ? (() => {
              const mapa = thumbRigMap[lado][fases[i]] ?? {
                axis: 'z', sign: lado === 'left' ? 1 : -1,
              };
              const result = [0, 0, 0];
              result[['x', 'y', 'z'].indexOf(mapa.axis)] = mapa.sign * flex[i];
              return result;
            })()
            : [h.rotation.x, h.rotation.y, cal[lado].dedos * flex[i]];
          if (typeof aplicarRotacionSegura === 'function') {
            aplicarRotacionSegura(h, `${lado}:${nombreDedo}:${fases[i]}`,
              rotacion, meta, {
                handId: lado,
                expectedHandId: lado,
                recovery: meta.recovery === true,
                jointLimits: {
                  min: [-1.6, -1.6, -1.6],
                  max: [1.6, 1.6, 1.6],
                },
              });
          } else if (nombreDedo === 'Thumb') {
            const mapa = thumbRigMap[lado][fases[i]] ?? {
              axis: 'z', sign: lado === 'left' ? 1 : -1,
            };
            h.rotation.set(0, 0, 0);
            h.rotation[mapa.axis] = mapa.sign * flex[i];
          } else {
            h.rotation.z = cal[lado].dedos * flex[i];
          }
        }
      }
    }

    function ponerManoReposo(lado) {
      ultimoSolveManoIK[lado] = null;
      const dedos = [
        ['Thumb', kFasesPulgar], ['Index', kFasesGenericas],
        ['Middle', kFasesGenericas], ['Ring', kFasesGenericas],
        ['Little', kFasesGenericas],
      ];
      for (const [nombreDedo, fases] of dedos) {
        for (const fase of fases) {
          const nombreHueso = VRMHumanBoneName[
            `${lado === 'left' ? 'Left' : 'Right'}${nombreDedo}${fase}`];
          const h = nombreHueso ? bone(nombreHueso) : null;
          // Identidad completa: con ManoIK los dedos tambien giran de lado
          // (eje Y) y no solo se flexionan (eje Z).
          if (h) h.quaternion.identity();
        }
      }
    }

    // ---------------------------------------------------------------------
    // Orientacion 3D de la palma.
    //
    // Hand landmarks llegan relativos a muneca. Sus tres ejes utiles son:
    // X: muneca -> nudillo medio; Y: indice -> menique; Z: normal de palma.
    // Se construye el mismo marco en bind pose VRM y en cada frame. El delta
    // entre ambos se aplica en mundo y despues se convierte a local; asi la
    // solucion sigue al antebrazo y no depende de Euler X global.
    // ---------------------------------------------------------------------
    const kIdxIndiceMcp = 4, kIdxMedioMcp = 8, kIdxMeniqueMcp = 16;

    function orientarMuneca(lado, presente, puntos, base, meta = {}) {
      const mano = bone(lado === 'left'
        ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
      const referencia = refHand[lado];
      if (!mano || !referencia || !cal.usarMuneca) return;
      // Presencia=0 conserva ultima orientacion valida durante un gap.
      if (!presente || !puntos || !base) return;
      const puntoValido = (punto) => Array.isArray(punto) && punto.length >= 3 &&
        punto.slice(0, 3).every(Number.isFinite);
      const puntosClave = [0, kIdxIndiceMcp, kIdxMedioMcp, kIdxMeniqueMcp];
      if (!Array.isArray(puntos) ||
          !puntosClave.every((indice) => puntoValido(puntos[indice]))) return;

      const dedos = vectorManoAAvatar(puntos[kIdxMedioMcp], base);
      const ancho = vectorManoAAvatar([
        puntos[kIdxIndiceMcp][0] - puntos[kIdxMeniqueMcp][0],
        puntos[kIdxIndiceMcp][1] - puntos[kIdxMeniqueMcp][1],
        puntos[kIdxIndiceMcp][2] - puntos[kIdxMeniqueMcp][2],
      ], base);
      const cmc = vectorManoAAvatar(puntos[0], base);
      const objetivo = marcoMano(dedos, ancho, cmc);
      if (!objetivo) return; // landmarks degenerados: conservar ultima pose

      const qRest = new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          referencia.marco.x, referencia.marco.y, referencia.marco.z));
      const qObjetivo = new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          objetivo.x, objetivo.y, objetivo.z));
      const delta = qObjetivo.multiply(qRest.invert());
      const ajuste = new THREE.Quaternion().setFromAxisAngle(
        objetivo.x,
        cal[lado].palmaInv * (cal[lado].palmaOff + cal.wristCompensation));
      const mundo = ajuste.multiply(delta).multiply(referencia.qWorld);
      const padre = mano.parent.getWorldQuaternion(new THREE.Quaternion());
      if (typeof aplicarQuaternionSegura === 'function') {
        aplicarQuaternionSegura(mano, `${lado}:hand`,
          padre.invert().multiply(mundo), meta, {
            handId: lado, expectedHandId: lado,
            recovery: meta.recovery === true,
          });
      } else {
        mano.quaternion.copy(padre.invert().multiply(mundo));
      }
    }

    function ponerMunecaReposo(lado, meta = {}, seguro = false) {
      const mano = bone(lado === 'left'
        ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
      if (!mano) return;
      if (seguro && typeof aplicarQuaternionSegura === 'function') {
        const jointId = `${lado}:hand`;
        safetyGateFor(jointId).reset();
        aplicarQuaternionSegura(mano, jointId,
          new THREE.Quaternion(), meta, {
            handId: lado, expectedHandId: lado,
          });
        return;
      }
      mano.rotation.set(0, 0, 0);
    }

    function moverExpresionBasica(t) {
      // No hay datos faciales grabados (el pipeline de captura solo mira
      // pose + manos), asi que esto es generico: un parpadeo cada tanto
      // para que no se sienta un maniqui. Nada de esto viene de la seña.
      if (!vrm || !vrm.expressionManager) return;
      const ciclo = (t % 3.6);
      const parpadeo = ciclo > 3.4 ? (1 - (ciclo - 3.4) / 0.2) : (ciclo > 3.3 ? (ciclo - 3.3) / 0.1 : 0);
      vrm.expressionManager.setValue('blink', Math.max(0, Math.min(1, parpadeo)));
    }

    // ---------------------------------------------------------------------
    // Reproduccion de una secuencia de frames (ver dtw.dart / Template.seq)
    // ---------------------------------------------------------------------
    // Layout del vector normalizado, version 2.0.0 (152 dims). Ver
    // lib/sign_norm.dart. El cuerpo son 8 puntos x (x, y, z): hombros,
    // codos, munecas y caderas.
    const kOffBody = 0, kOffLocL = 24, kOffLocR = 27, kOffPresL = 30,
      kOffPresR = 31, kOffShapeL = 32, kOffShapeR = 92,
      kFrameDim = 152, kTFrames = 32;
    // Indices dentro del bloque de cuerpo, en PUNTOS (no en dimensiones).
    const kPtHombroI = 0, kPtHombroD = 1, kPtCodoI = 2, kPtCodoD = 3,
      kPtMunI = 4, kPtMunD = 5, kPtCaderaI = 6, kPtCaderaD = 7;

    // Suavizado visual único y sensible a grupo. MAD solo informa; no
    // sustituye movimientos válidos. Reconocimiento y grabación usan raw.
    const responsiveRigFilter = createResponsiveRigFilter({
      deadbands: {body: .003, wrist: .004, shape: 0},
    });
    const adaptiveMotionCalibrator = createAdaptiveMotionCalibrator({
      warmupMs: 1500,
      deadbands: {body: .003, wrist: .004},
    });
    const adaptivePoseScheduler = createAdaptivePoseScheduler({
      minStride: 2, maxStride: 4, processLimitMs: 50,
    });
    const handAngleFilters = {
      left: Array.from({length: 5}, () => createFastFingerAngleFilter(3)),
      right: Array.from({length: 5}, () => createFastFingerAngleFilter(3)),
    };
    // Estado de render separado del vector semántico. Conserva evidencia
    // numérica de entrada/salida para medir fingerLag sin guardar imágenes.
    const fingerRenderState = {
      left: Array.from({length: 5}, () => ({
        input: [0, 0, 0], render: [0, 0, 0], timestampMs: 0,
        samples: [], lagMs: 0,
      })),
      right: Array.from({length: 5}, () => ({
        input: [0, 0, 0], render: [0, 0, 0], timestampMs: 0,
        samples: [], lagMs: 0,
      })),
    };
    let ultimoAnguloTimestamp = {left: -1, right: -1};
    let ultimoDiagnosticoAngulos = {
      left: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
      right: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
    };
    let ultimoDiagnosticoFiltro = {
      madOutliers: [], madRepaired: [], jumpRejected: [], deadbandHeld: 0,
      delayMs: 0, rawToFilteredRms: 0, timestampRejected: false,
    };
    let ultimoModoSuavizado = webCameraState.smoothing;
    function reiniciarFiltroWeb() {
      filtroFrameWeb = null;
      filtroTimestampWeb = 0;
      responsiveRigFilter.reset();
      adaptiveMotionCalibrator.reset();
      adaptivePoseScheduler.reset();
      responsiveRigFilter.setDeadbands({body: .003, wrist: .004});
      for (const lado of ['left', 'right']) {
        for (const filtro of handAngleFilters[lado]) filtro.reset();
      }
      reiniciarManoIK();
      ultimoAnguloTimestamp = {left: -1, right: -1};
      ultimoDiagnosticoAngulos = {
        left: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
        right: {madOutliers: [], jumpRejectedChains: [], delayMs: 0, fingerLagMs: 0},
      };
      for (const lado of ['left', 'right']) {
        for (const dedo of fingerRenderState[lado]) {
          dedo.input = [0, 0, 0]; dedo.render = [0, 0, 0];
          dedo.timestampMs = 0; dedo.samples = []; dedo.lagMs = 0;
        }
      }
      resetSafetyGates();
      ultimoDiagnosticoFiltro = {
        madOutliers: [], madRepaired: [], jumpRejected: [], deadbandHeld: 0,
        delayMs: 0, rawToFilteredRms: 0, timestampRejected: false,
        motionScore: 0, motionByGroup: {body: 0, wrist: 0, shape: 0, presence: 0},
        fingerMotionScore: 0,
        intentionalMotion: false, quiet: true,
      };
      ultimoModoSuavizado = webCameraState.smoothing;
    }

    function suavizarFrameWeb(frame, timestampMs) {
      if (!Array.isArray(frame) || frame.length !== kFrameDim) return null;
      if (webCameraState.smoothing !== ultimoModoSuavizado) {
        reiniciarFiltroWeb();
      }
      const t = Number(timestampMs);
      const confianza = typeof frameVivoQuality !== 'undefined' &&
          Number(frameVivoQuality) > 0
        ? Math.max(0, Math.min(1, Number(frameVivoQuality))) : 1;
      const result = responsiveRigFilter.filter(frame, t, confianza);
      if (!result) return null;
      filtroFrameWeb = result.frame;
      filtroTimestampWeb = Number.isFinite(t) ? t : 0;
      ultimoDiagnosticoFiltro = result.diagnostics;
      const calibration = adaptiveMotionCalibrator.update(
        frame, t, result.diagnostics.motionScore);
      responsiveRigFilter.setDeadbands(calibration.deadbands);
      webCameraState.calibrationState = calibration.state;
      webCameraState.bodyDeadband = calibration.deadbands.body;
      webCameraState.wristDeadband = calibration.deadbands.wrist;
      webCameraState.motionScore = Number(result.diagnostics.motionScore ?? 0);
      webCameraState.fingerMotionScore = Number(
        result.diagnostics.fingerMotionScore ?? 0);
      webCameraState.motionQuiet = result.diagnostics.quiet === true;
      if (result.diagnostics.timestampRejected) {
        guardarAudit({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(), stage: 'filter', joint: null,
          score: 0, severity: 'error', state: 'REJECTED',
          action: 'hold_last', code: 'stale_frame',
        });
      }
      if (!webCameraState.smoothing) return frame.slice();
      return result.frame.slice();
    }

    window.suavizarFrameWeb = suavizarFrameWeb;

    let colaFrames = [];
    let frameActual = 0;
    let reproduciendo = false;
    let kFps = 30; // tracking y replay usan 30 FPS; render sigue a 60 FPS.
    let frameVivo = null;
    let frameVivoTimestampMs = 0;
    let frameVivoQuality = 0;
    let frameVivoFrameId = 0;
    let frameVivoSourceFrameId = 0;
    let ultimoSourceFrameRenderizado = 0;
    let frameVivoSourceSkewMs = 0;
    // Reloj local de recepcion. timestampMs puede venir de DateTime de Dart
    // (epoch) o de performance.now() web; no sirve para medir silencio entre
    // mensajes. Esto cubre tambien stream nativo detenido dentro de WebView.
    let frameVivoRecibidoAt = 0;
    let frameVivoExterno = false;
    let frameVivoStale = false;
    const kFrameStaleMs = 450;
    let filtroFrameWeb = null;
    let filtroTimestampWeb = 0;

    const kThumbCalibrationSteps = [
      {side: 'left', pose: 'open', text: 'Abre mano izquierda y extiende pulgar'},
      {side: 'left', pose: 'closed', text: 'Lleva pulgar izquierdo hacia palma'},
      {side: 'right', pose: 'open', text: 'Abre mano derecha y extiende pulgar'},
      {side: 'right', pose: 'closed', text: 'Lleva pulgar derecho hacia palma'},
    ];
    let thumbCalibrationSession = null;

    function medianValue(values) {
      const sorted = values.slice().sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[middle] :
        (sorted[middle - 1] + sorted[middle]) / 2;
    }

    function thumbPointsFromFrame(frame, side) {
      const presence = side === 'left' ? kOffPresL : kOffPresR;
      const offset = side === 'left' ? kOffShapeL : kOffShapeR;
      if (!Array.isArray(frame) || Number(frame[presence]) < .5) return null;
      return Array.from({length: 20}, (_, index) => [
        Number(frame[offset + index * 3]),
        Number(frame[offset + index * 3 + 1]),
        Number(frame[offset + index * 3 + 2]),
      ]);
    }

    function pintarPasoCalibracion(message = null) {
      const element = document.getElementById('diagCalibracion');
      if (!element) return;
      if (!thumbCalibrationSession) {
        element.textContent = message ?? 'Calibración inactiva';
        return;
      }
      const step = kThumbCalibrationSteps[thumbCalibrationSession.step];
      element.textContent = message ??
        `Paso ${thumbCalibrationSession.step + 1}/4: ${step.text}. ` +
        `${thumbCalibrationSession.samples.length}/20 estables`;
    }

    window.iniciarCalibracionPulgares = function () {
      window.configurarDiagnostico(true);
      thumbCalibrationSession = {step: 0, samples: [], measurements: {}};
      pintarPasoCalibracion();
      return true;
    };

    function resumenCalibracion(samples) {
      const distanceValues = samples.map((sample) => sample.distance);
      const angleValues = [0, 1, 2].map((index) =>
        samples.map((sample) => sample.angles[index]));
      const spreadDistance = Math.max(...distanceValues) - Math.min(...distanceValues);
      const spreadAngles = angleValues.map((values) =>
        Math.max(...values) - Math.min(...values));
      if (spreadDistance > .05 || spreadAngles.some((spread) => spread > .15)) {
        return null;
      }
      return {
        distance: medianValue(distanceValues),
        angles: angleValues.map(medianValue),
      };
    }

    function procesarCalibracionPulgares(frame, quality) {
      if (!thumbCalibrationSession) return;
      const step = kThumbCalibrationSteps[thumbCalibrationSession.step];
      const points = thumbPointsFromFrame(frame, step.side);
      if (!points || Number(quality) < .65) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion(`Paso ${thumbCalibrationSession.step + 1}/4: ` +
          `${step.text}. Tracking bajo; mantén pose y mano completa.`);
        return;
      }
      const measurement = measureThumbPose(points);
      if (!measurement) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion('Geometría de pulgar inválida; muestra mano completa.');
        return;
      }
      thumbCalibrationSession.samples.push(measurement);
      if (thumbCalibrationSession.samples.length < 20) {
        pintarPasoCalibracion();
        return;
      }
      const summary = resumenCalibracion(thumbCalibrationSession.samples);
      if (!summary) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion('Movimiento detectado. Repite pose y mantenla estable.');
        return;
      }
      thumbCalibrationSession.measurements[`${step.side}_${step.pose}`] = summary;
      thumbCalibrationSession.step++;
      thumbCalibrationSession.samples = [];
      if (thumbCalibrationSession.step < kThumbCalibrationSteps.length) {
        pintarPasoCalibracion();
        return;
      }
      try {
        const measurements = thumbCalibrationSession.measurements;
        cal.thumbCalibration.left = createThumbCalibration(
          measurements.left_open, measurements.left_closed, Date.now());
        cal.thumbCalibration.right = createThumbCalibration(
          measurements.right_open, measurements.right_closed, Date.now());
        const wire = thumbCalibrationWire();
        if (standaloneWeb) {
          localStorage.setItem('univoz.thumbCalibration.v2', JSON.stringify(wire));
        } else if (window.SenasChannel) {
          window.SenasChannel.postMessage('thumb_calibration:' + JSON.stringify(wire));
        }
        thumbCalibrationSession = null;
        pintarPasoCalibracion('Calibración guardada para ambas manos.');
      } catch (error) {
        thumbCalibrationSession = null;
        errorDiagnostico('calibration', 'thumb_poses_not_distinct');
        pintarPasoCalibracion('Poses demasiado parecidas. Reinicia calibración.');
      }
    }

    // ---------------------------------------------------------------------
    // Cámara web + MediaPipe Tasks Vision
    //
    // El navegador procesa video en memoria: no se graba video ni se envia
    // imagen fuera de la pagina. Solo el ultimo vector normalizado llega al
    // mismo RigBody que usa Flutter. detectForVideo es sincrono, asi que esta
    // unica rAF funciona como compuerta natural: tracking cerca de 30 FPS,
    // render siempre a 60 FPS, cero cola creciente.
    // ---------------------------------------------------------------------
    let camaraStream = null;
    let poseLandmarkerWeb = null;
    let handLandmarkerWeb = null;
    let preloadedLandmarkersWeb = null;
    let detectorWarmupWeb = null;
    let camaraLoopId = 0;
    let camaraUltimoVideoTime = -1;
    let camaraUltimoTimestampMs = 0;
    let camaraFpsInicio = 0;
    let camaraFpsFrames = 0;
    let camaraInputQualityInicio = 0;
    let camaraInputQualityFrames = 0;
    let camaraInputQualityDropped = 0;
    const camaraTimings = {pose: [], hand: [], process: [], render: []};
    let renderFpsInicio = 0;
    let renderFpsFrames = 0;
    let camaraTrackingFpsFrames = 0;
    let camaraPoseFpsFrames = 0;
    let webCaptureFrameIndex = 0;
    let webPoseCache = null;
    let webGrabacion = [];
    let webUltimaSecuencia = null;

    function percentilWeb(values, percentile = .95) {
      if (!values.length) return 0;
      const sorted = values.slice().sort((a, b) => a - b);
      const index = Math.min(sorted.length - 1,
        Math.ceil((sorted.length - 1) * percentile));
      return sorted[index];
    }

    function registrarTiempoWeb(stage, elapsedMs) {
      const value = Math.max(0, Number(elapsedMs) || 0);
      const samples = camaraTimings[stage];
      samples.push(value);
      if (samples.length > 60) samples.shift();
      const current = `${stage}Ms`;
      const p95 = `${stage}P95Ms`;
      webCameraState[current] = value;
      webCameraState[p95] = percentilWeb(samples);
      webPerformanceMetrics.recordStage(stage, value);
      actualizarMetricasWeb();
    }

    function actualizarMetricasWeb() {
      const report = webPerformanceMetrics.snapshot();
      for (const stage of ['pose', 'hand', 'process']) {
        const summary = report.stages[stage];
        if (!summary) continue;
        webCameraState[`${stage}P50Ms`] = summary.p50_ms;
        webCameraState[`${stage}P95Ms`] = summary.p95_ms;
        webCameraState[`${stage}P99Ms`] = summary.p99_ms;
      }
      webCameraState.latencyP50Ms = report.latency_ms.p50_ms;
      webCameraState.latencyP95Ms = report.latency_ms.p95_ms;
      webCameraState.latencyP99Ms = report.latency_ms.p99_ms;
      webCameraState.metricsFrames = report.frames.total;
    }

    function reiniciarTiemposWeb() {
      for (const samples of Object.values(camaraTimings)) samples.length = 0;
      for (const key of [
        'poseMs', 'handMs', 'processMs',
        'poseP50Ms', 'poseP95Ms', 'poseP99Ms',
        'handP50Ms', 'handP95Ms', 'handP99Ms',
        'processP50Ms', 'processP95Ms', 'processP99Ms',
      ]) webCameraState[key] = 0;
      webCameraState.framesSkipped = 0;
    }

    function webCoord(p) {
      if (Array.isArray(p)) {
        return {
          x: Number(p[0]), y: Number(p[1]), z: Number(p[2]),
          visibility: Number(p[3] ?? 0),
        };
      }
      return {
        x: Number(p?.x), y: Number(p?.y), z: Number(p?.z),
        visibility: Number(p?.visibility ?? 0),
      };
    }

    function webFinito(p) {
      return Number.isFinite(p.x) && Number.isFinite(p.y) &&
        Number.isFinite(p.z);
    }

    function puntoEnCuadroWeb(p) {
      return webFinito(p) && p.x >= 0 && p.x <= 1 &&
        p.y >= 0 && p.y <= 1;
    }

    // No alimentar normalizador con manos parcialmente corruptas. MediaPipe
    // puede devolver un punto aislado fuera de cuadro durante oclusion; si se
    // acepta, ese punto deforma angulo y orientacion de toda mano.
    const kMargenManoWeb = 0.15;
    const kMargenCuerpoWeb = 0.15;
    const kConexionesManoWeb = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17],
    ];

    function webDistancia(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
    }

    function webManoUtilizable(hand, side = null) {
      const fail = (code, landmark = null) => {
        if (typeof errorDiagnostico === 'function') {
          errorDiagnostico('capture', code, side, landmark);
        }
        return false;
      };
      if (!Array.isArray(hand) || hand.length !== 21) {
        return fail('hand_landmarks_incomplete');
      }
      const puntos = hand.map(webCoord);
      const nonFinite = puntos.findIndex((p) => !webFinito(p));
      if (nonFinite >= 0) return fail('point_non_finite', nonFinite);
      // Wrist must be in view; tips may leave a small margin at frame edge.
      if (!puntoEnCuadroWeb(puntos[0])) return fail('wrist_out_of_frame', 0);
      const dentro = puntos.filter((p) => p.x >= -kMargenManoWeb &&
        p.x <= 1 + kMargenManoWeb && p.y >= -kMargenManoWeb &&
        p.y <= 1 + kMargenManoWeb).length;
      if (dentro < 15) {
        const outside = puntos.findIndex((p) => p.x < -kMargenManoWeb ||
          p.x > 1 + kMargenManoWeb || p.y < -kMargenManoWeb ||
          p.y > 1 + kMargenManoWeb);
        return fail('hand_out_of_frame', outside >= 0 ? outside : null);
      }
      const escala = Math.hypot(puntos[9].x - puntos[0].x,
        puntos[9].y - puntos[0].y);
      if (!Number.isFinite(escala) || escala < 0.015 || escala > 0.65) {
        return fail('hand_scale_invalid', 9);
      }
      // Each connection must stay plausible relative to middle-MCP scale.
      // This catches landmark swaps/spikes while tolerating open/closed hands.
      for (const [a, b] of kConexionesManoWeb) {
        const d = webDistancia(puntos[a], puntos[b]);
        if (!Number.isFinite(d) || d < escala * 0.018 ||
            d > escala * 2.2) return fail('hand_segment_invalid', b);
      }
      return true;
    }

    function webPoseGeometriaValida(pose, poseMundo) {
      const falla = (motivo, landmark = null) => {
        if (typeof webCameraState !== 'undefined') {
          webCameraState.validation = motivo;
        }
        if (typeof errorDiagnostico === 'function') {
          errorDiagnostico('capture', motivo, null, landmark);
        }
        return false;
      };
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) {
        return falla('pose-formato');
      }
      const anclas = [11, 12, 23, 24];
      for (const i of anclas) {
        const p = webCoord(pose[i]);
        // Hombros deben estar visibles en imagen; caderas pueden quedar
        // fuera del recorte superior, pero worldLandmarks siguen siendo
        // validos para formar eje vertical del torso.
        const hombroEnMargen = p.x >= -kMargenCuerpoWeb &&
          p.x <= 1 + kMargenCuerpoWeb && p.y >= -kMargenCuerpoWeb &&
          p.y <= 1 + kMargenCuerpoWeb;
        if ((i === 11 || i === 12) &&
            (!webFinito(p) || !hombroEnMargen)) {
          return falla('shoulder_out_of_frame', i);
        }
        const visNecesaria = i === 11 || i === 12;
        if (!webFinito(p) || (visNecesaria &&
            (!Number.isFinite(p.visibility) || p.visibility < 0.2)) ||
            !webFinito(webCoord(poseMundo[i]))) {
          return falla('pose_anchor_unsafe', i);
        }
      }
      const mundo = poseMundo.map(webCoord);
      const hombros = webDistancia(mundo[11], mundo[12]);
      if (!Number.isFinite(hombros) || hombros < 1e-3) {
        return falla('hombros-degenerados');
      }
      const segmentos = [[11, 13], [13, 15], [12, 14], [14, 16], [23, 24]];
      for (const [a, b] of segmentos) {
        const d = webDistancia(mundo[a], mundo[b]);
        if (!Number.isFinite(d) || d < hombros * 0.08 ||
            d > hombros * 2.5) return falla('pose_segment_invalid', b);
      }
      const centroHombros = {
        x: (mundo[11].x + mundo[12].x) * 0.5,
        y: (mundo[11].y + mundo[12].y) * 0.5,
        z: (mundo[11].z + mundo[12].z) * 0.5,
      };
      const centroCaderas = {
        x: (mundo[23].x + mundo[24].x) * 0.5,
        y: (mundo[23].y + mundo[24].y) * 0.5,
        z: (mundo[23].z + mundo[24].z) * 0.5,
      };
      const tronco = webDistancia(centroHombros, centroCaderas);
      if (!Number.isFinite(tronco) || tronco <= hombros * 0.25 ||
          tronco >= hombros * 4.0) return falla('tronco-invalido');
      return true;
    }

    function webResta(a, b) {
      return [a.x - b.x, a.y - b.y, a.z - b.z];
    }

    function webPuntoResta(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function webLargo(a) {
      return Math.hypot(a[0], a[1], a[2]);
    }

    function webUnitario(a) {
      const m = webLargo(a);
      return m < 1e-6 ? null : [a[0] / m, a[1] / m, a[2] / m];
    }

    function webPto(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function webCruz(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
    }

    function webBaseCuerpo(world) {
      const hombroI = webCoord(world[11]);
      const hombroD = webCoord(world[12]);
      const caderaI = webCoord(world[23]);
      const caderaD = webCoord(world[24]);
      if (!webFinito(hombroI) || !webFinito(hombroD) ||
          !webFinito(caderaI) || !webFinito(caderaD)) {
        return null;
      }
      const escala = webLargo(webResta(hombroD, hombroI));
      if (!Number.isFinite(escala) || escala < 1e-6) return null;

      const derecha = webUnitario(webResta(hombroD, hombroI));
      if (!derecha) return null;
      const origen = [
        (hombroI.x + hombroD.x) * 0.5,
        (hombroI.y + hombroD.y) * 0.5,
        (hombroI.z + hombroD.z) * 0.5,
      ];
      const centroCaderas = [
        (caderaI.x + caderaD.x) * 0.5,
        (caderaI.y + caderaD.y) * 0.5,
        (caderaI.z + caderaD.z) * 0.5,
      ];
      const tronco = webPuntoResta(
        origen, centroCaderas);
      const arriba = webUnitario([
        tronco[0] - derecha[0] * webPto(tronco, derecha),
        tronco[1] - derecha[1] * webPto(tronco, derecha),
        tronco[2] - derecha[2] * webPto(tronco, derecha),
      ]);
      if (!arriba) return null;
      const frente = webUnitario(webCruz(arriba, derecha));
      if (!frente) return null;
      return { derecha, arriba, frente, origen, escala };
    }

    function webProyectar(base, punto) {
      const p = webCoord(punto);
      if (!webFinito(p)) return null;
      const q = [
        p.x - base.origen[0],
        p.y - base.origen[1],
        p.z - base.origen[2],
      ];
      return [
        webPto(q, base.derecha) / base.escala,
        webPto(q, base.arriba) / base.escala,
        webPto(q, base.frente) / base.escala,
      ];
    }

    /**
     * Espejo JS de normalizeFrame() en sign_norm.dart/sign_norm.py.
     * Entrada: resultados crudos de PoseLandmarker y HandLandmarker.
     * Salida: vector MotionFrameV2, exactamente 152 valores o null.
     */
    function normalizarFrameWeb(pose, poseMundo, left, right,
      renderWrists = null) {
      webCameraState.validation = '';
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) {
        errorDiagnostico('capture', 'pose_format');
        return null;
      }
      const ls = webCoord(pose[11]);
      const rs = webCoord(pose[12]);
      if (!webFinito(ls) || !webFinito(rs) ||
          ls.visibility < 0.5 || rs.visibility < 0.5) {
        errorDiagnostico('capture', 'shoulder_confidence_low');
        return null;
      }

      const bodyIdx = [11, 12, 13, 14, 15, 16, 23, 24];
      if (bodyIdx.some((i) => !webFinito(webCoord(poseMundo[i])))) {
        errorDiagnostico('capture', 'pose_world_non_finite');
        return null;
      }
      if (!webPoseGeometriaValida(pose, poseMundo)) {
        if (!webCameraState.validation) webCameraState.validation = 'pose-geometria';
        return null;
      }
      const base = webBaseCuerpo(poseMundo);
      if (!base) return null;

      const dx = rs.x - ls.x;
      const dy = rs.y - ls.y;
      const escalaImg = Math.hypot(dx, dy);
      if (escalaImg < 1e-6) return null;
      const cosT = dx / escalaImg;
      const sinT = dy / escalaImg;
      const out = Array(152).fill(0);

      for (let i = 0; i < bodyIdx.length; i++) {
        const q = webProyectar(base, poseMundo[bodyIdx[i]]);
        if (!q) return null;
        out[i * 3] = q[0];
        out[i * 3 + 1] = q[1];
        out[i * 3 + 2] = q[2];
      }

      const manos = [
        [left, 'left', 24, 30, 32, 15],
        [right, 'right', 27, 31, 92, 16],
      ];
      for (const [rawHand, side, offLoc, offPres, offShape, poseWrist] of manos) {
        if (!Array.isArray(rawHand) || rawHand.length !== 21) continue;
        const hand = rawHand.map(webCoord);
        if (!webManoUtilizable(hand, side)) {
          webCameraState.validation = 'mano-geometria';
          continue;
        }
        const q = webProyectar(base, poseMundo[poseWrist]);
        if (!q) continue;
        // Pose wrist can lag one or two inference frames. Render position
        // follows stabilized hand wrist, while semantic vector keeps raw pose
        // wrist above. Project image residual into body axes, bounded.
        const stableWrist = webCoord(renderWrists?.[side]);
        const poseWristImage = webCoord(pose?.[poseWrist]);
        if (webFinito(stableWrist) && webFinito(poseWristImage)) {
          const imageDx = (stableWrist.x - poseWristImage.x) / escalaImg;
          const imageDy = (stableWrist.y - poseWristImage.y) / escalaImg;
          const bodyDx = imageDx * cosT + imageDy * sinT;
          const bodyDy = -imageDx * sinT + imageDy * cosT;
          q[0] += Math.max(-.75, Math.min(.75, bodyDx));
          q[1] += Math.max(-.75, Math.min(.75, bodyDy));
        }
        out[offLoc] = q[0];
        out[offLoc + 1] = q[1];
        out[offLoc + 2] = q[2];
        out[offPres] = 1;

        const w = hand[0];
        const m = hand[9];
        let escalaMano = Math.hypot(m.x - w.x, m.y - w.y);
        if (escalaMano < 1e-6) escalaMano = escalaImg * 0.25;
        for (let j = 1; j < 21; j++) {
          const p = hand[j];
          const qx = p.x - w.x;
          const qy = p.y - w.y;
          const k = offShape + (j - 1) * 3;
          out[k] = (qx * cosT + qy * sinT) / escalaMano;
          out[k + 1] = (-qx * sinT + qy * cosT) / escalaMano;
          out[k + 2] = (p.z - w.z) / escalaMano;
        }
      }
      return out.every(Number.isFinite) ? out : null;
    }

    window.normalizarFrameWeb = normalizarFrameWeb;

    function pintarOverlayWeb(pose, left, right) {
      const video = document.getElementById('camaraVideo');
      const canvas = document.getElementById('camaraOverlay');
      if (!video || !canvas || !video.videoWidth || !video.videoHeight) return;
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      diagnosticOverlayPoints = [];
      ctx.lineWidth = Math.max(2, canvas.width / 320);
      ctx.strokeStyle = '#44e37a';
      ctx.fillStyle = '#44e37a';
      const pxy = (p) => {
        const q = webCoord(p);
        return puntoEnCuadroWeb(q)
          ? [q.x * canvas.width, q.y * canvas.height] : null;
      };
      const line = (a, b, color) => {
        const pa = pxy(a), pb = pxy(b);
        if (!pa || !pb) return;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(pa[0], pa[1]);
        ctx.lineTo(pb[0], pb[1]);
        ctx.stroke();
      };
      const dot = (p, color, stream = 'pose', side = null, landmark = null) => {
        const q = pxy(p);
        if (!q) return;
        const issue = diagnosticPointIssues.find((item) =>
          item.side === side && item.landmark === landmark);
        const diagnosticColor = issue?.status === 'yellow' ? '#f5b400' :
          issue ? '#e32636' : webCameraState.quality < .55 ? '#f5b400' : '#24b35a';
        ctx.fillStyle = diagnosticoActivo ? diagnosticColor : color;
        ctx.beginPath();
        ctx.arc(q[0], q[1], Math.max(2, canvas.width / 160), 0, Math.PI * 2);
        ctx.fill();
        if (diagnosticoActivo) diagnosticOverlayPoints.push({
          x: q[0], y: q[1], stream, side, landmark,
          code: issue?.code ?? (webCameraState.quality < .55 ? 'confidence_low' : 'valid'),
        });
      };
      const label = (p, text, color) => {
        const q = pxy(p);
        if (!q) return;
        ctx.fillStyle = color;
        ctx.font = `bold ${Math.max(11, canvas.width / 30)}px sans-serif`;
        ctx.fillText(text, q[0] + 5, q[1] - 5);
      };
      const poseEdges = [
        [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
        [11, 23], [12, 24], [23, 24],
      ];
      for (const [a, b] of poseEdges) line(pose?.[a], pose?.[b], '#44e37a');
      // Colores I/D trazan cadena anatómica Pose -> mano. No representan
      // lado visual de pantalla y permiten detectar inversión de orientación.
      for (const [shoulder, elbow, wrist, color, shoulderLabel, wristLabel] of [
        [11, 13, 15, '#ff9f43', 'H-I', 'I'],
        [12, 14, 16, '#62b7ff', 'H-D', 'D'],
      ]) {
        line(pose?.[shoulder], pose?.[elbow], color);
        line(pose?.[elbow], pose?.[wrist], color);
        label(pose?.[shoulder], shoulderLabel, color);
        label(pose?.[wrist], wristLabel, color);
      }
      for (const [hand, etiqueta, color] of [
        [left, 'I', '#ff9f43'], [right, 'D', '#62b7ff'],
      ]) {
        if (!hand) continue;
        const handEdges = [
          [0, 1], [1, 2], [2, 3], [3, 4],
          [0, 5], [5, 6], [6, 7], [7, 8],
          [0, 9], [9, 10], [10, 11], [11, 12],
          [0, 13], [13, 14], [14, 15], [15, 16],
          [0, 17], [17, 18], [18, 19], [19, 20],
          [5, 9], [9, 13], [13, 17],
        ];
        for (const [a, b] of handEdges) line(hand[a], hand[b], color);
        for (let index = 0; index < hand.length; index++) {
          dot(hand[index], color, 'hand', etiqueta === 'I' ? 'left' : 'right', index);
        }
        const muñeca = pxy(hand[0]);
        if (muñeca) {
          ctx.fillStyle = color;
          ctx.font = `bold ${Math.max(12, canvas.width / 24)}px sans-serif`;
          ctx.fillText(etiqueta, muñeca[0] + 6, muñeca[1] - 6);
        }
      }
      if (pose) {
        for (let index = 0; index < pose.length; index++) {
          dot(pose[index], '#44e37a', 'pose', null, index);
        }
      }
    }

    function pintarEstadoCamaraWeb() {
      const estado = document.getElementById('camaraEstado');
      const stats = document.getElementById('camaraStats');
      const iniciar = document.getElementById('bIniciarCamara');
      const detener = document.getElementById('bDetenerCamara');
      const grabar = document.getElementById('bGrabarCamara');
      const repetir = document.getElementById('bRepetirCamara');
      const descargar = document.getElementById('bDescargarCamara');
      if (!estado || !stats || !iniciar || !detener ||
          !grabar || !repetir || !descargar) return;
      const s = webCameraState;
      estado.className = 'camaraEstado' +
        (s.error || s.detectorError ? ' error' : s.running ? ' ok' : '');
      estado.textContent = s.loading ? 'Cargando…' : s.error || s.detectorError ? 'Error' :
        s.running ? 'Activa' : s.detectorsLoading ? 'Detectores…' : 'Apagada';
      iniciar.disabled = s.loading || s.running;
      detener.disabled = !s.running && !s.loading;
      grabar.disabled = !s.running || s.recording;
      repetir.disabled = !webUltimaSecuencia;
      descargar.disabled = !webUltimaSecuencia;
      const calidad = s.quality > 0 ? Math.round(s.quality * 100) + '%' : '—';
      stats.textContent = 'Pose: ' + (s.pose ? 'sí' : 'no') +
        ' · I: ' + (s.leftHand ? 'sí (' + s.leftHandPoints + ')' : 'no') +
        ' · D: ' + (s.rightHand ? 'sí (' + s.rightHandPoints + ')' : 'no') +
        ' · Vector: ' + (s.lastVectorDim || '—') +
        ' · Q: ' + calidad + ' · entrada ' +
        (s.inputFps ? Number(s.inputFps).toFixed(0) : '—') +
        ' FPS (cfg ' + (s.captureFps ? Number(s.captureFps).toFixed(0) : '—') +
        ') · track ' + (s.trackingFps || 0) + ' · pose ' + (s.poseFps || 0) +
        ' · render ' + s.renderFps + ' FPS · M ' +
        Number(s.motionScore ?? 0).toFixed(2) +
        ' · dedos ' + Number(s.fingerMotionScore ?? 0).toFixed(2) +
        (s.motionQuiet ? ' quieto' : ' movimiento') +
        ' · P/H ' + Number(s.poseP95Ms ?? 0).toFixed(1) + '/' +
        Number(s.handP95Ms ?? 0).toFixed(1) + ' ms' +
        ' · proc ' + Number(s.processP95Ms ?? 0).toFixed(1) + ' ms' +
        ' · L ' + Number(s.latencyP50Ms ?? 0).toFixed(1) + '/' +
        Number(s.latencyP95Ms ?? 0).toFixed(1) + '/' +
        Number(s.latencyP99Ms ?? 0).toFixed(1) + ' ms' +
        ' · drop ' + (s.framesSkipped || 0) +
        ' · válidos ' + s.validFrames +
        ' · lados: ' + (s.handAssignmentMode || 'none') +
        ' · stride ' + (s.poseStride || 2) +
        ' · calib ' + (s.calibrationState || 'WARMUP') +
        (s.recording ? ' · grabando ' + s.recordedFrames + '/32' :
          s.lastSequenceFrames ? ' · secuencia lista' : '') +
        (s.stale ? ' · sin tracking' : '') +
        (s.validation ? ' · ' + s.validation : '');
    }

    function siguienteTimestampWeb() {
      // MediaPipe Tasks Web espera reloj monotónico en milisegundos. Usar
      // epoch (~1e12) desborda timestamp interno y detiene CalculatorGraph.
      const ahora = Math.round(performance.now());
      camaraUltimoTimestampMs = Math.max(ahora, camaraUltimoTimestampMs + 1);
      return camaraUltimoTimestampMs;
    }

    const webHandTracker = createHandTrackCoordinator();
    // `hand_assignment_hysteresis` is numeric evidence when continuity holds
    // identity through a transient contradictory arm-chain label.
    let ultimoTrackingWeb = null;
    let ultimoSourceMeta = null;
    const wristDisagreementState = {
      left: {frames: 0, reported: false},
      right: {frames: 0, reported: false},
    };

    function reiniciarDesacuerdoMuñeca() {
      for (const state of Object.values(wristDisagreementState)) {
        state.frames = 0;
        state.reported = false;
      }
    }

    function manosDesdeResultado(resultado, pose, timestampMs = 0) {
      const manos = resultado?.landmarks ?? [];
      const etiquetas = resultado?.handednesses ?? resultado?.handedness ?? [];
      const t = Number(timestampMs);
      const hombroI = webCoord(pose?.[11]);
      const hombroD = webCoord(pose?.[12]);
      const anchoHombros = webFinito(hombroI) && webFinito(hombroD)
        ? Math.max(.05, Math.hypot(
          hombroI.x - hombroD.x, hombroI.y - hombroD.y)) : .4;
      const candidatosCrudos = manos.map((mano, index) => {
        const categoria = etiquetas?.[index]?.[0] ?? {};
        return {
          landmarks: mano,
          side: String(categoria.categoryName ?? ''),
          confidence: Number(categoria.score ?? .5),
        };
      });
      const asignacion = assignHandsByArmChain(candidatosCrudos, {
        leftShoulder: hombroI,
        rightShoulder: hombroD,
        leftElbow: webCoord(pose?.[13]),
        rightElbow: webCoord(pose?.[14]),
        leftWrist: webCoord(pose?.[15]),
        rightWrist: webCoord(pose?.[16]),
        shoulderWidth: anchoHombros,
      });
      webCameraState.handAssignmentMode = asignacion.mode === 'pose_arm_chain' ||
        asignacion.mode === 'ambiguous' ? asignacion.mode : 'pose_pending';
      if (asignacion.mode === 'ambiguous') {
        webCameraState.validation = 'hand_side_ambiguous';
        diagnosticErrors.push({stage: 'association', code: 'hand_side_ambiguous'});
        guardarAudit({
          frame: frameVivoFrameId + 1,
          timestampMs: t || performance.now(),
          stage: 'association', joint: null, score: .5,
          severity: 'warn', state: 'AMBIGUOUS', action: 'hold_track',
          code: 'hand_side_ambiguous',
        });
      }
      const candidatosTrack = candidatosCrudos.map((candidato, index) => {
        const categoria = etiquetas?.[index]?.[0] ?? {};
        const anatomia = resolveAnatomicalHandSide(asignacion, index);
        const completa = webManoUtilizable(candidato.landmarks, anatomia.side);
        return {
          landmarks: completa ? candidato.landmarks : null,
          side: completa ? anatomia.side : null,
          sideLocked: completa && anatomia.sideLocked,
          sideAmbiguous: completa && anatomia.sideAmbiguous,
          confidence: Number(categoria.score ?? .5),
        };
      });
      const poseHint = asignacion.mode === 'pose_arm_chain' ? {
        leftWrist: webCoord(pose?.[15]),
        rightWrist: webCoord(pose?.[16]),
        shoulderWidth: anchoHombros,
      } : null;
      ultimoTrackingWeb = webHandTracker.update(candidatosTrack, poseHint, t);
      diagnosticErrors.push(...ultimoTrackingWeb.diagnostics.errors);
      const trackingErrors = ultimoTrackingWeb.diagnostics.errors;
      webCameraState.leftSurface = ultimoTrackingWeb.left.surface ?? 'unknown';
      webCameraState.rightSurface = ultimoTrackingWeb.right.surface ?? 'unknown';
      webCameraState.handHolds += trackingErrors.filter((error) =>
        error.code === 'hand_position_held' || error.code === 'hand_surface_flip').length;
      webCameraState.handRecoveries += ['left', 'right'].filter((side) =>
        ultimoTrackingWeb[side].recoveryFrames === 2 &&
        trackingErrors.some((error) => error.side === side &&
          error.code === 'hand_recovered')).length;
      webCameraState.handSwaps += trackingErrors.filter((error) =>
        error.code === 'hand_identity_swap').length;
      webCameraState.surfaceFlips =
        (ultimoTrackingWeb.left.surfaceChanges ?? 0) +
        (ultimoTrackingWeb.right.surfaceChanges ?? 0);
      const continuityHeld = ultimoTrackingWeb.diagnostics.errors.some((error) =>
        error.code === 'hand_assignment_hysteresis');
      const wristFusionMode = classifySourceSkew(
        Math.abs(t - (webPoseCache?.timestampMs ?? t))).mode;
      for (const [side, poseIndex] of [['left', 15], ['right', 16]]) {
        const track = ultimoTrackingWeb[side];
        const handWrist = webCoord(track.detected?.[0]);
        const poseWrist = webCoord(pose?.[poseIndex]);
        if (webFinito(handWrist) && webFinito(poseWrist)) {
          const residual = Math.hypot(
            handWrist.x - poseWrist.x, handWrist.y - poseWrist.y) /
            anchoHombros;
          // A cached pose can be up to 120 ms older than hands. Do not call
          // that expected temporal skew a broken union; only direct fusion
          // may raise wrist disagreement.
          const disagreement = residual > .25 && !continuityHeld &&
            wristFusionMode === 'direct';
          const state = wristDisagreementState[side];
          if (disagreement) {
            state.frames++;
            // One crossing or one noisy direct frame is not enough to declare
            // a broken union. Require persistence, then report once per episode.
            if (state.frames >= 3 && !state.reported) {
              state.reported = true;
              errorDiagnostico('fusion', 'wrist_disagreement', side, 0,
                'yellow');
            }
          } else {
            state.frames = 0;
            state.reported = false;
          }
        }
      }
      return {
        // Recognition keeps detector evidence raw. Avatar render consumes
        // stabilized landmarks below, preventing gates from contaminating
        // semantic input while still blocking visual jumps.
        left: ultimoTrackingWeb.left.raw ?? ultimoTrackingWeb.left.detected,
        right: ultimoTrackingWeb.right.raw ?? ultimoTrackingWeb.right.detected,
        renderLeft: ultimoTrackingWeb.left.renderLandmarks,
        renderRight: ultimoTrackingWeb.right.renderLandmarks,
        renderWrists: {
          left: ultimoTrackingWeb.left.renderLandmarks?.[0] ?? null,
          right: ultimoTrackingWeb.right.renderLandmarks?.[0] ?? null,
        },
        tracking: ultimoTrackingWeb,
      };
    }

    function calcularCalidadFrameWeb(pose, poseMundo, left, right) {
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) return 0;
      const cuerpo = [11, 12, 13, 14, 15, 16, 23, 24]
        .map((i) => webCoord(pose[i]).visibility);
      if (cuerpo.some((v) => !Number.isFinite(v))) return 0;
      // El mínimo es demasiado sensible: un codo parcialmente tapado hunde
      // Q aunque hombros y caderas sigan siendo utilizables. Promedio evita
      // ese falso cero y mantiene rango [0,1].
      const visibilidad = Math.max(0, Math.min(1,
        cuerpo.reduce((total, valor) => total + Math.max(0, Math.min(1, valor)), 0)
          / cuerpo.length));
      // Una mano basta para una seña valida. Dos manos suben calidad, pero
      // perder una no degrada frame completo a cero.
      const manos = left && right ? 1 : left || right ? 0.82 : 0.65;
      return Math.max(0, Math.min(1, visibilidad * 0.75 + manos * 0.25));
    }

    function procesarCamaraWeb() {
      if (!webCameraState.running) return;
      const video = document.getElementById('camaraVideo');
      // Diferenciar FPS configurados de FPS reales entregados por la fuente.
      // Un navegador puede negociar 30 FPS y entregar menos frames al video.
      const ahoraEntrada = performance.now();
