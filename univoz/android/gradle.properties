org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# org.gradle.java.home apuntaba a C:\Users\figue\Downloads\oracleJdk-25, una ruta
# que Gradle no reconoce como un JDK valido (probablemente el zip nunca se
# extrajo ahi, o quedo en una subcarpeta anidada). El proyecto compila con
# Java 17 (ver android/app/build.gradle.kts), asi que lo mas seguro es dejar
# que Gradle detecte automaticamente el JDK que trae Android Studio en vez de
# forzar una ruta manual. Si mas adelante quieres fijar un JDK especifico,
# usa uno 17-21 y confirma antes que <esa-ruta>\bin\java.exe exista.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# El proyecto vive en D:\ y el pub cache (paquetes de Flutter/Dart, incluido
# flutter_tts) vive en C:\Users\PC\AppData\Local\Pub\Cache\. El compilador de
# Kotlin (incremental) intenta calcular una ruta relativa entre archivos de
# ambas unidades para sus cachés, y en Windows eso falla con "this and base
# files have different roots", tumbando el build (compileDebugKotlin de
# flutter_tts). Desactivar la compilación incremental de Kotlin evita ese
# código y soluciona el crash; el único costo es una recompilación de Kotlin
# un poco más lenta (no afecta al resto de la build de Flutter).
kotlin.incremental=false
